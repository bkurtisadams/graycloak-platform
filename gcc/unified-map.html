<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World of Greyhawk — Unified Map (Slice 2)</title>
<!-- Inline-SVG favicon, mirrors greyhawk-map.html. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120900'/%3E%3Cpolygon points='16,4 28,11 28,21 16,28 4,21 4,11' fill='none' stroke='%23c8941a' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="gcc-header.css?v=c5edf4e5">
<link rel="stylesheet" href="gcc-auth.css?v=03238a9b">
<link rel="stylesheet" href="gcc-subhex.css?v=3e5946a4">
<link rel="stylesheet" href="gcc-settings.css?v=6d7c5758">
<link rel="stylesheet" href="gcc-publish.css?v=4f6c1daf">
<link rel="stylesheet" href="gcc-pull.css?v=0b2c90ed">
<link rel="stylesheet" href="gcc-dialog.css?v=bd2368c3">
<link rel="stylesheet" href="gcc-map.css?v=d40af595">
<style>
  /* Page-level reset — same convention as greyhawk-map.html. */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100vh; width: 100vw; overflow: hidden; background: #050200; }
  body { font-family: 'Crimson Text', Georgia, serif; color: #e8d5a3; user-select: none; }
  /* Parent map grid opacity — driven by GCCSettings display.gridOpacity. */
  polygon.hex-cell { stroke-opacity: var(--grid-opacity, 1); }
</style>
</head>
<body>

<!-- GCC site bar (cross-page chrome). gcc-header.js wires it. -->
<div id="gcc-bar" class="gcc-bar">
  <div class="gcc-bar-in">
    <a href="index.html" class="gcc-brand" title="Back to Dashboard">
      <div class="gcc-title-wrap">
        <div class="gcc-title">GRAYCLOAK'S</div>
        <div class="gcc-subtitle">CAMPAIGN CORNER</div>
      </div>
    </a>
    <div class="gcc-nav">
      <div class="gcc-tools-wrap">
        <button class="gcc-nav-btn" id="gcc-btn-tools">🎲 Tools ▾</button>
        <div class="gcc-tools-dd" id="gcc-tools-dd"></div>
      </div>
      <span id="gcc-auth-slot"></span>
      <button class="gcc-nav-btn" id="gcc-btn-theme" title="Toggle light/dark">
        <span id="gcc-theme-icon">◑</span>
      </button>
      <button class="gcc-nav-btn" id="gcc-btn-settings" title="Settings">⚙</button>
    </div>
  </div>
</div>
<div class="gcc-tools-overlay" id="gcc-tools-overlay"></div>

<!-- Unified shell. gcc-map.js owns this layout; rules in gcc-map.css. -->
<div id="gcc-map-shell">

  <aside id="gcc-map-panel">

    <section class="gcc-map-section">
      <header>View</header>
      <div id="gcc-map-scale-buttons"></div>
      <div class="gcc-map-zoom-row">
        <button class="gcc-map-zoom-btn" id="gcc-map-zoom-out" title="Zoom out (−)">−</button>
        <button class="gcc-map-zoom-btn" id="gcc-map-zoom-reset" title="Reset zoom (0)">⟲</button>
        <button class="gcc-map-zoom-btn" id="gcc-map-zoom-in" title="Zoom in (+)">+</button>
        <span id="gcc-map-zoom-pct">100%</span>
      </div>
    </section>

    <section class="gcc-map-section">
      <header>Selection</header>
      <div id="gcc-map-selection-body"><em>No selection</em></div>
    </section>

    <section class="gcc-map-section">
      <header>Tools</header>
      <div id="gcc-map-tools-body"><em>(no tools registered yet — Slice 5)</em></div>
    </section>

  </aside>

  <main id="gcc-map-canvas">
    <svg id="gcc-map-svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="gcc-map-coords">—</div>
  </main>

</div>

<!-- Transient status messages from showToast (parent renderer + tools). -->
<div id="toast"></div>

<!-- ─── Shared data layer + utilities (load order matters) ─── -->
<!-- These are unchanged from greyhawk-map.html. The unified shell
     reuses the same modules; renderers (Slices 3 & 4) call into
     them. Versions match those committed via cache-bust in
     greyhawk-map.html as of Slice 2. -->
<script src="gcc-regions.js?v=b7acdbbf"></script>
<script src="gcc-encounter-data.js?v=f727bdda"></script>
<script src="gcc-encounters.js?v=6e797639"></script>
<script src="gcc-encounter-panel.js?v=fa317397"></script>
<script src="gcc-landmarks.js?v=eae3e326"></script>
<script src="gcc-terrain.js?v=12899173"></script>
<script src="gcc-paths.js?v=7e486c1a"></script>
<script src="gcc-rng.js?v=725fb699"></script>
<script src="gcc-subhex-store.js?v=5fbc5d5e"></script>
<script src="gcc-subhex-data.js?v=c8e9f149"></script>
<script src="gcc-fog.js?v=177caee7"></script>
<script src="gcc-lost.js?v=71656a2f"></script>
<script src="gcc-subhex-icons.js?v=a8a47c2a"></script>
<script src="gcc-subhex-paths.js?v=6926cf58"></script>
<script src="gcc-dialog.js?v=d89481ae"></script>

<!-- Unified shell + renderers. gcc-map.js must load before the
     renderers so they can register; init fires on DOMContentLoaded. -->
<script src="gcc-map.js?v=a0669416"></script>
<script src="gcc-map-parent-renderer.js?v=cb269b79"></script>
<script src="gcc-map-subhex-renderer.js?v=c2b970a9"></script>
<script src="gcc-map-mile-renderer.js?v=06ef3d77"></script>
<script src="gcc-map-subhex-palette.js?v=c835a4c3"></script>

<!-- GCC platform chrome. Loaded last per existing convention. -->
<script src="gcc-data.js?v=f0da24c1"></script>
<script src="gcc-header.js?v=e1ca49dc"></script>
<script src="gcc-settings.js?v=f2fde918"></script>
<script src="gcc-firebase-config.js?v=ed16c91d"></script>
<script src="gcc-auth.js?v=dc620d93"></script>
<script src="gcc-publish.js?v=c1d6dfd4"></script>
<script src="gcc-pull.js?v=95a56e55"></script>

<!-- Page version stamp (bottom-right). Bump GCC_VERSION as you edit. -->
<script>window.GCC_VERSION = 'unified-map v0.1.0';</script>
<script src="gcc-version-badge.js?v=681c7e07"></script>

</body>
</html>
