<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — Graycloak's Campaign Corner</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+SC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gcc-header.css?v=c5edf4e5">
<link rel="stylesheet" href="gcc-auth.css?v=03238a9b">
<link rel="stylesheet" href="gcc-dialog.css?v=bd2368c3">
<script>document.documentElement.setAttribute('data-gcc-theme', localStorage.getItem('gcc-theme') || 'dark');</script>
<style>
[data-gcc-theme="dark"]{--bg:#101418;--bg2:#161a20;--bg-card:#1a1e26;--bg-card-hover:#20252e;--brd:#252a34;--brd-lt:#303848;--tx:#c8ccd4;--tx2:#7a8494;--tx3:#4a5464;--accent:#60a0d0;--accent-lt:#78b8e8;--accent-dim:#3a6a90;--red:#d04848;--green:#48a858;--amber:#d0a040;--card-shadow:0 1px 3px rgba(0,0,0,.2)}
[data-gcc-theme="light"]{--bg:#eef0f4;--bg2:#e4e8ee;--bg-card:#fff;--bg-card-hover:#f6f8fa;--brd:#d0d4dc;--brd-lt:#bcc2cc;--tx:#181c24;--tx2:#505868;--tx3:#8890a0;--accent:#30508a;--accent-lt:#2a4878;--accent-dim:#8890a0;--red:#c03030;--green:#287830;--amber:#a07818;--card-shadow:0 1px 4px rgba(0,0,0,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Alegreya',serif}
.play-wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
.play-hero{border:1px solid var(--brd);border-radius:10px;background:var(--bg2);padding:24px 26px;margin-bottom:22px}
.play-brand{font-family:'Cinzel',serif;font-weight:900;font-size:13px;letter-spacing:2px;color:var(--accent)}
.play-brand-sub{font-family:'Cinzel',serif;font-weight:500;font-size:10px;letter-spacing:3px;color:var(--tx2);margin-bottom:12px}
.play-title{font-family:'Cinzel',serif;font-weight:700;font-size:26px;color:var(--tx)}
.play-tagline{font-size:15px;color:var(--tx2);margin-top:3px}
.play-sec-hdr{display:flex;align-items:center;gap:9px;margin:0 0 14px}
.play-sec-title{font-family:'Cinzel',serif;font-weight:500;font-size:13px;letter-spacing:1.5px;color:var(--tx)}
.play-count{font-size:12px;color:var(--tx3)}
.play-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.play-card{background:var(--bg-card);border:1px solid var(--brd);border-radius:9px;padding:14px;display:flex;flex-direction:column;box-shadow:var(--card-shadow)}
.play-card-top{display:flex;gap:11px;align-items:center;margin-bottom:11px}
.play-port{width:44px;height:44px;border-radius:7px;background:var(--bg2);border:1px solid var(--brd-lt);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.play-port img{width:100%;height:100%;object-fit:cover}
.play-port span{font-family:'Cinzel',serif;font-weight:700;font-size:18px;color:var(--accent-lt)}
.play-id{min-width:0}
.play-name{font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-sub{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-stats{display:flex;gap:6px;margin-bottom:12px}
.play-stat{flex:1;background:var(--bg2);border-radius:5px;padding:5px 0;text-align:center}
.ps-l{font-size:10px;color:var(--tx3);letter-spacing:.5px}
.ps-v{font-size:15px;color:var(--tx)}
.play-btn{margin-top:auto;background:var(--accent-dim);border:none;border-radius:6px;padding:9px;font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:1px;color:#fff;cursor:pointer}
.play-btn:hover{background:var(--accent)}
.play-new{border:1.5px dashed var(--brd-lt);background:transparent;align-items:center;justify-content:center;text-align:center;min-height:168px;cursor:pointer}
.play-new:hover{background:var(--bg-card-hover)}
.play-new-plus{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--brd-lt);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);margin-bottom:10px}
.play-new-title{font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:var(--tx2)}
.play-new-sub{font-size:12px;color:var(--tx3);margin-top:3px}
.play-empty{padding:14px 2px 18px;color:var(--tx2);font-size:14px}
</style>
</head>
<body>

<div id="gcc-bar" class="gcc-bar">
  <div class="gcc-bar-in">
    <a href="index.html" class="gcc-brand" title="Home">
      <div class="gcc-title-wrap">
        <div class="gcc-title">GRAYCLOAK'S</div>
        <div class="gcc-subtitle">CAMPAIGN CORNER</div>
      </div>
    </a>
    <div class="gcc-nav">
      <div class="gcc-tools-wrap">
        <button class="gcc-nav-btn" id="gcc-btn-tools">🎲 Tools ▾</button>
        <div class="gcc-tools-dd" id="gcc-tools-dd"></div>
      </div>
      <span id="gcc-auth-slot"></span>
      <button class="gcc-nav-btn" id="gcc-btn-theme" title="Toggle light/dark"><span id="gcc-theme-icon">◑</span></button>
    </div>
  </div>
</div>
<div class="gcc-tools-overlay" id="gcc-tools-overlay"></div>

<div class="play-wrap">
  <div class="play-hero">
    <div class="play-brand">GRAYCLOAK'S</div>
    <div class="play-brand-sub">CAMPAIGN CORNER</div>
    <div class="play-title">Enter the Flanaess</div>
    <div class="play-tagline">Choose an adventurer to take into the world — or roll up a new one.</div>
  </div>

  <div class="play-sec-hdr">
    <span class="play-sec-title">YOUR ADVENTURERS</span>
    <span class="play-count" id="play-count">0</span>
  </div>
  <div class="play-empty" id="play-empty" style="display:none">No adventurers yet. Create your first below — it opens the character sheet where you can roll, build, and equip a 1st-level hero.</div>
  <div class="play-grid" id="play-grid"></div>
</div>

<script src="gcc-dialog.js?v=d89481ae"></script>
<script src="gcc-data.js?v=9971930b"></script>
<script src="gcc-images.js?v=d771a7c0"></script>
<script src="gcc-header.js?v=e1ca49dc"></script>
<script src="gcc-firebase-config.js?v=ed16c91d"></script>
<script src="gcc-auth.js?v=dc620d93"></script>
<script src="gcc-sync.js?v=1e5a9f39"></script>
<script>
GCC.init();
const ACTIVE_KEY='gcc-active-char';
const ESC=s=>{const d=document.createElement('div');d.textContent=(s==null?'':s);return d.innerHTML;};

function roster(){
  const all=(GCC.load&&GCC.load(GCC.KEYS.add1eChars))||[];
  const u=(typeof GCCAuth!=='undefined'&&GCCAuth.getUser)?GCCAuth.getUser():null;
  const uid=u&&u.uid;
  return all.filter(c=>!c.ownerUid||!uid||c.ownerUid===uid);
}
function fmtXP(c){
  const x=(+(c.xpTotal||0))+(+(c.xpTotal2||0))+(+(c.xpTotal3||0));
  if(!x)return '0';
  return x>=1000?((Math.round(x/100)/10)+'k'):String(x);
}
function play(id){ if(!id)return; try{localStorage.setItem(ACTIVE_KEY,id);}catch(e){} location.href='hommlet.html'; }

function render(){
  const list=roster();
  document.getElementById('play-count').textContent=list.length;
  document.getElementById('play-empty').style.display=list.length?'none':'';
  let h='';
  list.forEach(c=>{
    const id=ESC(c._id||'');
    const name=ESC(c.characterName||'Unnamed');
    const sub=ESC([c.race,(c.characterClass?c.characterClass+(c.level?' '+c.level:''):'')].filter(Boolean).join(' · ')||'—');
    const port=c.portrait?('<img src="'+c.portrait+'" alt="">'):('<span>'+ESC((c.characterName||'?').charAt(0).toUpperCase())+'</span>');
    const hp=ESC(c.hpMax!=null&&c.hpMax!==''?c.hpMax:(c.hpCurrent!=null&&c.hpCurrent!==''?c.hpCurrent:'—'));
    const ac=ESC(c.ac!=null&&c.ac!==''?c.ac:'—');
    h+='<div class="play-card"><div class="play-card-top"><div class="play-port">'+port+'</div>'+
       '<div class="play-id"><div class="play-name">'+name+'</div><div class="play-sub">'+sub+'</div></div></div>'+
       '<div class="play-stats">'+
       '<div class="play-stat"><div class="ps-l">HP</div><div class="ps-v">'+hp+'</div></div>'+
       '<div class="play-stat"><div class="ps-l">AC</div><div class="ps-v">'+ac+'</div></div>'+
       '<div class="play-stat"><div class="ps-l">XP</div><div class="ps-v">'+fmtXP(c)+'</div></div></div>'+
       '<button class="play-btn" data-play="'+id+'">&#9654; Play</button></div>';
  });
  h+='<div class="play-card play-new" id="play-new"><div class="play-new-plus">+</div>'+
     '<div class="play-new-title">New Character</div><div class="play-new-sub">Roll up a 1st-level hero</div></div>';
  const grid=document.getElementById('play-grid');
  grid.innerHTML=h;
  grid.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();play(b.getAttribute('data-play'));}));
  document.getElementById('play-new').addEventListener('click',()=>{ location.href='adnd.html'; });
}

render();
if(typeof GCCAuth!=='undefined'&&GCCAuth.onAuthChange) GCCAuth.onAuthChange(()=>render());
window.addEventListener('gcc-sync-ready',render);
</script>
</body>
</html>
