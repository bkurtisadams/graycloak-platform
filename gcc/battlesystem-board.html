<!-- battlesystem-board.html · v0.8.1 · HOUSE RULE (2026-08-18): melee reach is 1", the AD&D engagement convention — fighters within 1" (10 yds outdoors, matching BS's own [2.1] ground scale) may melee. This SUPERSEDES the v0.3.0 ruling that BS melee is literal base-to-base per [7.8]/[8.1]; Kurt's rationale: you can't swing a sword pressed against a man, and the AD&D convention BS descends from always gave the 1" fighting gap. Mechanics: CONTACT_EPS 0.5 → 1.0 (inContact, melee eligibility, phase auto-skip, enemyAtRear morale, clash lines, and the [8.1] frontage measurement all key off it consistently). The 0.25" STANDOFF stays as the rendered fighting line CHARGES still slam to [7.14] — a charge presses home; ordinary approach fights from anywhere inside 1". snapToContact REPURPOSED: with 1" of reach the old glue-everything-to-the-standoff behavior would override player positioning, so drops already within reach now STAY EXACTLY where dropped, and only the just-barely-out drop (reach..reach+0.4"] glues to 0.9" — the frustration killer without the teleport. chargeState's 'already in contact' floor widens from 0.15" to the full reach ('already within melee reach' — no burning move to charge someone you can already strike). Wording pass: 'engages' replaces 'contacts' in drop/mob logs, 'In reach:' in the Selected pane, the blocked-melee reason reads 'out of melee reach — X" apart, needs <= 1" [house: AD&D 1" engagement]', and the failed-charge warning cites reach. Self-tests 54 → 57: reach lock at 1.0, 0.9"-pair fights / 1.2"-pair doesn't / just-out drop glues to 0.9", in-reach drops stay put (snap fixture repurposed), out-of-reach reason fixture moved to 1.5", diagonal-charge fixture pushed beyond the widened reach. PRIOR (v0.8.0): UX slice — chainmail layout parity + engagement legibility (three reported issues run down). (1) UNREADABLE UNIT TEXT — root causes: every card drew TWO label lines (plus chips) with no halo over the green field, colliding on any crowded line, and the old 285px|board|300px grid squeezed the board into the middle column so everything rendered small. Fixes: labels are now HALOED (paint-order:stroke, chainmail's technique) and COMPACT by default — one 10px line (side·name #id · figs · ROUT/CHG) — with the full two-line detail drawn only for the selected/targeted unit; labels are pointer-events:none so they never block clicks; M/F/X chips draw in battle only. (2) LAYOUT — chainmail's arrangement ported whole: Board FIRST at minmax(0,1fr) | 7px rail-splitter | controls rail | log rail, the two rails holding a 250:300 ratio off --rail (default 550px); the splitter drags to resize, snaps closed past the min for a full-width board, double-click resets, persists in localStorage (bs-rail). The old left column is gone — Spectate/Selected/Muster stack in the controls rail (Selected ABOVE Muster: battle-first), the Battle Log is the far rail with its own scroll. Selected and Muster panels are COLLAPSIBLE via their headers (▾/▸), and Muster auto-collapses at Begin battle (header re-opens; Reset re-expands). Seat CSS untouched — the spectate/player rules target ids, which moved with their elements. (3) CAN'T CLOSE / CAN'T FIGHT "EVEN IN CONTACT" — two real causes found: (a) CONTACT_EPS was 0.3 vs the 0.25 rendered standoff — 0.05" of slack, so a pair 0.31" apart LOOKED exactly like an engaged standoff pair but wasn't mechanically in contact; EPS widens to 0.5 (a pair that looks engaged IS engaged; the standoff renders at 0.25 so daylight between engaged and not is visible) and the drop/snap capture widens 0.8→1.0. (b) The disabled attack buttons carried their block reason in `title` — but DISABLED elements don't fire pointer events in Chrome, so the tooltip NEVER SHOWED and a blocked melee was a silent mystery. The Selected pane now has an ATTACK row that states it plainly: MELEE/CHARGE READY in green, or the live reason — and the not-in-contact reason now names the actual gap ('0.42" apart, needs <= 0.5"'). Self-tests 49 → 54: EPS lock, gap-naming reason, compact-vs-detail label counts, splitter presence, header collapse toggle. PRIOR (v0.7.1): 1" SUB-GRID (chainmail-board parity, snap-to-grid deliberately declined). The Grid button now CYCLES three states — Grid: 6" → Grid: 6"+1" → Grid: off — with the label naming the mode (state.grid 1/2/0; view-local, never snapshotted or published). In 6"+1" mode, faint 1" lines (stroke-width 0.35, .09 alpha) draw between the 6" majors, but ONLY past a zoom threshold (view.k >= 1.5): at full-table view 72×48 fine lines are noise over the parchment, so the sub-grid fades in as you lean in; the button tooltip says so. Snap-to-grid was considered and DECLINED (ruled with Kurt 2026-08-18): (1) it fights snap-to-contact — inch quantization vs the 0.25" standoff is exactly the visual-vs-mechanical divergence behind the v0.2.1/v0.3.2 melee-skip bugs; (2) BS footprints are sub-inch (3/4" dwarf bases, 0.5" open-formation gaps) so a 1" quantum misaligns edges; (3) 45° headings (v0.7.0) don't align to a square grid at all. If ever revisited: opt-in, center-snapped at 0.5", drop-only, cardinal-only, always yielding to snap-to-contact. Self-tests 46 → 49: button cycles 6"→6"+1"→off→6" with the .on class tracking, and the sub-grid line count is zero below the zoom gate and exactly (71-11)+(47-7) non-major lines above it. PRIOR (v0.7.0): Slice 7A — 45° headings on true oriented-rect geometry. FACING: u.facing is now any 45° step (0-315); ctrl+wheel rotates 45° per notch (setup free + burst-collapsed; battle routes through the [7.9] economy); Selected pane gains Oblique L/R 45° buttons; Right/Left/About Face keep their RAW 1/3-1/3-1/2 MV costs. OBLIQUE ECONOMY per the 2026-08-18 ruling: ONE free ≤45° direction change per move for closed/open (u.obliqueUsed, reset at End of Round); FURTHER 45° steps cost 1/6 MV — a pro-rated half of a Right Face (house extrapolation, open to veto: two steps = 1/3 MV ✓ consistent, though four steps at 2/3 exceeds About Face's 1/2, so About stays the cheap 180). GEOMETRY: the local rect is now ALWAYS frontage-horizontal with the front edge at local top — the old 90/270 w/h swap is retired and rotation happens about the center in world space. unitPoly/toLocal/worldBounds/facingDir are the new frame helpers. rectGap/contactDelta become SAT intersection + vertex-edge closest-pair on the oriented quads (EXACT parity with the old AABB distance at cardinal headings — locked by self-test); contactDelta returns the true closing vector at any heading, so charge/snap/mobCharge close correctly rotated. arcOf classifies the attacker's center in the DEFENDER'S LOCAL FRAME — one formula, cardinal semantics unchanged, front/flank/rear now correct at every heading (this is the aiming machinery missiles, dragon breath, and spell templates will consume). contactInfo [8.1] projects the overlap onto the attacker's front-edge axis — which also FIXES a latent cardinal bug: at 90/270 the old code measured the x-extent (unit DEPTH), not frontage. nearestCardinal → nearestFacing (nearest 45°): chargers, mob charges, and routs now end actually pointed at/away from their target. RENDER: card/pips/front-stripe/CR-circle rotate as a group about the card center; chips, labels, and the arc banner stay UPRIGHT, anchored to the world-bounds box; the front rank is always local row 0 (the rotation carries it — identical cardinal visuals). Mob Advance walks along any heading via facingDir. MIGRATION: pre-v0.7 saves stored the SWAPPED rect's top-left for facing 90/270; hydrateUnits(units, fromVersion) shifts x,y so the world CENTER is preserved (self-tested); hydration also normalizes facing to 45° steps and seeds obliqueUsed; loadScenario and NET.applyRemote pass their payload's simVersion. Mob facing buttons deliberately KEPT this slice as the GM's proxy for the wheel (RAW gives mobs Wheeling, not facing changes — the honest fix lands with 7B). DEFERRED to 7B: Wheel as a first-class costed action (outermost-figure arc, any-figure pivot [7.9]), drag-leg heading enforcement (straight/≤45° legs, the one-free-oblique consumed by an oblique DRAG leg too), and the [7.8] engaged-unit lockdown with Wrap-Around [7.11]/Fighting Withdrawal [7.12]. Melee at cardinal headings is behavior-identical to v0.6.1 except the 90/270 contactInfo fix. Self-tests 35 → 46: 45° normalize + center invariance, cardinal AABB gap parity, gap symmetry, rotated contactDelta measure + closure-to-contact, arcOf at 45°, pre-0.7 center-preserving migration, facingDir NE, contactInfo x-overlap parity at facing 0, oblique free-then-1/6-MV; faceUnit and wheel-burst tests updated for the fixed local rect and 45° notches. Script parses as a MODULE. PRIOR (v0.6.1): FIX: the measure tool. Two defects: (1) the mouseup handler cleared measure.a and returned WITHOUT renderBoard(), so the dashed line + label froze on screen until an unrelated action redrew the board (the stale ghost line); (2) it was hold-to-measure — the anchor cleared on release, so the reading could not be read after letting go. Now: measure.dragging tracks the active drag; on release the measurement PINS (line + inches/yards label stay drawn), the next mousedown in measure mode starts a fresh one, and toggling Measure off clears everything; a zero-length click (<0.05") clears instead of pinning a "0" label. Pre-measuring is a deliberate deviation from [7.7]'s SPECIAL NOTE (no pre-measuring at the table) — ruled a GM aid appropriate to a computer game (2026-08-18). RULING RECORDED for the movement slice, [7.9] free 45-degree oblique: ONE free direction change of up to 45 degrees per move for closed/open formations; only skirmish formation changes direction at will (multiple changes). RAW says "at will" in both sentences, but unlimited free 45-degree legs would let closed/open approximate any curve for free and the costed Wheel would never be paid — the one-per-move reading preserves wheeling's purpose (house interpretation, ruled 2026-08-18; implementation lands with the heading-aware movement slice). PRIOR (v0.6.0): Slice 6 — GCC multiplayer, chainmail-board's NET layer (Slice 1 publish/spectate + Slice 2A player seats) ported whole onto this board's snap/applySnap architecture. FIREBASE: same GCC project via the same three head includes (gcc-firebase-config.js / gcc-auth.js / gcc-auth.css, chainmail's current ?v= hashes); battles publish into the SAME campaigns/{cid}/battles/{bid} collection under the existing rules v9 — ZERO rules changes; the payload's format field ('battlesystem-board') disambiguates and each board's applyRemote rejects the other's docs as 'bad snapshot'. PUBLISH: NET.schedulePublish() rides pushUndo's tail (still the complete map of mutations), debounced 750 ms non-extending; undo/redo (afterRestore) and loadScenario republish explicitly; doc carries name/ownerUid/simVersion/seq-increment/status(setup→live)/snapshot/_updated. Unlike chainmail, snap() does not carry the log, so the payload ships logHtml alongside — captured from #log (prepend-newest-first) capped at the newest 300 entries for 1 MB doc headroom. SPECTATE (?camp=&battle=&spectate=1): onSnapshot → applyRemote → applySnap + hydrateUnits (extracted from loadScenario's hydration loop, now shared; seeds controllerUid/controllerName) + logHtml swap — NOT loadScenario, whose resets would stomp the viewport; state.view is never in the snapshot so pan/zoom survive publishes (first snapshot recentres); stale selId/targetId cleared; version-skew banner nudges a refresh when the publisher is newer. Inputs: spectate mousedown hard-returns after pan/measure, keydown and ctrl+wheel-facing gated, mutating buttons + Muster/Selected hidden via body.spectate CSS (the pushUndo seat guard is the backstop — no capture-phase allowlist needed since hidden buttons can't be clicked). PLAYER SEATS (&player=1): subscribes via the same pipe; body.player keeps the Selected pane; pushUndo hard no-ops (seats never write the battle doc); drag arms only on OWNED units (NET.ownsUnit) and only when playerMayMoveNow — the BS WRINKLE chainmail lacks: NEW state.moverSide (in snap(), so it publishes and undoes) seeds to the initiative winner at Movement entry [5.1] and the GM's new 'Pass move → Side X' phase-row button flips it; seats move only while their side holds the move (deployment is free; mobs never drag [2.10]; routed/rallied blocked [6.3]/[6.4]). A seat drop posts a move intent to battles/{bid}/commands (rules v9: members create-as-self) and stands as a local preview until the GM echo; the GM board is the authority — startCommandFeed consumes 'added' → validateMove (alive, controllerUid match, playerMayMoveNow incl. the side gate) → applyCommand replays the exact drop bookkeeping (budget re-clamp via moveBudget, board clamp, pushUndo 'net-move' with a PRE-move snapshot, movedIn charge, acted.moved, snapToContact, contact + 'Player move' log lines) → deletes the command; refusals log 'Player move refused' and schedulePublish explicitly. ASSIGN: GM's Selected pane gains 'Assign to player…' → #assign-menu populated live from campaigns/{cid}/players (gcc-invite roster) with clear-control; seats persist through every snapshot/save via hydrateUnits; Selected shows a Player row in net sessions. FIX (pre-existing, exposed by the port): drag undo was off-by-one — the drop's pushUndo('move') fired AFTER the live mousemove mutations, snapshotting the POST-drop state (every other call site pushes pre-mutation), so undo-after-drag was a visual no-op and a second undo ate the previous action too. pushUndo(tag, pre) now takes an optional pre-mutation snapshot; mousedown captures drag.pre and the drop passes it — net-move uses the same path. Boot banner names the session params; net chip (⟳/✓/⚠, click-to-sign-in), Share spectate/player link buttons, 6 s auth watchdog and [NET] console breadcrumbs all ported as-is. Self-tests +13: seat pushUndo guards (spectate + player), debounce collapse 3→1, payload format/round-trip/size canary, hydrate seat seeding, validateMove owned-in-setup + unowned rejection, seat gate (wrong side / own side / wrong phase), otherSide, and the drag-undo pre-snapshot fix; test cleanup now also clears undo/redo artifacts and cancels the test publish window. Script still parses as a MODULE (checked as .mjs per chainmail's v0.11.178 lesson). PRIOR (v0.5.0): Slice 5 — commanders and command [4.7]-[4.10], retiring the Slice-1 open ruling. Every REGULAR unit now spawns with an embedded Unit Commander (RAW [2.8]: regulars must have one) — a fighter of level 3-6 with rolled CHA, giving CB per Table 8 [4.9] and CR = (CHA+level)/2 + 3\" fighter bonus [4.8]; mobs spawn with a boss who can Give Orders but never confers In-Command benefits ([2.10]: mobs always suffer OOC penalties). WIRED CONSEQUENCES (engine keys verified before wiring, per house rule): commanderFighting -1 AR for regulars (Table 10, embedded commander fights with the unit), outOfCommand +1 AR and -2 ML for mobs and routed units, commander CB added to current morale [4.9] via unit.commander.charismaBonus, mobWithSupport +2 ML when a friendly regular unit sits in the mob's rear arc within 6\" [2.10], and closed formation now REQUIRES command [4.7]. RALLY moves to the engine's attemptRally with the [6.1] flags (inMeleeContact, commanderInRange = has a commander) — the manual checkMorale shim is retired. MOB ORDERS [2.10]/[6.6]: mobs cannot be dragged in battle; in the Rally phase a mob's commander may attempt ONE order (Advance or Charge) via rally check, the mob then follows its last order each Movement phase — Advance walks it straight along its facing, Charge closes on the nearest enemy in the 1.5x reach — and at the start of each Movement phase a mob that SEES an enemy within charge range checks DISCIPLINE (Table 7; PEAS DL is low) and on failure charges regardless of orders, going OOC-wild per [4.6]. Board: gold star = commander pip, dashed CR circle on selection, OOC and order tags in the card label, Cmdr row in the Selected pane. Commander death is NOT reachable this slice — [9.2]: an embedded Unit Commander cannot be killed without his unit being destroyed; detached commanders, Brigade/Army ranks, and hero assassinations arrive with the heroes slice, as does commander editing. Pre-v0.5.0 saves hydrate generated commanders on load. PRIOR (v0.4.1): Ctrl+wheel facing, ported from chainmail-board's onWheel grammar (ctrl+wheel rotates the SELECTED unit, falling through to zoom when nothing is selected; there ±15° free-form, here one CARDINAL step per notch since BS facing is the [7.9] set). Wheel-down = Right Face, wheel-up = Left Face. In SETUP the rotation is free and ungated; in battle each notch routes through facingChange() so the [7.9] 1/3-MV cost, Movement-phase gating, rout guard, and the [6.3] free-face-after-rally all apply unchanged — the budget is what stops a spin. Setup wheel bursts collapse to ONE undo entry (tag 'wheel-face:<id>' skipped while it's already on top of the stack, chainmail's tag-collapse pattern). Toolbar hint updated. PRIOR (v0.4.0): Slice 4 — facing, flanks, and rear + M/F/X acted chips. FACING: units carry a cardinal facing (0/90/180/270 — RAW's own facing-change set, since [7.9] defines exactly Right Face, Left Face, About Face; free 45-degree drift and wheeling stay OPEN for a later slice). The front edge draws a green stripe; the front RANK of pips is the rank nearest that edge (dark pips follow the facing). Facing changes are Selected-pane buttons costed per [7.9] — Left/Right Face 1/3 MV, About Face 1/2 MV — budget-checked in the Movement phase, and FREE once immediately after a successful rally per [6.3]. A charge turns the charger to face its target (the last 2/3-straight leg implies it); a rout ends with the unit's back to the enemy [7.15], now literally. ARCS: arcOf(defender, attacker) classifies the attacker's center against the defender's facing-axis edges — front of the front edge = FRONTAL, behind the rear edge = REAR, else FLANK. Targeting shows the chainmail-style arc banner over the target (green/amber/red per the --front/--flank/--rear palette). COMBAT WIRING: rear attacks take arDelta -2 and flank attacks -1 when the defender carries a shield ([8.3] SPECIAL NOTE examples — shield flags added to MEN_HF, DWARF, DW_PIKE, HOBGOB), the melee log names the arc, and a unit meleeing with an enemy in contact with its REAR arc checks morale with the [4.2] enemyAtRear -2 (engine key verified). M/F/X CHIPS: chainmail's acted trio — u.acted {moved, fired, fought} — renders as chips above each card, dark when done (M on any move/charge/facing spend, X on fighting a melee, F reserved until the missile slice), reset at End of Round. Self-tests add arc classification, facing-cost/center-preserving rotation, and the rear arDelta. PRIOR (v0.3.2): FIX: melee skipped again — the v0.3.0 card was drawn with a 3px pad OUTWARD in board coordinates, inflating every unit's apparent footprint ~0.21\" per side; cards that looked engaged were mechanically 0.5-0.7\" apart (past CONTACT_EPS 0.3 and even the 0.6 snap capture), so the engine rightly saw no contact and phaseIsEmpty skipped the phase your eyes said was due. The closure geometry itself verified clean across offsets this time. Fixes: (1) WYSIWYG card — the card rect now sits EXACTLY on the true base footprint (0,0,w,h) with the pips inset, so the drawn edge IS the base edge and the standoff gap you see is the gap the rules see; (2) snap capture widened to 0.8\" so near drops glue reliably; (3) honest skip — the Melee phase NEVER auto-skips while any unit has a declared charge [7.14], and when it does skip it names the closest enemy pair and their gap ('closest: X vs Y — 0.71\" apart') so a miss is information, not mystery. Self-tests add the charge skip-guard. PRIOR (v0.3.1): FIX: dwarf base size per [2.3] footnote — 'Dwarves are mounted on 3/4\" bases even though they are size S creatures' (width over height). Type rows gain an optional `base` override consumed by unitRect (BASE_W[t.base || t.size]); DWARF and DW_PIKE set base:'M'. Combat size stays S (the size field still drives [8.5] vs-L selection and future size rules); only the footprint changes. Self-test locks dwarf figure width to 0.75\". PRIOR (v0.3.0): Slice 3 — chainmail visual language + engagement standoff. Units now render as chainmail-board cards: parchment card (#efe7d2) with a side-colored border, SQUARE figure pips with the FRONT RANK in the dark side color and rear ranks in the light tint (his frontage/non-frontage convention), the wounded figure shown as a pink half-tone pip, and the two-line label BELOW the unit ('A · Name #id' in the side color over 'type · figs/start' in soft ink) so adjacent labels stop colliding. Engaged enemy pairs draw a dotted clash line between them. ENGAGEMENT STANDOFF: BS melee is base-to-base RAW ([1.6]/[7.8]/[8.1] — no Chainmail 3-inch rule), but glued bases were unreadable, so contact is now RENDERED with a 0.25-inch fighting-line gap: charge and snap close to the standoff rather than to zero, and the contact epsilon is 0.3 inch, so a standoff pair IS in base-to-base contact mechanically while the boards breathe visually. Selected/targeted units draw last (labels never buried). Self-tests updated for the standoff geometry. PRIOR (v0.2.1): FIX: melee phase auto-skipped after a charge/snap that visually touched. Root cause: chargeToTarget and snapToContact closed along the CENTER-to-center vector by the rect-gap distance, but the rect gap is the hypot of the per-axis edge deficits — on any diagonal offset the center vector is not the deficit vector, so the move under-closed (repro: 0.671" gap 'closed' to 0.301", above the 0.15" contact epsilon), inContact stayed false, and phaseIsEmpty(melee) skipped the phase. Fix: new contactDelta(u,v) returns the exact per-axis translation whose hypot IS the rect gap; charge and snap now translate by that delta, zeroing the gap by construction (movedIn charged with delta.dist, identical to the reach test's rectGap so budgets are unchanged). Self-test adds a diagonal-offset fixture locked to end in contact. PRIOR (v0.2.0): Slice 2 — chainmail targeting grammar + feel pass. Mirrors chainmail-board's attack grammar exactly: SHIFT+CLICK an enemy toggles it as the TARGET (dashed ring + reticle tag), plain click selects, and the action buttons in the phase row LIGHT UP from eligibility-state functions (meleeState/chargeState/rallyState, each returning {ok, reason}; the reason surfaces as the disabled button's tooltip, chainmail's btn-melee pattern). '⚔ Resolve melee' enables when a friendly is selected, an enemy targeted, the pair is in base-to-base contact, it is the Melee phase, and the attacker is neither routed nor rallied-this-round [6.3]; 'Charge target' enables in the Movement phase when the target is reachable within the 1.5x charge allowance [7.14] and, on click, declares the charge and auto-closes straight into contact (last leg straight per [7.14], cost charged to the move budget); 'Attempt rally' enables in the Rally phase for a selected routed unit. Also: SNAP-TO-CONTACT — a drop that leaves <=0.35 inch of gap to an enemy glues the facing edges (kills the pixel-fiddling to reach [7.8] contact); CLICK-TO-PLACE muster — a muster button arms placement and the next board click drops the unit there (Esc or right-click cancels; shift-click keeps placing more of the same); EMPTY-PHASE AUTO-SKIP — Rally with no routed units and Melee with no contacts advance themselves with a one-line log note. The Selected pane gains a Target row; the panel Attack flow is retired in favor of the lit buttons. Self-tests add meleeState gating and the snap closure math. PRIOR (v0.1.0): Slice 1 — BATTLESYSTEM Basic Game on the chainmail-board chassis. New file forked from chainmail-board v0.11.180's chassis PATTERNS (parchment palette + toolbar/panel/log CSS, right-drag pan + wheel zoom, phase rail, undo/redo, JSON save/load, boot self-tests), with the rules core supplied by @graycloak/battlesystem-engine v0.2.0 (synced at ./engine/, same copy the Foundry module consumes — do NOT edit ./engine/ here; edit graycloak-platform/packages/battlesystem-engine and re-sync). SCOPE (Basic Game, rulebook Part 2): Army-Roster units (Regular/Mob; AC, creature HD, ratio [2.2], figures, frontage, formation, MV, THAC0, weapon, size), 5-phase round [Basic seq: Initiative d6 reroll-ties / Rally / Movement A-chooses / Melee simultaneous [8.0] / End], closed-open formation change at 1/3 MV [7.6], drag movement with live budget clamp + charge at 1.5x MV requiring contact [7.14], melee via engine resolveMeleeCombat (AR pipeline [8.3], CRT [8.4-8.5], eligible fighters [8.1] with measured contact frontage, casualties + single-wound rule [8.7]), automatic morale triggers 25%/50%/post-50%-per-figure [4.4] via engine checkMorale 2d10 with situational stack [4.2], failure effects [4.5] (closed breaks to open; open/mob ROUTS with auto move MV+1/3 away, back to enemy [7.15]), Rally-phase attemptRally [6.1-6.3] with rallied-unit restrictions, fight-in-melee-only-if-attacked [6.3]. OPEN RULINGS this slice (flagged in-log where they bite): no commanders/CR yet, so In-Command bonuses, CB, and the OOC penalties are not applied (units treated as in command; [4.7]-[4.10] land with the Intermediate slice); skirmish units deferred (no missiles in Basic anyway); contact frontage measured as overlapping facing-edge figures, side-extras [8.1] auto-computed 0-2 from geometry; wheeling/facing costs deferred — drag cost is path length (straight-line legs), which under-charges a wheel; mobs get Move Forward only (orders system with commanders). Self-tests at boot lock the [8.4] worked example, morale example, rout distance, and save round-trip. -->

<style>
  :root {
    --bg:#ece0c4; --panel:#f5eedb; --field:#a8b094; --field-edge:#6d735a; --ink:#2c2316; --ink-soft:#6e6047; --rule:#b6a682;
    --side-a:#3a6e90; --side-a-d:#27516c; --side-a-l:#9cbed4; --side-b:#9c3b2c; --side-b-d:#73291d; --side-b-l:#d7a89c;
    --front:#2f7d4f; --flank:#c0892e; --rear:#b0392c; --gold:#d8b25a; --rank-hi:#ecd08a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Avenir Next Condensed","Avenir Next","Helvetica Neue",Helvetica,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); margin: 0; font-family: var(--serif); }
  .page { max-width: 1600px; margin: 0 auto; padding: 14px 22px 28px; }
  .toolbar { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--rule);
    padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-family: var(--sans); }
  .tb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-setup { padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .brand { display: inline-flex; flex-direction: column; gap: 1px; font-family: var(--serif); font-size: 20px;
    font-weight: 700; margin-right: 6px; line-height: 1; }
  .brand .version-tag { font-size: 11px; font-weight: 600; opacity: .72; letter-spacing: 1.2px;
    font-family: var(--sans); text-transform: uppercase; }
  .tb-sep { width: 1px; height: 20px; background: var(--rule); opacity: .6; margin: 0 3px; }
  .tb-pin-right { margin-left: auto; }
  button, select, input[type=number], input[type=text] {
    font-family: var(--sans); font-size: 12px; padding: 5px 11px; border: 1px solid var(--rule);
    border-radius: 5px; background: var(--bg); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--gold); background: var(--panel); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--gold); border-color: #b8923a; font-weight: 700; }
  button.on { background: var(--rank-hi); border-color: #b8923a; }
  input[type=number] { width: 62px; cursor: text; } input[type=text] { cursor: text; }
  label.f { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-soft); }
  .phase-rail { display: flex; gap: 3px; flex-wrap: wrap; align-items: flex-end; }
  .pstep { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 1px 6px; }

  { id:'MEN_HF', name:'Men-at-Arms',      ac:4, hd:1,   mv:9,  thaco:20, weapon:'longsword',  size:'M', unitType:'regular', shield:true },

/* Base widths per [2.3] in inches of tabletop. */
const BASE_W = { S: 0.5, M: 0.75, L: 1.0 };

/* === B. PHASES — Basic Game sequence (rulebook Part 2) ==================== */

  { id:'initiative', label:'Initiative', rule:'[5.1]' },
  { id:'rally',      label:'Rally',      rule:'[6.0]' },
  { id:'movement',   label:'Movement',   rule:'[7.0]' },
  { id:'melee',      label:'Melee',      rule:'[8.0]' },
  { id:'end',        label:'End Round',  rule:'[1.7]' },

function rollInitiative(rng) { // [5.1] 1d6 each, reroll ties
  let a, b; do { a = 1 + Math.floor(rng()*6); b = 1 + Math.floor(rng()*6); } while (a === b);
  return { a, b, winner: a > b ? 'A' : 'B' };
}
const roll2d6  = () => { const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];  return { total:d[0]+d[1], dice:d }; };
const roll2d10 = () => { const d=[1+Math.floor(Math.random()*10),1+Math.floor(Math.random()*10)];return { total:d[0]+d[1], dice:d }; };

  units: [], selId: null, targetId: null, place: null, setup: true, round: 0, phaseIdx: 0, sideA: null,
  moverSide: null,                    // Slice 6: who holds the Movement Phase — the seat gate [5.1]
  grid: 1, measure: { on:false, a:null, live:null, dragging:false },   // grid: 0 off · 1 six-inch · 2 six+one-inch sub-grid
  view: { x:0, y:0, k:1 },

const otherSide = s => s === 'A' ? 'B' : 'A';

/* [4.9] Table 8 — commander charisma bonus */
function cbFromCha(cha) {
  if (cha >= 19) return 3; if (cha >= 17) return 2; if (cha >= 15) return 1;

}

const crOf = c => (c.cha + c.level) / 2 + (c.cls === 'fighter' ? 3 : 0);
const CMDR_NAMES = ['Aldric','Berrin','Cass','Doone','Edda','Fenn','Garrick','Hale','Iva','Jorun','Kell','Marta','Osric','Pell','Rowan','Sten','Tam','Ulf','Vera','Wynn'];
function mkCommander(mob) {
  const cha = 8 + Math.floor(Math.random() * 10);                    // 8-17 → CB 0..+2
  const level = mob ? 2 : 3 + Math.floor(Math.random() * 4);         // regulars F3-F6
  return { name: CMDR_NAMES[Math.floor(Math.random() * CMDR_NAMES.length)], cls:'fighter', level, cha };
}
/* [4.7] In Command: embedded commander → all figures trivially within CR;
   mobs NEVER gain the benefits and routed units are OOC. */
const inCommand = u => !!u.cmdr && !u.routed && typeById(u.type).unitType === 'regular';
const isOOC = u => u.routed || typeById(u.type).unitType === 'mob';
function mkUnit(typeId, side, figures, x, y) {
  const t = typeById(typeId);
  const ratio = ratioFromHD(t.hd);                                   // [2.2]
  const frontage = Math.min(figures, Math.max(3, Math.ceil(Math.sqrt(figures)*1.6)));
  const u = {
    id: nextId++, type: typeId, side, figures, startFigures: figures,
    frontage, formation: t.unitType === 'mob' ? 'mob' : 'closed',    // [7.1]
    x, y, facing: side === 'A' ? 180 : 0,                            // A deploys north facing south (+y=down)
    acted: { moved:false, fired:false, fought:false }, freeFace: false, obliqueUsed: false,
    wounded: 0,                                                      // [8.7] max one
    routed: false, ralliedThisRound: false, wasAttackedThisPhase: false,
    movedIn: 0, charging: false,
    moraleChecked: { p25:false, p50:false },
    cmdr: mkCommander(t.unitType === 'mob'),                         // [2.8]/[2.10]
    mobOrder: null, orderedThisRound: false,
  };
  u.baseMorale = computeBaseMorale(u);                               // [4.1]
  return u;
}
function unitEngineData(u) {   // shape shared with the Foundry module's buildDefender-alikes
  const t = typeById(u.type);
  return {
    hitDice: t.hd, figures: u.figures, armorClass: t.ac,
    isDemihuman: !!t.demihuman, hasMagicEquipment: false,
    hasSpecialAbilities: false, hasExceptionalAbilities: false,
    mounted: false, unitIsRegular: t.unitType === 'regular',
    baseMorale: u.baseMorale, formation: u.formation,
    commander: (u.cmdr && !u.routed) ? { charismaBonus: cbFromCha(u.cmdr.cha) } : undefined,  // [4.9]
  };
}
function computeBaseMorale(u) { return BattlesystemMorale.calculateBaseMorale(unitEngineData(u)); }
function hdPerFig(u) { const t = typeById(u.type); return calculateHDPerFigure(t.hd, ratioFromHD(t.hd)); }
function unitRect(u) {         // LOCAL tabletop-inch rect [2.3] — frontage horizontal, front edge = local top;
  const t = typeById(u.type), bw = BASE_W[t.base || t.size];        //   u.facing rotates it about its center in world space
  const gap = u.formation === 'open' ? 0.5 : 0;                      // [7.3] bases ~1/2" apart
  const cols = Math.min(u.frontage, u.figures);
  const rows = Math.max(1, Math.ceil(u.figures / cols));
  const w = cols * bw + Math.max(0, cols - 1) * gap;
  const h = rows * bw + Math.max(0, rows - 1) * gap;
  return { w, h, cols, rows, bw, gap };
}
/* --- Slice 7A: oriented-rect frame helpers (45° headings) ---------------- */
const facingRad = f => (f || 0) * Math.PI / 180;
const facingDir = f => { const r = facingRad(f); return [Math.sin(r), -Math.cos(r)]; };  // unit vector the front points along
function unitPoly(u) {           // 4 world corners; [0]-[1] is the front edge
  const r = unitRect(u), cx = u.x + r.w/2, cy = u.y + r.h/2;
  const c = Math.cos(facingRad(u.facing)), s = Math.sin(facingRad(u.facing));
  const pt = (lx, ly) => { const dx = lx - cx, dy = ly - cy; return { x: cx + c*dx - s*dy, y: cy + s*dx + c*dy }; };
  return [pt(u.x, u.y), pt(u.x + r.w, u.y), pt(u.x + r.w, u.y + r.h), pt(u.x, u.y + r.h)];
}
function toLocal(u, px, py) {    // world point → the unit's unrotated frame (rect at u.x/u.y)
  const r = unitRect(u), cx = u.x + r.w/2, cy = u.y + r.h/2;
  const c = Math.cos(-facingRad(u.facing)), s = Math.sin(-facingRad(u.facing));
  const dx = px - cx, dy = py - cy;
  return { x: cx + c*dx - s*dy, y: cy + s*dx + c*dy };
}
function worldBounds(u) {
  const P = unitPoly(u), xs = P.map(p => p.x), ys = P.map(p => p.y);
  return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };
}
/* Which arc of `def` does `att`'s center lie in? Classified in def's local
   frame, so one formula covers every heading (cardinal semantics unchanged). */
function arcOf(def, att) {
  const r = unitRect(def), c = unitCenter(att), la = toLocal(def, c.cx, c.cy);
  return la.y < def.y ? 'front' : la.y > def.y + r.h ? 'rear' : 'flank';
}
const ARC_LABEL = { front:'FRONTAL', flank:'FLANK', rear:'REAR' };
const ARC_COLOR = { front:'var(--front)', flank:'var(--flank)', rear:'var(--rear)' };
function faceUnit(u, newFacing) {                                    // 45° headings; center invariant (local rect fixed)
  u.facing = ((Math.round(newFacing / 45) * 45) % 360 + 360) % 360;
}
function facingChange(u, kind) {                                     // [7.9] costs; [6.3] free after rally
  const t = typeById(u.type);
  const oblique = kind === 'obl-left' || kind === 'obl-right';
  const free = u.freeFace || (oblique && !u.obliqueUsed);            // ruling 2026-08-18: ONE free ≤45° per move

    if (targets.length) pane.insertAdjacentHTML('beforeend', `<div class="hintline">In contact: ${targets.map(v=>esc(uName(v))).join(', ')}</div>`);
  }
}
function selTarget() {
  return [ state.units.find(x => x.id === state.selId), state.units.find(x => x.id === state.targetId) ];
}
function meleeState(a, d) {                                          // lit when {ok:true}
  if (state.setup) return { ok:false, reason:'battle not begun' };
  if (curPhase().id !== 'melee') return { ok:false, reason:'Melee happens in the Melee Phase [1.6]' };
  if (!a) return { ok:false, reason:'select one of your units' };
  if (!d) return { ok:false, reason:'shift+click an enemy to target it' };
  if (d.side === a.side) return { ok:false, reason:'target an ENEMY unit' };
  if (a.routed) return { ok:false, reason:'routed units cannot attack [6.4]' };
  if (a.ralliedThisRound && !a.wasAttackedThisPhase) return { ok:false, reason:'rallied units fight only if attacked [6.3]' };
  if (!inContact(a, d)) return { ok:false, reason:`out of melee reach — ${fmt(rectGap(a, d))}″ apart, needs ≤ ${CONTACT_EPS}″ [house: AD&D 1″ engagement]` };
  return { ok:true };
}
function chargeState(a, d) {                                         // [7.14]
  if (state.setup) return { ok:false, reason:'battle not begun' };
  if (curPhase().id !== 'movement') return { ok:false, reason:'charges are declared in the Movement Phase [7.14]' };
  if (!a) return { ok:false, reason:'select one of your units' };
  if (!d || d.side === a.side) return { ok:false, reason:'shift+click an enemy to target it' };
  if (a.routed || a.ralliedThisRound) return { ok:false, reason: a.routed ? 'routed' : 'rallied this round [6.3]' };
  const gap = rectGap(a, d);
  if (gap <= CONTACT_EPS) return { ok:false, reason:'already within melee reach' };
  const t = typeById(a.type);
  const reach = t.mv * 1.5 - a.movedIn;
  if (gap > reach) return { ok:false, reason:`out of charge reach — ${fmt(gap)}" gap vs ${fmt(reach)}" allowance [7.14]` };
  return { ok:true, gap };
}
function rallyState(a) {
  if (state.setup) return { ok:false, reason:'battle not begun' };
  if (curPhase().id !== 'rally') return { ok:false, reason:'rally attempts happen in the Rally Phase [6.0]' };
  if (!a) return { ok:false, reason:'select one of your units' };
  if (!a.routed) return { ok:false, reason:'unit is not routed' };
  if (!a.cmdr) return { ok:false, reason:'no eligible commander [6.1]' };
  if (state.units.some(v => v.side !== a.side && v.figures > 0 && inContact(a, v)))
    return { ok:false, reason:'cannot rally in contact with the enemy [6.1]' };

}
function syncActions() {
  const [a, d] = selTarget();

  const set = (id, st) => { const b = $(id); b.disabled = !st.ok; b.title = st.ok ? '' : (st.reason || ''); };
  set('#btn-melee', ms); set('#btn-charge', cs); set('#btn-rally', rs);
}
function chargeToTarget() {                                          // declare + close [7.14]
  const [a, d] = selTarget();
  const st = chargeState(a, d); if (!st.ok) return;
  pushUndo('charge');
  a.charging = true;
  const delta = contactDelta(a, d);                                  // close to the fighting line
  const step = Math.max(0, delta.dist - STANDOFF);
  const sc = delta.dist > 0 ? step / delta.dist : 0;
  a.x += delta.dx * sc; a.y += delta.dy * sc;
  a.movedIn += step; a.acted.moved = true;
  faceUnit(a, nearestFacing(delta.dx, delta.dy));                  // the straight final leg [7.14]
  log('phase', `⚡ ${esc(uName(a))} CHARGES ${esc(uName(d))}`, `closes ${fmt(step)}" straight in — melee resolves in the Melee Phase [7.14]`);
  renderAll();
}
function renderAll() { renderBoard(); renderRail(); renderSel(); syncActions();
  $('#btn-begin').style.display = state.setup ? '' : 'none';
  $('#btn-advance').style.display = state.setup ? 'none' : '';
  const pm = $('#btn-pass-move');                                    // Slice 6: GM hands the Movement Phase across
  pm.hidden = state.setup || curPhase().id !== 'movement' || state.net.spectate || state.net.player;
  if (!pm.hidden) pm.textContent = `Pass move → Side ${otherSide(state.moverSide || state.sideA || 'A')}`;
  $('#version-tag').textContent = 'v' + SIM_VERSION;
}

/* --- pointer interaction: select / drag-move / pan / measure ------------- */
let drag = null, pan = null;
function boardPt(evt) {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return { x: (vb.x + (evt.clientX - r.left) / r.width * vb.width) / PXI,
           y: (vb.y + (evt.clientY - r.top) / r.height * vb.height) / PXI };
}
svg.addEventListener('contextmenu', e => { e.preventDefault(); if (state.place) { state.place = null; svg.style.cursor = 'default'; } });
svg.addEventListener('mousedown', evt => {
  const p = boardPt(evt);
  if (evt.button === 2) { pan = { sx:evt.clientX, sy:evt.clientY, vx:state.view.x, vy:state.view.y }; return; }
  if (state.measure.on) { state.measure.a = { x:p.x, y:p.y }; state.measure.live = { x:p.x, y:p.y }; state.measure.dragging = true; renderBoard(); return; }
  if (state.net.spectate) return;                                    // Slice 6: read-only — pan/measure only
  const g = evt.target.closest('[data-uid]');
  if (state.place && !g) {                                           // click-to-place muster
    placeArmed(p.x, p.y, evt.shiftKey); return;
  }
  if (g) {
    const u = state.units.find(x => x.id === +g.dataset.uid);
    if (evt.shiftKey) {                                              // chainmail grammar: shift+click = target
      state.targetId = (state.targetId === u.id) ? null : u.id;
      if (state.targetId === state.selId) state.targetId = null;
      renderAll(); return;
    }
    state.selId = u.id;
    if (state.targetId === u.id) state.targetId = null;
    renderAll();
    // Slice 6: player seats drag only OWNED units, always enforce-gated; the GM
    // drag gate stays advisory as before. drag.pre is the PRE-move snapshot —
    // the drop's undo entry must restore the start position, not the drop
    // (the mutation happens live in mousemove, before pushUndo can fire).
    const mayMove = state.net.player
      ? (NET.ownsUnit(u) && playerMayMoveNow(u))
      : (!state.setup ? (curPhase().id === 'movement' && !u.routed && !u.ralliedThisRound && typeById(u.type).unitType !== 'mob') : true);
    if (mayMove) drag = { u, start:{x:u.x, y:u.y}, grab:{ dx:p.x-u.x, dy:p.y-u.y }, spent0: u.movedIn, pre: state.net.player ? null : snap() };
  } else { state.selId = null; renderAll(); }
});
window.addEventListener('mousemove', evt => {
  if (pan) {
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    state.view.x = pan.vx - (evt.clientX - pan.sx) / r.width * vb.width;
    state.view.y = pan.vy - (evt.clientY - pan.sy) / r.height * vb.height;
    renderBoard(); return;
  }
  const p = boardPt(evt);
  if (state.measure.on && state.measure.dragging) { state.measure.live = { x:p.x, y:p.y }; renderBoard(); return; }
  if (!drag) return;
  let nx = p.x - drag.grab.dx, ny = p.y - drag.grab.dy;
  if (!state.setup) {                                   // live budget clamp [7.7]
    const budget = moveBudget(drag.u) + (drag.u.movedIn - drag.spent0);
    const d = Math.hypot(nx - drag.start.x, ny - drag.start.y);
    if (d > budget) { const s = budget / d; nx = drag.start.x + (nx-drag.start.x)*s; ny = drag.start.y + (ny-drag.start.y)*s; }
  }
  drag.u.x = clamp(nx, 0, BOARD_W-1); drag.u.y = clamp(ny, 0, BOARD_H-1);
  renderBoard();
});
window.addEventListener('mouseup', () => {
  if (pan) { pan = null; return; }
  if (state.measure.on && state.measure.dragging) {                  // pin the reading; next click starts a new one
    state.measure.dragging = false;
    const { a, live } = state.measure;
    if (a && live && Math.hypot(live.x-a.x, live.y-a.y) < 0.05) state.measure.a = state.measure.live = null;
    renderBoard(); return;
  }
  if (!drag) return;
  const d = Math.hypot(drag.u.x - drag.start.x, drag.u.y - drag.start.y);
  if (d > 0.05) {
    if (state.net.player) {                                          // Slice 6: seat drop → move intent;
      NET.sendMove(drag.u, drag.start.x, drag.start.y);              //   local position stands as a preview
      drag = null; renderSel(); return;                              //   until the GM echo reconciles it
    }
    if (!state.setup) {
      drag.u.movedIn = drag.spent0 + d;
      drag.u.acted.moved = true;
      snapToContact(drag.u);                                         // glue a near-miss drop [7.8]
      // [7.8] stop on contact is naturally enforced by the player; contact log aid:
      const hit = state.units.find(v => v.side !== drag.u.side && inContact(drag.u, v));
      if (drag.u.charging && !hit) log('phase', `${esc(uName(drag.u))} charge did not reach`, 'must end within melee reach (1\u2033) or take -3 ML (open/mob) [7.14]');
      if (hit) log('phase', `${esc(uName(drag.u))} engages ${esc(uName(hit))}`, `moved ${fmt(d)}" \u00b7 within 1\u2033 reach [7.8]`);
    }
    pushUndo('move', drag.pre);                                      // FIX: pre-drag snapshot — undo restores the start position
  } else { drag.u.x = drag.start.x; drag.u.y = drag.start.y; renderBoard(); }

});
svg.addEventListener('wheel', evt => {
  evt.preventDefault();
  // Ctrl+wheel rotates the selected unit one cardinal step (chainmail grammar);
  // falls through to zoom when nothing is selected.
  if (evt.ctrlKey && !state.net.spectate && !state.net.player) {     // seats: facing is a GM action — fall through to zoom

    if (u && u.figures > 0 && !u.routed) { wheelFace(u, evt.deltaY > 0 ? 'right' : 'left'); return; }
  }
  const k0 = state.view.k;
  state.view.k = clamp(k0 * (evt.deltaY < 0 ? 1.12 : 0.9), 0.5, 4);
  const p = boardPt(evt);
  state.view.x += (p.x*PXI - state.view.x) * (1 - k0/state.view.k);
  state.view.y += (p.y*PXI - state.view.y) * (1 - k0/state.view.k);

}, { passive:false });

/* Chainmail's vertical splitter, ported whole (key: bs-rail). Drag right to
   shrink the rails together, snap closed past the min, double-click resets,
   size persists. Pure presentation — the SVG reads its rect live per event. */
(function initRailSplitter() {
  const layout = document.querySelector('.layout');
  const grip = document.getElementById('rail-splitter');
  if (!layout || !grip) return;
  const DEF = 550, MIN = 430, COLLAPSE = MIN - 60, CAP = 820, BOARD_MIN = 360;
  let collapsed = false;
  const curRail = () => collapsed ? 0 : (parseFloat(getComputedStyle(layout).getPropertyValue('--rail')) || DEF);
  const apply = (rail) => {
    if (rail <= 0) { collapsed = true;  layout.classList.add('rail-collapsed');    layout.style.removeProperty('--rail'); }
    else           { collapsed = false; layout.classList.remove('rail-collapsed'); layout.style.setProperty('--rail', rail + 'px'); }
  };
  const persist = () => { try { localStorage.setItem('bs-rail', collapsed ? 'x' : String(curRail())); } catch (e) {} };
  try { const s = localStorage.getItem('bs-rail');
        if (s === 'x') apply(0); else if (s) apply(Math.min(CAP, Math.max(MIN, parseFloat(s) || DEF))); } catch (e) {}
  let startX = 0, startRail = DEF, dragging = false, maxRail = CAP;
  grip.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startRail = curRail();
    maxRail = Math.min(CAP, layout.clientWidth - BOARD_MIN - 17);
    grip.classList.add('dragging'); try { grip.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const raw = startRail - (e.clientX - startX);                    // drag right → rail shrinks
    if (raw < COLLAPSE) apply(0); else apply(Math.min(maxRail, Math.max(MIN, raw)));
  });
  const end = (e) => { if (!dragging) return; dragging = false; grip.classList.remove('dragging');
    try { grip.releasePointerCapture(e.pointerId); } catch (_) {} persist(); };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', () => { apply(DEF); persist(); });
})();

/* === J. NET — GCC multiplayer (Slice 6: chainmail Slice 1 + 2A port) ===== */
// Ported whole from chainmail-board v0.11.180's NET layer onto this board's
// snap/applySnap architecture. Publishes a full minified snapshot to
// campaigns/{cid}/battles/{bid} — SAME collection and rules (v9) as chainmail
// battles; the payload's format field ('battlesystem-board') disambiguates and
// each board rejects the other's docs. Publish rides pushUndo's tail (the
// complete map of mutations); undo/redo/loadScenario republish explicitly.
// Spectators/players subscribe onSnapshot → applyRemote (applySnap +
// hydrateUnits, NOT loadScenario — its resets would stomp the viewport).
// Player seats post move intents to battles/{bid}/commands; the GM board is
// the authority and gates every intent through playerMayMoveNow, including
// the BS wrinkle chainmail lacks: the Side A/B Movement-Phase alternation
// (state.moverSide, seeded from initiative, flipped by Pass move).
// EVERYTHING here no-ops on file:// (no GCCAuth) or without ?camp=.
const NET = (function () {
  const FB_VERSION = '10.12.2';   // matches gcc-auth.js / gcc-sync.js compat builds
  const FS_URL = `https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore-compat.js`;
  const DEBOUNCE_MS = 750;        // non-extending window: drag storms collapse to ≤1 publish per window
  const LOG_PUBLISH_CAP = 300;    // newest-first entries carried in the payload (1 MB doc cap headroom)

  let db = null, user = null, unsub = null, cmdUnsub = null;
  let timer = null, dirty = false, declined = false, firstRemote = false, modalShown = false;
  let timerStarts = 0;            // self-test hook: debounce windows opened

  const $chip = () => $('#net-chip');
  function chip(cls, text, title, onclick) {
    const c = $chip(); if (!c) return;
    c.hidden = false;
    c.className = 'net-chip' + (cls ? ' ' + cls : '') + (onclick ? ' click' : '');
    c.textContent = text;
    c.title = title || '';
    c.onclick = onclick || null;
  }

  function loadScript(url) {   // same pattern as gcc-auth/gcc-sync
    return new Promise((res, rej) => {
      if (document.querySelector(`script[src="${url}"]`)) { res(); return; }
      const s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + url));
      document.head.appendChild(s);
    });
  }

  const battleRef = () => db.collection('campaigns').doc(state.net.campId)
                            .collection('battles').doc(state.net.battleId);

  // Same payload as saveScenario minus filename/savedAt, plus the Battle Log —
  // snap() does not carry the log here (unlike chainmail's captureSnapshot), so
  // it ships alongside, capped to the newest entries (#log prepends newest-first).
  function logCapture() {
    const L = $('#log'); if (!L) return '';
    return Array.from(L.children).slice(0, LOG_PUBLISH_CAP).map(k => k.outerHTML).join('');
  }
  function publishPayload() {
    return JSON.stringify({
      format: 'battlesystem-board',
      simVersion: SIM_VERSION,
      state: snap(),
      logHtml: logCapture(),
    });
  }

  function schedulePublish() {
    if (!state.net.campId || state.net.spectate || state.net.player || declined) return;
    dirty = true;
    if (timer) return;   // a window is already open — this mutation rides it
    timerStarts++;
    timer = setTimeout(() => { timer = null; if (dirty) publishNow(); }, DEBOUNCE_MS);
  }

  async function publishNow() {
    dirty = false;
    if (!db || !user) { chip('err', '⚠ not signed in', 'Sign in to publish this battle'); return; }
    if (state.net.publishing) { schedulePublish(); return; }   // one write in flight at a time
    try {
      if (!state.net.battleId) {   // first publish creates the doc (auto-id) and rewrites the URL
        const suggested = state.net.name || `Battle — ${new Date().toLocaleDateString()}`;
        const entered = prompt('Name this battle (spectators will see it):', suggested);
        if (entered === null) {   // cancelled — stop nagging for this session
          declined = true;
          chip('', '— not publishing', 'Battle naming cancelled — reload the page to publish');
          return;
        }
        state.net.name = (entered.trim() || suggested).slice(0, 80);
        const ref = db.collection('campaigns').doc(state.net.campId).collection('battles').doc();
        state.net.battleId = ref.id;
        const url = new URL(location.href);
        url.searchParams.set('battle', ref.id);
        history.replaceState(null, '', url);
      }
      state.net.publishing = true;
      chip('busy', '⟳ publishing');
      await battleRef().set({
        name: state.net.name || 'Untitled battle',
        ownerUid: user.uid,
        simVersion: SIM_VERSION,
        seq: firebase.firestore.FieldValue.increment(1),
        status: state.setup ? 'setup' : 'live',   // Begin battle flips this on its own publish
        snapshot: publishPayload(),
        _updated: new Date().toISOString(),
      }, { merge: true });
      state.net.lastPublishedSeq += 1;
      state.net.error = null;
      console.info('[NET] published seq', state.net.lastPublishedSeq);
      chip('live', `✓ live (seq ${state.net.lastPublishedSeq})`, 'Latest board state is published');
      const share = $('#btn-net-share'); if (share) share.hidden = false;
      const pshare = $('#btn-net-share-player'); if (pshare) pshare.hidden = false;
      startCommandFeed();   // first publish may have just created the doc
    } catch (e) {
      state.net.error = e.message || String(e);
      chip('err', '⚠ publish error', state.net.error);
      console.error('[NET] publish failed:', e);
    } finally {
      state.net.publishing = false;
      if (dirty) schedulePublish();   // mutations landed mid-write — open a fresh window
    }
  }

  function shareLink(kind) {
    if (!state.net.battleId) return;
    const url = new URL(location.origin + location.pathname);
    url.searchParams.set('camp', state.net.campId);
    url.searchParams.set('battle', state.net.battleId);
    url.searchParams.set(kind, '1');
    const link = url.toString();
    const done = () => chip('live', '✓ link copied', link);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt('Link:', link));
    else prompt('Link:', link);
  }
  const shareSpectateLink = () => shareLink('spectate');
  const sharePlayerLink = () => shareLink('player');

  // ── Player seats + move intents (chainmail Slice 2A) ────────────────────
  // Players never write the battle doc. A drop on a player's board posts a tiny
  // intent to battles/{bid}/commands (rules v9: members create-as-self); the
  // GM's open board validates against the live engine, replays the exact drop
  // bookkeeping, deletes the command, and the normal publish pipe echoes the
  // result to every client. Rejections log a Battle-Log line — the log IS the
  // reply channel, no second wire needed.
  const cmdsRef = () => battleRef().collection('commands');
  const me = () => user ? { uid: user.uid, name: user.displayName || (user.email ? user.email.split('@')[0] : user.uid) } : null;
  const canAssign = () => !!(db && user && state.net.campId && !state.net.spectate && !state.net.player);
  const ownsUnit = (u) => !!(user && u && u.controllerUid === user.uid);

  async function fetchPlayers() {   // campaigns/{cid}/players — the roster gcc-invite.js writes
    const qs = await db.collection('campaigns').doc(state.net.campId).collection('players').get();
    return qs.docs.map(d => ({ uid: d.id, name: d.data().displayName || d.data().email || d.id }));
  }

  async function openAssignMenu(u, x, y) {
    const m = $('#assign-menu');
    if (!m || !canAssign()) return;
    const head = `<div class="ctx-head">Assign ${esc(uName(u))} (${u.side})</div>`;
    m.innerHTML = head + '<button disabled>loading roster\u2026</button>';
    m.style.left = Math.min(x, innerWidth - 220) + 'px'; m.style.top = Math.min(y, innerHeight - 160) + 'px';
    m.hidden = false;
    let roster = [];
    try { roster = await fetchPlayers(); }
    catch (e) { m.innerHTML = head + `<button disabled>roster failed \u2014 ${esc(e.message)}</button>`; return; }
    if (m.hidden) return;   // closed while loading
    m.innerHTML = head
      + (roster.length ? roster.map(p =>
          `<button data-uid="${esc(p.uid)}" data-name="${esc(p.name)}">${esc(p.name)}${u.controllerUid === p.uid ? ' \u2713' : ''}</button>`).join('')
        : '<button disabled>no players in this campaign yet</button>')
      + (u.controllerUid ? '<button data-clear="1" class="danger">Clear player control</button>' : '');
    m.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      m.hidden = true;
      const unit = state.units.find(w => w.id === u.id);
      if (!unit || unit.figures <= 0) return;
      pushUndo('assign:' + unit.id);
      if (b.dataset.clear) {
        const was = unit.controllerName || 'a player';
        unit.controllerUid = null; unit.controllerName = '';
        log('phase', `Player control cleared \u00b7 ${esc(uName(unit))} (${unit.side})`, `${esc(was)} no longer moves it`);
      } else if (b.dataset.uid) {
        unit.controllerUid = b.dataset.uid;
        unit.controllerName = (b.dataset.name || '').slice(0, 60);
        log('phase', `Player control \u00b7 ${esc(uName(unit))} (${unit.side})`, `${esc(unit.controllerName)} now moves it from their own board`);
      }
      renderAll();
    };
  }

  async function sendMove(u, ox, oy) {   // player drop → intent doc; the preview stands until the echo
    if (!db || !user || !state.net.battleId) {
      chip('err', '\u26a0 not connected', 'Sign in and reload the player link');
      u.x = ox; u.y = oy; renderBoard();
      return;
    }
    try {
      chip('busy', '\u27f3 move sent');
      await cmdsRef().add({
        uid: user.uid, name: me().name, action: 'move',
        unitId: u.id, to: { x: u.x, y: u.y },
        ts: firebase.firestore.FieldValue.serverTimestamp(), build: SIM_VERSION,
      });
      chip('live', '\u2713 sent \u2014 awaiting the GM', 'The GM\u2019s board resolves the move; the echo lands here');
    } catch (e) {
      chip('err', '\u26a0 send failed', e.message);
      u.x = ox; u.y = oy; renderBoard();
    }
  }

  // GM side. Pure-ish so the self-tests can exercise it: reads state, mutates nothing.
  function validateMove(c) {
    const u = state.units.find(w => w.id === Number(c.unitId));
    if (!u || u.figures <= 0) return { ok: false, why: 'that unit is gone' };
    if (!c.uid || u.controllerUid !== c.uid) return { ok: false, why: `${esc(uName(u))} is not under that player\u2019s control`, u };
    if (!playerMayMoveNow(u)) {
      const why = curPhase().id !== 'movement' ? 'it is not the Movement Phase [7.0]'
        : u.routed ? `${esc(uName(u))} is routed [6.4]`
        : u.ralliedThisRound ? `${esc(uName(u))} rallied this round \u2014 no move [6.3]`
        : typeById(u.type).unitType === 'mob' ? 'mobs move by orders, not drags [2.10]'
        : `it is Side ${state.moverSide}\u2019s move`;
      return { ok: false, why, u };
    }
    const nx = Number(c.to && c.to.x), ny = Number(c.to && c.to.y);
    if (!Number.isFinite(nx) || !Number.isFinite(ny)) return { ok: false, why: 'bad destination', u };
    return { ok: true, u, nx, ny };
  }

  function applyCommand(c) {
    if (!c || c.action !== 'move') return;
    const who = esc((c.name || 'A player').slice(0, 60));
    const refuse = (why) => {
      log('phase', 'Player move refused', `${who} \u2014 ${why} (command dropped)`);
      schedulePublish();   // no pushUndo to ride \u2014 the refusal line must still echo out
      renderAll();
    };
    const v = validateMove(c);
    if (!v.ok) { refuse(v.why); return; }
    const u = v.u;
    const pre = snap();                                  // the undo entry restores the pre-move board
    let nx = v.nx, ny = v.ny;
    // Replays the exact drop bookkeeping — same clamp the seat's own mousemove
    // applied live, re-run here because the GM's board is the authority.
    if (!state.setup) {
      const budget = moveBudget(u);
      const d0 = Math.hypot(nx - u.x, ny - u.y);
      if (d0 > budget) { const sc = Math.max(0, budget) / d0; nx = u.x + (nx - u.x) * sc; ny = u.y + (ny - u.y) * sc; }
    }
    nx = clamp(nx, 0, BOARD_W - 1); ny = clamp(ny, 0, BOARD_H - 1);
    const moved = Math.hypot(nx - u.x, ny - u.y);
    if (moved <= 0.05) { refuse(`no legal move remained for ${esc(uName(u))}`); return; }
    pushUndo('net-move:' + u.id, pre);
    u.x = nx; u.y = ny;
    if (!state.setup) {
      u.movedIn += moved; u.acted.moved = true;
      snapToContact(u);                                              // glue a near-miss drop [7.8]
      const hit = state.units.find(w => w.side !== u.side && w.figures > 0 && inContact(u, w));
      if (hit) log('phase', `${esc(uName(u))} engages ${esc(uName(hit))}`, `moved ${fmt(moved)}" \u00b7 within 1\u2033 reach [7.8]`);
    }
    log('phase', `Player move \u00b7 ${esc(uName(u))} (${u.side})`,
      `${who} moves it ${fmt(moved)}"${state.setup ? ' (deployment)' : ` (turn total ${fmt(u.movedIn)}")`}`);
    renderAll();
  }

  function startCommandFeed() {
    if (cmdUnsub || !db || !state.net.battleId || state.net.spectate || state.net.player) return;
    cmdUnsub = cmdsRef().onSnapshot(qs => {
      qs.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        try { applyCommand(ch.doc.data()); }
        catch (e) { console.error('[NET] command failed:', e, ch.doc.data()); }
        ch.doc.ref.delete().catch(e => console.warn('[NET] command cleanup failed:', e));
      });
    }, err => console.error('[NET] command feed error:', err));
    console.info('[NET] command feed open');
  }

  // ── Spectate: onSnapshot → applySnap + hydrateUnits ─────────────────────
  // Deliberately NOT loadScenario: its fresh-context resets (alerts, stack
  // clears, "Board loaded" log line) would fire on every publish. This path
  // reuses the same primitives, and the spectator's pan/zoom/measure survive
  // publishes (state.view is never in the snapshot; first snapshot recentres).
  function applyRemote(d) {
    let data = null;
    try { data = JSON.parse(d.snapshot || ''); } catch (e) { /* fallthrough */ }
    if (!data || data.format !== 'battlesystem-board' || !data.state || !Array.isArray(data.state.units)) {
      $('#sp-status').textContent = 'bad snapshot — waiting for the next publish';
      return;
    }
    applySnap(data.state);
    hydrateUnits(state.units, data.simVersion);
    if (state.selId && !state.units.some(u => u.id === state.selId)) state.selId = null;
    if (state.targetId && !state.units.some(u => u.id === state.targetId)) state.targetId = null;
    if (typeof data.logHtml === 'string') $('#log').innerHTML = data.logHtml;
    if (!firstRemote) { state.view = { x: 0, y: 0, k: 1 }; firstRemote = true; }
    renderAll();
    // Banner: battle · turn · phase · publish status
    $('#sp-name').textContent = d.name || 'Untitled battle';
    $('#sp-turn').textContent = state.setup ? 'Deployment'
      : `Round ${state.round} · ${curPhase().label}${curPhase().id === 'movement' && state.moverSide ? ` · Side ${state.moverSide} moving` : ''}`;
    $('#sp-status').textContent = `${d.status || 'live'} · seq ${d.seq != null ? d.seq : '?'} · v${d.simVersion || '?'}`;
    // Name the seat's units and whether the phase + side gate lets them move right now.
    const mine = $('#sp-mine');
    if (mine) {
      mine.hidden = !state.net.player;
      if (state.net.player && user) {
        const owned = state.units.filter(w => w.figures > 0 && w.controllerUid === user.uid);
        mine.innerHTML = owned.length
          ? 'Your units: ' + owned.map(w => `${esc(uName(w))} (${w.side})${playerMayMoveNow(w) ? ' — may move' : ''}`).join(' · ')
          : 'No units assigned to you yet — ask the GM.';
      }
    }
    // Version skew (GitHub Pages caching): publisher NEWER than local → nudge a refresh.
    const warn = $('#sp-warn');
    if (warn) {
      const cmp = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
        for (let i = 0; i < 3; i++) { if ((pa[i]||0) < (pb[i]||0)) return -1; if ((pa[i]||0) > (pb[i]||0)) return 1; } return 0; };
      const newer = d.simVersion && cmp(SIM_VERSION, d.simVersion) < 0;
      warn.hidden = !newer;
      if (newer) warn.textContent = `The GM is publishing from v${d.simVersion} (you are on v${SIM_VERSION}) — refresh for the latest build.`;
    }
  }

  function startSpectate() {   // also the player-mode subscription — same pipe, different gates
    if (unsub) return;   // onAuthChange can refire — subscribe once
    chip('busy', state.net.player ? '⟳ joining' : '⟳ spectating');
    console.info('[NET] subscribing to battle', state.net.battleId);

      if (!doc.exists) { $('#sp-status').textContent = 'battle not found'; chip('err', '⚠ not found', 'No battle doc at this id'); console.warn('[NET] battle doc does not exist'); return; }
      chip('live', state.net.player ? '✓ playing' : '✓ spectating',
        state.net.player ? 'Live view — drag your assigned units while your side holds the move' : 'Live read-only view — updates as the GM plays');
      console.info('[NET] snapshot in, seq', doc.data().seq);
      applyRemote(doc.data());
    }, err => {
      chip('err', '⚠ error', err.message);
      $('#sp-status').textContent = 'error: ' + err.message;
    });
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  function init() {
    const q = new URLSearchParams(location.search);
    state.net.campId = q.get('camp') || null;
    state.net.battleId = q.get('battle') || null;

    state.net.player = !state.net.spectate && q.get('player') === '1';   // spectate wins a conflict
    if (!state.net.campId) { state.net.spectate = false; state.net.player = false; return; }   // offline / standalone — fully inert
    if (state.net.spectate) document.body.classList.add('spectate');   // gate inputs before auth resolves
    if (state.net.player) {
      document.body.classList.add('player');
      const h = $('#sp-head'); if (h) h.textContent = 'Playing';
    }
    if ((state.net.spectate || state.net.player) && !state.net.battleId) {   // a live view but nothing to watch
      chip('err', '⚠ link is missing &battle=', 'Ask the GM for a fresh share link');
      if ($('#sp-status')) $('#sp-status').textContent = 'this link has no battle id';
      return;
    }
    console.info('[NET] init', { camp: state.net.campId, battle: state.net.battleId, spectate: state.net.spectate, player: state.net.player, build: SIM_VERSION });
    if (typeof GCCAuth === 'undefined') { chip('err', '⚠ no GCC scripts', 'gcc-auth.js failed to load'); return; }
    chip('busy', '⟳ connecting');
    if (state.net.spectate || state.net.player) $('#sp-status').textContent = 'connecting…';
    // Watchdog (chainmail v0.11.176): gcc-auth ALWAYS emits an initial auth event
    // once Firebase resolves — if nothing arrives in 6 s, name the stall.
    let authEventSeen = false;
    setTimeout(() => {
      if (authEventSeen) return;
      chip('err', '⚠ auth never resolved', 'No sign-in state arrived from gcc-auth — press F12 and check the console');
      if ((state.net.spectate || state.net.player) && $('#sp-status')) $('#sp-status').textContent = 'stalled waiting for sign-in state — press F12';
      console.error('[NET] watchdog: no auth event after 6 s.',
        { GCCAuth: typeof GCCAuth, firebase: typeof firebase,
          config: typeof GCC_FIREBASE_CONFIG !== 'undefined',
          hint: 'Check the Network tab for failed gcc-*.js or gstatic firebase-*.js loads.' });
    }, 6000);
    GCCAuth.onAuthChange(async (u) => {
      authEventSeen = true;
      console.info('[NET] auth event:', u ? `signed in as ${u.email || u.uid}` : 'signed out');
      user = u;
      if (!u) {
        chip('err', '⚠ sign in', 'Click to sign in to Graycloak\u2019s Campaign Corner',
          () => { try { GCCAuth.showModal('signin'); } catch (e) {} });
        if (state.net.spectate || state.net.player) {   // reads require auth (rules v8+) — say so, and open the door
          if ($('#sp-status')) $('#sp-status').textContent = state.net.player ? 'sign in to play' : 'sign in to spectate';
          if (!modalShown) { modalShown = true; try { GCCAuth.showModal('signin'); } catch (e) {} }
        }
        return;
      }
      try {
        if (!db) { await loadScript(FS_URL); db = firebase.firestore(); console.info('[NET] Firestore ready'); }
      } catch (e) { chip('err', '⚠ Firestore failed', e.message); console.error('[NET] Firestore load failed:', e); return; }
      if (state.net.spectate || state.net.player) startSpectate();
      else {
        if (state.net.battleId) {   // reconnect — seed the chip's seq and the battle name from
          try {                     // the doc so a reload neither restarts the count at 1 nor
            const doc = await battleRef().get();   // republishes as 'Untitled battle'
            if (doc.exists) {
              const d = doc.data();
              state.net.lastPublishedSeq = d.seq || 0;
              if (!state.net.name && d.name) state.net.name = d.name;
            }
          } catch (e) { /* non-fatal — the first publish still lands, chip just starts fresh */ }
        }
        chip('live', state.net.battleId ? `✓ connected (seq ${state.net.lastPublishedSeq})` : '✓ ready — first action publishes',
          state.net.battleId ? 'Publishing to the battle doc' : 'The first mutating action creates the battle doc');
        const share = $('#btn-net-share'); if (share && state.net.battleId) share.hidden = false;
        const pshare = $('#btn-net-share-player'); if (pshare && state.net.battleId) pshare.hidden = false;
        if (state.net.battleId) schedulePublish();   // announce the current board on (re)connect
        startCommandFeed();   // consume player move intents (no-op until battleId exists)
      }
    });
  }

  return {
    init, schedulePublish, publishNow, publishPayload, applyRemote,
    shareSpectateLink, sharePlayerLink, sendMove, ownsUnit, canAssign, openAssignMenu,
    // self-test hooks — not for gameplay use
    _test: {
      get timerStarts() { return timerStarts; },
      get pending() { return !!timer; },
      cancel() { if (timer) clearTimeout(timer); timer = null; dirty = false; },
      validateMove,
    },
  };
})();

$('#btn-net-share-player').onclick = () => NET.sharePlayerLink();

  const m = $('#assign-menu');
  if (m && !m.hidden && !m.contains(e.target)) m.hidden = true;
}, true);

  // validateMove: ownership + setup admission
  const PU = state.units[0]; PU.controllerUid = 'uidX'; state.setup = true;
  t('validateMove accepts owned in setup', NET._test.validateMove({ unitId: PU.id, uid:'uidX', to:{ x:6, y:6 } }).ok === true);
  t('validateMove rejects unowned', NET._test.validateMove({ unitId: PU.id, uid:'other', to:{ x:6, y:6 } }).ok === false);
  // seat gate: Side A/B alternation + phase
  state.setup = false; state.round = 1; state.phaseIdx = PHASES.findIndex(x => x.id === 'movement');
  state.moverSide = 'B';
  t('seat gate: wrong side blocked', playerMayMoveNow(PU) === false);
  state.moverSide = 'A';
  t('seat gate: own side in Movement ok', playerMayMoveNow(PU) === true);
  state.phaseIdx = PHASES.findIndex(x => x.id === 'melee');
  t('seat gate: non-Movement phase blocked', playerMayMoveNow(PU) === false);
  t('otherSide flips', otherSide('A') === 'B' && otherSide('B') === 'A');
  // drag-undo FIX: the drop's undo entry is the PRE-drag snapshot
  state.setup = true; state.units = [mkUnit('ORC','A',12,10,10)];
  const MU = state.units[0], preS = snap();
  MU.x = 20;                                   // simulate the live mousemove mutation
  pushUndo('move', preS); undo();
  t('drag undo restores the pre-drag position', state.units[0].x === 10);
  // ── Slice 7A: 45° headings + oriented-rect geometry ──────────────────────
  const OA = mkUnit('ORC','A',12,10,10);
  faceUnit(OA, 45);
  t('45° heading normalizes + keeps center', OA.facing === 45 && Math.abs(unitCenter(OA).cx - (10 + unitRect(OA).w/2)) < 1e-9);
  // cardinal parity: pure-y separation equals the old AABB edge distance
  const PA = mkUnit('ORC','A',12,10,10); PA.facing = 0;
  const PB = mkUnit('ORC','B',12,10, 10 + unitRect(PA).h + 1.25); PB.facing = 0;
  t('cardinal gap parity with the AABB model', Math.abs(rectGap(PA, PB) - 1.25) < 1e-6);
  t('polyGap symmetric', Math.abs(rectGap(PA, PB) - rectGap(PB, PA)) < 1e-9);
  // rotated pair: contactDelta measures the true gap and closes it
  const RA = mkUnit('ORC','A',12,10,10); faceUnit(RA, 45);
  const RB = mkUnit('DWARF','B',12,22,18);
  const rdel = contactDelta(RA, RB);
  t('rotated contactDelta measures the gap', Math.abs(rdel.dist - rectGap(RA, RB)) < 1e-9 && rdel.dist > CONTACT_EPS);
  RA.x += rdel.dx; RA.y += rdel.dy;
  t('rotated closure lands in contact', rectGap(RA, RB) < 0.02);
  // arcOf tracks a 45° facing: dead-ahead FRONT, dead-astern REAR
  const DF = mkUnit('MEN_HF','B',12,20,20); faceUnit(DF, 45);
  const dcn = unitCenter(DF), fdv = facingDir(45);
  const AFU = mkUnit('ORC','A',12, dcn.cx + fdv[0]*12, dcn.cy + fdv[1]*12);
  const ARU = mkUnit('ORC','A',12, dcn.cx - fdv[0]*12, dcn.cy - fdv[1]*12);
  t('arcOf tracks a 45° facing', arcOf(DF, AFU) === 'front' && arcOf(DF, ARU) === 'rear');
  // pre-0.7 migration: a facing-90 save keeps its world center
  const MGU = mkUnit('ORC','A',12,10,10);
  const mgr = unitRect(MGU);
  const oldCx = 10 + mgr.h/2, oldCy = 10 + mgr.w/2;                  // old model stored the swapped rect's top-left
  MGU.facing = 90; hydrateUnits([MGU], '0.6.1');
  const mgc = unitCenter(MGU);
  t('pre-0.7 facing-90 save keeps its center', Math.abs(mgc.cx - oldCx) < 1e-9 && Math.abs(mgc.cy - oldCy) < 1e-9);
  // mob advance heading at 45° is a unit NE vector
  const mdv = facingDir(45);
  t('facingDir 45° is unit NE', Math.abs(mdv[0] - Math.SQRT1_2) < 1e-9 && Math.abs(mdv[1] + Math.SQRT1_2) < 1e-9);
  // contactInfo projection parity at facing 0 (x-overlap of two closed lines)
  const CIA = mkUnit('ORC','A',12,10,10); CIA.facing = 0;
  const CIB = mkUnit('ORC','B',12,11,10 + unitRect(CIA).h + 0.05); CIB.facing = 180;
  const ciOld = Math.max(0, Math.min(10 + unitRect(CIA).w, 11 + unitRect(CIB).w) - Math.max(10, 11));
  t('contactInfo projection matches x-overlap at facing 0',
    contactInfo(CIA, CIB).contactFrontage === Math.max(1, Math.min(unitRect(CIA).cols, Math.round(ciOld / (unitRect(CIA).bw + unitRect(CIA).gap)) || 1)));
  // oblique economy: first ≤45° free [7.9 ruling 2026-08-18], second costs 1/6 MV
  const OCU = mkUnit('ORC','A',12,10,10); state.units = [OCU]; state.setup = false; state.round = 1;
  state.phaseIdx = PHASES.findIndex(x => x.id === 'movement');
  const duN = state.undoStack.length;
  facingChange(OCU, 'obl-right');
  t('first oblique is free', OCU.facing === 225 && OCU.movedIn === 0 && OCU.obliqueUsed === true);
  facingChange(OCU, 'obl-right');
  t('second oblique costs 1/6 MV', OCU.facing === 270 && Math.abs(OCU.movedIn - typeById('ORC').mv/6) < 1e-9);
  state.undoStack.length = duN;
  // Slice 7B-prep (v0.7.1): grid cycles 6" → 6"+1" → off; sub-grid respects the zoom gate
  const gb = $('#btn-grid'); const g0 = state.grid; state.grid = 1;
  gb.click(); gb.click();
  t('grid button cycles to off', state.grid === 0 && !gb.classList.contains('on'));
  gb.click();
  t('grid button cycles back to 6\u2033', state.grid === 1 && gb.classList.contains('on'));
  state.grid = 2; state.view.k = 1; renderBoard();
  const fine1 = svg.querySelectorAll('line[stroke-width="0.35"]').length;
  state.view.k = 2; renderBoard();
  const fine2 = svg.querySelectorAll('line[stroke-width="0.35"]').length;
  t('1\u2033 sub-grid gated by zoom', fine1 === 0 && fine2 === (BOARD_W - 1 - 11) + (BOARD_H - 1 - 7));
  state.grid = g0; state.view.k = 1;
  // v0.8.0: engagement legibility + chainmail layout
  t('melee reach is 1" [house rule 2026-08-18]', CONTACT_EPS === 1.0 && STANDOFF < CONTACT_EPS);
  const gaH = unitRect(mkUnit('ORC','A',12,0,0)).h;
  const GA = mkUnit('ORC','A',12,10,10), GD = mkUnit('MEN_HF','B',12,10,10 + gaH + 1.5);
  state.units = [GA, GD]; state.setup = false; state.round = 1;
  state.phaseIdx = PHASES.findIndex(x => x.id === 'melee');
  const msr = meleeState(GA, GD);
  t('melee reason names the gap', !msr.ok && /″ apart/.test(msr.reason));
  // AD&D 1" engagement: 0.9" fights, 1.2" does not; a just-out drop glues to inside reach
  GD.y = 10 + gaH + 0.9;
  t('0.9" pair is within melee reach', inContact(GA, GD) && meleeState(GA, GD).ok);
  GD.y = 10 + gaH + 1.2;
  t('1.2" pair is out of reach', !inContact(GA, GD));
  snapToContact(GA);
  t('just-out drop glues to inside reach', inContact(GA, GD) && Math.abs(rectGap(GA, GD) - 0.9) < 0.05);
  // labels: compact one-liner unselected, two lines when selected
  state.selId = null; state.targetId = null; renderBoard();
  const lbl1 = svg.querySelectorAll('g[data-uid] text[paint-order="stroke"]').length;
  state.selId = GA.id; renderBoard();
  const lbl2 = svg.querySelectorAll('g[data-uid] text[paint-order="stroke"]').length;
  t('labels: compact by default, detail on select', lbl1 === 2 && lbl2 === 3);
  state.selId = null;
  t('rail splitter present', !!document.getElementById('rail-splitter'));
  const mp = $('#muster-panel'); const wasC = mp.classList.contains('collapsed');
  mp.querySelector('h2.tgl').click();
  t('panel header toggles collapse', mp.classList.contains('collapsed') !== wasC);
  mp.classList.remove('collapsed');
  NET._test.cancel(); state.net.campId = null;         // kill the test publish window before real boot
  state.setup = true; state.round = 0; state.phaseIdx = 0; state.moverSide = null;
  state.units = []; nextId = 1; state.selId = null; state.targetId = null;   // tests must not leak pieces
  state.undoStack.length = 0; state.redoStack.length = 0; syncUndo();        // no test undo/redo artifacts
  console.log(`[BS-BOARD] self-tests: ${ok.length} ok${bad.length ? ` · FAILED: ${bad.join('; ')}` : ''}`);
  if (bad.length) log('phase', '⚠ Self-test failures', bad.join(' · '));
})();

NET.init();
renderAll();
log('phase', `Battlesystem Board v${SIM_VERSION}`, 'Muster (click board to place) · shift+click targets an enemy · lit buttons show legal actions',
  'Engine: @graycloak/battlesystem-engine v0.2.0 · Multiplayer: ?camp= publishes · &spectate=1 watches · &player=1 moves assigned units · Intermediate slice (missiles, cavalry, terrain) to follow');
</script>
