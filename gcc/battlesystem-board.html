mobs charge exclusively through their persistent Rally-Phase Charge order [2.10]/[6.6], eliminating the old dead-end where a mob could declare a charge but could not be dragged. Charge reachability now measures the actual minimum translation needed to reach the 0.25-inch fighting-line standoff (rect gap minus STANDOFF), instead of granting an extra full 1-inch CONTACT_EPS. The toolbar now visibly changes to “⚡ Charge declared” and names the declared target; direct declaration returns success/failure for regression tests. PRIOR (v0.15.1): MOVEMENT BADGE CLEARANCE FIX. Live and completed movement information badges now position from the moving unit's rotated footprint with a guaranteed 1-inch battlefield clearance, rather than using a small cursor offset that could place the box against or over the unit. The cursor still selects the preferred side; viewport fitting and other-unit collision scoring choose a safe alternate side when needed. PRIOR (v0.15.0): SLICE 7C — SPECIAL MOVEMENT + ROUT COMPLETION. Forced March [7.13] is now a declared movement action with 1.5× MV, in-command/no-contact gates, end-of-move Morale Check, cumulative AR degradation, and one-point recovery after a completely idle/unattacked round. Flee [8.8] is a first-class engaged movement action: free about-face, one rear free attack with no retaliation, then a full-MV retreat if the unit survives and does not rout from the free attack. Rout direction is now recorded on first rout and subsequent [6.4] rout movement continues on that heading; routed units struck in melee immediately rout another full MV after damage. Charge Break Through [7.14] gains an assisted eligibility/action path for contacts whose minimum possible charging damage destroys the figures blocking the path; the blocker figures are removed and the charge remains live so the charger can continue its declared heading. PRIOR (v0.14.2): SIDE NAMING SIMPLIFICATION. Side A and Side B are now permanent army identities throughout the simulator (default colors blue/red); initiative determines only which permanent side acts first that round. The old Blue/Red text labels and initiative-winner role relabeling are removed. The initiative winner is stored explicitly as initiativeWinner, with backward-compatible hydration of pre-v0.14.2 snapshots that used sideA. PRIOR (v0.14.1): 7B CORRECTION — FREE OBLIQUE DIRECTION + LIVE DRAG RULER. Closed/open units now move at ANY direction within ±45° of their unchanged formation facing, at will and with no extra turn surcharge; the old 45° snap and one-free-oblique house rule are removed. Facing changes remain the separate Right/Left/About Face maneuvers, and Wheel remains the costed way to rotate the formation. Movement feedback now follows the Chainmail board pattern: the current drag leg, start marker, running allowance, direction and facing render LIVE while dragging in a top overlay, while completed paths remain quiet history underneath the figures. Post-move summaries are compact, selected-unit-only badges positioned on the path rather than under the destination unit. Charge path headings are stored continuously (not rounded to 45°), so the final-one-third-straight validator measures the actual path. PRIOR (v0.14.0): SLICE 7B — PATH-AWARE MOVEMENT. Movement is now stored as explicit legs with trails, start/end markers, distance/cost/facing diagnostics, heading enforcement, first-contact stops, charge declaration + path validation, true 45° wheels, engaged-unit lockdown, frontage changes, fighting withdrawal, and an assisted wrap-around action. Charge uses the user-verified 1/3 final-straight reading of [7.14]; it must be declared before movement, travel at least 2/3 normal MV before contact, and spend its final 1/3 of actual path in one straight heading. Failed charges apply the RAW closed→open or open/mob −3 morale consequences. Movement auto-actions now run when each army’s turn actually begins. PRIOR (v0.13.0): TSR-STYLE UNIT SHEET. The live Selected inspector is now a compact BATTLESYSTEM Army Roster block modeled on the rulebook sheet: Unit Name/Type; AC/#FIG/Commander; HD/fig/Ratio/Level-Race-Class; MV/Size/MR+saves; AR+modifiers; ML+modifiers; DL; Weapon/Damage/#AT; Special Abilities/Limitations. A small Battle footer keeps transient state (formation/frontage/facing, movement, status, target/attack) separate from roster data. Edit mode is in-place in the same grid instead of a long replacement form. Per-unit `u.prof` overrides let a deployed unit differ from its BS_TYPES template without copying the whole template; AC, HD, MV, Base AR, Base ML, DL, size, weapon/damage/#AT, roster notes, MR/saves, race and deputy persist in saves/network snapshots and feed the rules engine where applicable. The detached panel title becomes “Unit Sheet · <name>”; controls are compacted with a facing dropdown. PRIOR (v0.12.0): BOARD-FIRST LAYOUT. The battlefield now owns the viewport: full-height app shell, one resizable right inspector dock (Selected/Muster tabs), and a collapsible/resizable bottom Battle Log replace the old two permanent side rails. The dock defaults to 320px, can be resized or snapped closed, and persists independently of battle saves; the log defaults collapsed, opens upward, can be height-resized, and persists as view state. Selected can pop into a draggable/resizable floating window and re-dock without cloning or losing live button handlers. Setup opens Muster; battle start and clicking a unit open Selected. Spectator/player seat chrome is preserved in the new dock. No rules, save-snapshot, or network payload changes. PRIOR (v0.11.1): VISUAL UX PASS. Battlefield chrome is quieter and selection/targeting carry the emphasis: selected units use animated gold corner brackets; targets use an animated ivory/red reticle; ordinary card borders keep army color. Labels are smaller with a thinner halo, drop army letter / #id / weapon clutter in compact mode, selected/targeted units stay one-line enhanced compact instead of forcing full detail, Labels: off now really hides labels except hover, and Full/hover retain two-line detail. M/F/X chips shrink ~20% and inactive chips soften. The commander star is removed; the first front-rank figure pip now carries a gold outline to represent the embedded commander/boss. The selected commander CR circle is retained but substantially faded, and the FRONT/FLANK/REAR target banner is reduced. No rules, save, or network state changes. PRIOR (v0.11.0): ARMY/ROLE NAMING + STRICT TWO-STEP MOVEMENT (the sub-phase slice, cut against [5.1] as pasted). VERIFICATION FIRST: ChatGPT's claimed discrepancy ("Side A CHOOSES which side moves first") is WRONG — [5.1] opens "The side that moves first in each Game Round is determined by making an Initiative Roll", i.e. the WINNER MOVES FIRST with no choosing step, corroborated by [7.8]'s "lost initiative and had an enemy unit move into base-to-base contact" (only possible because the loser moves second). The Slice 6 seeding stands as RAW. What [5.1] DOES establish: "The side that wins initiative is called Side A" — Side A/B are PER-ROUND ROLES, not army identities, and the sim conflated them. NAMING: armies are now player-facing BLUE (internal id A) and RED (internal id B) everywhere — muster dropdown, rail ("Round 2 · Red is Side A · Red moving (Side A)"), initiative log ("Red wins initiative — Red is Side A this round"), seat refusals ("it is Blue's move"), spectate banner — while Side A/Side B appear only as role annotations (roleOf helper); internal ids, saves, and the NET payload are UNTOUCHED (zero migration). MOVEMENT is now the RAW strict sequence instead of a free toggle: state.moveStep (0 Side A's turn · 1 Side B's · 2 both done; carried in snap(), so it publishes and undoes) — the pass button reads "Blue done → Red moves", then "Red done — end movement", then hides; after both, moverSide = null so NO seat may move (previously the GM could toggle back and forth forever, which [5.1] does not allow). Rally and Melee entries log their role order informationally ("Rally order: Red (Side A), then Blue" [6.0]; "Red (Side A) chooses the order of engagements" [8.2]) — display-only for now since seats have no rally/melee actions; the enforcement machinery arrives when they do. Self-tests 70 → 77: helper semantics (armyName permanent, roleOf per-round), movement entry seeds winner + step 0, first pass hands across, second pass ends movement with nobody holding it, seats locked out after both moved, third pass a no-op, moveStep round-trips through snapshots. PRIOR (v0.10.0): [7.14] MINIMUM CHARGE RUN-UP + UNIT EDITOR. (1) The too-close "CHARGE READY" Kurt caught is a real Basic-rules gap, not Intermediate — [7.14]: "the unit must be able to move at least 2/3 its normal movement rate before it comes into base-to-base contact." chargeState now enforces it; RULED 2026-08-18: movement already made this phase COUNTS toward the run-up (the charge is the unit's move — a fresh MV-9 unit 3" out cannot charge, but one that marched 4" and closes 3" can, 7 >= 6). The closing distance measures to the standoff. Refusal reads 'too close to charge — needs a X" run-up before contact, this move totals Y" [7.14]'. Wild mob charges from failed discipline stay UNGATED per [4.6] (forced regardless). (2) UNIT EDITOR — no way existed to touch a deployed unit or its rolled commander, which made testing morale/discipline/rally against specific stats impossible. The Selected pane gains '✎ Edit' (GM only; seats never see buttons): custom NAME (u.label, hydrated on old saves, flows through uName into every log line, the Selected pane, and both board label modes — escaped at write per the XSS convention), figures + startFigures (settable independently to stage loss-threshold morale checks), frontage, movedIn, wounded, ROUTED and RALLIED-THIS-ROUND flags (rally/discipline testing), and the embedded commander's name / level 1-20 / CHA 3-19 — Apply recomputes CB, CR, and baseMorale [4.8]/[4.9] and logs the edit; Cancel or deselect closes; every Apply is one undo entry. Self-tests 63 → 70: run-up refusal names the rule, prior-movement completion, long-approach pass, editor form render, Apply rewrites unit + commander + pushes one undo + closes, ML recompute, custom name through uName and onto the board. PRIOR (v0.9.1): FIX: chrome in the fighting gap (screenshot repro from Kurt: an engaged ogre/dwarf pair with BOTH units' M/F/X chips stacked in the gap over both cards, plus the FRONTAL banner colliding with the ogres' above-label). Root cause: v0.9.0 moved LABELS to the rear but its chip "swap" placed chips at the top of the bounds unless the label was up there — for a front-south unit that put chips BELOW its card, and for its front-north opponent chips ABOVE its card: both sets landed in the shared engagement gap, precisely the space the labels had just vacated. FIX: a single REAR-CHROME PLAN computed once per unit positions chips AND label as one stack off the rear edge, chips nearest the card, label lines beyond (rear-down: chips,l1,l2 downward; rear-up: l1,l2,chips upward with chips hugging the card; rear-sideways: block vertically centred at the anchor). The fighting gap between two engaged fronts now holds NOTHING. The arc banner is stack-aware: when the target's chrome sits above its card the banner climbs past the label block instead of printing through it. Anchor margin trimmed 0.55"→0.45" since the stack is taller. Self-tests 61 → 63: an engaged front-to-front pair rendered and BOTH chip rows asserted geometrically out of the gap (north-facer's chips ≥ card bottom, south-facer's < card top). PRIOR (v0.9.0): Rear-anchored labels + Labels modes + hover reveal (the "text in the fighting gap" fix, decoupled from the reach ruling — 1" melee reach STANDS). ANCHORING: the unit label now sits off the REAR edge — the side opposite the green front stripe — computed as center − facingDir·(depth/2 + 0.55") in the upright overlay, correct at every 45° heading. Units fight front-to-front, so labels structurally vacate the engagement gap: two battle lines closing on each other keep their name tags trailing BEHIND them like standards, never between the fronts. When the rear points up (front-south headings) the label block shifts clear and the M/F/X chips SWAP to below the card so the two never collide. MODES: new Labels toolbar button cycling compact → full → off (state.labels 1/2/0, view-local like Grid, never snapshotted): compact stays the default one-liner per unit; full draws every unit's two-line detail; off gives a clean tabletop for screenshots and dense fights. HOVER: mousing over any unit reveals its full two-line detail in ANY mode (state.hoverId, tracked in mousemove with re-render only on change, cleared on board mouseleave) — identification is always one hover away even on a bare board; selection and targeting still force detail as before. Self-tests 57 → 61: full mode = 2 lines/unit and off = none via real button clicks, hover reveals detail with labels off, Labels cycles back to compact, and rear anchoring locked geometrically (facing-0 label y below the card, facing-180 label y above). PRIOR (v0.8.1): HOUSE RULE (2026-08-18): melee reach is 1", the AD&D engagement convention — fighters within 1" (10 yds outdoors, matching BS's own [2.1] ground scale) may melee. This SUPERSEDES the v0.3.0 ruling that BS melee is literal base-to-base per [7.8]/[8.1]; Kurt's rationale: you can't swing a sword pressed against a man, and the AD&D convention BS descends from always gave the 1" fighting gap. Mechanics: CONTACT_EPS 0.5 → 1.0 (inContact, melee eligibility, phase auto-skip, enemyAtRear morale, clash lines, and the [8.1] frontage measurement all key off it consistently). The 0.25" STANDOFF stays as the rendered fighting line CHARGES still slam to [7.14] — a charge presses home; ordinary approach fights from anywhere inside 1". snapToContact REPURPOSED: with 1" of reach the old glue-everything-to-the-standoff behavior would override player positioning, so drops already within reach now STAY EXACTLY where dropped, and only the just-barely-out drop (reach..reach+0.4"] glues to 0.9" — the frustration killer without the teleport. chargeState's 'already in contact' floor widens from 0.15" to the full reach ('already within melee reach' — no burning move to charge someone you can already strike). Wording pass: 'engages' replaces 'contacts' in drop/mob logs, 'In reach:' in the Selected pane, the blocked-melee reason reads 'out of melee reach — X" apart, needs <= 1" [house: AD&D 1" engagement]', and the failed-charge warning cites reach. Self-tests 54 → 57: reach lock at 1.0, 0.9"-pair fights / 1.2"-pair doesn't / just-out drop glues to 0.9", in-reach drops stay put (snap fixture repurposed), out-of-reach reason fixture moved to 1.5", diagonal-charge fixture pushed beyond the widened reach. PRIOR (v0.8.0): UX slice — chainmail layout parity + engagement legibility (three reported issues run down). (1) UNREADABLE UNIT TEXT — root causes: every card drew TWO label lines (plus chips) with no halo over the green field, colliding on any crowded line, and the old 285px|board|300px grid squeezed the board into the middle column so everything rendered small. Fixes: labels are now HALOED (paint-order:stroke, chainmail's technique) and COMPACT by default — one 10px line (side·name #id · figs · ROUT/CHG) — with the full two-line detail drawn only for the selected/targeted unit; labels are pointer-events:none so they never block clicks; M/F/X chips draw in battle only. (2) LAYOUT — chainmail's arrangement ported whole: Board FIRST at minmax(0,1fr) | 7px rail-splitter | controls rail | log rail, the two rails holding a 250:300 ratio off --rail (default 550px); the splitter drags to resize, snaps closed past the min for a full-width board, double-click resets, persists in localStorage (bs-rail). The old left column is gone — Spectate/Selected/Muster stack in the controls rail (Selected ABOVE Muster: battle-first), the Battle Log is the far rail with its own scroll. Selected and Muster panels are COLLAPSIBLE via their headers (▾/▸), and Muster auto-collapses at Begin battle (header re-opens; Reset re-expands). Seat CSS untouched — the spectate/player rules target ids, which moved with their elements. (3) CAN'T CLOSE / CAN'T FIGHT "EVEN IN CONTACT" — two real causes found: (a) CONTACT_EPS was 0.3 vs the 0.25 rendered standoff — 0.05" of slack, so a pair 0.31" apart LOOKED exactly like an engaged standoff pair but wasn't mechanically in contact; EPS widens to 0.5 (a pair that looks engaged IS engaged; the standoff renders at 0.25 so daylight between engaged and not is visible) and the drop/snap capture widens 0.8→1.0. (b) The disabled attack buttons carried their block reason in `title` — but DISABLED elements don't fire pointer events in Chrome, so the tooltip NEVER SHOWED and a blocked melee was a silent mystery. The Selected pane now has an ATTACK row that states it plainly: MELEE/CHARGE READY in green, or the live reason — and the not-in-contact reason now names the actual gap ('0.42" apart, needs <= 0.5"'). Self-tests 49 → 54: EPS lock, gap-naming reason, compact-vs-detail label counts, splitter presence, header collapse toggle. PRIOR (v0.7.1): 1" SUB-GRID (chainmail-board parity, snap-to-grid deliberately declined). The Grid button now CYCLES three states — Grid: 6" → Grid: 6"+1" → Grid: off — with the label naming the mode (state.grid 1/2/0; view-local, never snapshotted or published). In 6"+1" mode, faint 1" lines (stroke-width 0.35, .09 alpha) draw between the 6" majors, but ONLY past a zoom threshold (view.k >= 1.5): at full-table view 72×48 fine lines are noise over the parchment, so the sub-grid fades in as you lean in; the button tooltip says so. Snap-to-grid was considered and DECLINED (ruled with Kurt 2026-08-18): (1) it fights snap-to-contact — inch quantization vs the 0.25" standoff is exactly the visual-vs-mechanical divergence behind the v0.2.1/v0.3.2 melee-skip bugs; (2) BS footprints are sub-inch (3/4" dwarf bases, 0.5" open-formation gaps) so a 1" quantum misaligns edges; (3) 45° headings (v0.7.0) don't align to a square grid at all. If ever revisited: opt-in, center-snapped at 0.5", drop-only, cardinal-only, always yielding to snap-to-contact. Self-tests 46 → 49: button cycles 6"→6"+1"→off→6" with the .on class tracking, and the sub-grid line count is zero below the zoom gate and exactly (71-11)+(47-7) non-major lines above it. PRIOR (v0.7.0): Slice 7A — 45° headings on true oriented-rect geometry. FACING: u.facing is now any 45° step (0-315); ctrl+wheel rotates 45° per notch (setup free + burst-collapsed; battle routes through the [7.9] economy); Selected pane gains Oblique L/R 45° buttons; Right/Left/About Face keep their RAW 1/3-1/3-1/2 MV costs. OBLIQUE ECONOMY per the 2026-08-18 ruling: ONE free ≤45° direction change per move for closed/open (u.obliqueUsed, reset at End of Round); FURTHER 45° steps cost 1/6 MV — a pro-rated half of a Right Face (house extrapolation, open to veto: two steps = 1/3 MV ✓ consistent, though four steps at 2/3 exceeds About Face's 1/2, so About stays the cheap 180). GEOMETRY: the local rect is now ALWAYS frontage-horizontal with the front edge at local top — the old 90/270 w/h swap is retired and rotation happens about the center in world space. unitPoly/toLocal/worldBounds/facingDir are the new frame helpers. rectGap/contactDelta become SAT intersection + vertex-edge closest-pair on the oriented quads (EXACT parity with the old AABB distance at cardinal headings — locked by self-test); contactDelta returns the true closing vector at any heading, so charge/snap/mobCharge close correctly rotated. arcOf classifies the attacker's center in the DEFENDER'S LOCAL FRAME — one formula, cardinal semantics unchanged, front/flank/rear now correct at every heading (this is the aiming machinery missiles, dragon breath, and spell templates will consume). contactInfo [8.1] projects the overlap onto the attacker's front-edge axis — which also FIXES a latent cardinal bug: at 90/270 the old code measured the x-extent (unit DEPTH), not frontage. nearestCardinal → nearestFacing (nearest 45°): chargers, mob charges, and routs now end actually pointed at/away from their target. RENDER: card/pips/front-stripe/CR-circle rotate as a group about the card center; chips, labels, and the arc banner stay UPRIGHT, anchored to the world-bounds box; the front rank is always local row 0 (the rotation carries it — identical cardinal visuals). Mob Advance walks along any heading via facingDir. MIGRATION: pre-v0.7 saves stored the SWAPPED rect's top-left for facing 90/270; hydrateUnits(units, fromVersion) shifts x,y so the world CENTER is preserved (self-tested); hydration also normalizes facing to 45° steps and seeds obliqueUsed; loadScenario and NET.applyRemote pass their payload's simVersion. Mob facing buttons deliberately KEPT this slice as the GM's proxy for the wheel (RAW gives mobs Wheeling, not facing changes — the honest fix lands with 7B). DEFERRED to 7B: Wheel as a first-class costed action (outermost-figure arc, any-figure pivot [7.9]), drag-leg heading enforcement (straight/≤45° legs, the one-free-oblique consumed by an oblique DRAG leg too), and the [7.8] engaged-unit lockdown with Wrap-Around [7.11]/Fighting Withdrawal [7.12]. Melee at cardinal headings is behavior-identical to v0.6.1 except the 90/270 contactInfo fix. Self-tests 35 → 46: 45° normalize + center invariance, cardinal AABB gap parity, gap symmetry, rotated contactDelta measure + closure-to-contact, arcOf at 45°, pre-0.7 center-preserving migration, facingDir NE, contactInfo x-overlap parity at facing 0, oblique free-then-1/6-MV; faceUnit and wheel-burst tests updated for the fixed local rect and 45° notches. Script parses as a MODULE. PRIOR (v0.6.1): FIX: the measure tool. Two defects: (1) the mouseup handler cleared measure.a and returned WITHOUT renderBoard(), so the dashed line + label froze on screen until an unrelated action redrew the board (the stale ghost line); (2) it was hold-to-measure — the anchor cleared on release, so the reading could not be read after letting go. Now: measure.dragging tracks the active drag; on release the measurement PINS (line + inches/yards label stay drawn), the next mousedown in measure mode starts a fresh one, and toggling Measure off clears everything; a zero-length click (<0.05") clears instead of pinning a "0" label. Pre-measuring is a deliberate deviation from [7.7]'s SPECIAL NOTE (no pre-measuring at the table) — ruled a GM aid appropriate to a computer game (2026-08-18). RULING RECORDED for the movement slice, [7.9] free 45-degree oblique: ONE free direction change of up to 45 degrees per move for closed/open formations; only skirmish formation changes direction at will (multiple changes). RAW says "at will" in both sentences, but unlimited free 45-degree legs would let closed/open approximate any curve for free and the costed Wheel would never be paid — the one-per-move reading preserves wheeling's purpose (house interpretation, ruled 2026-08-18; implementation lands with the heading-aware movement slice). PRIOR (v0.6.0): Slice 6 — GCC multiplayer, chainmail-board's NET layer (Slice 1 publish/spectate + Slice 2A player seats) ported whole onto this board's snap/applySnap architecture. FIREBASE: same GCC project via the same three head includes (gcc-firebase-config.js / gcc-auth.js / gcc-auth.css, chainmail's current ?v= hashes); battles publish into the SAME campaigns/{cid}/battles/{bid} collection under the existing rules v9 — ZERO rules changes; the payload's format field ('battlesystem-board') disambiguates and each board's applyRemote rejects the other's docs as 'bad snapshot'. PUBLISH: NET.schedulePublish() rides pushUndo's tail (still the complete map of mutations), debounced 750 ms non-extending; undo/redo (afterRestore) and loadScenario republish explicitly; doc carries name/ownerUid/simVersion/seq-increment/status(setup→live)/snapshot/_updated. Unlike chainmail, snap() does not carry the log, so the payload ships logHtml alongside — captured from #log (prepend-newest-first) capped at the newest 300 entries for 1 MB doc headroom. SPECTATE (?camp=&battle=&spectate=1): onSnapshot → applyRemote → applySnap + hydrateUnits (extracted from loadScenario's hydration loop, now shared; seeds controllerUid/controllerName) + logHtml swap — NOT loadScenario, whose resets would stomp the viewport; state.view is never in the snapshot so pan/zoom survive publishes (first snapshot recentres); stale selId/targetId cleared; version-skew banner nudges a refresh when the publisher is newer. Inputs: spectate mousedown hard-returns after pan/measure, keydown and ctrl+wheel-facing gated, mutating buttons + Muster/Selected hidden via body.spectate CSS (the pushUndo seat guard is the backstop — no capture-phase allowlist needed since hidden buttons can't be clicked). PLAYER SEATS (&player=1): subscribes via the same pipe; body.player keeps the Selected pane; pushUndo hard no-ops (seats never write the battle doc); drag arms only on OWNED units (NET.ownsUnit) and only when playerMayMoveNow — the BS WRINKLE chainmail lacks: NEW state.moverSide (in snap(), so it publishes and undoes) seeds to the initiative winner at Movement entry [5.1] and the GM's new 'Pass move → Side X' phase-row button flips it; seats move only while their side holds the move (deployment is free; mobs never drag [2.10]; routed/rallied blocked [6.3]/[6.4]). A seat drop posts a move intent to battles/{bid}/commands (rules v9: members create-as-self) and stands as a local preview until the GM echo; the GM board is the authority — startCommandFeed consumes 'added' → validateMove (alive, controllerUid match, playerMayMoveNow incl. the side gate) → applyCommand replays the exact drop bookkeeping (budget re-clamp via moveBudget, board clamp, pushUndo 'net-move' with a PRE-move snapshot, movedIn charge, acted.moved, snapToContact, contact + 'Player move' log lines) → deletes the command; refusals log 'Player move refused' and schedulePublish explicitly. ASSIGN: GM's Selected pane gains 'Assign to player…' → #assign-menu populated live from campaigns/{cid}/players (gcc-invite roster) with clear-control; seats persist through every snapshot/save via hydrateUnits; Selected shows a Player row in net sessions. FIX (pre-existing, exposed by the port): drag undo was off-by-one — the drop's pushUndo('move') fired AFTER the live mousemove mutations, snapshotting the POST-drop state (every other call site pushes pre-mutation), so undo-after-drag was a visual no-op and a second undo ate the previous action too. pushUndo(tag, pre) now takes an optional pre-mutation snapshot; mousedown captures drag.pre and the drop passes it — net-move uses the same path. Boot banner names the session params; net chip (⟳/✓/⚠, click-to-sign-in), Share spectate/player link buttons, 6 s auth watchdog and [NET] console breadcrumbs all ported as-is. Self-tests +13: seat pushUndo guards (spectate + player), debounce collapse 3→1, payload format/round-trip/size canary, hydrate seat seeding, validateMove owned-in-setup + unowned rejection, seat gate (wrong side / own side / wrong phase), otherSide, and the drag-undo pre-snapshot fix; test cleanup now also clears undo/redo artifacts and cancels the test publish window. Script still parses as a MODULE (checked as .mjs per chainmail's v0.11.178 lesson). PRIOR (v0.5.0): Slice 5 — commanders and command [4.7]-[4.10], retiring the Slice-1 open ruling. Every REGULAR unit now spawns with an embedded Unit Commander (RAW [2.8]: regulars must have one) — a fighter of level 3-6 with rolled CHA, giving CB per Table 8 [4.9] and CR = (CHA+level)/2 + 3\" fighter bonus [4.8]; mobs spawn with a boss who can Give Orders but never confers In-Command benefits ([2.10]: mobs always suffer OOC penalties). WIRED CONSEQUENCES (engine keys verified before wiring, per house rule): commanderFighting -1 AR for regulars (Table 10, embedded commander fights with the unit), outOfCommand +1 AR and -2 ML for mobs and routed units, commander CB added to current morale [4.9] via unit.commander.charismaBonus, mobWithSupport +2 ML when a friendly regular unit sits in the mob's rear arc within 6\" [2.10], and closed formation now REQUIRES command [4.7]. RALLY moves to the engine's attemptRally with the [6.1] flags (inMeleeContact, commanderInRange = has a commander) — the manual checkMorale shim is retired. MOB ORDERS [2.10]/[6.6]: mobs cannot be dragged in battle; in the Rally phase a mob's commander may attempt ONE order (Advance or Charge) via rally check, the mob then follows its last order each Movement phase — Advance walks it straight along its facing, Charge closes on the nearest enemy in the 1.5x reach — and at the start of each Movement phase a mob that SEES an enemy within charge range checks DISCIPLINE (Table 7; PEAS DL is low) and on failure charges regardless of orders, going OOC-wild per [4.6]. Board: gold star = commander pip, dashed CR circle on selection, OOC and order tags in the card label, Cmdr row in the Selected pane. Commander death is NOT reachable this slice — [9.2]: an embedded Unit Commander cannot be killed without his unit being destroyed; detached commanders, Brigade/Army ranks, and hero assassinations arrive with the heroes slice, as does commander editing. Pre-v0.5.0 saves hydrate generated commanders on load. PRIOR (v0.4.1): Ctrl+wheel facing, ported from chainmail-board's onWheel grammar (ctrl+wheel rotates the SELECTED unit, falling through to zoom when nothing is selected; there ±15° free-form, here one CARDINAL step per notch since BS facing is the [7.9] set). Wheel-down = Right Face, wheel-up = Left Face. In SETUP the rotation is free and ungated; in battle each notch routes through facingChange() so the [7.9] 1/3-MV cost, Movement-phase gating, rout guard, and the [6.3] free-face-after-rally all apply unchanged — the budget is what stops a spin. Setup wheel bursts collapse to ONE undo entry (tag 'wheel-face:<id>' skipped while it's already on top of the stack, chainmail's tag-collapse pattern). Toolbar hint updated. PRIOR (v0.4.0): Slice 4 — facing, flanks, and rear + M/F/X acted chips. FACING: units carry a cardinal facing (0/90/180/270 — RAW's own facing-change set, since [7.9] defines exactly Right Face, Left Face, About Face; free 45-degree drift and wheeling stay OPEN for a later slice). The front edge draws a green stripe; the front RANK of pips is the rank nearest that edge (dark pips follow the facing). Facing changes are Selected-pane buttons costed per [7.9] — Left/Right Face 1/3 MV, About Face 1/2 MV — budget-checked in the Movement phase, and FREE once immediately after a successful rally per [6.3]. A charge turns the charger to face its target (the last 2/3-straight leg implies it); a rout ends with the unit's back to the enemy [7.15], now literally. ARCS: arcOf(defender, attacker) classifies the attacker's center against the defender's facing-axis edges — front of the front edge = FRONTAL, behind the rear edge = REAR, else FLANK. Targeting shows the chainmail-style arc banner over the target (green/amber/red per the --front/--flank/--rear palette). COMBAT WIRING: rear attacks take arDelta -2 and flank attacks -1 when the defender carries a shield ([8.3] SPECIAL NOTE examples — shield flags added to MEN_HF, DWARF, DW_PIKE, HOBGOB), the melee log names the arc, and a unit meleeing with an enemy in contact with its REAR arc checks morale with the [4.2] enemyAtRear -2 (engine key verified). M/F/X CHIPS: chainmail's acted trio — u.acted {moved, fired, fought} — renders as chips above each card, dark when done (M on any move/charge/facing spend, X on fighting a melee, F reserved until the missile slice), reset at End of Round. Self-tests add arc classification, facing-cost/center-preserving rotation, and the rear arDelta. PRIOR (v0.3.2): FIX: melee skipped again — the v0.3.0 card was drawn with a 3px pad OUTWARD in board coordinates, inflating every unit's apparent footprint ~0.21\" per side; cards that looked engaged were mechanically 0.5-0.7\" apart (past CONTACT_EPS 0.3 and even the 0.6 snap capture), so the engine rightly saw no contact and phaseIsEmpty skipped the phase your eyes said was due. The closure geometry itself verified clean across offsets this time. Fixes: (1) WYSIWYG card — the card rect now sits EXACTLY on the true base footprint (0,0,w,h) with the pips inset, so the drawn edge IS the base edge and the standoff gap you see is the gap the rules see; (2) snap capture widened to 0.8\" so near drops glue reliably; (3) honest skip — the Melee phase NEVER auto-skips while any unit has a declared charge [7.14], and when it does skip it names the closest enemy pair and their gap ('closest: X vs Y — 0.71\" apart') so a miss is information, not mystery. Self-tests add the charge skip-guard. PRIOR (v0.3.1): FIX: dwarf base size per [2.3] footnote — 'Dwarves are mounted on 3/4\" bases even though they are size S creatures' (width over height). Type rows gain an optional `base` override consumed by unitRect (BASE_W[t.base || t.size]); DWARF and DW_PIKE set base:'M'. Combat size stays S (the size field still drives [8.5] vs-L selection and future size rules); only the footprint changes. Self-test locks dwarf figure width to 0.75\". PRIOR (v0.3.0): Slice 3 — chainmail visual language + engagement standoff. Units now render as chainmail-board cards: parchment card (#efe7d2) with a side-colored border, SQUARE figure pips with the FRONT RANK in the dark side color and rear ranks in the light tint (his frontage/non-frontage convention), the wounded figure shown as a pink half-tone pip, and the two-line label BELOW the unit ('A · Name #id' in the side color over 'type · figs/start' in soft ink) so adjacent labels stop colliding. Engaged enemy pairs draw a dotted clash line between them. ENGAGEMENT STANDOFF: BS melee is base-to-base RAW ([1.6]/[7.8]/[8.1] — no Chainmail 3-inch rule), but glued bases were unreadable, so contact is now RENDERED with a 0.25-inch fighting-line gap: charge and snap close to the standoff rather than to zero, and the contact epsilon is 0.3 inch, so a standoff pair IS in base-to-base contact mechanically while the boards breathe visually. Selected/targeted units draw last (labels never buried). Self-tests updated for the standoff geometry. PRIOR (v0.2.1): FIX: melee phase auto-skipped after a charge/snap that visually touched. Root cause: chargeToTarget and snapToContact closed along the CENTER-to-center vector by the rect-gap distance, but the rect gap is the hypot of the per-axis edge deficits — on any diagonal offset the center vector is not the deficit vector, so the move under-closed (repro: 0.671" gap 'closed' to 0.301", above the 0.15" contact epsilon), inContact stayed false, and phaseIsEmpty(melee) skipped the phase. Fix: new contactDelta(u,v) returns the exact per-axis translation whose hypot IS the rect gap; charge and snap now translate by that delta, zeroing the gap by construction (movedIn charged with delta.dist, identical to the reach test's rectGap so budgets are unchanged). Self-test adds a diagonal-offset fixture locked to end in contact. PRIOR (v0.2.0): Slice 2 — chainmail targeting grammar + feel pass. Mirrors chainmail-board's attack grammar exactly: SHIFT+CLICK an enemy toggles it as the TARGET (dashed ring + reticle tag), plain click selects, and the action buttons in the phase row LIGHT UP from eligibility-state functions (meleeState/chargeState/rallyState, each returning {ok, reason}; the reason surfaces as the disabled button's tooltip, chainmail's btn-melee pattern). '⚔ Resolve melee' enables when a friendly is selected, an enemy targeted, the pair is in base-to-base contact, it is the Melee phase, and the attacker is neither routed nor rallied-this-round [6.3]; 'Charge target' enables in the Movement phase when the target is reachable within the 1.5x charge allowance [7.14] and, on click, declares the charge and auto-closes straight into contact (last leg straight per [7.14], cost charged to the move budget); 'Attempt rally' enables in the Rally phase for a selected routed unit. Also: SNAP-TO-CONTACT — a drop that leaves <=0.35 inch of gap to an enemy glues the facing edges (kills the pixel-fiddling to reach [7.8] contact); CLICK-TO-PLACE muster — a muster button arms placement and the next board click drops the unit there (Esc or right-click cancels; shift-click keeps placing more of the same); EMPTY-PHASE AUTO-SKIP — Rally with no routed units and Melee with no contacts advance themselves with a one-line log note. The Selected pane gains a Target row; the panel Attack flow is retired in favor of the lit buttons. Self-tests add meleeState gating and the snap closure math. PRIOR (v0.1.0): Slice 1 — BATTLESYSTEM Basic Game on the chainmail-board chassis. New file forked from chainmail-board v0.11.180's chassis PATTERNS (parchment palette + toolbar/panel/log CSS, right-drag pan + wheel zoom, phase rail, undo/redo, JSON save/load, boot self-tests), with the rules core supplied by @graycloak/battlesystem-engine v0.2.0 (synced at ./engine/, same copy the Foundry module consumes — do NOT edit ./engine/ here; edit graycloak-platform/packages/battlesystem-engine and re-sync). SCOPE (Basic Game, rulebook Part 2): Army-Roster units (Regular/Mob; AC, creature HD, ratio [2.2], figures, frontage, formation, MV, THAC0, weapon, size), 5-phase round [Basic seq: Initiative d6 reroll-ties / Rally / Movement A-chooses / Melee simultaneous [8.0] / End], closed-open formation change at 1/3 MV [7.6], drag movement with live budget clamp + charge at 1.5x MV requiring contact [7.14], melee via engine resolveMeleeCombat (AR pipeline [8.3], CRT [8.4-8.5], eligible fighters [8.1] with measured contact frontage, casualties + single-wound rule [8.7]), automatic morale triggers 25%/50%/post-50%-per-figure [4.4] via engine checkMorale 2d10 with situational stack [4.2], failure effects [4.5] (closed breaks to open; open/mob ROUTS with auto move MV+1/3 away, back to enemy [7.15]), Rally-phase attemptRally [6.1-6.3] with rallied-unit restrictions, fight-in-melee-only-if-attacked [6.3]. OPEN RULINGS this slice (flagged in-log where they bite): no commanders/CR yet, so In-Command bonuses, CB, and the OOC penalties are not applied (units treated as in command; [4.7]-[4.10] land with the Intermediate slice); skirmish units deferred (no missiles in Basic anyway); contact frontage measured as overlapping facing-edge figures, side-extras [8.1] auto-computed 0-2 from geometry; wheeling/facing costs deferred — drag cost is path length (straight-line legs), which under-charges a wheel; mobs get Move Forward only (orders system with commanders). Self-tests at boot lock the [8.4] worked example, morale example, rout distance, and save round-trip. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battlesystem — Battlefield · v0.43.9</title>
<style>
  :root {
    --bg:#ece0c4; --panel:#f5eedb; --field:#a8b094; --field-edge:#6d735a; --ink:#2c2316; --ink-soft:#6e6047; --rule:#b6a682;
    --side-a:#3a6e90; --side-a-d:#27516c; --side-a-l:#9cbed4; --side-b:#9c3b2c; --side-b-d:#73291d; --side-b-l:#d7a89c;
    --front:#2f7d4f; --flank:#c0892e; --rear:#b0392c; --gold:#d8b25a; --rank-hi:#ecd08a;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Avenir Next Condensed","Avenir Next","Helvetica Neue",Helvetica,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink); margin:0; font-family:var(--serif); }
  .page { height:100vh; width:100%; max-width:none; margin:0; padding:0; display:grid;
    grid-template-rows:auto minmax(0,1fr) auto; }
  .toolbar { display:flex; flex-direction:column; gap:5px; background:var(--panel); border:0; border-bottom:1px solid var(--rule);
    padding:6px 10px; border-radius:0; margin:0; font-family:var(--sans); box-shadow:0 2px 8px rgba(44,35,22,.10); z-index:30; }
  .tb-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:28px; }
  .tb-setup { padding-bottom:5px; border-bottom:1px solid rgba(182,166,130,.45); }
  .brand { display:inline-flex; flex-direction:column; gap:1px; font-family:var(--serif); font-size:19px;
    font-weight:700; margin-right:5px; line-height:1; }
  .brand .version-tag { font-size:10px; font-weight:600; opacity:.72; letter-spacing:1.2px;
    font-family:var(--sans); text-transform:uppercase; }
  .tb-sep { width:1px; height:19px; background:var(--rule); opacity:.6; margin:0 2px; }
  .tb-pin-right { margin-left:auto; }
  button, select, input[type=number], input[type=text] {
    font-family:var(--sans); font-size:11.5px; padding:5px 9px; border:1px solid var(--rule);
    border-radius:5px; background:var(--bg); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--gold); background:var(--panel); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--gold); border-color:#b8923a; font-weight:700; }
  button.on { background:var(--rank-hi); border-color:#b8923a; }
  input[type=number] { width:62px; cursor:text; } input[type=text] { cursor:text; }
  label.f { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; letter-spacing:1px;
    text-transform:uppercase; color:var(--ink-soft); }
  .phase-rail { display:flex; gap:2px; flex-wrap:wrap; align-items:flex-end; }
  .pstep { display:inline-flex; flex-direction:column; align-items:center; gap:2px; padding:1px 5px; }
  .pstep .plabel { font-size:10.5px; letter-spacing:.3px; border-bottom:2px solid transparent; white-space:nowrap; }
  .pstep .pmk { display:inline-block; width:10px; text-align:center; }
  .pstep.todo .plabel { color:#c2b48f; } .pstep.done .plabel { color:var(--ink-soft); }
  .pstep.now .plabel { color:var(--ink); border-bottom-color:#8a6d2e; font-weight:700; }
  .pstep .prow { display:flex; gap:3px; align-items:center; min-height:13px; }
  .ppill { font-family:var(--sans); font-size:9px; font-weight:700; line-height:1; padding:2px 5px; border-radius:7px; color:#fff; }
  .ppill.a { background:var(--side-a-d); } .ppill.b { background:var(--side-b-d); }
  .pstep.todo .ppill, .pstep.done .ppill, .ppill.sdone { opacity:.4; }
  .psep { color:#cdbf9b; font-size:11px; margin:0 3px; align-self:flex-start; }
  .phase-tag { font-size:10.5px; letter-spacing:1.35px; text-transform:uppercase; color:var(--ink-soft);
    padding:4px 8px; background:rgba(216,178,90,.18); border:1px solid rgba(216,178,90,.5);
    border-radius:3px; font-weight:700; }

  /* v0.12.0 board-first shell: Battlefield | splitter | one inspector dock. */
  .layout { min-height:0; display:grid; gap:0; grid-template-columns:minmax(0,1fr) 6px var(--dock,320px) var(--logw,300px); background:var(--field); }
  .layout.dock-collapsed { grid-template-columns:minmax(0,1fr) 6px 0 var(--logw,300px); }
  .rail-splitter { grid-column:2; align-self:stretch; min-height:0; cursor:col-resize; background:var(--rule);
    opacity:.5; touch-action:none; transition:opacity .12s, background .12s; }
  .rail-splitter:hover, .rail-splitter.dragging { opacity:1; background:var(--gold); }
  .layout.dock-collapsed .rail-splitter { opacity:.85; background:var(--gold); }
  .layout.dock-collapsed .side-panel { overflow:hidden; border-left:0; }
  /* v0.31.1: terrain editor controls must overlay the battlefield, not become
     an auto-placed .layout grid item. Both occupy cell 1/1; the panel paints above. */
  #terrain-panel { grid-column:1; grid-row:1; align-self:start; justify-self:start; z-index:25; margin:6px 10px;
    padding:5px 8px !important; background:rgba(245,238,219,.96); border:1px solid var(--rule); border-radius:5px;
    box-shadow:0 2px 8px rgba(44,35,22,.16); font-family:var(--sans); }
  #conditions-panel { grid-column:1; grid-row:1; align-self:start; justify-self:end; z-index:26; margin:6px 10px;
    width:min(540px,calc(100% - 20px)); padding:7px 9px; background:rgba(245,238,219,.98); border:1px solid var(--rule); border-radius:5px;
    box-shadow:0 2px 10px rgba(44,35,22,.2); font-family:var(--sans); font-size:11px; color:var(--ink); }
  #conditions-panel .cp-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #conditions-panel .cp-head b { font-size:12px; letter-spacing:.5px; text-transform:uppercase; }
  #conditions-panel .cp-head button { margin-left:auto; padding:2px 7px; }
  #conditions-panel .cp-grid { display:grid; grid-template-columns:96px minmax(0,1fr); gap:5px 8px; align-items:center; }
  #conditions-panel .cp-grid > span { color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px; font-size:9.5px; font-weight:700; }
  #conditions-panel .cp-controls { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  #conditions-panel select, #conditions-panel input { font:inherit; }
  #conditions-panel select { max-width:180px; }
  #conditions-panel .cp-effects { margin-top:6px; padding-top:5px; border-top:1px solid var(--rule); line-height:1.35; }
  .board-wrap { grid-column:1; grid-row:1; min-width:0; min-height:0; height:100%; background:var(--field); border:0; border-right:1px solid var(--field-edge);
    border-radius:0; overflow:hidden; position:relative; }
  #board { display:block; width:100%; height:100%; min-height:0; cursor:default; }

  aside.side-panel { grid-column:3; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;
    background:var(--panel); border-left:1px solid var(--rule); }
  .dock-tabs { display:flex; flex:0 0 auto; border-bottom:1px solid var(--rule); background:#efe5cd; }
  .dock-tab { flex:1; border:0; border-right:1px solid var(--rule); border-radius:0; background:transparent;
    padding:8px 6px; font-size:10.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink-soft); }
  .dock-tab:last-child { border-right:0; }
  .dock-tab.active { background:var(--panel); color:var(--ink); box-shadow:inset 0 -2px 0 #a97f1f; }
  .dock-head { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 9px;
    border-bottom:1px solid rgba(182,166,130,.55); }
  .dock-head h2 { margin:0; font-family:var(--sans); font-size:11px; letter-spacing:2px; text-transform:uppercase; }
  .dock-head .dock-grow { flex:1; }
  .dock-head button { padding:3px 7px; font-size:12px; }
  .dock-body { min-height:0; flex:1; overflow:auto; }
  .panel { background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:10px 12px; }
  .panel h2 { font-family:var(--sans); font-size:12px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin:0 0 8px; }
  .dock-content { display:none; margin:0; border:0; border-radius:0; padding:10px 11px; background:transparent; }
  .dock-content.active { display:block; }
  .popped-note { display:block; padding:10px; margin:4px 0; border:1px dashed var(--rule); border-radius:5px;
    font-family:var(--sans); font-size:10.5px; color:var(--ink-soft); text-align:center; }
  .popped-note[hidden] { display:none; }

  .roster-row { display:grid; grid-template-columns:74px 1fr; gap:4px 8px; font-size:12.5px; margin-bottom:4px; align-items:center; }
  .roster-row .k { font-family:var(--sans); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft); }

  /* v0.13.0: compact TSR-inspired Army Roster / Unit Sheet. 24 columns let the
     paper form's asymmetric boxes survive in a narrow dock without a long list. */
  .unit-sheet { display:grid; grid-template-columns:repeat(24,minmax(0,1fr)); border:1px solid #9f8d67;
    border-right:0; border-bottom:0; background:#f8f1df; min-width:0; }
  .us-cell { min-width:0; min-height:43px; padding:4px 6px 5px; border-right:1px solid #9f8d67;
    border-bottom:1px solid #9f8d67; overflow:hidden; }
  .us-cell.us-tall { min-height:58px; }
  .us-cell.us-special { min-height:62px; }
  .us-cell.us-battle { min-height:54px; background:#efe5cd; }
  .us-label { display:block; font-family:var(--sans); font-size:8.5px; line-height:1.05; letter-spacing:.55px;
    text-transform:uppercase; font-weight:800; color:#55462f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .us-value { margin-top:4px; font-size:12px; line-height:1.15; font-weight:600; overflow-wrap:anywhere; }
  .us-value.small { font-family:var(--sans); font-size:10px; font-weight:500; line-height:1.2; }
  .us-value.muted { color:var(--ink-soft); }
  .us-stat .us-value { font-size:14px; font-weight:800; }
  .us-name .us-value { font-size:14px; }
  .us-saves { grid-column:span 16; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); padding:0; }
  .us-saves > .us-mini { min-width:0; padding:4px 2px 5px; border-right:1px solid #9f8d67; }
  .us-saves > .us-mini:last-child { border-right:0; }
  .us-mini .us-label { font-size:7px; text-align:center; letter-spacing:.15px; }
  .us-mini .us-value { margin-top:4px; text-align:center; font-size:10px; font-weight:700; }
  .us-battle-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px 10px; font-family:var(--sans); font-size:9.5px; line-height:1.25; }
  .us-battle-grid b { font-size:8px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); }
  .us-actions { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; align-items:center; }
  .us-actions button, .us-actions select { padding:4px 7px; font-size:10.5px; }
  .us-actions .danger { color:var(--rear); }
  .us-input { width:100% !important; min-width:0; padding:3px 4px !important; font-size:11px !important; border-radius:3px !important; }
  .us-input.num { text-align:right; }
  textarea.us-input { min-height:42px; resize:vertical; font-family:var(--sans); }
  .us-checks { display:flex; flex-wrap:wrap; gap:5px 9px; font-family:var(--sans); font-size:9px; margin-top:3px; }
  .us-edit-note { font-family:var(--sans); font-size:9px; color:var(--ink-soft); margin:5px 0 0; }
  .unit-sheet.editing .us-cell { min-height:50px; }
  .unit-sheet.editing .us-saves > .us-mini { padding-left:1px; padding-right:1px; }
  /* v0.36.2: the character card mirrors the dense TSR Heroes & Commanders roster. */
  .character-roster .us-cell { min-height:36px; padding:3px 5px 4px; }
  .character-roster .us-label { font-size:7.8px; letter-spacing:.35px; }
  .character-roster .us-value { margin-top:3px; font-size:11.5px; }
  .character-roster .us-stat .us-value { font-size:13px; }
  .character-roster .us-name .us-value { font-size:13px; }
  .character-roster .us-special { min-height:56px; }
  .character-roster textarea.us-input { min-height:50px; }
  .char-weapon-grid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 42px; gap:3px; align-items:center; }
  .char-weapon-grid + .char-weapon-grid { margin-top:3px; }
  .char-weapon-grid .wlab { font-family:var(--sans); font-size:7px; font-weight:800; text-transform:uppercase; color:var(--ink-soft); text-align:center; }
  /* v0.36.3: keep the roster footprint, but let EDIT controls consume space by need.
     The outer sheet remains 24 columns; nested row clusters prevent seven tiny stat/save
     boxes from starving their inputs just to preserve the paper form's literal cell widths. */
  .character-roster.editing .us-cell { min-height:46px; }
  .character-roster.editing .us-input { box-sizing:border-box; min-height:28px; padding:4px 6px !important; font-size:12px !important; }
  .character-roster.editing select.us-input { padding-right:24px !important; }
  .character-roster.editing .char-edit-cluster { padding:0; overflow:visible; }
  .char-edit-grid { display:grid; width:100%; height:100%; min-width:0; }
  .char-edit-grid.abilities { grid-template-columns:1.35fr repeat(5,1fr) 1.2fr; }
  .char-edit-grid.saves { grid-template-columns:repeat(5,1fr); }

  /* v0.43.6: focused AD&D level-drain resolver. Native <dialog> keeps the

  /* Battle Log: permanent right rail beside the inspector dock (v0.19.0). */
  .log-rail { display:grid; grid-template-columns:5px minmax(0,1fr); min-height:0; min-width:0;
    background:var(--panel); border-left:1px solid var(--rule); }
  .log-rail-resizer { cursor:ew-resize; background:transparent; touch-action:none; }
  .log-rail-resizer:hover, .log-rail-resizer.dragging { background:var(--gold); }

  .ppill.act { outline:2px solid #8a6d2e; outline-offset:1px; }

  .wgrid input[type=number]::-webkit-outer-spin-button,
  .wgrid input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .log-scroll { min-height:0; flex:1; overflow:auto; padding:0 10px 8px; }

  .log-e .det { font-family:var(--sans); font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .log-e.melee h4 { color:#6b3120; } .log-e.morale h4 { color:#7a5a15; } .log-e.phase h4 { color:#3d5a74; } .log-e.missile h4 { color:#2f6b4f; }

  /* Optional Windows-like pop-out for the live Selected inspector. */
  .float-panel[hidden] { display:none; }
  .float-panel { position:fixed; z-index:70; top:110px; right:24px; width:430px; height:535px; min-width:360px; min-height:180px; max-width:90vw; max-height:85vh;

  /* v0.11.1 battlefield focus: SVG-only selection/target reticles. */

    animation: bs-select-pulse 1.6s ease-in-out infinite; }
  .bs-select-reticle.melee-ready { animation:bs-select-ready-pulse .72s ease-in-out infinite alternate; }
  .bs-target-reticle { transform-box: fill-box; transform-origin: center;
    animation: bs-target-pulse .9s ease-in-out infinite alternate; }

  @keyframes bs-melee-line-pulse { from { opacity:.70; } to { opacity:1; } }

function normalizeChariotComponent(row={}, puller=false) {

}

  const memSrc = raw.memorized && typeof raw.memorized === 'object' ? raw.memorized : {};
  const levels = {}, memorized = {};
  for (let i=1;i<=9;i++) {
    levels[i] = String(src[i] ?? src['l'+i] ?? '').trim();
    memorized[i] = String(memSrc[i] ?? memSrc['l'+i] ?? '').trim();
  }

function normalizeCharacterHitPoints(t={}) {
  const hasExplicitMod = Object.prototype.hasOwnProperty.call(t,'hpMod');
  const rawMax=Number(t.baseMaxHp ?? t.maxHp), rawHp=Number(t.hp), rawMod=Number(t.hpMod);
  let maxHp=(Number.isFinite(rawMax)&&rawMax>0)?Math.max(1,Math.round(rawMax)):30; // persisted field = Base Max HP
  const hpMod=Number.isFinite(rawMod)?Math.round(rawMod):0;
  let effectiveMaxHp=Math.max(1,maxHp+hpMod);
  let hp=Number.isFinite(rawHp)?Math.max(0,Math.round(rawHp)):effectiveMaxHp;
  // Pre-v0.40.7 saves have no explicit modifier. Preserve v0.37+'s safety rule:
  // current hp above a hidden/old maximum expands the Base Max rather than vanishing.
  if(!hasExplicitMod && hp>effectiveMaxHp) { maxHp=Math.max(maxHp,hp-hpMod); effectiveMaxHp=Math.max(1,maxHp+hpMod); }

function characterEffectiveMaxHp(c={}) {
  return Math.max(1,Math.round(Number(c.maxHp)||1)+(Number.isFinite(Number(c.hpMod))?Math.round(Number(c.hpMod)):0));
}
function characterHpSummary(c={}) {
  const eff=characterEffectiveMaxHp(c), mod=Number(c.hpMod)||0, source=String(c.hpModSource||'').trim();
  return { current:Math.max(0,Math.round(Number(c.hp)||0)), base:Math.max(1,Math.round(Number(c.maxHp)||1)), mod, source, effective:eff };

    active:!!r?.active, label:String(r?.label||'').trim().slice(0,80),

    ac:Number.isFinite(Number(r?.ac))?Number(r.ac):0,
    damage:Number.isFinite(Number(r?.damage))?Math.trunc(Number(r.damage)):0

}

// letterbox as board: exact at the centre, diverging linearly toward the edges.
// Pure so the self-tests can drive it with a synthetic rect (v0.31.4 lesson).

   550px reservation is gone: default 320px, 250-520px normal range, drag far
   right to snap closed, double-click to restore. */
(function initDockSplitter() {
  const layout = $('.layout'), grip = $('#rail-splitter'); if (!layout || !grip) return;
  const DEF=320, MIN=250, COLLAPSE=215, CAP=520, BOARD_MIN=480;
  let collapsed = false;
  const cur = () => collapsed ? 0 : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock')) || DEF);
  const apply = width => {
    if (width <= 0) { collapsed=true; layout.classList.add('dock-collapsed'); document.documentElement.style.removeProperty('--dock'); }
    else { collapsed=false; layout.classList.remove('dock-collapsed'); document.documentElement.style.setProperty('--dock', width+'px'); }
  };
  const persist = () => { try { localStorage.setItem('bs-dock', collapsed ? 'x' : String(cur())); } catch (_) {} };
  try { const v=localStorage.getItem('bs-dock'); if (v==='x') apply(0); else if (v) apply(Math.min(CAP, Math.max(MIN, parseFloat(v)||DEF))); } catch (_) {}
  let dragging=false, startX=0, startW=DEF, maxW=CAP;
  grip.addEventListener('pointerdown', e => {
    dragging=true; startX=e.clientX; startW=collapsed ? MIN : cur(); maxW=Math.max(MIN, Math.min(CAP, layout.clientWidth-BOARD_MIN-6));
    grip.classList.add('dragging'); try { grip.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return; const raw=startW-(e.clientX-startX);
    if (raw < COLLAPSE) apply(0); else apply(Math.min(maxW, Math.max(MIN, raw)));
  });
  const end=e=>{ if(!dragging)return; dragging=false; grip.classList.remove('dragging'); try{grip.releasePointerCapture(e.pointerId);}catch(_){} persist(); };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', ()=>{ apply(DEF); persist(); });
})();
