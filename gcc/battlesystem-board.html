    rider:{ label:'horse archer',    ac:7, hd:1 }, mount:{ label:'light warhorse',  ac:7, hd:'2',   mv:24, dmg:'1d4/1d4' } },   // Table 12/[10.5]: fire with FULL movement
  // [10.9]/[10.10] field artillery: one 10-HD crew figure (ten 0-level men at 10:1);
  // the piece's AR = crewThaco flat, never ratio-adjusted; crew is skirmish-handled.
  { id:'ARTY_LC', name:'Light Catapult', ac:10, hd:1, mv:8, thaco:20, arThaco:21, crewThaco:20, weapon:'club', size:'L', race:'Human', unitType:'skirmish', artillery:'lightCatapult', int:'average', align:'N' },
  { id:'ARTY_HC', name:'Heavy Catapult', ac:10, hd:1, mv:4, thaco:20, arThaco:21, crewThaco:20, weapon:'club', size:'L', race:'Human', unitType:'skirmish', artillery:'heavyCatapult', int:'average', align:'N' },
  { id:'ARTY_BAL',name:'Ballista',       ac:10, hd:1, mv:6, thaco:20, arThaco:21, crewThaco:20, weapon:'club', size:'L', race:'Human', unitType:'skirmish', artillery:'ballista', int:'average', align:'N' },
]);
const typeById = id => BS_TYPES.find(t => t.id === id);

/* v0.13.0 per-unit profile overrides. BS_TYPES remains the template catalog;
   saves only carry fields that differ from the template. */
const profileOf = u => ({ ...typeById(u.type), ...(u.prof || {}) });
const ratioAdj = ratio => ({'10:1':0,'5:1':5,'2:1':10,'1:1':15}[ratio] || 0);
/* 1e intelligence ladder (MM). Table 6: Low or lower −1 DL · High or higher +1 DL;
   Chaotic −1 DL · Lawful +1 DL. Note Very (11-12) sits BELOW High (13-14). */
const INT_RANKS = Object.freeze(['non','animal','semi','low','average','very','high','exceptional','genius','supra','godlike']);
const intRank   = v => { const i = INT_RANKS.indexOf(String(v ?? 'average').toLowerCase()); return i < 0 ? INT_RANKS.indexOf('average') : i; };
const isLowInt  = u => intRank(profileOf(u).int) <= INT_RANKS.indexOf('low');
const isHighInt = u => intRank(profileOf(u).int) >= INT_RANKS.indexOf('high');
const isChaotic = u => /^c/i.test(String(profileOf(u).align || ''));
const isLawful  = u => /^l/i.test(String(profileOf(u).align || ''));
const chargeDisciplineRequired = u => u.formation === 'closed' && (isChaotic(u) || isLowInt(u));   // Table 7 [4.6]/[7.14]
function baseAR(u) {
  // [8.3] multiple-20s: AR conversion ignores repeated 20s on the attack matrix.
  // arThaco carries the un-repeated value where it differs (0-level men: first 20
  // at AC 1 -> AC 0 = 21, the rulebook's own worked example; matrices verified
  // against the DMG by Kurt 2026-08-20). Sheet THACO display keeps t.thaco.
  const p = profileOf(u), ov = Number(u.prof?.ar);
  return Number.isFinite(ov) ? ov : (p.arThaco ?? p.thaco) + ratioAdj(ratioFromHD(p.hd));
}
const effectiveAR = u => baseAR(u) + Math.max(0, Number(u.forcedMarchPenalty)||0);
// [3.1] TSR roster weapon rows: name · to-hit bonus · S/M dmg · L dmg · dmg bonus · #AT.
// prof.weapons = [{name,hit,sm,l,dmod,at},...]; row 0 is the primary. Absent list =
// legacy model (template weapon + prof dice overrides, optional prof.weapon2 sidearm).
function weaponEntries(u) {
  const p = profileOf(u);
  if (Array.isArray(p.weapons) && p.weapons.length) return p.weapons;
  const legacy = [{ name: p.weapon, _legacyPrimary: true }];
  if (p.weapon2) legacy.push({ name: p.weapon2 });
  return legacy;
}
// [10.x] Fire data lives in @graycloak/battlesystem-engine v0.3.0 (missiles.js);
// the board consumes MISSILE_WEAPONS/ARTILLERY_WEAPONS/missileKey/rangeBand.
const missileRowOf = u => weaponEntries(u).find(e => MISSILE_WEAPONS[missileKey(e.name)]) || null;
const artilleryOf = t => (t && t.artillery && ARTILLERY_WEAPONS[t.artillery]) || null;
// [10.5] split-fire (mounted/centaur archers, breath weapons): move ½, fire, keep
// moving — profileOf(u).splitFire, dormant until cavalry brings mounted types.
const canFireAtAll = u => { const t = profileOf(u); return t.unitType !== 'mob' && u.figures > 0 && (!!artilleryOf(t) || !!missileRowOf(u)); };
// [10.1] the LOS cone originates at the unit's FRONT EDGE center (RULED 2026-08-20:
// closer to "45 degrees to either side of the figure" than a body-center origin —
// stricter for close, wide targets). The arc overlay draws from the same point.
function frontEdgeCenter(u) {
  const r = unitRect(u), d = facingDir(u.facing);
  return { x: u.x + r.w/2 + d[0]*r.h/2, y: u.y + r.h/2 + d[1]*r.h/2 };
}
const missileDataOf = e => e ? MISSILE_WEAPONS[missileKey(e.name)] : null;
const hasMissiles = u => profileOf(u).unitType !== 'mob' && !!missileRowOf(u);       // [2.10] mobs never use missiles
const activeWeaponName = u => u.activeWeapon || weaponEntries(u)[0].name;         // [8.2] weapon in hand
const activeWeaponEntry = u => { const l = weaponEntries(u); return l.find(e => e.name === activeWeaponName(u)) || l[0]; };
const weaponHitDelta = u => -(Number(activeWeaponEntry(u).hit) || 0);             // [3.1] to-hit bonus: minus improves AR [8.3]
function profileForEntry(u, e) {
  const p = profileOf(u);
  if (e._legacyPrimary) return legacyPrimaryProfile(u);                           // template + old prof dice overrides
  if (!e.sm && !e.l && !Number(e.dmod)) {                                          // pure name row (legacy sidearm): engine table
    const raw = BattlesystemCombat.defineWeapon(e.name);
    const w = { damageDice: raw.damageDice, damageModifier: raw.damageModifier, numberOfDice: raw.numberOfDice, numberOfAttacks: Math.max(1, Number(e.at) || raw.numberOfAttacks || 1) };
    if (raw.damageDiceVsLarge) { w.damageDiceVsLarge = raw.damageDiceVsLarge; w.damageModifierVsLarge = raw.damageModifierVsLarge ?? w.damageModifier; w.numberOfDiceVsLarge = raw.numberOfDiceVsLarge || w.numberOfDice; }
    return w;
  }
  const fallback = BattlesystemCombat.defineWeapon(e.name);
  const def = buildWeaponDamageDefinition(e.sm || '', e.l || '', fallback) || { ...fallback };
  const dmod = Number(e.dmod) || 0;
  const w = { damageDice: def.damageDice, damageModifier: (def.damageModifier || 0) + dmod,
              numberOfDice: def.numberOfDice || 1,
              numberOfAttacks: Math.max(1, Number(e.at) || fallback.numberOfAttacks || 1) };
  const lDiffers = def.damageDiceVsLarge && (def.damageDiceVsLarge !== def.damageDice
    || (def.damageModifierVsLarge || 0) !== (def.damageModifier || 0)
    || (def.numberOfDiceVsLarge || 1) !== (def.numberOfDice || 1));
  if (lDiffers) { w.damageDiceVsLarge = def.damageDiceVsLarge; w.damageModifierVsLarge = (def.damageModifierVsLarge || 0) + dmod; w.numberOfDiceVsLarge = def.numberOfDiceVsLarge || w.numberOfDice; }
  return w;
}
function switchWeapon(u) {                                            // [8.2]: free change at the Melee Phase, even in melee
  const list = weaponEntries(u);
  if (list.length < 2) return false;
  if (state.setup || curPhase().id !== 'melee') { log('phase', `${esc(uName(u))} can change weapons at the Melee Phase [8.2]`); return false; }
  pushUndo('switch-weapon');
  const cur = Math.max(0, list.findIndex(e => e.name === activeWeaponName(u)));
  u.activeWeapon = list[(cur + 1) % list.length].name;
  log('phase', `${esc(uName(u))} changes weapons`, `now fighting with ${esc(u.activeWeapon)} — no time, movement, or combat penalty [8.2]`);
  renderAll(); return true;
}
function weaponProfile(u) { return profileForEntry(u, activeWeaponEntry(u)); }
/* [11.5] Mounted units fight rider + mount on ONE Attack Roll — the mount's MM
   damage routine joins the rider's weapon as extra CRT components (engine
   appendMountDamageComponents; each component keeps its own vs-L pair and reads
   its own CRT column, results summed). On a successful charge the LANCE component
   alone doubles (per-component damageMultiplier — the hooves never double).
   RULED 2026-08-21, open to veto: Set Spears deny the [11.4] −2 AR but NOT the
   lance doubling (the denial is the charge-bonus clause; the lance still lands —
   symmetric with the spears' own double damage). */
function meleeWeaponFor(u, opts = {}) {
  const t = profileOf(u), w = weaponProfile(u);
  if (!t.mounted || !t.mount?.dmg) return w;
  const combined = appendMountDamageComponents(w, t.mount.dmg, t.mount.dmgL || '');
  if (opts.charging && /lance/i.test(activeWeaponName(u)) && Array.isArray(combined.components))
    combined.components[0] = { ...combined.components[0], damageMultiplier: 2 };
  return combined;
}
/* [11.4]: −2 AR for a cavalry charge, vs the CHARGED target only, while the charge
   stands (chargeSucceeded rides to the Melee Phase, endRound clears it). A charger
   meeting Set Spears never reaches the simultaneous path — resolveSetSpearsMelee
   is where the denial lives. */
const cavalryChargeActive = (A, D) => !!(profileOf(A).mounted && A.chargeSucceeded && A.chargeTargetId === D.id);
function legacyPrimaryProfile(u) {
  const p = profileOf(u);
  const raw = BattlesystemCombat.defineWeapon(p.weapon), pr = u.prof || {};
  const w = {
    damageDice: pr.damageDice || raw.damageDice,
    damageModifier: Number.isFinite(Number(pr.damageModifier)) ? Number(pr.damageModifier) : raw.damageModifier,
    numberOfDice: Number.isFinite(Number(pr.numberOfDice)) ? Number(pr.numberOfDice) : raw.numberOfDice,
    numberOfAttacks: Number.isFinite(Number(pr.numberOfAttacks)) ? Number(pr.numberOfAttacks) : raw.numberOfAttacks,
  };
  // AD&D S/M-vs-L pair [8.5]: pass the *VsLarge keys through so the engine's
  // selectWeaponForTargetSize can swap them vs size-L defenders. v0.18.0 —
  // the old profile builder silently STRIPPED these even when the engine had data.
  const dl = pr.damageDiceVsLarge ?? raw.damageDiceVsLarge;
  if (dl) {
    w.damageDiceVsLarge = dl;
    w.damageModifierVsLarge = Number.isFinite(Number(pr.damageModifierVsLarge)) ? Number(pr.damageModifierVsLarge)
      : Number.isFinite(Number(raw.damageModifierVsLarge)) ? Number(raw.damageModifierVsLarge) : w.damageModifier;
    w.numberOfDiceVsLarge = Number.isFinite(Number(pr.numberOfDiceVsLarge)) ? Number(pr.numberOfDiceVsLarge)
      : (raw.numberOfDiceVsLarge || w.numberOfDice);
  }
  return w;
}
function damageTextL(u) {
  const w = weaponProfile(u);
  if (!w.damageDiceVsLarge) return '';
  const dice = `${(w.numberOfDiceVsLarge||1) > 1 ? w.numberOfDiceVsLarge : ''}${w.damageDiceVsLarge}`;
  return `${dice}${w.damageModifierVsLarge ? (w.damageModifierVsLarge > 0 ? '+' : '') + w.damageModifierVsLarge : ''}`;
}
const smStr = w => `${w.numberOfDice||1}${String(w.damageDice||'D6').toLowerCase()}${w.damageModifier?(w.damageModifier>0?'+':'')+w.damageModifier:''}`;
const lStr  = w => !w.damageDiceVsLarge ? '' : `${w.numberOfDiceVsLarge||1}${String(w.damageDiceVsLarge).toLowerCase()}${w.damageModifierVsLarge?(w.damageModifierVsLarge>0?'+':'')+w.damageModifierVsLarge:''}`;
function damageText(u) {
  const w = weaponProfile(u), dice = `${w.numberOfDice > 1 ? w.numberOfDice : ''}${w.damageDice}`;
  return `${dice}${w.damageModifier ? (w.damageModifier > 0 ? '+' : '') + w.damageModifier : ''}`;
}

/* Base widths per [2.3] in inches of tabletop. */
const BASE_W = { S: 0.5, M: 0.75, L: 1.0 };

/* === B. PHASES — Basic Game sequence (rulebook Part 2) ==================== */
const PHASES = Object.freeze([
  { id:'initiative',    label:'Initiative',      rule:'[5.1]' },
  { id:'initialMissile',label:'Initial Missile', rule:'[1.2]' },
  { id:'rally',         label:'Rally',           rule:'[6.0]' },
  { id:'movement',      label:'Movement',        rule:'[7.0]' },
  { id:'missileMagic',  label:'Missile & Magic', rule:'[1.5]' },
  { id:'melee',         label:'Melee',           rule:'[8.0]' },
  { id:'end',           label:'End Round',       rule:'[1.7]' },
]);
const PHASE_VER = 7;                                                 // v0.24.0: old 5-phase saves remap on load
const PHASE_MIGRATE_5 = [0, 2, 3, 5, 6];                             // init, rally, movement, melee, end
function rollInitiative(rng) { // [5.1] 1d6 each, reroll ties
  let a, b; do { a = 1 + Math.floor(rng()*6); b = 1 + Math.floor(rng()*6); } while (a === b);
  return { a, b, winner: a > b ? 'A' : 'B' };
}
const roll2d6  = () => { const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];  return { total:d[0]+d[1], dice:d }; };
const roll2d10 = () => { const d=[1+Math.floor(Math.random()*10),1+Math.floor(Math.random()*10)];return { total:d[0]+d[1], dice:d }; };

/* === C. STATE ============================================================= */
const PXI = 14;                       // px per tabletop inch (1" = 10 yds [2.1])
/* [11.8] TERRAIN — penalty p = the fraction of normal movement LOST in the
   terrain, so each inch inside costs 1/(1-p)" of allowance (woods/obstacle 1.5x,
   rough/swamp 2x). Most restrictive wins where features overlap. kin names the
   creature class that IGNORES the penalty (woodland/mountain/swamp per RAW;
   aquatic units alone may enter water, at full rate). noClosed terrain forbids
   Closed Formation outright — no exemption, even for kin. Obstacles ([11.8]:
   streams, walls, fences, gulleys) additionally bar charges through and break a
   crossing closed unit to OPEN for free. Hills carry heightFt: the climb costs
   MV/3 per 10 ft ascended, charged once on entry; descending is free; charging
   uphill is barred. Roads give +1/3 MV only when the whole move stays on the
   road ([11.8] whole-move condition — checked along the unit-centre line; the
   frontage-width reading is an approximation, open to veto). */
const BS_TERRAIN = Object.freeze({
  woods:  { label:'Woods',       fill:'#5f7d4f', area:true,  penalty:1/3, kin:'woodland', noClosed:true, wIn:10, hIn:8 },
  rough:  { label:'Rough',       fill:'#b09a6a', area:true,  penalty:1/2, kin:'mountain', noClosed:true, wIn:9,  hIn:6 },
  swamp:  { label:'Swamp',       fill:'#7a8a5a', area:true,  penalty:1/2, kin:'swamp',    noClosed:true, wIn:9,  hIn:7 },
  hill:   { label:'Hill',        fill:'#cda86a', area:true,  penalty:0,   hill:true, defaultHeightFt:10, wIn:12, hIn:8 },
  ditch:  { label:'Ditch/Gulley',fill:'#9c8757', area:true,  penalty:1/3, obstacle:true,  wIn:11, hIn:3 },
  pond:   { label:'Pond/Lake',   fill:'#4f7c9c', area:true,  water:true,  noClosed:true,  wIn:7,  hIn:6 },
  river:  { label:'River',       fill:'#3f6f95', linear:true, water:true, noClosed:true,  widthIn:3 },
  stream: { label:'Stream',      fill:'#5b86a8', linear:true, penalty:1/3, obstacle:true, widthIn:2 },
  wall:   { label:'Wall/Fence',  fill:'#8a8578', linear:true, penalty:1/3, obstacle:true, widthIn:1 },
  hedge:  { label:'Hedge',       fill:'#6c8452', linear:true, penalty:1/3, obstacle:true, widthIn:1 },
  road:   { label:'Road',        fill:'#8a6f4a', linear:true, road:true,   widthIn:2 },

/* v0.12.0 inspector dock splitter (view-local, key: bs-dock). The old two-rail
   550px reservation is gone: default 320px, 250-520px normal range, drag far
   right to snap closed, double-click to restore. */
(function initDockSplitter() {
  const layout = $('.layout'), grip = $('#rail-splitter'); if (!layout || !grip) return;
  const DEF=320, MIN=250, COLLAPSE=215, CAP=520, BOARD_MIN=480;
  let collapsed = false;
  const cur = () => collapsed ? 0 : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock')) || DEF);
  const apply = width => {
    if (width <= 0) { collapsed=true; layout.classList.add('dock-collapsed'); document.documentElement.style.removeProperty('--dock'); }
    else { collapsed=false; layout.classList.remove('dock-collapsed'); document.documentElement.style.setProperty('--dock', width+'px'); }
  };
  const persist = () => { try { localStorage.setItem('bs-dock', collapsed ? 'x' : String(cur())); } catch (_) {} };
  try { const v=localStorage.getItem('bs-dock'); if (v==='x') apply(0); else if (v) apply(Math.min(CAP, Math.max(MIN, parseFloat(v)||DEF))); } catch (_) {}
  let dragging=false, startX=0, startW=DEF, maxW=CAP;
  grip.addEventListener('pointerdown', e => {
    dragging=true; startX=e.clientX; startW=collapsed ? MIN : cur(); maxW=Math.max(MIN, Math.min(CAP, layout.clientWidth-BOARD_MIN-6));
    grip.classList.add('dragging'); try { grip.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return; const raw=startW-(e.clientX-startX);
    if (raw < COLLAPSE) apply(0); else apply(Math.min(maxW, Math.max(MIN, raw)));
  });
  const end=e=>{ if(!dragging)return; dragging=false; grip.classList.remove('dragging'); try{grip.releasePointerCapture(e.pointerId);}catch(_){} persist(); };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', ()=>{ apply(DEF); persist(); });
})();

// snap/applySnap architecture. Publishes a full minified snapshot to
// campaigns/{cid}/battles/{bid} — SAME collection and rules (v9) as chainmail
// battles; the payload's format field ('battlesystem-board') disambiguates and
// each board rejects the other's docs. Publish rides pushUndo's tail (the
// complete map of mutations); undo/redo/loadScenario republish explicitly.
// Spectators/players subscribe onSnapshot → applyRemote (applySnap +
// hydrateUnits, NOT loadScenario — its resets would stomp the viewport).
// Player seats post move intents to battles/{bid}/commands; the GM board is
// the authority and gates every intent through playerMayMoveNow, including
// the BS wrinkle chainmail lacks: initiative-winner-first Movement-Phase alternation
// (state.moverSide, seeded from initiative, flipped by Pass move).
// EVERYTHING here no-ops on file:// (no GCCAuth) or without ?camp=.
const NET = (function () {
  const FB_VERSION = '10.12.2';   // matches gcc-auth.js / gcc-sync.js compat builds
  const FS_URL = `https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore-compat.js`;
  const DEBOUNCE_MS = 750;        // non-extending window: drag storms collapse to ≤1 publish per window
  const LOG_PUBLISH_CAP = 300;    // newest-first entries carried in the payload (1 MB doc cap headroom)

  let db = null, user = null, unsub = null, cmdUnsub = null;
  let timer = null, dirty = false, declined = false, firstRemote = false, modalShown = false;
  let timerStarts = 0;            // self-test hook: debounce windows opened

  const $chip = () => $('#net-chip');
  function chip(cls, text, title, onclick) {
    const c = $chip(); if (!c) return;
    c.hidden = false;
    c.className = 'net-chip' + (cls ? ' ' + cls : '') + (onclick ? ' click' : '');
    c.textContent = text;
    c.title = title || '';
    c.onclick = onclick || null;
  }

  function loadScript(url) {   // same pattern as gcc-auth/gcc-sync
    return new Promise((res, rej) => {
      if (document.querySelector(`script[src="${url}"]`)) { res(); return; }
      const s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + url));
      document.head.appendChild(s);
    });
  }

  const battleRef = () => db.collection('campaigns').doc(state.net.campId)
                            .collection('battles').doc(state.net.battleId);

  // Same payload as saveScenario minus filename/savedAt, plus the Battle Log —
  // snap() does not carry the log here (unlike chainmail's captureSnapshot), so
  // it ships alongside, capped to the newest entries (#log prepends newest-first).
  function logCapture() {
    const L = $('#log'); if (!L) return '';
    return Array.from(L.children).slice(0, LOG_PUBLISH_CAP).map(k => k.outerHTML).join('');
  }
  function publishPayload() {
    return JSON.stringify({
      format: 'battlesystem-board',
      simVersion: SIM_VERSION,
      state: snap(),
      logHtml: logCapture(),
    });
  }

  function schedulePublish() {
    if (!state.net.campId || state.net.spectate || state.net.player || declined) return;
    dirty = true;
    if (timer) return;   // a window is already open — this mutation rides it
    timerStarts++;
    timer = setTimeout(() => { timer = null; if (dirty) publishNow(); }, DEBOUNCE_MS);
  }

  async function publishNow() {
    dirty = false;
    if (!db || !user) { chip('err', '⚠ not signed in', 'Sign in to publish this battle'); return; }
    if (state.net.publishing) { schedulePublish(); return; }   // one write in flight at a time
    try {
      if (!state.net.battleId) {   // first publish creates the doc (auto-id) and rewrites the URL
        const suggested = state.net.name || `Battle — ${new Date().toLocaleDateString()}`;
        const entered = prompt('Name this battle (spectators will see it):', suggested);
        if (entered === null) {   // cancelled — stop nagging for this session
          declined = true;
          chip('', '— not publishing', 'Battle naming cancelled — reload the page to publish');
          return;
        }
        state.net.name = (entered.trim() || suggested).slice(0, 80);
        const ref = db.collection('campaigns').doc(state.net.campId).collection('battles').doc();
        state.net.battleId = ref.id;
        const url = new URL(location.href);
        url.searchParams.set('battle', ref.id);
        history.replaceState(null, '', url);
      }
      state.net.publishing = true;
      chip('busy', '⟳ publishing');
      await battleRef().set({
        name: state.net.name || 'Untitled battle',
        ownerUid: user.uid,
        simVersion: SIM_VERSION,
        seq: firebase.firestore.FieldValue.increment(1),
        status: state.setup ? 'setup' : 'live',   // Begin battle flips this on its own publish
        snapshot: publishPayload(),
        _updated: new Date().toISOString(),
      }, { merge: true });
      state.net.lastPublishedSeq += 1;
      state.net.error = null;
      console.info('[NET] published seq', state.net.lastPublishedSeq);
      chip('live', `✓ live (seq ${state.net.lastPublishedSeq})`, 'Latest board state is published');
      const share = $('#btn-net-share'); if (share) share.hidden = false;
      const pshare = $('#btn-net-share-player'); if (pshare) pshare.hidden = false;
      startCommandFeed();   // first publish may have just created the doc
    } catch (e) {
      state.net.error = e.message || String(e);
      chip('err', '⚠ publish error', state.net.error);
      console.error('[NET] publish failed:', e);
    } finally {
      state.net.publishing = false;
      if (dirty) schedulePublish();   // mutations landed mid-write — open a fresh window
    }
  }

  function shareLink(kind) {
    if (!state.net.battleId) return;
    const url = new URL(location.origin + location.pathname);
    url.searchParams.set('camp', state.net.campId);
    url.searchParams.set('battle', state.net.battleId);
    url.searchParams.set(kind, '1');
    const link = url.toString();
    const done = () => chip('live', '✓ link copied', link);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt('Link:', link));
    else prompt('Link:', link);
  }
  const shareSpectateLink = () => shareLink('spectate');
  const sharePlayerLink = () => shareLink('player');

  // ── Player seats + move intents (chainmail Slice 2A) ────────────────────
  // Players never write the battle doc. A drop on a player's board posts a tiny
  // intent to battles/{bid}/commands (rules v9: members create-as-self); the
  // GM's open board validates against the live engine, replays the exact drop
  // bookkeeping, deletes the command, and the normal publish pipe echoes the
  // result to every client. Rejections log a Battle-Log line — the log IS the
  // reply channel, no second wire needed.
  const cmdsRef = () => battleRef().collection('commands');
  const me = () => user ? { uid: user.uid, name: user.displayName || (user.email ? user.email.split('@')[0] : user.uid) } : null;
  const canAssign = () => !!(db && user && state.net.campId && !state.net.spectate && !state.net.player);
  const ownsUnit = (u) => !!(user && u && u.controllerUid === user.uid);

  async function fetchPlayers() {   // campaigns/{cid}/players — the roster gcc-invite.js writes
    const qs = await db.collection('campaigns').doc(state.net.campId).collection('players').get();
    return qs.docs.map(d => ({ uid: d.id, name: d.data().displayName || d.data().email || d.id }));
  }

  async function openAssignMenu(u, x, y) {
    const m = $('#assign-menu');
    if (!m || !canAssign()) return;
    const head = `<div class="ctx-head">Assign ${esc(uName(u))} (${armyName(u.side)})</div>`;
    m.innerHTML = head + '<button disabled>loading roster\u2026</button>';
    m.style.left = Math.min(x, innerWidth - 220) + 'px'; m.style.top = Math.min(y, innerHeight - 160) + 'px';
    m.hidden = false;
    let roster = [];
    try { roster = await fetchPlayers(); }
    catch (e) { m.innerHTML = head + `<button disabled>roster failed \u2014 ${esc(e.message)}</button>`; return; }
    if (m.hidden) return;   // closed while loading
    m.innerHTML = head
      + (roster.length ? roster.map(p =>
          `<button data-uid="${esc(p.uid)}" data-name="${esc(p.name)}">${esc(p.name)}${u.controllerUid === p.uid ? ' \u2713' : ''}</button>`).join('')
        : '<button disabled>no players in this campaign yet</button>')
      + (u.controllerUid ? '<button data-clear="1" class="danger">Clear player control</button>' : '');
    m.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      m.hidden = true;
      const unit = state.units.find(w => w.id === u.id);
      if (!unit || unit.figures <= 0) return;
      pushUndo('assign:' + unit.id);
      if (b.dataset.clear) {
        const was = unit.controllerName || 'a player';
        unit.controllerUid = null; unit.controllerName = '';
        log('phase', `Player control cleared \u00b7 ${esc(uName(unit))} (${armyName(unit.side)})`, `${esc(was)} no longer moves it`);
      } else if (b.dataset.uid) {
        unit.controllerUid = b.dataset.uid;
        unit.controllerName = (b.dataset.name || '').slice(0, 60);
        log('phase', `Player control \u00b7 ${esc(uName(unit))} (${armyName(unit.side)})`, `${esc(unit.controllerName)} now moves it from their own board`);
      }
      renderAll();
    };
  }

  async function sendMove(u, ox, oy, ofacing=u.facing) {   // player drop → intent doc; the preview stands until the echo
    if (!db || !user || !state.net.battleId) {
      chip('err', '\u26a0 not connected', 'Sign in and reload the player link');
      u.x = ox; u.y = oy; u.facing=ofacing; renderBoard();
      return;
    }
    try {
      chip('busy', '\u27f3 move sent');
      await cmdsRef().add({
        uid: user.uid, name: me().name, action: 'move',
        unitId: u.id, to: { x: u.x, y: u.y }, facing:u.facing,
        ts: firebase.firestore.FieldValue.serverTimestamp(), build: SIM_VERSION,
      });
      chip('live', '\u2713 sent \u2014 awaiting the GM', 'The GM\u2019s board resolves the move; the echo lands here');
    } catch (e) {
      chip('err', '\u26a0 send failed', e.message);
      u.x = ox; u.y = oy; u.facing=ofacing; renderBoard();
    }
  }

  // GM side. Pure-ish so the self-tests can exercise it: reads state, mutates nothing.
  function validateMove(c) {
    const u = state.units.find(w => w.id === Number(c.unitId));
    if (!u || u.figures <= 0) return { ok: false, why: 'that unit is gone' };
    if (!c.uid || u.controllerUid !== c.uid) return { ok: false, why: `${esc(uName(u))} is not under that player\u2019s control`, u };
    if (!playerMayMoveNow(u) || movementLockReason(u)) {
      const why = movementLockReason(u) || (curPhase().id !== 'movement' ? 'it is not the Movement Phase [7.0]'
        : u.routed ? `${esc(uName(u))} is routed [6.4]`
        : u.ralliedThisRound ? `${esc(uName(u))} rallied this round \u2014 no move [6.3]`
        : profileOf(u).unitType === 'mob' ? 'mobs move by orders, not drags [2.10]'
        : `it is ${armyName(state.moverSide)}\u2019s move`);
      return { ok: false, why, u };
    }
    const nx = Number(c.to && c.to.x), ny = Number(c.to && c.to.y);
    if (!Number.isFinite(nx) || !Number.isFinite(ny)) return { ok: false, why: 'bad destination', u };
    return { ok: true, u, nx, ny };
  }

  function applyCommand(c) {
    if (!c || c.action !== 'move') return;
    const who = esc((c.name || 'A player').slice(0, 60));
    const refuse = (why) => {
      log('phase', 'Player move refused', `${who} \u2014 ${why} (command dropped)`);
      schedulePublish();   // no pushUndo to ride \u2014 the refusal line must still echo out
      renderAll();
    };
    const v = validateMove(c);
    if (!v.ok) { refuse(v.why); return; }
    const u=v.u, pre=snap(), start={x:u.x,y:u.y}, startCenter=centerPoint(u), baseFacing=u.facing, spent0=u.movedIn;
    const plan=dragPlan(u,start,v.nx,v.ny,spent0,baseFacing);
    if (plan.distance<=0.05) { refuse(`no legal move remained for ${esc(uName(u))}`); return; }
    u.x=clamp(plan.x,0,BOARD_W-1); u.y=clamp(plan.y,0,BOARD_H-1);
    const ok=commitDraggedMove({u,start,startCenter,spent0,baseFacing,pre,plan});
    if (!ok) { refuse('the requested leg was illegal under the movement path rules'); return; }
    log('phase',`Player move · ${esc(uName(u))} (${armyName(u.side)})`,`${who} · path ${fmt(moveTravel(u))}″ · cost ${fmt(u.movedIn)}″ · facing ${u.facing}°`);
  }

  function startCommandFeed() {
    if (cmdUnsub || !db || !state.net.battleId || state.net.spectate || state.net.player) return;
    cmdUnsub = cmdsRef().onSnapshot(qs => {
      qs.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        try { applyCommand(ch.doc.data()); }
        catch (e) { console.error('[NET] command failed:', e, ch.doc.data()); }
        ch.doc.ref.delete().catch(e => console.warn('[NET] command cleanup failed:', e));
      });
    }, err => console.error('[NET] command feed error:', err));
    console.info('[NET] command feed open');
  }

  // ── Spectate: onSnapshot → applySnap + hydrateUnits ─────────────────────
  // Deliberately NOT loadScenario: its fresh-context resets (alerts, stack
  // clears, "Board loaded" log line) would fire on every publish. This path
  // reuses the same primitives, and the spectator's pan/zoom/measure survive
  // publishes (state.view is never in the snapshot; first snapshot recentres).
  function applyRemote(d) {
    let data = null;
    try { data = JSON.parse(d.snapshot || ''); } catch (e) { /* fallthrough */ }
    if (!data || data.format !== 'battlesystem-board' || !data.state || !Array.isArray(data.state.units)) {
      $('#sp-status').textContent = 'bad snapshot — waiting for the next publish';
      return;
    }
    applySnap(data.state);
    hydrateUnits(state.units, data.simVersion);
    if (state.selId && !state.units.some(u => u.id === state.selId)) state.selId = null;
    if (state.targetId && !state.units.some(u => u.id === state.targetId)) state.targetId = null;
    if (typeof data.logHtml === 'string') $('#log').innerHTML = data.logHtml;
    if (!firstRemote) { state.view = { x: 0, y: 0, k: 1 }; firstRemote = true; }
    renderAll();
    // Banner: battle · turn · phase · publish status
    $('#sp-name').textContent = d.name || 'Untitled battle';
    $('#sp-turn').textContent = state.setup ? 'Deployment'
      : `Round ${state.round} · ${curPhase().label}${curPhase().id === 'movement' && state.moverSide ? ` · ${armyName(state.moverSide)} moving` : ''}`;
    $('#sp-status').textContent = `${d.status || 'live'} · seq ${d.seq != null ? d.seq : '?'} · v${d.simVersion || '?'}`;
    // Name the seat's units and whether the phase + side gate lets them move right now.
    const mine = $('#sp-mine');
    if (mine) {
      mine.hidden = !state.net.player;
      if (state.net.player && user) {
        const owned = state.units.filter(w => w.figures > 0 && w.controllerUid === user.uid);
        mine.innerHTML = owned.length
          ? 'Your units: ' + owned.map(w => `${esc(uName(w))} (${armyName(w.side)})${playerMayMoveNow(w) ? ' — may move' : ''}`).join(' · ')
          : 'No units assigned to you yet — ask the GM.';
      }
    }
    // Version skew (GitHub Pages caching): publisher NEWER than local → nudge a refresh.
    const warn = $('#sp-warn');
    if (warn) {
      const cmp = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
        for (let i = 0; i < 3; i++) { if ((pa[i]||0) < (pb[i]||0)) return -1; if ((pa[i]||0) > (pb[i]||0)) return 1; } return 0; };
      const newer = d.simVersion && cmp(SIM_VERSION, d.simVersion) < 0;
      warn.hidden = !newer;
      if (newer) warn.textContent = `The GM is publishing from v${d.simVersion} (you are on v${SIM_VERSION}) — refresh for the latest build.`;
    }
  }

  function startSpectate() {   // also the player-mode subscription — same pipe, different gates
    if (unsub) return;   // onAuthChange can refire — subscribe once
    chip('busy', state.net.player ? '⟳ joining' : '⟳ spectating');
    console.info('[NET] subscribing to battle', state.net.battleId);
    unsub = battleRef().onSnapshot(doc => {
      if (!doc.exists) { $('#sp-status').textContent = 'battle not found'; chip('err', '⚠ not found', 'No battle doc at this id'); console.warn('[NET] battle doc does not exist'); return; }
      chip('live', state.net.player ? '✓ playing' : '✓ spectating',
        state.net.player ? 'Live view — drag your assigned units while your side holds the move' : 'Live read-only view — updates as the GM plays');
      console.info('[NET] snapshot in, seq', doc.data().seq);
      applyRemote(doc.data());
    }, err => {
      chip('err', '⚠ error', err.message);
      $('#sp-status').textContent = 'error: ' + err.message;
    });
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  function init() {
    const q = new URLSearchParams(location.search);
    state.net.campId = q.get('camp') || null;
    state.net.battleId = q.get('battle') || null;
    state.net.spectate = q.get('spectate') === '1';
    state.net.player = !state.net.spectate && q.get('player') === '1';   // spectate wins a conflict
    if (!state.net.campId) { state.net.spectate = false; state.net.player = false; return; }   // offline / standalone — fully inert
    if (state.net.spectate) document.body.classList.add('spectate');   // gate inputs before auth resolves
    if (state.net.player) {
      document.body.classList.add('player');
      const h = $('#sp-head'); if (h) h.textContent = 'Playing';
    }
    if ((state.net.spectate || state.net.player) && !state.net.battleId) {   // a live view but nothing to watch
      chip('err', '⚠ link is missing &battle=', 'Ask the GM for a fresh share link');
      if ($('#sp-status')) $('#sp-status').textContent = 'this link has no battle id';
      return;
    }
    console.info('[NET] init', { camp: state.net.campId, battle: state.net.battleId, spectate: state.net.spectate, player: state.net.player, build: SIM_VERSION });
    if (typeof GCCAuth === 'undefined') { chip('err', '⚠ no GCC scripts', 'gcc-auth.js failed to load'); return; }
    chip('busy', '⟳ connecting');
    if (state.net.spectate || state.net.player) $('#sp-status').textContent = 'connecting…';
    // Watchdog (chainmail v0.11.176): gcc-auth ALWAYS emits an initial auth event
    // once Firebase resolves — if nothing arrives in 6 s, name the stall.
    let authEventSeen = false;
    setTimeout(() => {
      if (authEventSeen) return;
      chip('err', '⚠ auth never resolved', 'No sign-in state arrived from gcc-auth — press F12 and check the console');
      if ((state.net.spectate || state.net.player) && $('#sp-status')) $('#sp-status').textContent = 'stalled waiting for sign-in state — press F12';
      console.error('[NET] watchdog: no auth event after 6 s.',
        { GCCAuth: typeof GCCAuth, firebase: typeof firebase,
          config: typeof GCC_FIREBASE_CONFIG !== 'undefined',
          hint: 'Check the Network tab for failed gcc-*.js or gstatic firebase-*.js loads.' });
    }, 6000);
    GCCAuth.onAuthChange(async (u) => {
      authEventSeen = true;
      console.info('[NET] auth event:', u ? `signed in as ${u.email || u.uid}` : 'signed out');
      user = u;
      if (!u) {
        chip('err', '⚠ sign in', 'Click to sign in to Graycloak\u2019s Campaign Corner',
          () => { try { GCCAuth.showModal('signin'); } catch (e) {} });
        if (state.net.spectate || state.net.player) {   // reads require auth (rules v8+) — say so, and open the door
          if ($('#sp-status')) $('#sp-status').textContent = state.net.player ? 'sign in to play' : 'sign in to spectate';
          if (!modalShown) { modalShown = true; try { GCCAuth.showModal('signin'); } catch (e) {} }
        }
        return;
      }
      try {
        if (!db) { await loadScript(FS_URL); db = firebase.firestore(); console.info('[NET] Firestore ready'); }
      } catch (e) { chip('err', '⚠ Firestore failed', e.message); console.error('[NET] Firestore load failed:', e); return; }
      if (state.net.spectate || state.net.player) startSpectate();
      else {
        if (state.net.battleId) {   // reconnect — seed the chip's seq and the battle name from
          try {                     // the doc so a reload neither restarts the count at 1 nor
            const doc = await battleRef().get();   // republishes as 'Untitled battle'
            if (doc.exists) {
              const d = doc.data();
              state.net.lastPublishedSeq = d.seq || 0;
              if (!state.net.name && d.name) state.net.name = d.name;
            }
          } catch (e) { /* non-fatal — the first publish still lands, chip just starts fresh */ }
        }
        chip('live', state.net.battleId ? `✓ connected (seq ${state.net.lastPublishedSeq})` : '✓ ready — first action publishes',
          state.net.battleId ? 'Publishing to the battle doc' : 'The first mutating action creates the battle doc');
        const share = $('#btn-net-share'); if (share && state.net.battleId) share.hidden = false;
        const pshare = $('#btn-net-share-player'); if (pshare && state.net.battleId) pshare.hidden = false;
        if (state.net.battleId) schedulePublish();   // announce the current board on (re)connect
        startCommandFeed();   // consume player move intents (no-op until battleId exists)
      }
    });
  }

  return {
    init, schedulePublish, publishNow, publishPayload, applyRemote,
    shareSpectateLink, sharePlayerLink, sendMove, ownsUnit, canAssign, openAssignMenu,
    // self-test hooks — not for gameplay use
    _test: {
      get timerStarts() { return timerStarts; },
      get pending() { return !!timer; },
      cancel() { if (timer) clearTimeout(timer); timer = null; dirty = false; },
      validateMove,
    },
  };
})();
$('#btn-net-share').onclick = () => NET.shareSpectateLink();
$('#btn-net-share-player').onclick = () => NET.sharePlayerLink();
$('#btn-pass-move').onclick = passMove;
$('#btn-elect-order').onclick = electOrder;
$('#btn-automove').onclick = e => {
  pushUndo('setting');
  state.autoMove = !state.autoMove;
  e.target.textContent = `Auto-move: ${state.autoMove ? 'on' : 'off'}`;
  e.target.classList.toggle('on', state.autoMove);
  log('phase', `Auto-move ${state.autoMove ? 'ON' : 'OFF'}`, state.autoMove
    ? 'the sim executes rout continuation and mob orders'
    : 'rout and mob moves are described on amber badges — drag those units yourself');
  renderAll();
};
$('#btn-enforce').onclick = e => {
  pushUndo('setting');
  state.enforce = !state.enforce;
  log('phase', `Rules: ${state.enforce ? 'ENFORCED' : 'ADVISORY'}`, state.enforce
    ? 'gates block illegal actions; the sim executes rules outcomes'
    : 'movement is free and sequencing gates warn instead of blocking; morale/discipline/rout/pass-through post ⚑ DUE lines — roll them from the unit pane');
  renderAll();
};
window.addEventListener('mousedown', e => {   // assign menu closes on any outside press
  const m = $('#assign-menu');
  if (m && !m.hidden && !m.contains(e.target)) m.hidden = true;
}, true);

/* === K. SELF-TESTS (boot, console) ======================================= */
(function selfTests() {
  const ok = [], bad = [];
  const logBeforeTests = $('#log').innerHTML;                       // self-tests must never become user Battle Log history
  const t = (label, cond) => (cond ? ok : bad).push(label);
  // [8.4] rulebook worked example through the engine with forced dice
  const r = BattlesystemCombat.resolveMeleeCombat(
    { thaco:17, ratio:'10:1', modifiers:{}, arBaseOverride:17,
      weapon:{ damageDice:'D8', damageModifier:0, numberOfDice:1 }, numberOfAttacks:1, eligibleFigures:10 },
    { ac:8, hitDice:10, size:'M' }, () => ({ total:7, dice:[3,4] }));
  t('[8.4] worked example 60 HD / 6 killed', r.rawTotalDamage===60 && r.killed===6);
  // [4.1] orc base morale from BS_TYPES row (11 -1 AC6? no: AC6 no mod; regular +1) = 12

  console.log(`[BS-BOARD] self-tests: ${ok.length} ok${bad.length ? ` · FAILED: ${bad.join('; ')}` : ''}`);
  if (bad.length) log('phase', '⚠ Self-test failures', bad.join(' · '));
})();

NET.init();
setDockTab(state.setup ? 'muster' : 'selected');
renderAll(); syncLogCount();
log('phase', `Battlesystem Board v${SIM_VERSION}`, 'Muster (click board to place) · shift+click targets an enemy · lit buttons show legal actions',
  'Engine: @graycloak/battlesystem-engine v0.2.0 · Multiplayer: ?camp= publishes · &spectate=1 watches · &player=1 moves assigned units · Intermediate slice (missiles, cavalry, terrain) to follow');
</script>
