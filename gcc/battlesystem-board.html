/* === J. NET — GCC multiplayer (Slice 6: chainmail Slice 1 + 2A port) ===== */
// Ported whole from chainmail-board v0.11.180's NET layer onto this board's
// snap/applySnap architecture. Publishes a full minified snapshot to
// campaigns/{cid}/battles/{bid} — SAME collection and rules (v9) as chainmail
// battles; the payload's format field ('battlesystem-board') disambiguates and
// each board rejects the other's docs. Publish rides pushUndo's tail (the
// complete map of mutations); undo/redo/loadScenario republish explicitly.
// Spectators/players subscribe onSnapshot → applyRemote (applySnap +
// hydrateUnits, NOT loadScenario — its resets would stomp the viewport).
// Player seats post move intents to battles/{bid}/commands; the GM board is
// the authority and gates every intent through playerMayMoveNow, including
// the BS wrinkle chainmail lacks: initiative-winner-first Movement-Phase alternation
// (state.moverSide, seeded from initiative, flipped by Pass move).
// EVERYTHING here no-ops on file:// (no GCCAuth) or without ?camp=.
const NET = (function () {
  const FB_VERSION = '10.12.2';   // matches gcc-auth.js / gcc-sync.js compat builds
  const FS_URL = `https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-firestore-compat.js`;
  const DEBOUNCE_MS = 750;        // non-extending window: drag storms collapse to ≤1 publish per window
  const LOG_PUBLISH_CAP = 300;    // newest 300 entries carried chronologically in the payload (1 MB doc cap headroom)

  let db = null, user = null, unsub = null, cmdUnsub = null;
  let timer = null, dirty = false, declined = false, firstRemote = false, modalShown = false;
  let timerStarts = 0;            // self-test hook: debounce windows opened

  const $chip = () => $('#net-chip');
  function chip(cls, text, title, onclick) {
    const c = $chip(); if (!c) return;
    c.hidden = false;
    c.className = 'net-chip' + (cls ? ' ' + cls : '') + (onclick ? ' click' : '');
    c.textContent = text;
    c.title = title || '';
    c.onclick = onclick || null;
  }

  function loadScript(url) {   // same pattern as gcc-auth/gcc-sync
    return new Promise((res, rej) => {
      if (document.querySelector(`script[src="${url}"]`)) { res(); return; }
      const s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + url));
      document.head.appendChild(s);
    });
  }

  const battleRef = () => db.collection('campaigns').doc(state.net.campId)
                            .collection('battles').doc(state.net.battleId);

  // Same payload as saveScenario minus filename/savedAt, plus the Battle Log —
  // snap() does not carry the log here (unlike chainmail's captureSnapshot), so
  // it ships alongside, capped to the newest entries while preserving oldest→newest order.
  function logCapture() {
    const L = $('#log'); if (!L) return '';
    return Array.from(L.children).slice(-LOG_PUBLISH_CAP).map(k => k.outerHTML).join('');
  }
  function publishPayload() {
    return JSON.stringify({
      format: 'battlesystem-board',
      simVersion: SIM_VERSION,
      state: snap(),
      logHtml: logCapture(),
    });
  }

  function schedulePublish() {
    if (!state.net.campId || state.net.spectate || state.net.player || declined) return;
    dirty = true;
    if (timer) return;   // a window is already open — this mutation rides it
    timerStarts++;
    timer = setTimeout(() => { timer = null; if (dirty) publishNow(); }, DEBOUNCE_MS);
  }

  async function publishNow() {
    dirty = false;
    if (!db || !user) { chip('err', '⚠ not signed in', 'Sign in to publish this battle'); return; }
    if (state.net.publishing) { schedulePublish(); return; }   // one write in flight at a time
    try {
      if (!state.net.battleId) {   // first publish creates the doc (auto-id) and rewrites the URL
        const suggested = state.net.name || `Battle — ${new Date().toLocaleDateString()}`;
        const entered = prompt('Name this battle (spectators will see it):', suggested);
        if (entered === null) {   // cancelled — stop nagging for this session
          declined = true;
          chip('', '— not publishing', 'Battle naming cancelled — reload the page to publish');
          return;
        }
        state.net.name = (entered.trim() || suggested).slice(0, 80);
        const ref = db.collection('campaigns').doc(state.net.campId).collection('battles').doc();
        state.net.battleId = ref.id;
        const url = new URL(location.href);
        url.searchParams.set('battle', ref.id);
        history.replaceState(null, '', url);
      }
      state.net.publishing = true;
      chip('busy', '⟳ publishing');
      await battleRef().set({
        name: state.net.name || 'Untitled battle',
        ownerUid: user.uid,
        simVersion: SIM_VERSION,
        seq: firebase.firestore.FieldValue.increment(1),
        status: state.setup ? 'setup' : 'live',   // Begin battle flips this on its own publish
        snapshot: publishPayload(),
        _updated: new Date().toISOString(),
      }, { merge: true });
      state.net.lastPublishedSeq += 1;
      state.net.error = null;
      console.info('[NET] published seq', state.net.lastPublishedSeq);
      chip('live', `✓ live (seq ${state.net.lastPublishedSeq})`, 'Latest board state is published');
      const share = $('#btn-net-share'); if (share) share.hidden = false;
      const pshare = $('#btn-net-share-player'); if (pshare) pshare.hidden = false;
      startCommandFeed();   // first publish may have just created the doc
    } catch (e) {
      state.net.error = e.message || String(e);
      chip('err', '⚠ publish error', state.net.error);
      console.error('[NET] publish failed:', e);
    } finally {
      state.net.publishing = false;
      if (dirty) schedulePublish();   // mutations landed mid-write — open a fresh window
    }
  }

  function shareLink(kind) {
    if (!state.net.battleId) return;
    const url = new URL(location.origin + location.pathname);
    url.searchParams.set('camp', state.net.campId);
    url.searchParams.set('battle', state.net.battleId);
    url.searchParams.set(kind, '1');
    const link = url.toString();
    const done = () => chip('live', '✓ link copied', link);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt('Link:', link));
    else prompt('Link:', link);
  }
  const shareSpectateLink = () => shareLink('spectate');
  const sharePlayerLink = () => shareLink('player');

  // ── Player seats + move intents (chainmail Slice 2A) ────────────────────
  // Players never write the battle doc. A drop on a player's board posts a tiny
  // intent to battles/{bid}/commands (rules v9: members create-as-self); the
  // GM's open board validates against the live engine, replays the exact drop
  // bookkeeping, deletes the command, and the normal publish pipe echoes the
  // result to every client. Rejections log a Battle-Log line — the log IS the
  // reply channel, no second wire needed.
  const cmdsRef = () => battleRef().collection('commands');
  const me = () => user ? { uid: user.uid, name: user.displayName || (user.email ? user.email.split('@')[0] : user.uid) } : null;
  const canAssign = () => !!(db && user && state.net.campId && !state.net.spectate && !state.net.player);
  const ownsUnit = (u) => !!(user && u && u.controllerUid === user.uid);

  async function fetchPlayers() {   // campaigns/{cid}/players — the roster gcc-invite.js writes
    const qs = await db.collection('campaigns').doc(state.net.campId).collection('players').get();
    return qs.docs.map(d => ({ uid: d.id, name: d.data().displayName || d.data().email || d.id }));
  }

  async function openAssignMenu(u, x, y) {
    const m = $('#assign-menu');
    if (!m || !canAssign()) return;
    const head = `<div class="ctx-head">Assign ${esc(uName(u))} (${armyName(u.side)})</div>`;
    m.innerHTML = head + '<button disabled>loading roster\u2026</button>';
    m.style.left = Math.min(x, innerWidth - 220) + 'px'; m.style.top = Math.min(y, innerHeight - 160) + 'px';
    m.hidden = false;
    let roster = [];
    try { roster = await fetchPlayers(); }
    catch (e) { m.innerHTML = head + `<button disabled>roster failed \u2014 ${esc(e.message)}</button>`; return; }
    if (m.hidden) return;   // closed while loading
    m.innerHTML = head
      + (roster.length ? roster.map(p =>
          `<button data-uid="${esc(p.uid)}" data-name="${esc(p.name)}">${esc(p.name)}${u.controllerUid === p.uid ? ' \u2713' : ''}</button>`).join('')
        : '<button disabled>no players in this campaign yet</button>')
      + (u.controllerUid ? '<button data-clear="1" class="danger">Clear player control</button>' : '');
    m.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      m.hidden = true;
      const unit = state.units.find(w => w.id === u.id);
      if (!unit || unit.figures <= 0) return;
      pushUndo('assign:' + unit.id);
      if (b.dataset.clear) {
        const was = unit.controllerName || 'a player';
        unit.controllerUid = null; unit.controllerName = '';
        log('phase', `Player control cleared \u00b7 ${esc(uName(unit))} (${armyName(unit.side)})`, `${esc(was)} no longer moves it`);
      } else if (b.dataset.uid) {
        unit.controllerUid = b.dataset.uid;
        unit.controllerName = (b.dataset.name || '').slice(0, 60);
        log('phase', `Player control \u00b7 ${esc(uName(unit))} (${armyName(unit.side)})`, `${esc(unit.controllerName)} now moves it from their own board`);
      }
      renderAll();
    };
  }

  async function sendMove(u, ox, oy, ofacing=u.facing) {   // player drop → intent doc; the preview stands until the echo
    if (!db || !user || !state.net.battleId) {
      chip('err', '\u26a0 not connected', 'Sign in and reload the player link');
      u.x = ox; u.y = oy; u.facing=ofacing; renderBoard();
      return;
    }
    try {
      chip('busy', '\u27f3 move sent');
      await cmdsRef().add({
        uid: user.uid, name: me().name, action: 'move',
        unitId: u.id, to: { x: u.x, y: u.y }, facing:u.facing,
        ts: firebase.firestore.FieldValue.serverTimestamp(), build: SIM_VERSION,
      });
      chip('live', '\u2713 sent \u2014 awaiting the GM', 'The GM\u2019s board resolves the move; the echo lands here');
    } catch (e) {
      chip('err', '\u26a0 send failed', e.message);
      u.x = ox; u.y = oy; u.facing=ofacing; renderBoard();
    }
  }

  // GM side. Pure-ish so the self-tests can exercise it: reads state, mutates nothing.
  function validateMove(c) {
    const u = state.units.find(w => w.id === Number(c.unitId));
    if (!u || u.figures <= 0) return { ok: false, why: 'that unit is gone' };
    if (!c.uid || u.controllerUid !== c.uid) return { ok: false, why: `${esc(uName(u))} is not under that player\u2019s control`, u };
    if (!playerMayMoveNow(u) || movementLockReason(u)) {
      const why = movementLockReason(u) || (curPhase().id !== 'movement' ? 'it is not the Movement Phase [7.0]'
        : u.routed ? `${esc(uName(u))} is routed [6.4]`
        : u.ralliedThisRound ? `${esc(uName(u))} rallied this round \u2014 no move [6.3]`
        : profileOf(u).unitType === 'mob' ? 'mobs move by orders, not drags [2.10]'
        : `it is ${armyName(state.moverSide)}\u2019s move`);
      return { ok: false, why, u };
    }
    const nx = Number(c.to && c.to.x), ny = Number(c.to && c.to.y);
    if (!Number.isFinite(nx) || !Number.isFinite(ny)) return { ok: false, why: 'bad destination', u };
    return { ok: true, u, nx, ny };
  }

  function applyCommand(c) {
    if (!c || c.action !== 'move') return;
    const who = esc((c.name || 'A player').slice(0, 60));
    const refuse = (why) => {
      log('phase', 'Player move refused', `${who} \u2014 ${why} (command dropped)`);
      schedulePublish();   // no pushUndo to ride \u2014 the refusal line must still echo out
      renderAll();
    };
    const v = validateMove(c);
    if (!v.ok) { refuse(v.why); return; }
    const u=v.u, pre=snap(), start={x:u.x,y:u.y}, startCenter=centerPoint(u), baseFacing=tacFacing(u), baseFormationFacing=physFacing(u), spent0=u.movedIn;
    const plan=dragPlan(u,start,v.nx,v.ny,spent0,baseFacing);
    if (plan.distance<=0.05) { refuse(`no legal move remained for ${esc(uName(u))}`); return; }
    u.x=clamp(plan.x,0,BOARD_W-1); u.y=clamp(plan.y,0,BOARD_H-1);
    const ok=commitDraggedMove({u,start,startCenter,spent0,baseFacing,baseFormationFacing,pre,plan});
    if (!ok) { refuse('the requested leg was illegal under the movement path rules'); return; }
    log('phase',`Player move · ${esc(uName(u))} (${armyName(u.side)})`,`${who} · path ${fmt(moveTravel(u))}″ · cost ${fmt(u.movedIn)}″ · facing ${u.facing}°`);
  }

  function startCommandFeed() {
    if (cmdUnsub || !db || !state.net.battleId || state.net.spectate || state.net.player) return;
    cmdUnsub = cmdsRef().onSnapshot(qs => {
      qs.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        try { applyCommand(ch.doc.data()); }
        catch (e) { console.error('[NET] command failed:', e, ch.doc.data()); }
        ch.doc.ref.delete().catch(e => console.warn('[NET] command cleanup failed:', e));
      });
    }, err => console.error('[NET] command feed error:', err));
    console.info('[NET] command feed open');
  }

  // ── Spectate: onSnapshot → applySnap + hydrateUnits ─────────────────────
  // Deliberately NOT loadScenario: its fresh-context resets (alerts, stack
  // clears, "Board loaded" log line) would fire on every publish. This path
  // reuses the same primitives, and the spectator's pan/zoom/measure survive
  // publishes (state.view is never in the snapshot; first snapshot recentres).
  function applyRemote(d) {
    let data = null;
    try { data = JSON.parse(d.snapshot || ''); } catch (e) { /* fallthrough */ }
    if (!data || data.format !== 'battlesystem-board' || !data.state || !Array.isArray(data.state.units)) {
      $('#sp-status').textContent = 'bad snapshot — waiting for the next publish';
      return;
    }
    applySnap(data.state);
    hydrateUnits(state.units, data.simVersion);
    normalizeSetupCommandLinks(state.units);
    if (state.selId && !state.units.some(u => u.id === state.selId)) state.selId = null;
    if (state.targetId && !state.units.some(u => u.id === state.targetId)) state.targetId = null;
    if (typeof data.logHtml === 'string') { const L=$('#log'), stick=logAtBottom(L); L.innerHTML=data.logHtml; syncLogCount(); if(stick) scrollLogToBottom(true); }
    if (!firstRemote) { state.view = { x: 0, y: 0, k: 1 }; firstRemote = true; }
    renderAll();
    // Banner: battle · turn · phase · publish status
    $('#sp-name').textContent = d.name || 'Untitled battle';
    $('#sp-turn').textContent = state.setup ? 'Deployment'
      : `Round ${state.round} · ${curPhase().label}${curPhase().id === 'movement' && state.moverSide ? ` · ${armyName(state.moverSide)} moving` : ''}`;
    $('#sp-status').textContent = `${d.status || 'live'} · seq ${d.seq != null ? d.seq : '?'} · v${d.simVersion || '?'}`;
    // Name the seat's units and whether the phase + side gate lets them move right now.
    const mine = $('#sp-mine');
    if (mine) {
      mine.hidden = !state.net.player;
      if (state.net.player && user) {
        const owned = state.units.filter(w => w.figures > 0 && w.controllerUid === user.uid);
        mine.innerHTML = owned.length
          ? 'Your units: ' + owned.map(w => `${esc(uName(w))} (${armyName(w.side)})${playerMayMoveNow(w) ? ' — may move' : ''}`).join(' · ')
          : 'No units assigned to you yet — ask the GM.';
      }
    }
    // Version skew (GitHub Pages caching): publisher NEWER than local → nudge a refresh.
    const warn = $('#sp-warn');
    if (warn) {
      const cmp = (a, b) => { const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
        for (let i = 0; i < 3; i++) { if ((pa[i]||0) < (pb[i]||0)) return -1; if ((pa[i]||0) > (pb[i]||0)) return 1; } return 0; };
      const newer = d.simVersion && cmp(SIM_VERSION, d.simVersion) < 0;
      warn.hidden = !newer;
      if (newer) warn.textContent = `The GM is publishing from v${d.simVersion} (you are on v${SIM_VERSION}) — refresh for the latest build.`;
    }
  }

  function startSpectate() {   // also the player-mode subscription — same pipe, different gates
    if (unsub) return;   // onAuthChange can refire — subscribe once
    chip('busy', state.net.player ? '⟳ joining' : '⟳ spectating');
    console.info('[NET] subscribing to battle', state.net.battleId);
    unsub = battleRef().onSnapshot(doc => {
      if (!doc.exists) { $('#sp-status').textContent = 'battle not found'; chip('err', '⚠ not found', 'No battle doc at this id'); console.warn('[NET] battle doc does not exist'); return; }
      chip('live', state.net.player ? '✓ playing' : '✓ spectating',
        state.net.player ? 'Live view — drag your assigned units while your side holds the move' : 'Live read-only view — updates as the GM plays');
      console.info('[NET] snapshot in, seq', doc.data().seq);
      applyRemote(doc.data());
    }, err => {
      chip('err', '⚠ error', err.message);
      $('#sp-status').textContent = 'error: ' + err.message;
    });
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  function init() {
    const q = new URLSearchParams(location.search);
    state.net.campId = q.get('camp') || null;
    state.net.battleId = q.get('battle') || null;
    state.net.spectate = q.get('spectate') === '1';
    state.net.player = !state.net.spectate && q.get('player') === '1';   // spectate wins a conflict
    if (!state.net.campId) { state.net.spectate = false; state.net.player = false; return; }   // offline / standalone — fully inert
    if (state.net.spectate) document.body.classList.add('spectate');   // gate inputs before auth resolves
    if (state.net.player) {
      document.body.classList.add('player');
      const h = $('#sp-head'); if (h) h.textContent = 'Playing';
    }
    if ((state.net.spectate || state.net.player) && !state.net.battleId) {   // a live view but nothing to watch
      chip('err', '⚠ link is missing &battle=', 'Ask the GM for a fresh share link');
      if ($('#sp-status')) $('#sp-status').textContent = 'this link has no battle id';
      return;
    }
    console.info('[NET] init', { camp: state.net.campId, battle: state.net.battleId, spectate: state.net.spectate, player: state.net.player, build: SIM_VERSION });
    if (typeof GCCAuth === 'undefined') { chip('err', '⚠ no GCC scripts', 'gcc-auth.js failed to load'); return; }
    chip('busy', '⟳ connecting');
    if (state.net.spectate || state.net.player) $('#sp-status').textContent = 'connecting…';
    // Watchdog (chainmail v0.11.176): gcc-auth ALWAYS emits an initial auth event
    // once Firebase resolves — if nothing arrives in 6 s, name the stall.
    let authEventSeen = false;
    setTimeout(() => {
      if (authEventSeen) return;
      chip('err', '⚠ auth never resolved', 'No sign-in state arrived from gcc-auth — press F12 and check the console');
      if ((state.net.spectate || state.net.player) && $('#sp-status')) $('#sp-status').textContent = 'stalled waiting for sign-in state — press F12';
      console.error('[NET] watchdog: no auth event after 6 s.',
        { GCCAuth: typeof GCCAuth, firebase: typeof firebase,
          config: typeof GCC_FIREBASE_CONFIG !== 'undefined',
          hint: 'Check the Network tab for failed gcc-*.js or gstatic firebase-*.js loads.' });
    }, 6000);
    GCCAuth.onAuthChange(async (u) => {
      authEventSeen = true;
      console.info('[NET] auth event:', u ? `signed in as ${u.email || u.uid}` : 'signed out');
      user = u;
      if (!u) {
        chip('err', '⚠ sign in', 'Click to sign in to Graycloak\u2019s Campaign Corner',
          () => { try { GCCAuth.showModal('signin'); } catch (e) {} });
        if (state.net.spectate || state.net.player) {   // reads require auth (rules v8+) — say so, and open the door
          if ($('#sp-status')) $('#sp-status').textContent = state.net.player ? 'sign in to play' : 'sign in to spectate';
          if (!modalShown) { modalShown = true; try { GCCAuth.showModal('signin'); } catch (e) {} }
        }
        return;
      }
      try {
        if (!db) { await loadScript(FS_URL); db = firebase.firestore(); console.info('[NET] Firestore ready'); }
      } catch (e) { chip('err', '⚠ Firestore failed', e.message); console.error('[NET] Firestore load failed:', e); return; }
      if (state.net.spectate || state.net.player) startSpectate();
      else {
        if (state.net.battleId) {   // reconnect — seed the chip's seq and the battle name from
          try {                     // the doc so a reload neither restarts the count at 1 nor
            const doc = await battleRef().get();   // republishes as 'Untitled battle'
            if (doc.exists) {
              const d = doc.data();
              state.net.lastPublishedSeq = d.seq || 0;
              if (!state.net.name && d.name) state.net.name = d.name;
            }
          } catch (e) { /* non-fatal — the first publish still lands, chip just starts fresh */ }
        }
        chip('live', state.net.battleId ? `✓ connected (seq ${state.net.lastPublishedSeq})` : '✓ ready — first action publishes',
          state.net.battleId ? 'Publishing to the battle doc' : 'The first mutating action creates the battle doc');
        const share = $('#btn-net-share'); if (share && state.net.battleId) share.hidden = false;
        const pshare = $('#btn-net-share-player'); if (pshare && state.net.battleId) pshare.hidden = false;
        if (state.net.battleId) schedulePublish();   // announce the current board on (re)connect
        startCommandFeed();   // consume player move intents (no-op until battleId exists)
      }
    });
  }

  return {
    init, schedulePublish, publishNow, publishPayload, applyRemote,
    shareSpectateLink, sharePlayerLink, sendMove, ownsUnit, canAssign, openAssignMenu,
    // self-test hooks — not for gameplay use
    _test: {
      get timerStarts() { return timerStarts; },
      get pending() { return !!timer; },
      cancel() { if (timer) clearTimeout(timer); timer = null; dirty = false; },
      validateMove,
    },
  };
})();
$('#btn-net-share').onclick = () => NET.shareSpectateLink();
$('#btn-net-share-player').onclick = () => NET.sharePlayerLink();
$('#btn-pass-move').onclick = passMove;
$('#btn-elect-order').onclick = electOrder;
$('#btn-automove').onclick = e => {
  pushUndo('setting');
  state.autoMove = !state.autoMove;
  e.target.textContent = `Auto-move: ${state.autoMove ? 'on' : 'off'}`;
  e.target.classList.toggle('on', state.autoMove);
  log('phase', `Auto-move ${state.autoMove ? 'ON' : 'OFF'}`, state.autoMove
    ? 'the sim executes rout continuation and mob orders'
    : 'rout and mob moves are described on amber badges — drag those units yourself');
  renderAll();
};
$('#btn-enforce').onclick = e => {
  pushUndo('setting');
  state.enforce = !state.enforce;
  log('phase', `Rules: ${state.enforce ? 'ENFORCED' : 'ADVISORY'}`, state.enforce
    ? 'gates block illegal actions; the sim executes rules outcomes'
    : 'movement is free and sequencing gates warn instead of blocking; Setup also permits live GM test attacks; morale/discipline/rout/pass-through post ⚑ DUE lines — roll them from the unit pane');
  renderAll();
};
window.addEventListener('mousedown', e => {   // assign menu closes on any outside press
  const m = $('#assign-menu');
  if (m && !m.hidden && !m.contains(e.target)) m.hidden = true;
}, true);
