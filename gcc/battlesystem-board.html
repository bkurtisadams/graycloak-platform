inal 1/3 straight run mathematically unrecoverable inside the remaining charge allowance; ADVISORY permits the move with an amber warning. Ordinary undeveloped charges still fail when Movement ends, but the special Break Through contact obligation is deferred to the end of the Melee Phase exactly as [7.14] states, so a later enemy contact can satisfy it and a target destroyed during Melee can still trigger the printed failed-charge consequence. PRIOR (v0.41.5): SETUP BREAKTHROUGH CONTINUATION — Setup advisory charges now survive [7.14] Break Through correctly: the old target is cleared, every continued drag leg remains part of the same charge path and 1.5× MV allowance, the first new enemy contacted becomes the continued charge target, and final-third-straight / allowance checks determine whether that continued charge completes. The redundant ordinary Movement Phase warning is suppressed for explicitly permitted Setup sandbox charges. PRIOR (v0.41.4): CHARGE DISPLAY + SETUP PATH FIX — cavalry/chariot sheets now display the actual [11.4] −2 AR charge modifier instead of the ordinary closed-formation −1, and Setup advisory test charges record their dragged movement leg so path and cost agree. Set Spears/Pikes denial is shown explicitly instead of advertising a bonus the melee resolver will withhold. PRIOR (v0.41.3): LEGACY COMMAND + SETUP CHARGE SANDBOX FIX — legacy embedded Unit Commanders are now recognized from both the canonical missing commanderId property and older/malformed literal "legacy"/blank values, preventing a sheet from displaying Legacy while commandSource treats the unit OOC. Hydration canonicalizes those values back to the missing-property form (and "none" to explicit null). Setup + Rules: ADVISORY now also permits charge declarations for focused combat testing; a declared sandbox charge that is dragged into target contact is marked successful so [11.4] cavalry/chariot charge modifiers and charge-double damage can be exercised before Begin Battle. PR at modifier shifts Current HP by the same delta (unless Current HP was explicitly edited), preserving the character's damage deficit for effects such as a familiar. Existing maxHp saves hydrate as Base Max with modifier 0; legacy saves whose current hp exceeded an old hidden max still expand safely, while explicit data is clamped to the resulting Effective Max. PRIOR (v0.40.6): NET MELEE SUMMARY FIX — the Simultaneous Melee headline now reports final figure/wound changes after [8.7] two-wound consolidation instead of echoing the raw CRT casualty object; detailed attack lines still show the raw CRT result. PRIOR (v0.40.5): COMMANDER-FIGHTING REACH FIX — Table 10 now treats a linked standalone Unit Commander as fighting with the unit anywhere inside the board’s 1-inch army fighting/contact reach, instead of requiring an overly precise 0.30-inch standoff. This keeps the commander-fighting −1 AR consistent with the simulator’s current melee geometry and follows deputies who assume the Unit Commander office. PRIOR (v0.40.4): COMMAND LINK CLEANUP + DETAIL FIX — Setup role changes now clear stale Unit/Brigade assignments immediately so a former Brigade Commander cannot linger as an INVALID link after becoming a Hero/Deputy; the unit editor explicitly locks No Brigade link persistence with a DOM self-test; LEVEL / RACE / CLASS now continues to show the linked Unit Commander’s character data even when that commander is DOWN, instead of leaking Army-command status text into the field. PRIOR (v0.40.3): COMMAND CHAIN UI — the existing Unit Sheet command cell now shows the compact full chain (Unit, derived Unit Deputy, Brigade, derived Army, and current command source/status) without redesigning the rest of the roster. Edit mode keeps only Unit/Brigade links editable while Deputy/Army/Current are read-only derived values. Focused boot tests lock those displays. PRIOR (v0.40.2): SELF-TEST FIXES — corrects two polluted boot-test fixtures from v0.40.x: the higher-command mob fixture now explicitly disables its legacy embedded Unit Commander before asserting Army-command fallback, and the Hero UI fixture restores the original Hero to state.units/selection before rendering spell-roster, reticle, and name-clearance assertions. No gameplay-rule behavior changes. PRIOR (v0.40.1): SYNTAX HOTFIX — fixes the Legacy Commander / Race editor cell introduced in v0.40.0: its malformed nested conditional template literal prevented the module from parsing. The cell now builds its HTML through a small IIFE, preserving legacy embedded-commander editing and race editing without nested-template ambiguity. PRIOR (v0.40.0): STANDALONE COMMAND HIERARCHY [4.7]-[4.10]/[9.2]-[9.3] — standalone PC/NPC Unit, Brigade, and Army Commanders now drive real command-radius status instead of being roster-only chrome. Unit Commander links are one-to-one; Brigade links cover up to 8 assigned units; the side’s Army Commander can affect any friendly unit in CR. In-command tests use every actual figure position, so a long formation is OOC if even one figure lies beyond the active commander’s CR. Higher commanders can restore command when the Unit Commander is absent/out of radius, commander CHA now feeds morale through the active standalone source, mobs remain OOC for penalties but can be rallied/ordered by eligible higher commanders, and Rally attempts enforce one unit per commander per Rally Phase. Deputies are linked by stable character ID, one deputy per commander, and can assume a vacated command; a voluntary role change must leave the command vacant through the remainder of that Game Round before succession, while death/down/disable/removal permits immediate takeover. Old saves preserve embedded commanders until a standalone/no-commander choice is explicitly made. [4.7] is now mechanically live for movement: an OOC regular in Closed Formation must break to Open before ordinary movement/facing/wheeling/frontage maneuvers. Also corrects the old Table 10 conflation of “In Command” with “commander fighting”: the −1 AR applies only to a legacy embedded commander or a linked standalone Unit Commander physically with the unit, never to remote Brigade/Army command. PRIOR (v0.39.1): AMMUNITION BOOKKEEPING [10.3] — normal arrows, quarrels, stones, and bullets are unlimited unless a scenario says otherwise; finite thrown/special missiles are tracked and consumed, with the RAW two-volley default preserved. Heroes spend individual missiles while army units spend volleys. Custom ammunition rows (e.g. arrows +1) may carry their own HIT±/DMG± and are selected independently of the bow, so bow and ammunition magic stack without conflating the items. PRIOR (v0.39.0): HERO BATTLEFIELD MISSILE FIRE [10.x] — standalone Heroes may now fire recognized character missile weapons at non-1:1 army units during the normal BATTLESYSTEM missile windows. The shot deliberately stays in the §10 BATTLESYSTEM AR/CRT pipeline: one Hero is one firing figure at the 1:1 ratio, so THAC0 receives the +15 ratio adjustment before weapon HIT±, Table 13 range/cover modifiers, and weapon DMG± are applied; this makes ordinary lone bow fire modest while magical bows/arrows can matter without inventing a special Hero damage rule. Hero-entered S/M/L ranges override the stock missile table when supplied, and common magic-suffix names such as “longbow +2” still identify the underlying missile family. Initial Missile, Missile & Magic, movement/fire limits, pass-through fire against army movers, LOS/cone/visibility, terrain cover, immediate missile casualties, and no-melee-after-firing behavior all reuse the existing §10 machinery. 1:1 missile TARGETS remain deliberately gated because they need direct-hp character missile handling rather than army casualties; §9.4A melee and §9.4B Individual Combat are unchanged. PRIOR (v0.38.0): §9.4B INDIVIDUAL COMBAT + COMPACT HERO WEAPON ROWS — 1:1 PC/NPC figures in mechanical base contact now resolve Individual Combat during the BATTLESYSTEM Melee Phase on HIT± and DMG± modifiers through the existing weapon-entry combat model, and adds a dedicated collapsible Spells roster for spellcasting class(es), levels 1–9, and casting notes. The spell roster is persistent reference data only for now: [14.1] casting/movement/phase enforcement remains deferred to the Advanced magic slice. PRIOR (v0.36.3): HERO EDITOR SPACE REBALANCE — the Heroes & Commanders editor keeps the exact same outer roster width but stops allocating every TSR field as an equal 24-column box. Editing rows now use nested, purpose-sized clusters: Command Rank + widened ability/MR inputs; AC/CB/Race + widened saving throws; roomy HD/CR/hp/MV vitals beside a wider weapon/damage/#AT table; and paired THACO/AR ratings beside a broad modifier field. Text-heavy controls receive the recovered width, STR can comfortably show exceptional values such as 18/76, save labels no longer ellipsize, numeric controls are taller/easier to edit, and the read-only TSR roster footprint is unchanged. PRIOR (v0.36.2): TSR HEROES & COMMANDERS ROSTER — the standalone character inspector/editor is rebuilt around the actual BATTLESYSTEM Heroes and Commanders Roster Sheet instead of a tall custom form. The primary grid now follows the TSR field grammar: Name + Class/Level; Command Rank + S/I/W/D/Co/Ch/MR%; AC/CB/Race + PPD/P-P/RSW/BW/Sp; HD/CR/hp/MV + structured Weapon/Damage/#AT rows; THACO/AR + THACO-AR Modifiers; and Special Abilities and Limitations. Missing RAW character data now persists (five non-CHA abilities, MR/saves, AR override/modifier note, and up to three structured weapon rows). Digital-only implementation controls (max HP, referee CR Level, Fighter/Ranger/Paladin +3 CR eligibility, Deputy designation/link, fixed 1:1/size, and battle state) move into a collapsed Details drawer so the live roster stays compact. Command Rank replaces the oversized Role block while still driving the same [9.0] role state. PRIOR (v0.36.1): HERO CHROME + AD&D CLASS FLEXIBILITY — standalone act casualty-slot tracking. Regression locks cover prior-move + casualty overflow, the exact-MV boundary, Right-Faced front-file preservation, and About-Faced front-rank preservation. PRIOR (v0.35.2): COMBAT-PAIR HIGHLIGHT — selected + targeted enemies within the 1″ melee reach now gain a shared outer corner-bracket cue while preserving their existing gold selection and red target reticles. The engagement connector strengthens for that selected/target pair and gains a compact crossed-swords marker; when meleeState() is actually legal now, the outer cue switches to the brighter READY treatment, so the battlefield and Resolve Melee button use the same eligibility source instead of duplicating combat logic. Out-of-reach targets retain the ordinary reticles only. Reduced-motion mode disables the new pulse. PRIOR (v0.35.1): SETUP DEPLOYMENT + ADVISORY TEST SANDBOX — Setup now exposes free deployment configuration instead of limiting the GM to drag/rotate: regular units may switch Closed/Open, change figure facing, and adjust frontage without spending MV or marking the unit as moved. When Rules is ADVISORY, Setup additionally permits direct melee and missile test attacks so casualty mechanics can be exercised without stepping through a live battle; ENFORCED Setup still blocks combat. Sandbox attacks are real state changes, so the UI warns to Undo/Reset before Begin Battle. PRIOR (v0.35.0): [7.3] OPEN-FORMATION GAP FILLING — casualties in OPEN formation now force surviving figures to fill front-line gaps at 1″ of movement per replacement figure, even while engaged. The rectangular unit abstraction treats removed figures as front-line losses and compacts survivors into the vacated front slots; the mandatory cost is derived from the actual tactical front edge (so a Right-Faced unit uses its current front file, not stored layout columns). Gap-fill cost is added to the round movement budget immediately, survives pass-through-fire resolution during a drag, and is exposed in the le wounded artillery crews remain unable to turn/move the piece [10.10]; skirmishers no longer use the ranked Wheel action. Regression locks cover mob/skirmish facing gates, wounded artillery, split-preserving rout/flee/charge-facing helpers, and programmatic skirmish Wheel refusal. PRIOR (v0.34.6): UI FIX: GREEN FRONTAGE BAR FOLLOWS TACTICAL FACING — after a [7.9] Face-in-place, the green bar now marks the actual occupied tactical front edge instead of remaining on the physical layout top edge. The bar is derived from the figures on the presented front, so incomplete formations do not advertise nonexistent frontage. Added regression locks for a Right-Faced line and an incomplete side-facing formation. PRIOR (v0.34.5): TACTICAL FRONTAGE FOLLOWS FIGURE FACING — `u.frontage` is now explicitly the physical layout-column count only; combat and missile capacity use presentedFrontage(), derived from the figures actually lying on the tactical front edge after [7.9] Facing Changes. The unit editor distinguishes Presented frontage from Layout columns. [7.10]/[7.11] frontage re-forming is temporarily refused while tactical and physical facing diverge, because the rectangular card model cannot represent the required irregular per-figure repositioning without moving the wrong figures. Added regression locks for cardinal presented frontage, missile firing capacity after Right Face, and the split-facing re-form guard. PRIOR (v0.34.4): UI: REAR CHROME FOLLOWS TACTICAL REAR AFTER FACE-IN-PLACE — M/F/X chips and upright labels now anchor outside the TRUE physical footprint along the figures' tactical rear, instead of assuming physical formation rotation and tactical facing are identical. Side-facing labels use start/end anchoring so long names grow AWAY from the unit rather than back across it. Two regression locks cover ordinary north-facing chrome and an 8x1 line after Right Face. PRIOR (v0.34.3): [7.9] FACE-IN-PLACE — Right/Left/About Face now turns figures without rotating or relocating the formation footprint. Physical orientation is stored lazily as formationFacing only when tactical facing diverges, so untouched units and old saves retain the prior one-field state. Presented frontage, front-rank missile figures, tactical arcs, movement cone, fire origin/arc, and arrow pips follow figure facing; Wheel/setup rotation preserves any facing offset. Focused self-tests lock an 8x1 Right Face to unchanged figure centres/footprint, frontage 1, 1/3-MV cost, and the correct tactical front. PRIOR (v0.34.2): FIX: POINTER DRIFT — boardPt IGNORED SVG LETTERBOXING (Kurt's repro: the cursor pulls away from the dragged unit, worsening with travel; ALSO the measure tool, which is what proved it was the MAPPING and not the unit code). ROOT CAUSE, found by reading after three wrong guesses and confirmed by Kurt's console (element aspect 0.926 vs viewBox 1.500): #board sets no preserveAspectRatio, so it defaults to xMidYMid MEET — ONE uniform scale plus centring bands — but boardPt mapped x by r.width/vb.width and y by r.height/vb.height INDEPENDENTLY, treating the letterbox as board. Error is zero at the centre and grows linearly toward the edges, which integrates over a drag into visible drift. NOT a v0.34.0 regression: boardPt is unchanged since v0.1.0 (chainmail chassis) and the diff touches no coordinate code — what changed is the LAYOUT aspect (rail/log widths persist in localStorage, so the trigger follows you across versions and reloads). At Kurt's aspect the board is WIDTH-constrained, so x was accidentally right and the entire error lived on y. FIX (ChatGPT's, adopted over the hand-rolled scale math — strictly more robust): boardPt asks the browser for its ACTUAL draw matrix via getScreenCTM().inverse(), which absorbs letterboxing, CSS transforms, borders, padding, scroll and devicePixelRatio. Pure clientToBoard(cx,cy,r,vb) is retained as the fallback AND the test surface, since getScreenCTM returns null in jsdom. PAN AUDITED AND FIXED TOO (also ChatGPT's catch): the right-drag pan cached rw/rh and vbw/vbh and divided per-axis with the same flaw — it now caches ONE uniformScale(). BOARD CLAMP: the drag clamp's hardcoded BOARD_W-1 / BOARD_H-1 margin assumed a 1\" base; it now uses the unit's true unitRect w/h, which v0.34.0's 1.5\"-deep cavalry made wrong at the south edge. Self-tests +4, driving clientToBoard with a synthetic rect at Kurt's exact 0.926 aspect: centre maps to centre at matching AND mismatched aspect, a +10\" step on the letterboxed axis lands at +10\", and the legacy per-axis formula is asserted WRONG on that axis so the lock cannot silently pass again. LESSON: a pointer-mapping bug is invisible whenever the layout happens to match the viewBox aspect — test the mismatched case explicitly. PRIOR (v0.34.1): FIX: THE [11.8 UI] SELF-TEST FAILED IN CHROME, PASSED IN JSDOM. Kurt's console 2026-08-22 settled it: Chrome's CSSOM COLLAPSES a complete grid-column/grid-row pair into `grid-area: 1 / 1` on serialization (and align-self/justify-self into place-self), so v0.31.3's longhand-only regex could never match in the browser. The shipped CSS was correct the whole time — both elements ARE pinned to cell 1/1 and the v0.31.1 reflow fix is intact; only the LOCK was broken, and it broke in the exact direction v0.31.3 claimed to have eliminated (it swapped a jsdom-only failure for a browser-only one and called itself environment-independent). _pinned(sel) now accepts grid-area OR either longhand order. FIFTH instance of the invisible-failure family; NEW LESSON: a regression lock that reads CSSOM/DOM SERIALIZATION must accept every engine's normalization, or it only tests the engine it was written on. Also: the boot banner's hardcoded 'engine v0.2.0' string corrected to v0.4.3 — it has been stale since v0.3.0 and actively misleads exactly the kind of debugging that found this. No rules changes. PRIOR (v0.34.0): [2.3] BASE FOOTPRINTS ARE WIDTH x DEPTH — CAVALRY BASE FIX. Kurt supplied the [2.3] base table 202 lled at visTargets (a capped kill also drops the wound), the ignored losses named in the log. RULINGS, open to veto: interposed UNITS read as COVER not concealment (bodies stop arrows); the band applies to artillery's fixed AC too (moot this slice — see deferrals); INDIRECT fire lobs OVER the screen and pays NO interposition cover (its +3 stands). SEMANTICS CHANGE: the v0.25.0 hard enemy-blocker refusal is REPLACED by graded visibility — partial sight AROUND an enemy unit is now legal direct fire at DMG cover; a FULLY hidden target still refuses ("no figure of the target is visible"), and the friendly-screen indirect grammar is unchanged. DEFERRED: pass-through fire and direct artillery keep the full-visibility assumption (PT would need the mover's mid-path footprint; flagged); terrain-based concealment (brush) awaits a use case. Self-tests +8: partial-screen visibility trichotomy, shooter reduction, band mapping incl. thresholds, loss-cap arithmetic, fully-hidden refusal, legal partial fire around an enemy blocker, and a LIVE volley with the cover band + visible count + [10.1] in the log. PRIOR (v0.32.1): HIGHER GROUND SIGN RULED (Kurt 2026-08-21, checked against the physical Table 10): the printed "Defender occupies higher ground −1" is nonsense taken literally — attacking a unit on HIGHER ground is a PENALTY. terrainMeleeDelta flips: defender uphill → attacker +1 (the book's magnitude, corrected sign); the v0.32.0 attacker-downhill-bonus reading is retired — downhill attacks get NO bonus. Log line reads "attacks uphill +1 [Table 10, sign ruled 2026-08-21]". Self-test rewritten to the ruled direction. PRIOR (v0.32.0): TERRAIN COMBAT — [11.9] + Table 13 terrain rows + Table 10 higher ground + [10.9] artillery movement (terrain slice two of two; [11.x] is now COMPLETE except chariots). WOODS FIRE GATES [11.9]: a unit whose centre sits DEEP in woods (more than 1″ from the region boundary — WOODS_EDGE_IN, RULING open to veto) can neither fire (volleyGates for troops AND artilleryGates — covering direct fire, the Fire button light, and pass-through arming/re-check) nor BE TARGETED (fireState, both troop and artillery paths; the PT sweep skips catch-points in deep woods); units AT THE EDGE fire out and can be hit, per RAW's "if they can fire out, they can be hit". Overlapping-woods union boundary approximated per-region. TABLE 13 INTO THE VOLLEY PIPELINE: target in woods +2; target behind HEDGE +2 (new hedge linear type — obstacle stats like wall, its own cover class); target behind WALL +4 — "behind" = the firer→target line crosses the linear feature within 2.5″ of the target centre (behindLinearCover, sampled like everything else); woods-and-hedge don't stack (one Table 13 row), wall stacks (separate row); AND THE ROW MISSED SINCE v0.24: "missile-using troops are mounted +2" — horse archers finally pay it. Open question flagged: indirect lobs over a wall still pay the wall +4 (RAW-flat reading; Kurt may veto). "In building" +4 waits for a building type. MELEE: terrainMeleeDelta feeds every attack path (resolveMelee both directions, resolveOneWayMelee free attacks, BOTH set-spears legs) — HIGHER GROUND −1 (RULING, open to veto and CHECK THE PHYSICAL TABLE 10: the supplied text reads "Defender occupies higher ground −1", which taken literally rewards attacking uphill; read with [11.8]'s uphill-charge ban we implement the only coherent direction — the ATTACKER on higher ground, by hill heightFt comparison, gets the −1) and the [11.9] LOW-GROUND +4 (attacker centred in a ditch/gulley, fording a stream, or in a swamp, against a defender in none of those); a ⛰ log line names the modifiers once per direction. ARTILLERY MOVEMENT [10.9], deferred since v0.26.0: pieces move ONLY along roads or clear terrain — the sampler and the drag clamp both halt the piece at the first non-road feature (blockedWhy distinguishes the message from the water stop; a road THROUGH woods stays passable — road presence wins), enforced clamps / advisory warns. umn). [8.2] SWITCH now CYCLES the roster rows in order (Melee-Phase-only button labels the next weapon); u.activeWeapon stores the row name, invalidated on Apply if its row was erased. VIEW: the sheet lists every row TSR-style ('⚔ longsword · +1 hit · 1d8+1 / 1d12+1 L · 1 AT'), active row marked when carrying alternates. vs-L variants identical to S/M are suppressed so usedLargeVariant cannot fire spuriously. Self-tests: editor id updated, +6 (magic longsword row incl. vs-L, hit→AR −1, cycle order + wrap, blank-row engine fallback + DMG± stack, identical-vs-L suppression). PRIOR (v0.22.0): BASIC CLOSE-OUT SLICE (from the full coverage audit — every fixable Basic-scope gap that needs no ruling from Kurt). (1) [6.1] ONE RALLY ATTEMPT per unit per Rally Phase: new u.rallyAttempted, set on any attempt (rout rally OR [4.6] reassert), cleared at Rally Phase entry; rallyState and attemptRallySelected refuse repeats — the old board let a failed rally be re-clicked until it passed. RELATED FIX: phaseIsEmpty no longer skips the Rally Phase while a disciplineBroken unit waits to reassert (previously reassert was UNREACHABLE unless someone also happened to be routed). (2) TABLE 7 FLEE TRIGGER: when a unit Flees [8.8], an engaged chaotic/low-int enemy now makes the Discipline Check the rulebook pairs with withdrawal ('...or Flees while engaged'); failure = closed→open + disciplineBroken (pursuit compulsion logged for GM enforcement) — previously only Fighting Withdrawal rolled it. (3) [2.8]/[2.10] MUSTER BOUNDS: regulars clamp 4-48, mobs 12-96 (input max raised to 96 — mobs were capped at 48, HALF their legal size; minimums were unenforced); adjustments log the rule. (4) TABLE 3 DATA (the int/align pattern closed): unitEngineData feeds hasSpecialAbilities / hasExceptionalAbilities / hasMagicEquipment / mounted from data+prof instead of hard-coded false — four ML modifiers wired since v0.1.0 could never fire. ELF gains specialAbilities:true (90% sleep/charm resistance is a Special Ability per the DMG p.85 definition [4.1] cites) → elves are +1 ML from this build. Editor gains three checkboxes (Special/Exceptional/Magic equip.) persisted as sparse prof overrides ahead of the ML recompute; 'mounted' is data-only until cavalry. (5) [7.15] ROUT COMPLETIONS: (a) SURROUNDED DESTRUCTION — at the moment a unit first routs, a 16-heading corridor probe (1″-wide: center ray ±0.45″ flankers, clear for 2″ past the unit edge) tests for any escape gap past enemy units in closed/open formation (mobs do not seal, per the rulebook's own wording); no gap = destroyed outright, both auto and manual modes (destruction is a rules outcome, not movement translation). (b) ROUT THROUGH FRIENDLIES — the rout leg sweeps a corridor; each friendly non-routed unit it hits makes an IMMEDIATE Morale Check (chained through runMoraleCheck's new chainDepth, capped at 4 against ping-pong): if it holds, the router BREAKS AROUND (pushed on along its rout heading in 0.25″ steps until clear — 'reforms on the other side'); if it fails, the existing failure machinery routs it away from the same cause, moving it ahead of the router. Applies to auto routs AND hand-executed manual-mode routs (routPathConsequences runs at manual commit). Skirmish pass-through lands with the skirmish slice. (6) [8.2] WEAPON IN HAND: units may carry a sidearm (prof.weapon2, set in the editor's new Weapon 2 field; no type defaults — GM assigns); a 'Switch to <weapon>' button in the Selected pane, Melee-Phase only, swaps u.activeWeapon FREE with no penalty per RAW, usable even in melee. weaponProfile serves the active weapon (sidearms use pure engine table values — prof dice overrides describe the primary; vs-L pairs flow), [8.1] eligibility follows it (a spear unit that draws swords loses its extra rank), and the sheet's WPN cell shows active + alt. activeWeapon persists across rounds (RAW: the weapon stays in hand) and rides snapshots. STATE: rallyAttempted + activeWeapon seeded in mkUnit/hydration. Self-tests +13. STILL OPEN AFTER THIS SLICE (need Kurt or their own slice): skirmish units [2.9]/[7.4] (best landed with missiles), Brigade/Army commanders [4.10], Table 7 hated-opponent (hate matrix + sees ruling), multiple-20s AR on the thaco-20 rows, end-of-Melee undead/cannot-harm triggers (dormant until such a type exists). PRIOR (v0.21.0): CR-CIRCLE TOGGLE + AUTO-MOVE GAME SETTING (both from Kurt's table notes). (1) COMMAND-RADIUS CIRCLE: the v0.11.1 fade (opacity .28, stroke .8) made it invisible at table zoom; it now draws at opacity .6 / stroke 1.5 / dash 5-5 with class cr-circle, and the C KEY toggles it (state.crCircle, view-local like Grid/Labels, never snapshotted; the keydown handler now also ignores keys typed into the editor's INPUT/SELECT/TEXTAREA — a latent Delete-key hazard closed in passing). (2) AUTO-MOVE (state.autoMove, default on, SNAPSHOTTED game setting — publishes to seats and rides saves; toolbar 'Auto-move: on/off' toggle, GM-only, one undo entry per flip): ON is today's behavior — the sim executes rout continuation [6.4]/[7.15] and mob standing orders [2.10]. OFF turns execution into INSTRUCTION: autoRout and runMobMovement set u.pendingAuto and log '⚑ MANUAL MOVE DUE' instead of moving; every unit with a pending instruction carries a persistent amber '⚑ MOVE DUE' badge (the movement-info badge machinery, 1″ clearance placement) stating the required move — 'ROUT 12″ SE · back to enemy', 'MOB ADVANCE: ≤12″ on facing, stop at contact'. The GM then EXECUTES BY HAND: routed units and mobs become GM-draggable in manual mode only (mayMove manualFree clause; rallied-this-round still blocked [6.3]; seats never), with dragPlan giving them free steering (no ±45° cone — the GM is the authority) and the correct allowance (rout MV+1/3; mob MV, 1.5× under Charge/Force March orders). Completing a manual ROUT move faces the unit along its flight heading (back to enemy [7.15]), updates routDir for [6.4] continuation guidance, applies the off-table removal, and clears the instruction; mob completion clears it; End of Round sweeps stale instructions. Dice-and-state automation (morale checks, discipline, rout STATUS, wild-charge determination) is deliberately NOT gated — the setting governs TRANSLATION only. All rout call sites inherit the manual branch through autoRout (morale-failure rout, [6.4] continuation at turn start, struck-while-routed re-rout). Old saves hydrate autoMove true. Self-tests +7: manual rout describes without moving + keeps routDir, free-steering rout drag at the rout allowance, mob order described vs walked per setting, snapshot round-trip, C-key toggle. PRIOR (v0.20.0): SLICE A — CHAINMAIL PHASE RAIL WITH SIDE PILLS + [1.4] ELECT. RAIL: the passive stepper adopts chainmail-board's pill grammar — every phase step shows its acting sides as A/B pills in acting order left→right (Rally and Melee: initiative winner first [6.0]/[1.6]; Movement: the elected order [1.4]; Initiative and End: none), ✓ marks on completed steps, › separators, pills at 40% opacity on done/todo steps. BS ENHANCEMENT over the chainmail original: within the LIVE Movement step the pills dim INDIVIDUALLY as each side finishes (moveStep 1 dims the first mover, 2 dims both) — chainmail splits First/Last Move into two rail steps, but BS [1.4] is ONE phase with pass-through fire interleaved, so one step with per-pill progress keeps the rulebook's own phase names. No rail-ghost: the .prow min-height keeps the rail height constant, and the rail only appears at Begin battle as before. [1.4] ELECT (RAW fix): the rulebook's Movement Phase opens "Side A chooses which side moves its forces first" — the board previously HARD-SEEDED moverSide to the initiative winner with no choice (the v0.11.0 verification note examined [5.1]/[7.8] but not [1.4]'s explicit choosing step; this SUPERSEDES it — [5.1]'s "side that moves first is determined by making an Initiative Roll" reads as determining WHO CHOOSES, i.e. who is Side A). Default remains winner-first (zero behavior change until used); a GM-only 'Move <winner> last/first' toolbar button appears during Movement while the elect is legal: moveStep 0 AND no unit of the leading side has taken a VOLUNTARY move — rout continuation [6.4] and mob standing orders [2.10] are involuntary and do NOT lock it. Electing swaps firstMover, hands moverSide across, logs '[1.4]', and begins the other side. SAFETY: beginMovementForSide now runs each side's rout/mob auto-actions at most ONCE per Movement Phase (new state.autoMovedSides, reset at phase entry) so an elect swap cannot double-run routs or mob orders — engagement marking [7.8] still re-runs at every turn start. passMove derives the second mover from firstMover. STATE: firstMover + autoMovedSides join snap()/applySnap with hydration defaults (old saves: firstMover falls back to moverSide→initiativeWinner); reset/beginBattle clear both; seats/spectators never see the elect button (CSS lists + syncActions). Self-tests +9: pill orders per phase, movement pills track the elect, elect legality window incl. the involuntary-move exemption, per-pill dim at each moveStep, the once-per-side auto guard, snapshot round-trip. DEFERRED (Slice B): the decoupled action dock (#action-bank/#action-slot) — lands with the missile slice when the phase-verb count earns it. PRIOR (v0.19.1): FIX: DIAGONAL CHARGE FACING/CONTACT (Kurt: "facing is now messed up"). The v0.16.0 charge-faces-its-target fix rotated the charger AFTER pressing to the standoff; rotating a wide rect about its center at a 45° heading swings the corners away from the enemy, ballooning the 0.25″ standoff to ~1.63″ — OUTSIDE melee reach — so diagonal chargers visibly spun and detached from their targets, charge "succeeded" but could not fight (cardinal charges rotated 0° and hid the bug; the v0.16 self-test asserted only the facing value, never the post-rotation gap). FIX: the rotation happens BEFORE the press — faceUnit at the moment the charge leg confirms its declared target 4]: a chaotic or low-int regular declaring a charge in CLOSED formation now makes a Discipline Check at declaration; on failure it breaks to OPEN and goes OUT OF COMMAND during the charge (new u.disciplineBroken flag — feeds isOOC/inCommand so the Table 10 +1 AR, −2 ML, and closed-formation ban all follow; the RAW compulsion to keep attacking until resolution is logged for GM enforcement, not hard-enforced). REASSERT [4.6]/[6.7]: a discipline-broken unit's commander reasserts command via a Rally-Phase rally attempt (rallyState lights; success clears the flag and the unit acts normally that round; the flag persists across rounds until reasserted). SHEET: view mode shows INT · AL in the Unit Type cell; the editor gains INT ladder + alignment selects persisted as sparse u.prof overrides (set before the DL recompute so calculateDiscipline sees them); saves/NET snapshots carry them via prof. Self-tests +8: gnoll low+chaotic reaches engine data, dwarf lawful/Very-not-High, Table 7 predicate closed-only and per-type, disciplineBroken OOC wiring, rallyState lights for reassert, prof overrides apply, snapshot round-trip. FLAGGED OPEN: Table 7 hated-opponent trigger (needs the PH p.18 hate matrix as a `hates` list and a sees-within-charge-range ruling); weapon vs-L damage is ENGINE-FIRST (defineWeapon must carry and expose the S/M vs L variants — do not edit gcc/engine/; change packages/battlesystem-engine and re-sync, then the sheet grows the second damage line and prof overrides). PRIOR (v0.16.0): CHARGE AUDIT FIXES (rules audit vs Basic Game text + CRT). (1) DECLARATION UNBLOCKED: the v0.14.0 declare-before-any-movement gate is retired — it reversed the recorded 2026-08-18 ruling (v0.10.0: movement already made this phase COUNTS toward the run-up) and made any prior Face/Wheel/frontage change, or even a 0.06-inch selection nudge, permanently poison charge declaration for the round; RAW [7.14] has no declare-first requirement (the charge IS the unit's move). chargeState now
