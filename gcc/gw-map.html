<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  :root {
    --parchment-light: #e8d5a3;
    --hex-stroke: rgba(0,0,0,0.32);
    --hex-hover: rgba(255,180,80,0.22);
    --hex-selected: rgba(255,120,40,0.42);
    --panel-bg: rgba(14,8,2,0.93);
    --panel-border: #5a3a0a;
    --gamma-orange: #ff8844;
    --gamma-orange-light: #ffaa66;
    --topbar-h: 46px;
    --gcc-bar-h: 44px;
  }
  /* Override gcc-header.css default (relative) to fix the bar at viewport top
     since gw-map uses a fixed-positioning layout. */
  .gcc-bar { position:fixed; top:0; left:0; right:0; z-index:200; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0a0500; font-family:'Crimson Text',Georgia,serif; color:var(--parchment-light); overflow:hidden; height:100vh; width:100vw; user-select:none; }

  #topbar { position:fixed; top:var(--gcc-bar-h); left:0; right:0; height:var(--topbar-h); background:linear-gradient(180deg,#100800,#1e1004); border-bottom:1px solid var(--panel-border); display:flex; align-items:center; padding:0 14px; gap:12px; z-index:100; }
  #topbar h1 { font-family:'Cinzel',serif; font-size:15px; font-weight:600; letter-spacing:.12em; color:var(--gamma-orange-light); text-shadow:0 0 12px rgba(255,136,68,.4); }
  #topbar .ver { font-size:11px; color:#c8a96e; }
  .sep { width:1px; height:22px; background:var(--panel-border); }
  .spacer { flex:1; }

  #map-wrap { position:fixed; top:calc(var(--gcc-bar-h) + var(--topbar-h)); left:0; right:0; bottom:0; overflow:hidden; cursor:grab; background:#050200; touch-action:none; }
  #map-wrap.grabbing { cursor:grabbing; }
  #map-stage { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  #world { display:block; }

  .parent-hex { fill:transparent; stroke:var(--hex-stroke); stroke-width:.5; cursor:pointer; transition:fill .1s, fill-opacity .1s; fill-opacity:1; }
  body.printed-map-shown .parent-hex { fill-opacity:.4; }
  .parent-hex:hover { stroke:rgba(255,200,80,.9); stroke-width:1; }
  .parent-hex.selected { stroke:#ff8844; stroke-width:1.8; }
  .parent-label { font-family:'Cinzel',serif; font-size:5px; fill:rgba(0,0,0,.6); text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  .rad-overlay { fill:url(#rad-hatch); stroke:rgba(195,240,55,.4); stroke-width:1.5; pointer-events:none; }

  .hud { position:fixed; background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:3px; color:var(--parchment-light); padding:10px 14px; font-size:12px; z-index:50; box-shadow:0 4px 16px rgba(0,0,0,.6); }
  #hud-cell      { top:calc(var(--gcc-bar-h) + var(--topbar-h) + 12px); left:12px;   min-width:200px; }
  #hud-layers    { top:calc(var(--gcc-bar-h) + var(--topbar-h) + 12px); right:12px;  min-width:160px; }
  #hud-encounter { bottom:12px; left:12px;  min-width:260px; max-width:320px; }
  #hud-data      { min-width:200px; }
  #hud-zoom      { min-width:140px; }
  #hud-br        { position:fixed; bottom:12px; right:12px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; z-index:50; }
  #hud-br .hud   { position:static; }

  .hud h3 { font-family:'Cinzel',serif; font-size:11px; font-weight:600; letter-spacing:.1em; color:var(--gamma-orange-light); margin-bottom:6px; }
  .hud-row { display:flex; justify-content:space-between; padding:2px 0; }
  .hud-row label { color:#aaa899; }

  .layer-toggle { display:flex; align-items:center; gap:6px; padding:3px 0; cursor:pointer; }
  .layer-toggle input { cursor:pointer; }

  button { background:none; border:1px solid var(--panel-border); color:var(--parchment-light); font-family:'Cinzel',serif; font-size:11px; letter-spacing:.04em; padding:5px 10px; cursor:pointer; border-radius:2px; transition:all .15s; }
  button:hover { background:rgba(255,136,68,.18); border-color:var(--gamma-orange); color:var(--gamma-orange-light); }
  button:active { transform:scale(.97); }
  button.primary { background:rgba(255,136,68,.18); border-color:var(--gamma-orange); color:var(--gamma-orange-light); }
  button.primary:hover { background:rgba(255,136,68,.32); }

  select { background:#1a0e02; border:1px solid var(--panel-border); color:var(--parchment-light); font-family:'Crimson Text',serif; font-size:12px; padding:3px 6px; border-radius:2px; }

  .enc-result .meta { color:#aaa899; font-size:10px; }

<script>
'use strict';

// ─── Terrain layer ───────────────────────────────────────────────────────────
const TERRAIN_COLOR = {
  water:            '#72a3c8',
  plains:           '#e6b04e',
  desert:           '#eaca44',
  forest:           '#76b057',
  'heavy-forest':   '#28644f',
  mountains:        '#6e5046',
  'snow-mountains': '#dcd7d7',
  deathlands:       '#d291a0',
  ruins:            '#a8576b',  // not auto-detected; manually assignable
  unknown:          '#3c3c3c',
};

// Bridge classifier/edited labels → keys in gw-encounter-data.js TERRAIN_TO_TABLE.
const TERRAIN_TO_ENCOUNTER_KEY = {
  water:            'water',
  plains:           'plains',
  desert:           'desert',
  forest:           'forest',
  'heavy-forest':   'forest',
  mountains:        'mountains',
  'snow-mountains': 'mountains',
  deathlands:       'radioactive',
  ruins:            'ruins',
};

const AUTO_TERRAIN = new Map();
for (const d of (window.GW_TERRAIN_DATA || [])){
  AUTO_TERRAIN.set(d.col + ',' + d.row, d.terrain);
}

const OVERRIDES_KEY = 'gw-terrain-overrides';
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(OVERRIDES_KEY) || '{}'); } catch (e) { overrides = {}; }

// Committed layer: baked authoring from gw-authored.js (the canonical map).
// Working localStorage overrides sit on top; an override matching its committed
// value reads as committed (not an unsaved edit).
const COMMITTED_TERRAIN = (window.GW_AUTHORED && window.GW_AUTHORED.stores && window.GW_AUTHORED.stores[OVERRIDES_KEY]) || {};

function getTerrain(col, row){
  const k = col + ',' + row;
  return overrides[k] || COMMITTED_TERRAIN[k] || AUTO_TERRAIN.get(k) || 'unknown';
}
window.getTerrain = getTerrain;   // consumed by gw-subhex-data parentTerrainOf

function isOverridden(col, row){
  return Object.prototype.hasOwnProperty.call(overrides, col + ',' + row);
}
// 'override' = unsaved working edit · 'committed' = baked into gw-authored.js · 'auto' = seed
function terrainSource(col, row){
  const k = col + ',' + row;
  if (Object.prototype.hasOwnProperty.call(overrides, k)){
    return overrides[k] === COMMITTED_TERRAIN[k] ? 'committed' : 'override';
  }
  if (Object.prototype.hasOwnProperty.call(COMMITTED_TERRAIN, k)) return 'committed';
  return 'auto';
}

function setTerrainOverride(col, row, terrain){
  const k = col + ',' + row;
  const base = COMMITTED_TERRAIN[k] || AUTO_TERRAIN.get(k);
  if (!terrain || terrain === base){
    delete overrides[k];
  } else {
    overrides[k] = terrain;
  }
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
}

// ─── Hazard overlay (radiation): independent of terrain ───────────────────────
const AUTO_HAZARD = new Map();
for (const d of (window.GW_TERRAIN_DATA || [])){ if (d.hazard) AUTO_HAZARD.set(d.col + ',' + d.row, d.hazard); }

const HAZARD_KEY = 'gw-hazard-overrides';
let hazardOverrides = {};
try { hazardOverrides = JSON.parse(localStorage.getItem(HAZARD_KEY) || '{}'); } catch (e) { hazardOverrides = {}; }
const COMMITTED_HAZARD = (window.GW_AUTHORED && window.GW_AUTHORED.stores && window.GW_AUTHORED.stores[HAZARD_KEY]) || {};

function hazardBase(k){
  if (Object.prototype.hasOwnProperty.call(COMMITTED_HAZARD, k)) return COMMITTED_HAZARD[k] || null;
  return AUTO_HAZARD.get(k) || null;
}
function getHazard(col, row){
  const k = col + ',' + row;
  if (Object.prototype.hasOwnProperty.call(hazardOverrides, k)) return hazardOverrides[k] || null;
  return hazardBase(k);
}
window.getHazard = getHazard;   // consumed by gw-subhex-data for inherited hazard

function setHazard(col, row, on){
  const k = col + ',' + row;
  const base = hazardBase(k);
  const val = on ? 'radiation' : null;
  if (val === base) delete hazardOverrides[k];        // matches committed/auto → not an edit
  else hazardOverrides[k] = val || '';                // '' = explicitly none
  localStorage.setItem(HAZARD_KEY, JSON.stringify(hazardOverrides));
}

function renderHazards(){
  const g = document.getElementById('parent-hazard');
  if (!g) return;
  g.replaceChildren();
  const keys = new Set([...AUTO_HAZARD.keys(), ...Object.keys(COMMITTED_HAZARD), ...Object.keys(hazardOverrides)]);
  for (const k of keys){
    const [col, row] = k.split(',').map(Number);
    if (getHazard(col, row) !== 'radiation') continue;
    const { x, y } = colRowToCenter(col, row);
    if (x < -HEX_R || x > WORLD_W + HEX_R || y < -HEX_R || y > WORLD_H + HEX_R) continue;
    const ov = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    ov.setAttribute('points', hexPolygonPoints(x, y, HEX_R));
    ov.setAttribute('class', 'rad-overlay');
    g.appendChild(ov);
  }
}

// ─── Geometry ────────────────────────────────────────────────────────────────
// FLAT-TOP odd-q parent grid at HEX_R=20, matching @graycloak/map-engine
// (constants.ts / coords.ts parentSvgCenter) so the phase-2 subhex layer's
// global axial math drops in unchanged. SUB_R = HEX_R/10 = 2 (10:1, 3-mile).
// gwmap.png (3001×1863, 1:1 SVG units) is now a background reference only —
// the flat-top grid no longer aligns to the printed pointy-top hexes
// (re-orient accepted 2026-05-24). Each parent = 30 mi.
const HEX_R      = 20;
const SUB_R      = HEX_R / 10;       // = 2, matches map-engine SUB_R
const SQRT3      = Math.sqrt(3);
const HEX_STEP_X = HEX_R * 1.5;      // flat-top: column horizontal step (30)
const HEX_STEP_Y = HEX_R * SQRT3;    // flat-top: row vertical step (~34.64)

const WORLD_W = 3001;
const WORLD_H = 1863;

const COLS = Math.ceil(WORLD_W / HEX_STEP_X) + 1;
const ROWS = Math.ceil(WORLD_H / HEX_STEP_Y) + 1;

// Anchor — becomes the subhex axial origin (Q=0,R=0) in the phase-2 data
// layer. Roughly mid-map so authored Q,R stay small. Fixed once chosen:
// changing it later rewrites every subhex doc id.
const ANCHOR_COL = Math.floor(COLS / 2);
const ANCHOR_ROW = Math.floor(ROWS / 2);

function colRowToCenter(col, row){
  // Flat-top, odd-q offset: odd columns shift down by half a row step.
  // Mirrors map-engine parentSvgCenter(col,row) exactly.
  const x = HEX_R + col * HEX_STEP_X;
  const y = HEX_STEP_Y / 2 + row * HEX_STEP_Y + ((col & 1) ? HEX_STEP_Y / 2 : 0);
  return { x, y };
}

function hexPolygonPoints(cx, cy, r){
  // Flat-top: vertices at 0°, 60°, 120°, 180°, 240°, 300°
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI/3;
    pts.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}

// ─── Pan / zoom ──────────────────────────────────────────────────────────────
const stage = document.getElementById('map-stage');
const wrap  = document.getElementById('map-wrap');
const view  = { x: 0, y: 0, scale: 1 };
const MIN_SCALE = 0.3;
const MAX_SCALE = 12;

function applyTransform(){
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  document.getElementById('hz-zoom').textContent = Math.round(view.scale * 100) + '%';
}

function fitToWindow(){
  const rect = wrap.getBoundingClientRect();
  const sx = rect.width / WORLD_W;
  const sy = rect.height / WORLD_H;
  view.scale = Math.min(sx, sy) * 0.95;
  view.x = (rect.width  - WORLD_W * view.scale) / 2;
  view.y = (rect.height - WORLD_H * view.scale) / 2;
  applyTransform();
}

let drag = null;
wrap.addEventListener('mousedown', e => {
  // Right-click: pan from anywhere, even over hexes
  if (e.button === 2){
    e.preventDefault();
    drag = { startX: e.clientX, startY: e.clientY, viewX: view.x, viewY: view.y };
    wrap.classList.add('grabbing');
    return;
  }
  // Left-click: pan only when not over a hex (so hex clicks select)
  if (e.button !== 0) return;
  if (e.target.classList && e.target.classList.contains('parent-hex')) return;
  drag = { startX: e.clientX, startY: e.clientY, viewX: view.x, viewY: view.y };
  wrap.classList.add('grabbing');
});

// Suppress the browser context menu over the map so right-click pan works
wrap.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!drag) return;
  view.x = drag.viewX + (e.clientX - drag.startX);
  view.y = drag.viewY + (e.clientY - drag.startY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  drag = null;
  wrap.classList.remove('grabbing');
});

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - view.x) / view.scale;
  const wy = (my - view.y) / view.scale;
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
  view.x = mx - wx * view.scale;
  view.y = my - wy * view.scale;
  applyTransform();
}, { passive: false });

document.getElementById('btn-reset').onclick = fitToWindow;

// ─── Parent grid ─────────────────────────────────────────────────────────────
let selectedHexes = new Set();

function buildParentGrid(){
  const gridG  = document.getElementById('parent-grid');
  const labelG = document.getElementById('parent-labels');
  for (let col = 0; col < COLS; col++){
    for (let row = 0; row < ROWS; row++){
      const { x, y } = colRowToCenter(col, row);
      if (x < -HEX_R || x > WORLD_W + HEX_R || y < -HEX_R || y > WORLD_H + HEX_R) continue;
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', hexPolygonPoints(x, y, HEX_R));
      poly.setAttribute('class', 'parent-hex');
      const terrain = getTerrain(col, row);
      poly.style.fill = TERRAIN_COLOR[terrain] || TERRAIN_COLOR.unknown;
      poly.dataset.col = col;
      poly.dataset.row = row;
      poly.dataset.terrain = terrain;
      poly.addEventListener('click', e => onCellClick(col, row, poly, e));
      gridG.appendChild(poly);
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', x);
      lbl.setAttribute('y', y);
      lbl.setAttribute('class', 'parent-label');
      lbl.textContent = col + ',' + row;
      labelG.appendChild(lbl);
    }
  }
  document.getElementById('parent-labels').style.display = 'none';
  renderHazards();
}

function onCellClick(col, row, polyEl, ev){
  const shift = ev && ev.shiftKey;

  if (!shift){
    // Plain click resets selection to just this hex
    selectedHexes.forEach(h => h.classList.remove('selected'));
    selectedHexes.clear();
    selectedHexes.add(polyEl);
    polyEl.classList.add('selected');
  } else {
    // Shift+click toggles this hex in/out of the selection
    if (selectedHexes.has(polyEl)){
      selectedHexes.delete(polyEl);
      polyEl.classList.remove('selected');
    } else {
      selectedHexes.add(polyEl);
      polyEl.classList.add('selected');
    }
  }

  refreshSelectionHud();
}

function clearSelection(){
  selectedHexes.forEach(h => h.classList.remove('selected'));
  selectedHexes.clear();
  refreshSelectionHud();
}

function refreshSelectionHud(){
  const n = selectedHexes.size;
  const hcCoords  = document.getElementById('hc-coords');
  const hcSource  = document.getElementById('hc-source');
  const hcRegion  = document.getElementById('hc-region');
  const sel       = document.getElementById('hc-terrain-edit');
  const enc       = document.getElementById('enc-terrain-readout');
  const btnDay    = document.getElementById('btn-roll-day');
  const btnWatch  = document.getElementById('btn-roll-watch');
  const btnExplore= document.getElementById('btn-explore-subhex');
  const rad       = document.getElementById('hc-radiation');

  if (n === 0){
    hcCoords.textContent = '—';
    hcSource.textContent = '—';
    hcRegion.textContent = '—';
    sel.disabled = true;
    sel.value = '';
    rad.disabled = true; rad.checked = false; rad.indeterminate = false;
    enc.textContent = '— click a hex —';
    btnDay.disabled = true;
    btnWatch.disabled = true;
    btnExplore.disabled = true;
    return;
  }

  // Gather terrains + sources across the selection
  const terrains = new Set();
  const sources  = new Set();
  let radCount = 0;
  selectedHexes.forEach(h => {
    const c = +h.dataset.col, r = +h.dataset.row;
    terrains.add(getTerrain(c, r));
    sources.add(terrainSource(c, r));
    if (getHazard(c, r) === 'radiation') radCount++;
  });

  if (n === 1){
    const h = [...selectedHexes][0];
    hcCoords.textContent = h.dataset.col + ', ' + h.dataset.row;
    sel.value = h.dataset.terrain;
    hcSource.textContent = [...sources][0];
    enc.textContent = h.dataset.terrain;
    btnDay.disabled = false;
    btnWatch.disabled = false;
    btnExplore.disabled = false;
    btnExplore.dataset.col = h.dataset.col;
    btnExplore.dataset.row = h.dataset.row;
  } else {
    hcCoords.textContent = n + ' hexes';
    sel.value = terrains.size === 1 ? [...terrains][0] : '';
    hcSource.textContent = sources.size === 1 ? [...sources][0] : 'mixed';
    enc.textContent = terrains.size === 1 ? [...terrains][0] : '(mixed — pick one)';
    // Encounter rolls require a single terrain; disable when the selection
    // has multiple distinct terrains
    const single = terrains.size === 1;
    btnDay.disabled = !single;
    btnWatch.disabled = !single;
    btnExplore.disabled = true;
  }
  sel.disabled = false;
  rad.disabled = false;
  rad.checked = radCount === n;
  rad.indeterminate = radCount > 0 && radCount < n;
  hcRegion.textContent = '—';
}

document.getElementById('hc-terrain-edit').addEventListener('change', e => {
  if (selectedHexes.size === 0) return;
  const terrain = e.target.value || 'unknown';
  selectedHexes.forEach(h => {
    const col = +h.dataset.col, row = +h.dataset.row;
    setTerrainOverride(col, row, terrain);
    h.style.fill = TERRAIN_COLOR[terrain] || TERRAIN_COLOR.unknown;
    h.dataset.terrain = terrain;
  });
  refreshSelectionHud();
});

document.getElementById('hc-radiation').addEventListener('change', e => {
  if (selectedHexes.size === 0) return;
  const on = e.target.checked;
  selectedHexes.forEach(h => setHazard(+h.dataset.col, +h.dataset.row, on));
  renderHazards();
  refreshSelectionHud();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearSelection();
});

// ─── Export authored data ────────────────────────────────────────────────────
// Read-only snapshot of every localStorage authoring store into a committed JS
// file (window.GW_AUTHORED). Never mutates localStorage. This is the durable,
// version-controllable home for hand-edits; localStorage stays the working layer.
const AUTHORED_KEYS = ['gw-terrain-overrides', 'gw-hazard-overrides', 'gw-subhex-overrides', 'gw-annotations'];
function exportAuthoredData(){
  const committed = (window.GW_AUTHORED && window.GW_AUTHORED.stores) || {};
  const stores = {};
  for (const k of AUTHORED_KEYS){
    let working = null; try { working = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e){ working = null; }
    if (k === 'gw-annotations'){
      // annotations aren't a keyed map; the working store is the live full set
      stores[k] = working || committed[k] || {};
    } else {
      // fold working edits over the committed map so re-baking never drops baked cells
      stores[k] = Object.assign({}, committed[k] || {}, working || {});
    }
  }
  const count = o => (o && typeof o === 'object') ? (Array.isArray(o) ? o.length : Object.keys(o).length) : 0;
  const meta = {
    parentTerrain: count(stores['gw-terrain-overrides']),
    parentRadiation: count(stores['gw-hazard-overrides']),
    subhexCells: count(stores['gw-subhex-overrides']),
  };
  const at = new Date().toISOString();
  const body =
    '// gw-authored.js — committed map authoring, baked from localStorage.\n' +
    '// Generated ' + at + '. Load in <head> before the app scripts; it is the\n' +
    '// durable base layer beneath your localStorage working edits.\n' +
    "'use strict';\n" +
    'window.GW_AUTHORED = ' + JSON.stringify({ version: 1, bakedAt: at, stores }) + ';\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/javascript' }));
  a.download = 'gw-authored.js';
  document.body.appendChild(a); a.click(); a.remove();
  return meta;
}
window.exportAuthoredData = exportAuthoredData;
document.getElementById('btn-export-authored').addEventListener('click', () => {
  const m = exportAuthoredData();
  const el = document.getElementById('export-status');
  el.textContent = `Saved gw-authored.js · ${m.parentTerrain} parent · ${m.parentRadiation} rad · ${m.subhexCells} subhex cells`;
});

// ─── Encounter rolls ─────────────────────────────────────────────────────────
function d(n){ return Math.floor(Math.random() * n) + 1; }

function rollEncounter(terrainKey, hazard, feature){
  const D = window.GWEncounterData;
  if (!D) return { error: 'gw-encounter-data.js not loaded' };
  // RAW priority: feature (ruin/spaceport) → radiation hazard → terrain.
  let mapped;
  if (feature && D.FEATURE_TO_TABLE[feature])      mapped = D.FEATURE_TO_TABLE[feature];
  else if (hazard === 'radiation')                 mapped = 'radioactive';
  else                                             mapped = TERRAIN_TO_ENCOUNTER_KEY[terrainKey] || terrainKey;
  const tableKey = D.TERRAIN_TO_TABLE[mapped] || 'clear';
  const table = D.ENCOUNTER_TABLES[tableKey];
  const roll = d(D.TABLE_DIE_SIZE);
  const row = table.find(r => roll >= r.min && roll <= r.max);
  return { tableKey, roll, row };
}

function rollWithCheck(scaleLabel){
  if (selectedHexes.size === 0){
    const el = document.getElementById('enc-result');
    el.style.display = 'block';
    el.innerHTML = '<span class="nope">Click a hex first.</span>';
    return;
  }
  // Use the first selected hex's terrain (button is disabled for mixed multi-select)
  const h0 = [...selectedHexes][0];
  const t = h0.dataset.terrain;
  const hz = getHazard(+h0.dataset.col, +h0.dataset.row);
  const tLabel = hz === 'radiation' ? `${t} (irradiated)` : t;
  const check = d(6);
  const el = document.getElementById('enc-result');
  el.style.display = 'block';

  if (check !== 6){
    el.innerHTML =
      `<div class="meta">${scaleLabel} check (1d6) on <em>${tLabel}</em></div>` +
      `<div>Rolled <strong>${check}</strong> — no encounter.</div>`;
    return;
  }

  const result = rollEncounter(t, hz);
  if (result.error){
    el.innerHTML = `<span class="nope">${result.error}</span>`;
    return;
  }

  const r = result.row;
  let html =
    `<div class="meta">${scaleLabel} check (1d6) → 6 ✶  Resolve on <em>${result.tableKey}</em> (1d20 → ${result.roll})</div>`;
  let exportable = null;
  if (r.creature === 'No Encounter'){
    html += `<div class="nope">No encounter (high roll on short table)</div>`;
  } else {
    html += `<div class="creature">${r.creature}</div>`;
    if (r.number) html += `<div>Number appearing: ${r.number}</div>`;
    if (r.note)   html += `<div class="meta" style="font-style:italic;">${r.note}</div>`;
    if (window.GWBestiary && window.GWBestiary[r.creature]) exportable = r.creature;
  }
  el.innerHTML = html;
  if (exportable) attachExport(el, exportable);
}

// Append MP Builder export controls under a rolled creature (-> Roll20 via
// `!mp import`). Multi-form creatures get a form picker.
function attachExport(container, creatureName){
  if (!window.GWMPExport) return;
  const e = window.GWBestiary[creatureName];
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:8px; padding-top:6px; border-top:1px dashed var(--panel-border);';
  let formSel = null;
  if (e.forms && e.forms.length > 1){
    formSel = document.createElement('select');
    formSel.style.cssText = 'width:100%; margin-bottom:5px; background:#0d0d1a; color:#eaeaea; border:1px solid var(--panel-border); font-size:11px; padding:2px;';
    e.forms.forEach((f, i) => { const o = document.createElement('option'); o.value = i; o.textContent = f.form || ('Form ' + (i+1)); formSel.appendChild(o); });
    box.appendChild(formSel);
  }
  const opts = () => ({ formIndex: formSel ? +formSel.value : 0 });
  const row = document.createElement('div'); row.style.cssText = 'display:flex; gap:5px;';
  const mk = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.style.cssText = 'flex:1; font-size:11px; padding:4px 5px; cursor:pointer; background:var(--panel-bg,#1a1a2e); color:var(--gamma-orange-light,#ffaa66); border:1px solid var(--panel-border,#5a3a0a); border-radius:2px;'; b.onclick = fn; return b; };
  const copyBtn = mk('⧉ Copy MP JSON', () => { window.GWMPExport.copy(creatureName, opts()).then(() => { copyBtn.textContent = '✓ Copied'; setTimeout(() => copyBtn.textContent = '⧉ Copy MP JSON', 1500); }); });
  const dlBtn = mk('⤓ Download', () => window.GWMPExport.download(creatureName, opts()));
  row.append(copyBtn, dlBtn); box.appendChild(row);
  const hint = document.createElement('div');
  hint.style.cssText = 'margin-top:5px; font-size:10px; color:#aaa899;';
  const setHint = () => { hint.innerHTML = 'Paste into a Roll20 handout, then <code>!mp import --name ' + window.GWMPExport.handoutName(creatureName, opts()) + '</code>'; };
  setHint(); if (formSel) formSel.onchange = setHint;
  box.appendChild(hint);
  container.appendChild(box);
}

// Shared so the subhex viewer can roll encounters + export with the same code.
window.GWEncounter = { roll: rollEncounter, attachExport };

document.getElementById('btn-roll-day').onclick   = () => rollWithCheck('Day');

};
