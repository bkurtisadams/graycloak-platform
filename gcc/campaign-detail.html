function wireSessionModalEvents(camp,isTimeline){
  // Derive in-game date from the real session date via the campaign's corrupted
  // calendar (camp.gameCalendar: {yearOffset, months[12], weekdays[7]?, includeWeekday?}).
  // Output stays plain text in sm-gamedate and remains fully editable.
  document.getElementById('sm-derive-gamedate')?.addEventListener('click',()=>{
    const cal=getCamp()?.gameCalendar;
    if(!cal||!Array.isArray(cal.months)||cal.months.length!==12)return;
    const iso=document.getElementById('sm-date')?.value;
    const d=iso?parseLocalDate(iso):new Date();
    if(isNaN(d))return;
    const wd=(cal.includeWeekday&&Array.isArray(cal.weekdays)&&cal.weekdays.length===7)?cal.weekdays[d.getDay()]+', ':'';
    const gd=document.getElementById('sm-gamedate');
    if(gd)gd.value=wd+cal.months[d.getMonth()]+' '+d.getDate()+', '+(d.getFullYear()+(parseInt(cal.yearOffset)||0));
  });
  document.getElementById('sm-img-upload')?.addEventListener('click',()=>document.getElementById('sm-img-file').click());
  document.getElementById('sm-img-file')?.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{sesImageData=ev.target.result;refreshModalBody(camp,isTimeline)};reader.readAsDataURL(file)});
  document.getElementById('sm-img-paste')?.addEventListener('click',async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const imgType=item.types.find(t=>t.startsWith('image/'));if(imgType){const blob=await item.getType(imgType);const reader=new FileReader();reader.onload=ev=>{sesImageData=ev.target.result;refreshModalBody(camp,isTimeline)};reader.readAsDataURL(blob);return}}}catch(e){console.warn('Clipboard paste failed:',e)}});
  document.getElementById('sm-img-clear')?.addEventListener('click',()=>{sesImageData='';refreshModalBody(camp,isTimeline)});
  if(!isTimeline){document.getElementById('sm-add-section')?.addEventListener('click',()=>{captureSessionSections();sesSections.push({title:'',text:'',images:[],layout:'text-first',columns:'auto',fit:'contain',textWidth:'normal'});refreshModalBody(camp,isTimeline)});
    document.querySelectorAll('[data-sec-remove]').forEach(btn=>{btn.addEventListener('click',()=>{captureSessionSections();sesSections.splice(parseInt(btn.dataset.secRemove),1);refreshModalBody(camp,isTimeline)})});
    // Multi-image: add images to section
    document.querySelectorAll('[data-sec-img-add]').forEach(btn=>{btn.addEventListener('click',()=>{const fi=document.querySelector(`[data-sec-img-file="${btn.dataset.secImgAdd}"]`);if(fi)fi.click()})});
    document.querySelectorAll('[data-sec-img-file]').forEach(fi=>{fi.addEventListener('change',e=>{const files=Array.from(e.target.files);if(!files.length)return;const idx=parseInt(fi.dataset.secImgFile);captureSessionSections();let loaded=0;files.forEach(file=>{const reader=new FileReader();reader.onload=ev=>{if(sesSections[idx]){if(!sesSections[idx].images)sesSections[idx].images=[];sesSections[idx].images.push({src:ev.target.result,size:'md',pos:'right',caption:''})}loaded++;if(loaded===files.length)refreshModalBody(camp,isTimeline)};reader.readAsDataURL(file)})})});
    // Multi-image: remove individual image
    document.querySelectorAll('[data-sec-img-rm]').forEach(btn=>{btn.addEventListener('click',()=>{const[si,ii]=btn.dataset.secImgRm.split('-').map(Number);captureSessionSections();if(sesSections[si]&&sesSections[si].images)sesSections[si].images.splice(ii,1);refreshModalBody(camp,isTimeline)})});
    // Multi-image: cycle size
    document.querySelectorAll('[data-sec-img-size]').forEach(btn=>{btn.addEventListener('click',()=>{const[si,ii]=btn.dataset.secImgSize.split('-').map(Number);captureSessionSections();if(sesSections[si]&&sesSections[si].images&&sesSections[si].images[ii]){const SIZES=['sm','md','lg','full'];const cur=sesSections[si].images[ii].size||'md';sesSections[si].images[ii].size=SIZES[(SIZES.indexOf(cur)+1)%SIZES.length]}refreshModalBody(camp,isTimeline)})});
    // Multi-image: cycle position
    document.querySelectorAll('[data-sec-img-pos]').forEach(btn=>{btn.addEventListener('click',()=>{const[si,ii]=btn.dataset.secImgPos.split('-').map(Number);captureSessionSections();if(sesSections[si]&&sesSections[si].images&&sesSections[si].images[ii]){const POSITIONS=['right','left','center','inline'];const cur=sesSections[si].images[ii].pos||'right';sesSections[si].images[ii].pos=POSITIONS[(POSITIONS.indexOf(cur)+1)%POSITIONS.length]}refreshModalBody(camp,isTimeline)})});
  }
  document.querySelectorAll('[data-roster-id]').forEach(cb=>{cb.addEventListener('change',()=>{const id=cb.dataset.rosterId;if(cb.checked){if(!sesRoster.includes(id))sesRoster.push(id)}else{sesRoster=sesRoster.filter(r=>r!==id)}cb.closest('.gcc-dlg-char-check').classList.toggle('checked',cb.checked)})});
  document.querySelectorAll('[data-tag-remove]').forEach(btn=>{btn.addEventListener('click',()=>{sesTags.splice(parseInt(btn.dataset.tagRemove),1);refreshModalBody(camp,isTimeline)})});
  const tagInput=document.getElementById('sm-tag-input');
  if(tagInput){tagInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&tagInput.value.trim()){e.preventDefault();const name=tagInput.value.trim();const camp=getCamp();const loreMatch=(camp?.lore||[]).find(l=>l.name.toLowerCase()===name.toLowerCase());sesTags.push({name,type:loreMatch?loreMatch.type:'other'});tagInput.value='';refreshModalBody(camp,isTimeline);document.getElementById('sm-tag-input')?.focus()}});
    document.getElementById('sm-tags-area')?.addEventListener('click',e=>{if(e.target===e.currentTarget)tagInput.focus()})}
}

// Resize image data URL to fit localStorage safely (max ~800KB)
function compressImageData(dataUrl,maxKB,cb){
  if(!dataUrl||dataUrl.length<maxKB*1024){cb(dataUrl);return}
  const img=new Image();img.onload=()=>{
    const canvas=document.createElement('canvas');let w=img.width,h=img.height;
    const maxDim=1600;if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r)}
    canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
    // Detect alpha: sample corners + center edge pixels
    const hasAlpha=(()=>{try{const spots=[[0,0],[w-1,0],[0,h-1],[w-1,h-1],[Math.floor(w/2),0],[0,Math.floor(h/2)]];for(const[x,y]of spots){if(ctx.getImageData(x,y,1,1).data[3]<250)return true}return false}catch(e){return false}})();
    if(hasAlpha){
      let result=canvas.toDataURL('image/png');
      console.log('[GCC] Image compressed (PNG, alpha preserved):',Math.round(dataUrl.length/1024)+'KB →',Math.round(result.length/1024)+'KB');
      cb(result);
    }else{
      let quality=0.85,result=canvas.toDataURL('image/jpeg',quality);
      while(result.length>maxKB*1024&&quality>0.4){quality-=0.05;result=canvas.toDataURL('image/jpeg',quality)}
      console.log('[GCC] Image compressed (JPEG):',Math.round(dataUrl.length/1024)+'KB →',Math.round(result.length/1024)+'KB','q='+quality.toFixed(2));
      cb(result);
    }
  };img.onerror=()=>cb(dataUrl);img.src=dataUrl;
}

document.getElementById('sm-save').addEventListener('click',async()=>{
  const camp=getCamp();if(!camp)return;const sessions=camp.sessions||[];captureSessionSections();
  const rawImage=sesImageData||'';

  // Store cover image in IndexedDB — never let an image-store failure abort the save
  let imageKey='';
  if(rawImage){
    try{
      if(_sesImageOrigKey&&!GCCImages.isDataUrl(rawImage)){
        // Image wasn't changed (still the resolved data URL from the original key)
        imageKey=_sesImageOrigKey;
      }else if(_sesImageOrigKey){
        // Image was replaced — update existing key, compress first
        const compressed=await new Promise(resolve=>compressImageData(rawImage,800,resolve));
        await GCCImages.put(_sesImageOrigKey,compressed);
        imageKey=_sesImageOrigKey;
        console.log('[GCC] Updated cover image:',imageKey,Math.round(compressed.length/1024)+'KB');
      }else{
        // New image — store with new key
        const compressed=await new Promise(resolve=>compressImageData(rawImage,800,resolve));
        imageKey=await GCCImages.store(compressed,'img_ses');
        console.log('[GCC] Stored new cover image:',imageKey,Math.round(compressed.length/1024)+'KB');
      }
    }catch(err){
      console.warn('[GCC] Cover image storage failed — saving session without image change:',err);
      imageKey=_sesImageOrigKey||''; // keep existing image on edit; drop on new
    }
  }else if(sesImageData===null&&_sesImageOrigKey){
    // Cover data could not be loaded (transient IDB miss), but a key exists.
    // Preserve the reference rather than wiping it. Explicit removal via the
    // Remove button sets sesImageData='' (empty string, not null), so that path
    // still clears the cover as intended.
    imageKey=_sesImageOrigKey;
  }

  // Store section images in IndexedDB — tolerate failures per image
  for(const sec of sesSections){
    for(const img of(sec.images||[])){
      try{
        if(img.src&&GCCImages.isDataUrl(img.src)){
          if(img._origKey){
            // Image was replaced — update existing key
            const compressed=await new Promise(resolve=>compressImageData(img.src,400,resolve));
            await GCCImages.put(img._origKey,compressed);
            img.src=img._origKey;
            console.log('[GCC] Updated section image:',img.src,Math.round(compressed.length/1024)+'KB');
          }else{
            // New image
            const compressed=await new Promise(resolve=>compressImageData(img.src,400,resolve));
            img.src=await GCCImages.store(compressed,'img_sec');
            console.log('[GCC] Stored new section image:',img.src,Math.round(compressed.length/1024)+'KB');
          }
        }else if(img._origKey&&!GCCImages.isDataUrl(img.src)){
          // Unchanged — restore original key
          img.src=img._origKey;
        }
      }catch(err){
        console.warn('[GCC] Section image storage failed:',err);
        img.src=img._origKey||''; // keep existing key on edit; drop unstorable new image
      }
      delete img._origKey;
    }
  }
  // Drop any image that couldn't be persisted, so raw data URLs never bloat localStorage
  for(const sec of sesSections){if(sec.images)sec.images=sec.images.filter(img=>img.src&&!GCCImages.isDataUrl(img.src))}

  const prevEntry=(sesEditIdx>=0&&sessions[sesEditIdx])?sessions[sesEditIdx]:null;
  const entry={_id:prevEntry&&prevEntry._id?prevEntry._id:GCC.genId('ses'),
    _created:prevEntry&&prevEntry._created?prevEntry._created:new Date().toISOString(),
    date:document.getElementById('sm-date').value||'',gameDate:document.getElementById('sm-gamedate').value.trim()||'',
    title:document.getElementById('sm-title').value.trim()||'',text:document.getElementById('sm-text').value.trim()||'',
    sections:sesSections.filter(s=>s.title||s.text||(s.images&&s.images.length)),image:imageKey,tags:sesTags,
    roster:sesRoster.length?sesRoster:[],
    xp:parseInt(document.getElementById('sm-xp').value)||0,visible:document.getElementById('sm-visible').checked,
    type:sesModal.dataset.entryType||'session',_updated:new Date().toISOString()};
  if(sesEditIdx>=0&&sessions[sesEditIdx]){entry.type=sessions[sesEditIdx].type}
  if(sesEditIdx>=0&&sesEditIdx<sessions.length){sessions[sesEditIdx]=entry}else{
    const posEl=document.getElementById('sm-position');
    const insertAt=posEl?parseInt(posEl.value):0;
    sessions.splice(insertAt,0,entry);
  }
  console.log('[GCC] Saving session, entries:',sessions.length);
  GCC.updateCampaign(campId,{sessions,session:countRealSessions(sessions)});closeSessionModal();render();
});

// GM-only. Exports the full wiki (including gmNotes and gmOnly) in the same
// shape the importer reads, so it round-trips for backup or bulk editing.
// Images are stored separately as IDB keys and are not portable, so they're omitted.
function exportLore(){
  const camp=getCamp();if(!camp)return;
  const lore=camp.lore||[];
  if(!lore.length){GCCDialog.alert('Nothing to export','This campaign has no wiki entries yet.');return}
  const out=lore.map(l=>{
    const e={type:l.type||'other',name:l.name||'Unnamed'};
    if(l.subtype)e.subtype=l.subtype;
    if(l.desc)e.desc=l.desc;
    if(l.gmNotes)e.gmNotes=l.gmNotes;
    if(l.gmOnly)e.gmOnly=true;
    return e;
  });
  const json=JSON.stringify(out,null,2);
  const slug=(camp.name||'campaign').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'campaign';
  const date=new Date().toISOString().slice(0,10);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`${slug}-wiki-${date}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ── HTML Journal Parser ──
function parseHtmlJournal(html){
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');
  const entries=doc.querySelectorAll('.j-entry');
  if(!entries.length)return[];
  const results=[];
  entries.forEach(entry=>{
    const heading=entry.querySelector('.j-heading')?.textContent?.trim()||'';
    // Parse heading: "Session #N — Title" or "Timeline — Title"
    let title='';const hm=heading.match(/(?:Session|Issue|Episode)\s*#?\d+\s*(?:—|–|-)\s*(.+)/i);
    if(hm)title=hm[1].trim();
    else{const tm=heading.match(/Timeline\s*(?:—|–|-)\s*(.+)/i);title=tm?tm[1].trim():heading}
    const isTimeline=/^Timeline/i.test(heading);
    // Dates
    const gameDateEl=entry.querySelector('.j-date-game');
    let gameDate='';if(gameDateEl){gameDate=gameDateEl.textContent.replace(/^IN-GAME:\s*/i,'').trim()}
    const playedEl=entry.querySelector('.j-date-played');
    let date='';if(playedEl){const raw=playedEl.textContent.replace(/^PLAYED:\s*/i,'').trim();try{const d=new Date(raw);if(!isNaN(d))date=d.toISOString().split('T')[0]}catch(e){}}
    // DM only
    const isDmOnly=entry.classList.contains('j-dm-only');
    // Summary
    const summary=entry.querySelector('.j-summary')?.textContent?.trim()||'';
    // Cover image
    const coverImg=entry.querySelector('.j-cover img');
    const coverSrc=coverImg?coverImg.getAttribute('src'):'';
    // Sections
    const sections=[];
    entry.querySelectorAll('.j-section').forEach(secEl=>{
      const secTitle=secEl.querySelector('.j-sec-title')?.textContent?.trim()||'';
      const secText=secEl.querySelector('.j-sec-text')?.textContent?.trim()||'';
      const images=[];
      secEl.querySelectorAll('.j-img-wrap').forEach(wrap=>{
        const img=wrap.querySelector('.j-img');if(!img)return;
        const src=img.getAttribute('src')||'';if(!src)return;
        let pos='right',size='md';
        if(wrap.classList.contains('j-pos-left'))pos='left';
        else if(wrap.classList.contains('j-pos-center'))pos='center';
        else if(wrap.classList.contains('j-pos-inline'))pos='inline';
        if(img.classList.contains('j-sz-sm'))size='sm';
        else if(img.classList.contains('j-sz-lg'))size='lg';
        else if(img.classList.contains('j-sz-full'))size='full';
        const caption=wrap.querySelector('.j-caption')?.textContent?.trim()||'';
        images.push({src,size,pos,caption});
      });
      sections.push({title:secTitle,text:secText,images});
    });
    // Tags
    const tags=[];
    entry.querySelectorAll('.j-tag').forEach(tagEl=>{tags.push({name:tagEl.textContent.trim(),type:'other'})});
    // XP
    let xp=0;const xpEl=entry.querySelector('.j-xp');
    if(xpEl){const xpM=xpEl.textContent.match(/\+?([\d,]+)/);if(xpM)xp=parseInt(xpM[1].replace(/,/g,''))||0}
    results.push({title,date,gameDate,text:summary,image:coverSrc,sections,tags,xp,visible:!isDmOnly,type:isTimeline?'timeline':'session'});
  });
  return results;
}

async function importHtmlSessions(parsed){
  const camp=getCamp();if(!camp)return 0;
  const sessions=camp.sessions||[];
  const existingTitles=new Set(sessions.map(s=>normDedupeText(s.title)));
  const skipDupes=document.getElementById('sim-skip-dupes').checked;
  let added=0,skipped=0;
  // Journal is oldest-first; sessions array is newest-first, so reverse
  const reversed=[...parsed].reverse();
  for(const ep of reversed){
    if(skipDupes&&existingTitles.has(normDedupeText(ep.title))){skipped++;continue}
    // Store cover image in IDB if it's a data URL
    let imageKey='';
    if(ep.image){
      if(GCCImages.isDataUrl(ep.image)){
        const compressed=await new Promise(r=>compressImageData(ep.image,800,r));
        imageKey=await GCCImages.store(compressed,'img_ses');
      }else{imageKey=ep.image}// already a URL
    }
    // Store section images in IDB if data URLs
    for(const sec of ep.sections){
      for(const img of(sec.images||[])){
        if(img.src&&GCCImages.isDataUrl(img.src)){
          const compressed=await new Promise(r=>compressImageData(img.src,400,r));
          img.src=await GCCImages.store(compressed,'img_sec');
        }
      }
    }
    const now=new Date().toISOString();
    const entry={date:ep.date,gameDate:ep.gameDate,title:ep.title,text:ep.text,
      sections:ep.sections,image:imageKey,tags:ep.tags,roster:[],xp:ep.xp,visible:ep.visible,type:ep.type,_created:now,_updated:now};
    entry._id=GCC.sessionStableId(entry);
    sessions.push(entry);
    existingTitles.add(normDedupeText(ep.title));
    added++;
  }
  if(added>0)GCC.updateCampaign(campId,{sessions,session:countRealSessions(sessions)});
  return{added,skipped};
}

function parseEpisodeText(raw){
  const episodes=[];
  const epRe=/Episode\s+(\d+)\s*:\s*(?:["\u201c\u201d\u201e]\s*(.+?)\s*["\u201c\u201d\u201e]|([^(]*?))\s*\(real\s*world\s*date\s*:\s*(.+?)\)/gi;
  const chunks=[];
  let match;
  const matches=[];
  while((match=epRe.exec(raw))!==null)matches.push({idx:match.index,num:parseInt(match[1]),title:(match[2]||match[3]||'').trim(),realDate:(match[4]||'').trim()});
  if(!matches.length)return[];
  for(let i=0;i<matches.length;i++){
    const start=matches[i].idx;
    const end=i+1<matches.length?matches[i+1].idx:raw.length;
    chunks.push({...matches[i],body:raw.substring(start,end)});
  }
  chunks.forEach(ch=>{
    const lines=ch.body.split('\n').map(l=>l.trim()).filter(Boolean);
    const headerLine=lines[0];
    const bodyLines=lines.slice(1);
    let xp=0;
    const endMatch=bodyLines.findLast(l=>/end\s+of\s+episode/i.test(l));
    if(endMatch){const xpM=endMatch.match(/(?:total\s+(?:earned\s+)?xp|total\s+xp\s+(?:earned\s+)?|xp)\s*=\s*([\d,]+)/i);if(xpM)xp=parseInt(xpM[1].replace(/,/g,''))||0}
    const contentLines=bodyLines.filter(l=>!/^end\s+of\s+episode/i.test(l)&&!/^figure\s+\d+/i.test(l));
    const dayRe=/^([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+\d{1,2}(?:\s*(?:–|-|to)\s*(?:[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*\s+)?\d{1,2})?\s*,\s*\d{2,4}\s*CY)\s*(?:–|--|—|-)\s*/;
    const sections=[];
    let summary='';
    let currentDay=null;
    let currentText=[];
    contentLines.forEach(line=>{
      const dm=line.match(dayRe);
      if(dm){
        if(currentDay){sections.push({title:currentDay,text:currentText.join('\n')})}
        else if(currentText.length){summary=currentText.join('\n')}
        currentDay=dm[1];
        currentText=[line.substring(dm[0].length).trim()];
      } else {
        currentText.push(line);
      }
    });
    if(currentDay){sections.push({title:currentDay,text:currentText.join('\n')})}
    else if(currentText.length){summary+=((summary?'\n':'')+currentText.join('\n'))}
    if(!summary&&sections.length){
      summary=sections[0].text.length>200?sections[0].text.substring(0,200)+'...':sections[0].text;
    }
    let gameDate='';
    if(sections.length){
      const first=sections[0].title;
      const last=sections[sections.length-1].title;
      gameDate=first===last?first:first+' to '+last;
    }
    let isoDate='';
    try{const d=new Date(ch.realDate);if(!isNaN(d))isoDate=d.toISOString().split('T')[0]}catch(e){}
    episodes.push({num:ch.num,title:ch.title,date:isoDate,gameDate,summary,sections,xp});
  });
  episodes.sort((a,b)=>a.num-b.num);
  return episodes;
}

// Detect player mode: if user is not the owner, fetch shared data from Firestore
(async function initPage(){
  // Try local render first (works for GM or offline)
  const localCamp=GCC.getCampaign(campId);
  if(localCamp){render()}
  else{document.getElementById('page-content').innerHTML='<div class="not-found"><div class="not-found-title">Loading...</div></div>'}

  // Wait for auth+firestore to be fully ready (Firestore SDK loads async in gcc-sync)
  if(typeof GCCAuth==='undefined'||typeof GCCInvite==='undefined'){return}

  // Wait for sync-ready (fires after auth + Firestore SDK loaded + initial sync)
  // or fall back to just auth if sync never fires (e.g. not signed in)
  const ready=await Promise.race([
    new Promise(r=>{window.addEventListener('gcc-sync-ready',()=>r('sync'),{once:true})}),
    new Promise(r=>{GCCAuth.onAuthChange(u=>{if(!u)r('noauth')})}),
    new Promise(r=>{setTimeout(()=>r('timeout'),8000)})
  ]);

  if(ready==='noauth'||ready==='timeout'){return}
  if(!GCCAuth.getUser()){return}

  const owner=await GCCInvite.isOwner(campId);
  if(!owner){
    // Player mode: fetch shared campaign data from Firestore
    console.log('[GCC] Player mode — fetching shared campaign data');
    const shared=await GCCInvite.getSharedData(campId);
    if(shared){
      _isPlayerMode=true;
      _sharedCamp=Object.assign({id:campId},shared);
      render();
    }
  } else {
    // GM mode: push current data to shared doc so players can see it
    console.log('[GCC] GM mode — pushing shared campaign data');
    render._gmConfirmed=true;
    const camp=GCC.getCampaign(campId);
    if(camp){pushSharedSanitized(campId,camp)}
  }
})();
window.addEventListener('gcc-sync-ready',()=>{render()});
// Keep the signed-in account chip current if auth resolves/changes after first render
if(typeof GCCAuth!=='undefined'&&GCCAuth.onAuthChange){GCCAuth.onAuthChange(()=>{const el=document.getElementById('camp-acct');if(el)el.outerHTML=acctChipHtml()});}

// ═══ TABLE FEED (chat + dice) ═══
// Tray UI, styles, and live Firestore feed are owned by gcc-table-feed.js.
GCCTableFeed.init({ campId, isGM: () => !_isPlayerMode });</script>
