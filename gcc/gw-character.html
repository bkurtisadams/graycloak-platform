<!DOCTYPE html>
<!-- gw-character.html v0.2.30 — Cryptic Alliance eligibility audit vs GW1e RAW: Iron Society restricted to human-mutant stock (Humanoid/Orlen/Gren); Seekers rule added (PSH/Humanoid/Gren — members appear completely human); Zoopremisists exclude humanoid-stock creatures (Orlen/Gren); The Created restricted to Android/Tech Construct (RAW: androids only); Ranks of the Fit reopened to PSH per RAW ("All forms of life may join"), machines excluded; Archivists and Healers close to machines; Review warns when a Zoopremisist member lacks Telepathy. Per-alliance eligible/excluded arrays in gw-cryptic-alliances.js still override these fallbacks. -->
<!-- gw-character.html v0.2.29 — Animal/Plant package panel now also renders on the Offensive/Defensive/Misc/Weakness ability steps; empty package (resumed drafts saved before v0.2.28) shows a prominent 'Roll species package' button that rolls type + abilities + weaknesses; reroll/extra/swap controls hidden until rolled. -->
<!-- gw-character.html v0.2.28 — MP 2.2 Animal/Plant species package for Mutated Animal/Plant: new gw-mp-animal.js data file (12 types, 2d6 tables, BC mods, swap options, species weakness table); type d12 roll/pick (plants locked to Plant/Fungus); PL-scaled species Ability rolls (Normal 1 extrapolated / Low 2 / Standard 3 / High 4) at 10 CP each with duplicate stacking under the Ability cap; extra roll (+10) and fewer roll (-10) controls; one type-Ability swap in place of a random roll; two -5 species Weaknesses (exempt from the -20 limit) with drop-one-to--10 and drop-both-costs-an-Ability rules; BC mods reapply on rollBC and revert on species/type change; species field and story carry the type. -->
<!-- gw-character.html v0.2.27 — Sub-ability rows split only on paren-terminated ' / ' separators (fixes Armor "Partial Coverage / Light" false split); rows longer than 120 chars comma-wrap onto CP-less continuation rows. -->
<!-- gw-character.html v0.2.26 — Sheet rows now carry the full abbreviated MP build (power + modifiers with CP parentheticals); multi-part ' / ' abilities split across rows with CP on the first row only; provenance tag and 160-char truncation removed; abbrBuild reordered (Touch/No Range now fire), unspaced slashes (Armor 3/2/2/2) preserved, new abbreviations (UBO/UOO, Comp, Kin, Rad, dmg, Vap/Perim AE). -->
<!-- gw-character.html v0.2.25 — Weakness funding now pools multiple kept weaknesses into the same non-Core ability until its CP target is funded. -->
<!-- gw-character.html v0.2.24 — MP transfer now exports concise sheet labels, de-dupes exact ability echoes, and moves full GW→MP build text into Story/build notes. -->
<!-- gw-character.html v0.2.23 — Birthplace table is now city/ruin focused; non-city settlement origins moved into Homeland Type. -->
<!-- gw-character.html v0.2.22 — Low Power mutation cap audit support: reads lowPowerGmOnly/capNote flags, marks those rows as GM approval at Normal/Low, excludes them from random rolls, and surfaces review/detail warnings. -->
<!-- gw-character.html v0.2.21 — Improves step header navigation labels, removes duplicate lower nav rows, brightens table header labels, and adds Ability Draft detail panel. -->
<!-- gw-character.html v0.2.20 — Ability Draft weakness controls: weaknesses can be kept/dropped and pinned to specific non-Core funding targets; draft ability table is taller for easier review. -->
<!-- gw-character.html v0.2.19 — Adds a dedicated Ability Draft step where rolled Offensive/Defensive/Misc candidates are designated Core or non-Core; Weakness CP funding for non-Core abilities is shown before Review; Weapons and Review move down one step. -->
<!-- gw-character.html v0.2.18 — MP Core/non-Core accounting: only four rolled abilities receive Core Ability CPs; Weakness CP slots fund optional non-Core abilities one-for-one; unfunded non-Core picks are shown as discarded and omitted from export -->
<!-- gw-character.html v0.2.17 — GM power level selector promoted to the intro/chronicle: Quick Random can now generate Normal/Low/Standard/High NPCs; cap/tally display shows Ability/BC/Damage caps; changing Power Level rerolls BCs and revalidates cap locks without changing mutation data -->
<!-- gw-character.html v0.2.16 — MP 2.3 rulebook weaknesses: new gw-mp-weaknesses.js data file (pick-only section under the GW defect chart, all species incl. creatures and Wastelander PSH); weakness slot changed from 2-count to -20 CP budget (any mix that sums to -20; rolls fill to budget; over-budget picks refused); Animal/Plant-style entries flagged exempt:true don't count toward the -20 limit; weakness pill/chronicle show CP totals -->
<!-- gw-character.html v0.2.15 — CP accounting fixes: all weakness entries forced negative (variable '*' weaknesses get a -10 placeholder tagged for GM adjustment; positive-CP data rows negated); pool table shows computed weakness values; live spent/budget CP pill on ability and weakness steps (red on overspend); Review leads with an overspend warning and reddens the Unspent cell; transfer confirms before exporting an overspent build -->
<!-- gw-character.html v0.2.14 — Creature packages with empty role pools now explain themselves (Android offense = equipment, shown from the bestiary entry); Tech Constructs draw from the physical/mental conversion charts as designed-in systems alongside integral equipment; Ancient age method (2d10+10 apparent + years since the 2322 holocaust, campaign year 2451) for androids, robots, and vault-dweller PSH -->
<!-- gw-character.html v0.2.13 — MP 2.1.16.5 cap enforcement: tierCaps (Ability=CP/5, BC=CP/5+10, Damage=CP/12.5+3); over-cap gear/mutations locked in tables and excluded from random rolls (hard, final CP); base-cost-over-cap and avg-damage-over-cap surfaced as Review warnings (GM may waive); Item Detail shows cap lock; poolTable commando pricing display synced to WH constants -->
<!-- gw-character.html v0.2.12 — Gear step item writeups: detail card under the roll controls shows the last clicked/rolled item's MP build (damage, hit, range, charges); owned gear rendered as pick-row cards with full stats instead of bare chips -->
<!-- gw-character.html v0.2.11 — Gear step shows the full grouped gear table on the left (click rows to add/remove, like Abilities) with roll/clear controls on the right; header nav on every step (Start Over + Back + Next beside the step title) -->
<!-- gw-character.html v0.2.10 — Wastelander PSH skips steps 12-14 (offense/defense/misc): go() redirects past skipped steps in the direction of travel, chronicle shows them as 'skipped', roll-all hidden on the Wastelander weakness step, draft step snapped forward on load -->
<!-- gw-character.html v0.2.9 — PSH overhaul: species package auto-applied (DNA-lock access +5, stat caps -5, Heightened Cool +3 from GW +3 Charisma); Wastelander/Commando path toggle — Commando prices picks from WH.commando (coreCp/maxPerAbility/bonusFromWeaknesses) and auto-adds the training package, Wastelander skips ability rolls; step 16 opens the full artifact list (armor/devices/drugs/grenades) gated by Ancient ID locks -->
<!-- gw-character.html v0.2.6 — Tech Construct rolls 2/2/2/2: offense/defense/misc pools built from artifact groups (weapons/armor/devices), built-in robotic weakness table; Ancient ID locks parsed from ability text gate gear by species everywhere; Friends of Entropy closed to machines -->
<!-- gw-character.html v0.2.5 — species-keyed GW origins: mystical branches dropped (no magic in GW1e), MP roll-twice-pick-either implemented, type-prefixed entries preserve MP originType on export, F.originsBySpecies override hook -->
<!-- gw-character.html v0.2.4 — nav buttons move to top of step column; chronicle steps jump freely in any order with content-based done marks; Ranks of the Fit & The Created closed to PSH -->
<!-- gw-character.html v0.2.3 — faction species eligibility: ineligible Cryptic Alliances greyed/locked, excluded from roll & pick; faction resets to Independent on species switch; data-overridable via alliance.eligible/excluded -->
<!-- gw-character.html v0.2.2 — PSH BC caps: ST<=18, EN/AG/IN/CL<=24 enforced on roll, manual edit, and species switch; step-7 inputs show per-stat max -->
<!-- gw-character.html v0.2.1 — MP transfer: send powerLevel as its id ('low') so MP Builder maps Power Level and base CPs correctly -->
<!-- gw-character.html v0.2.0 — split the single Abilities step into per-role steps: Offensive(12) Defensive(13) Miscellaneous(14) Weaknesses(15); Weapons & Gear(16); Review(17) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW → MP Character Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gcc-header.css?v=c5edf4e5">
<link rel="stylesheet" href="gcc-auth.css?v=03238a9b">
<link rel="stylesheet" href="gcc-dialog.css?v=bd2368c3">
<style>
  :root{
    --wl-page:#e7e3cd; --wl-panel:#faf6ea; --wl-panel-2:#f2ecd6; --wl-band:#43562b; --wl-band-2:#33401f;
    --wl-ink:#2f2c20; --wl-soft:#6f6238; --wl-line:#bcab6e; --wl-line-2:#d2c389; --wl-input:#fffbf0;
    --wl-orange:#c55d1a; --wl-orange-2:#ef7d2a; --wl-green:#3f7a32; --wl-red:#a83232; --wl-blue:#2b5c6b; --wl-amber:#9a7a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Oswald',system-ui,sans-serif;color:var(--wl-ink);background:var(--wl-page);}
  .wl-wrap{max-width:1140px;margin:0 auto;padding:14px;}
  .wl-titlebar{background:var(--wl-band);border:2px solid var(--wl-band-2);border-radius:11px;padding:7px 16px;text-align:center;}
  .wl-title-sub{font-family:'Oswald';font-style:italic;font-weight:600;letter-spacing:2px;color:#eadfb0;font-size:14px;}
  .wl-title{font-family:'Bangers','Impact',sans-serif;letter-spacing:3px;color:var(--wl-orange-2);font-size:42px;line-height:1.05;text-shadow:2px 2px 0 #7a3209;}
  select,input,textarea{font-family:'Oswald';font-size:13px;background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:5px 7px;color:var(--wl-ink);width:100%;}
  .wl-btn{font-family:'Oswald';font-weight:600;border-radius:6px;padding:8px 13px;font-size:13px;cursor:pointer;border:1px solid #00000022;color:#fff;}
  .wl-btn.orange{background:var(--wl-orange);border-color:#8a3d10;color:#fff3e0;}
  .wl-btn.green{background:var(--wl-green);border-color:#27521e;color:#eafce9;}
  .wl-btn.ghost{background:var(--wl-input);border-color:var(--wl-line);color:#4a3f1d;}
  .wl-btn.red{background:var(--wl-red);border-color:#7d2222;color:#ffeaea;}
  .wl-btn:disabled{opacity:.5;cursor:not-allowed}

  /* ── Wizard shell ───────────────────────────────────────────── */
  .gw-stage{margin-top:11px;background:var(--wl-panel);border:2px solid var(--wl-line);border-radius:11px;overflow:hidden;}
  .gw-body{display:flex;align-items:stretch;min-height:520px;}

  /* Chronicle (left) */
  .gw-chronicle{width:232px;flex-shrink:0;background:var(--wl-panel-2);border-right:2px solid var(--wl-line);padding:9px;overflow-y:auto;}
  .gw-chronicle.complete{background:#e6f0db;}
  .gw-chron-title{font-weight:600;color:var(--wl-orange);text-transform:uppercase;font-size:11px;letter-spacing:1px;border-bottom:1px solid var(--wl-orange);padding-bottom:4px;margin-bottom:8px;}
  .gw-chron-title.complete{color:var(--wl-green);border-color:var(--wl-green);}
  .gw-tally{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:9px;}
  .gw-tally .t{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:3px 2px;text-align:center;}
  .gw-tally .t .l{font-size:9px;color:var(--wl-soft);text-transform:uppercase;letter-spacing:.5px}
  .gw-tally .t .v{font-size:14px;font-weight:600}
  .gw-tally .t.hl{background:#fff2cf;border-color:var(--wl-orange)} .gw-tally .t.hl .v{color:var(--wl-orange)}
  .gw-track{background:var(--wl-input);border:2px solid var(--wl-band);border-radius:5px;margin-bottom:9px;overflow:hidden;}
  .gw-track-h{background:var(--wl-band);color:#ffe9ad;padding:4px 8px;font-weight:600;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .gw-track-b{padding:5px 7px;font-size:11px}
  .gw-track-item{display:flex;gap:5px;align-items:flex-start;padding:2px 0;border-bottom:1px dotted #e3d9b8}
  .gw-track-item:last-child{border-bottom:none}
  .gw-track-item.done{color:var(--wl-green)} .gw-track-item.active{color:var(--wl-blue);font-weight:600;background:#eaf2f4;margin:0 -7px;padding:3px 7px}
  .gw-track-item.pending{color:#a99e78}
  .gw-cstep{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:5px 7px;margin-bottom:5px;font-size:11px;cursor:pointer;}
  .gw-cstep.active{border-color:var(--wl-orange);border-width:2px;background:#fff8ef;padding:4px 6px}
  .gw-cstep.completed{background:#edf3e1;border-color:#7e9a55}
  .gw-cstep .h{font-weight:600;color:#3c3825;font-size:11px;margin-bottom:1px}
  .gw-cstep .r{color:#5c5436;font-size:10.5px;line-height:1.3}
  .gw-cstep .r strong{color:var(--wl-orange)}

  /* Main panel */
  .gw-main{flex:1;min-width:0;padding:12px 14px;overflow-y:auto;}
  .gw-step-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--wl-orange);}
  .gw-step-num{background:var(--wl-orange);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .gw-step-title{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#3c3825;}
  .gw-step-desc{color:var(--wl-soft);font-size:12px;margin:0 0 10px;}
  .gw-content{display:flex;gap:12px;align-items:flex-start;}
  .gw-content.vertical{flex-direction:column}
  .gw-table-side{flex:1;min-width:0;}
  .gw-controls{width:172px;flex-shrink:0;background:var(--wl-input);border:1px solid var(--wl-line);border-radius:6px;padding:9px;}
  .gw-ctrlcol{width:172px;flex-shrink:0}
  .gw-ctrlcol .gw-controls{width:100%}
  .gw-controls-title{font-weight:600;text-transform:uppercase;font-size:10px;color:var(--wl-soft);letter-spacing:1px;text-align:center;margin-bottom:7px;}
  .gw-roll-btn{display:block;width:100%;background:var(--wl-orange);color:#fff3e0;border:2px solid #8a3d10;padding:7px;font-size:12px;font-weight:600;cursor:pointer;border-radius:5px;margin-bottom:6px;text-transform:uppercase;}
  .gw-roll-btn:hover{background:var(--wl-orange-2)}
  .gw-roll-btn.sm{font-size:11px;padding:5px;text-transform:none}
  .gw-roll-res{text-align:center;font-size:18px;font-weight:600;color:var(--wl-orange);margin:5px 0;min-height:20px;}
  .gw-or{text-align:center;color:#a99e78;font-style:italic;margin:5px 0;font-size:11px;}
  .gw-pick{width:100%;padding:5px;font-size:12px;}
  .gw-hint{font-size:11px;color:var(--wl-soft);margin-top:8px;line-height:1.4}
  .gw-roll-rest{display:block;width:100%;margin-top:8px;background:var(--wl-input);border:1px dashed var(--wl-orange);color:#8a3d10;border-radius:5px;padding:6px;font-size:11px;font-weight:600;cursor:pointer;}
  .gw-roll-rest:hover{background:#fff2e3}

  /* Rules table (roll-or-pick rows) */
  .gw-rt{width:100%;border-collapse:collapse;font-size:12px;background:var(--wl-input);border:1px solid var(--wl-line);}
  .gw-rt caption{background:var(--wl-band-2);color:#ffd77a;padding:3px 7px;font-weight:600;text-align:left;text-transform:uppercase;letter-spacing:1px;font-size:11px;}
  .gw-rt th{background:var(--wl-band);color:#ffe9ad;padding:3px 6px;text-align:left;font-size:11px;}
  .gw-rt td{padding:3px 6px;border-bottom:1px solid #ece0bc;}
  .gw-rt tbody tr{cursor:pointer}
  .gw-rt tbody tr:hover{background:#ffe8d0}
  .gw-rt tbody tr.sel{background:#ffe6bf;font-weight:600}
  .gw-rt tbody tr.sel td:first-child::before{content:"▶ ";color:var(--wl-orange)}
  .gw-rt tbody tr.inel{cursor:not-allowed;opacity:.45;font-style:italic}
  .gw-rt tbody tr.inel:hover{background:var(--wl-input)}
  .gw-rt .cp{text-align:right;color:var(--wl-soft);width:54px}
  .gw-rt .rng{width:62px;color:var(--wl-soft)}
  .gw-rt th.cp,.gw-rt th.rng{color:#ffd77a}
  .gw-rt tbody tr.focus{background:#fff2cf;outline:2px solid var(--wl-orange);outline-offset:-2px}
  .gw-scroll{max-height:300px;overflow:auto;border:1px solid var(--wl-line);border-radius:5px}
  .gw-scroll.draft-abilities{max-height:500px}
  .gw-scroll.draft-weaknesses{max-height:230px}

  /* Abilities step */
  .gw-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
  .gw-tab{flex:1;text-align:center;border:1px solid var(--wl-line);border-radius:5px;padding:5px;font-size:11px;font-weight:600;cursor:pointer;background:var(--wl-input);}
  .gw-tab.off.active{background:#f3d2c2;border-color:var(--wl-orange);color:#71310d}
  .gw-tab.def.active{background:#cfe0e6;border-color:var(--wl-blue);color:#163a44}
  .gw-tab.mis.active{background:#efe3c0;border-color:var(--wl-amber);color:#5d4710}
  .gw-tab.wk.active{background:#f0d3d3;border-color:var(--wl-red);color:#6e1f1f}
  .gw-picks{display:flex;flex-direction:column;gap:5px;margin-top:7px}
  .gw-pickrow{border:1px solid var(--wl-line);border-radius:5px;background:var(--wl-input);padding:5px 7px;font-size:11px;}
  .gw-pickrow .mp{font-weight:600}.gw-pickrow .ab{color:var(--wl-soft);font-size:10px}
  .gw-chip{display:inline-flex;align-items:center;gap:5px;background:#eef3df;border:1px solid #8aa15a;color:#41541f;border-radius:999px;padding:3px 9px;font-size:11px;margin:0 5px 5px 0}
  .gw-chip .x{cursor:pointer;color:#9f3d14}

  /* Review sheet */
  .gw-sheet .sb{background:var(--wl-band);color:#ffe9ad;font-weight:600;letter-spacing:1px;font-size:12px;padding:4px 10px;border-radius:5px;margin:9px 0 6px;}
  .gw-sheet .sb:first-child{margin-top:0}
  .gw-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12px;}
  .gw-kv .k{color:var(--wl-soft)}
  .gw-cv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center;font-size:11px;}
  .gw-cv .cell{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:4px}
  .gw-cv .cell .v{font-weight:600;font-size:14px}
  .gw-cv .cell.hl{background:#fff2cf;border-color:var(--wl-orange);} .gw-cv .cell.hl .v,.gw-cv .cell.hl .l{color:var(--wl-orange)}
  .gw-abblocks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .gw-abb{border:1px solid #e3d4a8;border-radius:0 5px 5px 0;padding:5px 7px;font-size:11px;background:var(--wl-input)}
  .gw-abb.off{border-left:4px solid var(--wl-orange)} .gw-abb.off .t{color:#9f3d14}
  .gw-abb.def{border-left:4px solid var(--wl-blue)} .gw-abb.def .t{color:#163a44}
  .gw-abb.mis{border-left:4px solid var(--wl-amber)} .gw-abb.mis .t{color:#5d4710}
  .gw-abb.wk{border-left:4px solid var(--wl-red)} .gw-abb.wk .t{color:#a32d2d}
  .gw-abb .t{font-weight:600;margin-bottom:2px}
  textarea.gw-json{font-family:ui-monospace,monospace;font-size:10px;min-height:92px;background:#20241a;color:#e8e2bd;border-color:#4b532c}

  /* Nav */
  .gw-nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:9px;border-top:2px solid var(--wl-line);}
  .gw-main{display:flex;flex-direction:column;align-items:stretch;}
  .gw-main>*{flex-shrink:0}
  .gw-step-head{order:-3}
  .gw-main .gw-nav{order:-2;margin-top:0;margin-bottom:12px;padding-top:0;padding-bottom:9px;border-top:none;border-bottom:2px solid var(--wl-line);}
  .gw-bc{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:5px;align-items:end;}
  .gw-bc .c{text-align:center}.gw-bc .c label{display:block;font-size:11px;color:var(--wl-soft)}
  .gw-bc input{text-align:center;padding:4px 2px}

  /* Intro */
  .gw-intro{text-align:center;padding:26px 18px;}
  .gw-intro h3{color:var(--wl-orange);margin:0 0 6px;font-size:18px;text-transform:uppercase;letter-spacing:1px}
  .gw-intro p{color:var(--wl-soft);margin:6px 0;font-size:13px}
  .gw-intro-id{display:flex;gap:10px;justify-content:center;max-width:480px;margin:14px auto;flex-wrap:wrap}
  .gw-intro-id > div{flex:1;min-width:170px;text-align:left}
  .gw-intro-id label{font-size:11px;color:var(--wl-soft);display:block;margin-bottom:2px}
  .gw-intro-btns{display:flex;justify-content:center;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
  .gw-intro-btns button{padding:10px 18px;font-size:14px}
  .gw-summary{text-align:center;padding:10px;background:#e6f0db;border:1px solid #7e9a55;border-radius:6px;margin-bottom:11px;}
  .gw-summary h3{color:#2c5424;margin:0 0 4px;font-size:16px}
  .gw-summary p{color:var(--wl-soft);margin:0;font-size:12px}
  .gw-summary-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .wl-foot{color:var(--wl-soft);font-size:11px;text-align:center;margin:10px 0 2px}
  @media(max-width:760px){.gw-body{flex-direction:column}.gw-chronicle{width:auto;border-right:none;border-bottom:2px solid var(--wl-line)}.gw-content{flex-direction:column}.gw-controls{width:100%}.gw-ctrlcol{width:100%}}
</style>
</head>

<div id="gcc-bar" class="gcc-bar">
  <div class="gcc-bar-in">

<main class="wl-wrap">
  <div class="wl-titlebar">
    <div class="wl-title-sub">GAMMA WORLD / MIGHTY PROTECTORS</div>

  function cleanSheetText(s){return String(s||'').replace(/[“”]/g,'"').replace(/[’]/g,"'").replace(/\s+/g,' ').trim();}
  function abbrBuild(s){
    return cleanSheetText(s)
      .replace(/Vaporous Area Effect/gi,'Vap AE')
      .replace(/Perimeter Area Effect/gi,'Perim AE')
      .replace(/Area Effect/gi,'AE')
      .replace(/No Range/gi,'NoRng')
      .replace(/Touch Range/gi,'Tch')
      .replace(/Range/gi,'Rng')
      .replace(/Duration/gi,'Dur')
      .replace(/Charges/gi,'Chg')
      .replace(/Charge\b/gi,'Chg')
      .replace(/Power Requirement/gi,'PR')
      .replace(/Usable by Others/gi,'UBO')
      .replace(/Usable on Others/gi,'UOO')
      .replace(/Components:/gi,'Comp:')

      .replace(/Invulnerability/gi,'Invuln.')
      .replace(/Regeneration/gi,'Regen.')
      .replace(/Vulnerability/gi,'Vuln.')
      .replace(/Kinetic/gi,'Kin')

  function shortMpName(a){
    let name=cleanSheetText(a.mp||a.gw||'Ability');

    if(abilitySuite)name=abilitySuite[1];
    name=name
      .replace(/^Mental Ability\s+[A-Z]\)\s*/i,'')
      .replace(/^Physical Ability\s+[A-Z]\)\s*/i,'Physical Ability: ')
      .replace(/\bGeneration\b/gi,'Gen')

  function shortWeaknessName(a){

    const vuln=b.match(/Vulnerability[^;+]*;?\s*\+?([\d.]+)\s+([A-Za-z]+)\s+damage/i);

  function wrapSheetPart(p,max){

      case 'weakness':{const n=draftWeaknesses();return n.length?n.map(a=>'• '+(weaknessKept(a)?'':'⊘ ')+esc(a.mp||a.gw)+' ('+esc(abilityCPLabel(a))+')').join('<br>')+`<br><strong>${fmt(weaknessCPCounted())} / ${WK_BUDGET} CP kept</strong>`:'—';}
      case 'draft':{const abs=coreAbilities(),nc=nonCoreAbilities(),funded=nc.filter(a=>assignedNonCoreCP(a)>0).length;return abs.length?`<strong>${coreCount()} / ${Math.min(4,abs.length)}</strong> Core<br>${funded} funded non-Core · ${nc.length-funded} discarded`:'—';}
      case 'weapons':{const g=state.abilities.filter(a=>a.source==='special-weapon');return g.length?g.map(x=>'• '+esc(x.gw)).join('<br>'):'—';}
      case 'review':return state.step===18?'Ready to transfer':'—';

        <div><div style="font-size:11px;color:var(--wl-soft);margin-bottom:2px">Species Abilities (${apRollCount()} rolls at ${state.powerLevel}${state.powerLevel==='Normal'?' — extrapolated, MP table starts at Low':''}, 10 CP each, 2d6)</div>${ablRows}</div>

    const byRole=r=>state.abilities.filter(a=>a.role===r&&!a.weakness);
    const cls={offense:'off',defense:'def',misc:'mis'},lbl={offense:'Offensive',defense:'Defensive',misc:'Misc'};
    const ab=['offense','defense','misc'].map(r=>{const items=byRole(r);return `<div class="gw-abb ${cls[r]}"><div class="t">${lbl[r]}</div>${items.length?items.map(a=>`${a.core?'★ ':isDiscardedNonCore(a)?'⊘ ':''}${esc(a.mp)} <span style="color:var(--wl-soft)">(${esc(abilityCPLabel(a))})</span>`).join('<br>'):'—'}</div>`;}).join('')+(()=>{const w=exportedAbilities().filter(a=>a.weakness);return `<div class="gw-abb wk"><div class="t">Weaknesses</div>${w.length?w.map(a=>`${esc(a.gw)} <span style="color:var(--wl-soft)">(${esc(abilityCPLabel(a))})</span>`).join('<br>'):'—'}</div>`;})();
    const gear=state.abilities.filter(a=>a.source==='special-weapon');
    const gearHtml=gear.length?`<div class="gw-hint" style="margin:6px 0"><strong>Gear (Special Weapons):</strong> ${gear.map(g=>esc(g.gw)).join(', ')}</div>`:'';
    let json='';try{json=JSON.stringify(buildMP(),null,2);}catch(e){json='// '+e.message;}
    const idEdit=`<div style="display:flex;gap:8px;max-width:480px;margin-bottom:8px"><div style="flex:1"><label style="font-size:11px;color:var(--wl-soft)">Name</label><input data-text="name" value="${esc(state.name||'')}"></div><div style="flex:1"><label style="font-size:11px;color:var(--wl-soft)">Player</label><input data-text="player" value="${esc(state.player||'')}"></div></div>`;
    return `<div class="gw-step-head"><div class="gw-step-num">✓</div><div class="gw-step-title">Review</div><div style="margin-left:auto;display:flex;gap:6px;align-items:center"><button class="wl-btn ghost" data-act="startover" style="font-size:11px;padding:4px 10px">↺ Start Over</button><button class="wl-btn ghost" data-act="prev" style="font-size:11px;padding:4px 10px">← Back</button></div></div>`+
      `<div class="gw-summary"><h3>Build Complete</h3><p>Review below, then transfer to the MP Builder.</p></div>`+warnHtml+
      `<div class="gw-summary-actions"><button class="wl-btn green" data-act="transfer">Transfer to MP Builder →</button><button class="wl-btn ghost" data-act="copyjson">Export JSON</button><button class="wl-btn ghost" data-act="startover">Start Over</button><button class="wl-btn red" data-act="discard">Discard</button></div>`+
      idEdit+
      `<div class="gw-sheet"><div class="sb">IDENTITY</div><div class="gw-kv">${idkv}</div>`+
      `<div class="sb">BASIC CHARACTERISTICS</div><div class="gw-cv">${bc}</div>`+
      `<div class="sb">COMBAT VALUES</div><div class="gw-cv">${cv}</div>`+
      `<div class="sb">ABILITIES</div><div class="gw-abblocks">${ab}</div>${gearHtml}`+
      `<div class="sb">MP BUILDER JSON</div><textarea class="gw-json" readonly>${esc(json)}</textarea></div>`;
  }
  const stepRender={1:stepSpecies,2:stepFaction,3:stepSide,4:stepCulture,5:stepHome,6:stepHomeland,7:stepBC,8:stepBio,9:stepBackgrounds,10:stepMotivation,11:stepOrigin,12:()=>stepRole('offense'),13:()=>stepRole('defense'),14:()=>stepRole('misc'),15:()=>stepRole('weakness'),16:stepDraft,17:stepWeapons,18:stepReview};

  function renderIntro(){
    const resume=(state.name||state.species!=='Humanoid (Mutant)'||state.abilities.length)?`<p class="gw-hint" style="text-align:center">A saved draft is loaded — Step-by-Step resumes where you left off.</p>`:'';
    const c=tierCaps();
    const power=`<div class="gw-controls" style="max-width:440px;margin:14px auto 10px;text-align:left"><div class="gw-controls-title" style="text-align:left">GM Power Level / NPC Budget</div>${powerSelect('width:100%;margin-top:4px')}<div class="gw-hint" style="margin:6px 0 0">Default is Low / 100 CP. Pick Normal for lesser NPCs, or Standard/High for bigger wasteland problems. Core ${coreCp()} CP each · BC pool ${tierOf(state.powerLevel).bcPoints} · Caps: Ability ${c.ability} CP · BC ${c.bc} · avg damage ${fmt(c.damage)}.</div></div>`;
    return `<div class="gw-intro" style="width:100%">
      <h3>Wasteland Character Generator</h3>
      <p>Build a Gamma World 1e character and convert it to a Mighty Protectors sheet.</p>
      <div class="gw-intro-id">
        <div><label>Character Name</label><input data-text="name" value="${esc(state.name||'')}" placeholder="Unnamed"></div>
        <div><label>Player</label><input data-text="player" value="${esc(state.player||'')}" placeholder="Player name"></div>
      </div>
      ${power}
      <div class="gw-intro-btns">
        <button class="wl-btn ghost" data-act="start">👣 Step-by-Step</button>
        <button class="wl-btn orange" data-act="quick">🎲 Quick Random</button>
      </div>
      <p class="gw-hint">Quick Random uses the selected Power Level, rolls everything, and jumps to Review.</p>${resume}
    </div>`;
  }

  /* ── render ─────────────────────────────────────────────────── */
  function render(){
    const body=$('#gw-body');
    if(state.step===0){body.innerHTML=renderIntro();return;}
    body.innerHTML=`<div id="gw-chronicle-mount" style="display:flex;flex-shrink:0">${renderChronicle()}</div><div class="gw-main" id="gw-main">${(stepRender[state.step]||stepReview)()}</div>`;
  }
  function renderChronicleOnly(){const m=$('#gw-chronicle-mount');if(m)m.innerHTML=renderChronicle();}

  /* ── events ─────────────────────────────────────────────────── */
  function curKey(){const s=STEPS.find(s=>s.n===state.step);return s?s.key:null;}
  function bindHandlers(){
    const body=$('#gw-body');
    body.addEventListener('click',e=>{
      const goEl=e.target.closest('[data-goto]');if(goEl){go(+goEl.dataset.goto);return;}
      const a=e.target.closest('[data-act]');if(a){onAct(a.dataset.act);return;}
      const sp=e.target.closest('[data-spk]');if(sp){setSpecies(sp.dataset.spk);log('Species: '+state.species);saveDraft();render();return;}
      const mw=e.target.closest('[data-mpwk]');if(mw){const wk=MPWK().find(x=>x.name===mw.dataset.mpwk);if(wk){const ex=state.abilities.find(a=>a.source==='mp-weakness'&&a.base===wk.name);if(ex){state.abilities=state.abilities.filter(a=>a!==ex);log('Removed '+wk.name);}else{const e2=mpwkEntry(wk);if(!e2.exempt&&weaknessCPCounted()+e2.cpNum<WK_BUDGET){log(wk.name+' would exceed the '+WK_BUDGET+' CP weakness limit at character creation (MP 2.1.16.3).');}else{state.abilities.push(e2);log('Picked '+e2.gw+' ('+fmt(e2.cpNum)+' CP)');}}}saveDraft();render();return;}
      const gr=e.target.closest('[data-gearname]');if(gr){const nm=gr.dataset.gearname;gearFocus=nm;const ex=state.abilities.find(a=>a.source==='special-weapon'&&a.gw===nm);if(ex){state.abilities=state.abilities.filter(a=>a!==ex);log('Removed gear: '+nm);}else{const it=flatGear().find(x=>x.name===nm);if(it&&overCapCp(cpn(String(it.cp))||+it.cp)){log(nm+': over the '+tierCaps().ability+' CP Ability Cap at '+state.powerLevel+' — GM may waive (MP 2.1.16.5).');}else{addGear(it);}}saveDraft();render();return;}
      const pp=e.target.closest('[data-pshpath]');if(pp){state.pshPath=pp.dataset.pshpath;state.abilities=state.abilities.filter(a=>a.source==='special-weapon');applyPshPackage();log('PSH path: '+(state.pshPath==='commando'?'Commando':'Wastelander'));saveDraft();render();return;}
      const arr=e.target.closest('[data-aprr]');if(arr){const a=state.abilities.find(x=>x.uid===arr.dataset.aprr);if(a){state.abilities=state.abilities.filter(x=>x!==a);rollApAbility(a.apExtra);normalizeCore();}saveDraft();render();return;}
      const arm=e.target.closest('[data-aprm]');if(arm){const a=state.abilities.find(x=>x.uid===arm.dataset.aprm);if(a){state.abilities=state.abilities.filter(x=>x!==a);log('Removed species Ability '+(a.mp||a.base)+' (fewer roll: -10 CP — MP 2.2).');}saveDraft();render();return;}
      const awr=e.target.closest('[data-apwrr]');if(awr){const a=state.abilities.find(x=>x.uid===awr.dataset.apwrr);if(a){const other=apEntries().filter(x=>x.weakness&&x!==a).map(x=>x.base);state.abilities=state.abilities.filter(x=>x!==a);const nm=rollApWeakness(other);if(nm)state.abilities.push(apWkEntry(nm,a.cpNum));}saveDraft();render();return;}
      const awm=e.target.closest('[data-apwrm]');if(awm){apRemoveWeakness(awm.dataset.apwrm);saveDraft();render();return;}
      const fk=e.target.closest('[data-fck]');if(fk){state.faction=fk.dataset.fck;const al=allianceByName(state.faction);if(al&&al.side)state.side=al.side;saveDraft();render();return;}
      const oc=e.target.closest('[data-oc]');if(oc){const v=(state.originChoices||[])[+oc.dataset.oc];if(v){state.origin=v;log('Origin: '+v);}saveDraft();render();return;}
      const sd=e.target.closest('[data-sdk]');if(sd){state.side=sd.dataset.sdk;saveDraft();render();return;}
      const cl=e.target.closest('[data-clk]');if(cl){state.culture=cl.dataset.clk;saveDraft();render();return;}
      const hm=e.target.closest('[data-hmk]');if(hm){state.home=hm.dataset.hmk;saveDraft();render();return;}
      const hl=e.target.closest('[data-hlk]');if(hl){state.homeland=hl.dataset.hlk;saveDraft();render();return;}
      const bg=e.target.closest('[data-bgk]');if(bg){addBackground(bg.dataset.bgk);saveDraft();render();return;}
      const rmbg=e.target.closest('[data-rmbg]');if(rmbg){state.backgrounds.splice(+rmbg.dataset.rmbg,1);saveDraft();render();return;}
      const bgc=e.target.closest('[data-bgc]');if(bgc){toggleBgChoice(+bgc.dataset.bgc);saveDraft();render();return;}
      const wkKeep=e.target.closest('[data-wkkeep]');if(wkKeep){const w=state.abilities[+wkKeep.dataset.wkkeep];if(w&&w.weakness&&!isFixed(w)){w.keep=w.keep===false;log((w.keep===false?'Dropped weakness: ':'Kept weakness: ')+(w.gw||w.mp));}saveDraft();render();return;}
      const co=e.target.closest('[data-corei]');if(co){toggleCore(+co.dataset.corei);saveDraft();render();return;}
      const dr=e.target.closest('[data-draftuid]');if(dr){draftFocus=dr.dataset.draftuid;render();return;}
      const pr=e.target.closest('[data-pick-row]');if(pr){togglePick(poolTable(state.activeRole)[+pr.dataset.pickRow],state.activeRole);saveDraft();render();return;}
      const rmw=e.target.closest('[data-rmweap]');if(rmw){state.abilities.splice(+rmw.dataset.rmweap,1);saveDraft();render();return;}
      const tab=e.target.closest('[data-role]');if(tab){state.activeRole=tab.dataset.role;render();return;}
    });
    body.addEventListener('change',e=>{
      const pl=e.target.closest('[data-pl]');if(pl){setPowerLevel(pl.value);saveDraft();render();return;}
      const apt=e.target.closest('[data-aptype]');if(apt){setApType(apt.value);apRerollAbilities();saveDraft();render();return;}
      const wkFund=e.target.closest('[data-wkfund]');if(wkFund){const w=state.abilities[+wkFund.dataset.wkfund],v=wkFund.value;if(w&&w.weakness&&!isFixed(w)){w.fundUid=v;if(v&&v!=='__auto'&&v!=='__none'){log((w.gw||w.mp)+' pinned to fund '+((state.abilities.find(a=>a.uid===v)||{}).mp||'non-Core ability'));}else log((w.gw||w.mp)+' funding set to '+(v==='__none'?'none':'auto'));}saveDraft();render();return;}
      const pk=e.target.closest('[data-pick]');if(pk){const key=pk.dataset.pick,v=pk.value;if(key==='species'){setSpecies(v);}else{state[key]=v;if(key==='faction'){const al=allianceByName(v);if(al&&al.side)state.side=al.side;}if(key==='genderIdentity'){state.gender=v;}}saveDraft();render();return;}
      const bc=e.target.closest('[data-bc]');if(bc){const k=bc.dataset.bc,cap=bcCap(k);let v=parseInt(bc.value,10)||0;if(v>cap){v=cap;bc.value=v;}state.bc[k]=v;saveDraft();renderChronicleOnly();const t=$('#gw-main .gw-bc .c:last-child div');if(t)t.textContent=bcTotal();return;}
    });
    body.addEventListener('input',e=>{
      const tx=e.target.closest('[data-text]');if(tx){state[tx.dataset.text]=tx.value;saveDraft();renderChronicleOnly();return;}
      const bio=e.target.closest('[data-bio]');if(bio){state[bio.dataset.bio]=bio.value;saveDraft();renderChronicleOnly();return;}
    });
  }
  function onAct(act){
    switch(act){
      case 'start':go(1);return;
      case 'quick':generateAll();go(18);return;
      case 'prev':go(Math.max(1,state.step-1));return;
      case 'next':go(Math.min(18,state.step+1));return;
      case 'startover':if(confirm('Discard this draft and start over?'))startOver();return;
      case 'discard':if(confirm('Discard this character?'))startOver();return;
      case 'rollrest':rollRemaining(state.step);return;
      case 'transfer':transfer();return;
      case 'copyjson':exportJSON();return;
      case 'auto-core':autoCoreFirstFour();saveDraft();render();return;
      case 'ap-type-roll':{const d=APD();if(d){setApType(d.types[die(11)].name);apRerollAbilities();}saveDraft();render();return;}
      case 'ap-reroll':if(!state.apType||!apEntries().length)rollApPackage();else{apRerollAbilities();rollApWeaknesses();}saveDraft();render();return;
      case 'ap-extra':rollApAbility(true);normalizeCore();saveDraft();render();return;
      case 'ap-swap':apSwap();saveDraft();render();return;
      case 'roll':{const k=curKey();if(rollByKey[k])rollByKey[k]();saveDraft();render();return;}
      case 'roll-weight':rollWeight();saveDraft();render();return;
      case 'roll-age':rollAge();saveDraft();render();return;
      case 'roll-gender':rollGender();saveDraft();render();return;
      case 'roll-gid':rollGenderIdentity();saveDraft();render();return;
      case 'roll-gexp':rollGenderExpression();saveDraft();render();return;
      case 'roll-gsex':rollBiologicalSex();saveDraft();render();return;
      case 'roll-gattr':rollSexualAttraction();saveDraft();render();return;
      case 'roll-all':rollAbilities();saveDraft();render();return;
      case 'roll-cat':rollRole(state.activeRole,2);saveDraft();render();return;
      case 'clear-ab':state.abilities=state.abilities.filter(a=>isFixed(a));log('Cleared abilities.');saveDraft();render();return;
      case 'clear-role':state.abilities=state.abilities.filter(a=>!(a.role===state.activeRole&&!isFixed(a)));log('Cleared '+state.activeRole+' abilities.');saveDraft();render();return;
      case 'rollweapon':{const Lw=flatGear().filter(x=>!overCapCp(cpn(String(x.cp))||+x.cp));const it=Lw[die(Lw.length)-1];if(it)gearFocus=it.name;addGear(it);saveDraft();render();return;}
      case 'clear-gear':state.abilities=state.abilities.filter(a=>a.source!=='special-weapon');log('Cleared gear.');saveDraft();render();return;
    }
  }

  function applyAuthDefault(){if(typeof GCCAuth!=='undefined'&&GCCAuth.onAuthChange)GCCAuth.onAuthChange(u=>{if(u&&!(state.player||'').trim()){state.player=(u.displayName||u.email||'').trim();saveDraft();if(state.step===0||state.step===18)render();}});}
  function ensureCampaign(){try{let camps=JSON.parse(localStorage.getItem((typeof GCC!=='undefined'&&GCC.KEYS&&GCC.KEYS.campaigns)||'gcc-campaigns')||'[]');const DEF='Gamma World 2519';let ex=camps.find(c=>(c.name||'').trim().toLowerCase()===DEF.toLowerCase());if(!ex&&typeof GCC!=='undefined'&&GCC.addCampaign){ex=GCC.addCampaign({name:DEF,system:'mp',genre:'Post-apocalyptic',world:'Gamma World'});}window.__gwCampaign=ex?(ex.id||ex._id||''):'';}catch(e){}}

  function init(){ensureCampaign();loadDraft();applyAuthDefault();bindHandlers();render();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
