<!DOCTYPE html>
<!-- gw-character.html v0.2.2 — PSH BC caps: ST<=18, EN/AG/IN/CL<=24 enforced on roll, manual edit, and species switch; step-7 inputs show per-stat max -->
<!-- gw-character.html v0.2.1 — MP transfer: send powerLevel as its id ('low') so MP Builder maps Power Level and base CPs correctly -->
<!-- gw-character.html v0.2.0 — split the single Abilities step into per-role steps: Offensive(12) Defensive(13) Miscellaneous(14) Weaknesses(15); Weapons & Gear(16); Review(17) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW → MP Character Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gcc-header.css?v=c5edf4e5">
<link rel="stylesheet" href="gcc-auth.css?v=03238a9b">
<link rel="stylesheet" href="gcc-dialog.css?v=bd2368c3">
<style>
  :root{
    --wl-page:#e7e3cd; --wl-panel:#faf6ea; --wl-panel-2:#f2ecd6; --wl-band:#43562b; --wl-band-2:#33401f;
    --wl-ink:#2f2c20; --wl-soft:#6f6238; --wl-line:#bcab6e; --wl-line-2:#d2c389; --wl-input:#fffbf0;
    --wl-orange:#c55d1a; --wl-orange-2:#ef7d2a; --wl-green:#3f7a32; --wl-red:#a83232; --wl-blue:#2b5c6b; --wl-amber:#9a7a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Oswald',system-ui,sans-serif;color:var(--wl-ink);background:var(--wl-page);}
  .wl-wrap{max-width:1140px;margin:0 auto;padding:14px;}
  .wl-titlebar{background:var(--wl-band);border:2px solid var(--wl-band-2);border-radius:11px;padding:7px 16px;text-align:center;}
  .wl-title-sub{font-family:'Oswald';font-style:italic;font-weight:600;letter-spacing:2px;color:#eadfb0;font-size:14px;}
  .wl-title{font-family:'Bangers','Impact',sans-serif;letter-spacing:3px;color:var(--wl-orange-2);font-size:42px;line-height:1.05;text-shadow:2px 2px 0 #7a3209;}
  select,input,textarea{font-family:'Oswald';font-size:13px;background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:5px 7px;color:var(--wl-ink);width:100%;}
  .wl-btn{font-family:'Oswald';font-weight:600;border-radius:6px;padding:8px 13px;font-size:13px;cursor:pointer;border:1px solid #00000022;color:#fff;}
  .wl-btn.orange{background:var(--wl-orange);border-color:#8a3d10;color:#fff3e0;}
  .wl-btn.green{background:var(--wl-green);border-color:#27521e;color:#eafce9;}
  .wl-btn.ghost{background:var(--wl-input);border-color:var(--wl-line);color:#4a3f1d;}
  .wl-btn.red{background:var(--wl-red);border-color:#7d2222;color:#ffeaea;}
  .wl-btn:disabled{opacity:.5;cursor:not-allowed}

  /* ── Wizard shell ───────────────────────────────────────────── */
  .gw-stage{margin-top:11px;background:var(--wl-panel);border:2px solid var(--wl-line);border-radius:11px;overflow:hidden;}
  .gw-body{display:flex;align-items:stretch;min-height:520px;}

  /* Chronicle (left) */
  .gw-chronicle{width:232px;flex-shrink:0;background:var(--wl-panel-2);border-right:2px solid var(--wl-line);padding:9px;overflow-y:auto;}
  .gw-chronicle.complete{background:#e6f0db;}
  .gw-chron-title{font-weight:600;color:var(--wl-orange);text-transform:uppercase;font-size:11px;letter-spacing:1px;border-bottom:1px solid var(--wl-orange);padding-bottom:4px;margin-bottom:8px;}
  .gw-chron-title.complete{color:var(--wl-green);border-color:var(--wl-green);}
  .gw-tally{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:9px;}
  .gw-tally .t{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:3px 2px;text-align:center;}
  .gw-tally .t .l{font-size:9px;color:var(--wl-soft);text-transform:uppercase;letter-spacing:.5px}
  .gw-tally .t .v{font-size:14px;font-weight:600}
  .gw-tally .t.hl{background:#fff2cf;border-color:var(--wl-orange)} .gw-tally .t.hl .v{color:var(--wl-orange)}
  .gw-track{background:var(--wl-input);border:2px solid var(--wl-band);border-radius:5px;margin-bottom:9px;overflow:hidden;}
  .gw-track-h{background:var(--wl-band);color:#ffe9ad;padding:4px 8px;font-weight:600;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
  .gw-track-b{padding:5px 7px;font-size:11px}
  .gw-track-item{display:flex;gap:5px;align-items:flex-start;padding:2px 0;border-bottom:1px dotted #e3d9b8}
  .gw-track-item:last-child{border-bottom:none}
  .gw-track-item.done{color:var(--wl-green)} .gw-track-item.active{color:var(--wl-blue);font-weight:600;background:#eaf2f4;margin:0 -7px;padding:3px 7px}
  .gw-track-item.pending{color:#a99e78}
  .gw-cstep{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:5px 7px;margin-bottom:5px;font-size:11px;cursor:pointer;}
  .gw-cstep.active{border-color:var(--wl-orange);border-width:2px;background:#fff8ef;padding:4px 6px}
  .gw-cstep.completed{background:#edf3e1;border-color:#7e9a55}
  .gw-cstep .h{font-weight:600;color:#3c3825;font-size:11px;margin-bottom:1px}
  .gw-cstep .r{color:#5c5436;font-size:10.5px;line-height:1.3}
  .gw-cstep .r strong{color:var(--wl-orange)}

  /* Main panel */
  .gw-main{flex:1;min-width:0;padding:12px 14px;overflow-y:auto;}
  .gw-step-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;padding-bottom:5px;border-bottom:2px solid var(--wl-orange);}
  .gw-step-num{background:var(--wl-orange);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .gw-step-title{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#3c3825;}
  .gw-step-desc{color:var(--wl-soft);font-size:12px;margin:0 0 10px;}
  .gw-content{display:flex;gap:12px;align-items:flex-start;}
  .gw-content.vertical{flex-direction:column}
  .gw-table-side{flex:1;min-width:0;}
  .gw-controls{width:172px;flex-shrink:0;background:var(--wl-input);border:1px solid var(--wl-line);border-radius:6px;padding:9px;}
  .gw-controls-title{font-weight:600;text-transform:uppercase;font-size:10px;color:var(--wl-soft);letter-spacing:1px;text-align:center;margin-bottom:7px;}
  .gw-roll-btn{display:block;width:100%;background:var(--wl-orange);color:#fff3e0;border:2px solid #8a3d10;padding:7px;font-size:12px;font-weight:600;cursor:pointer;border-radius:5px;margin-bottom:6px;text-transform:uppercase;}
  .gw-roll-btn:hover{background:var(--wl-orange-2)}
  .gw-roll-btn.sm{font-size:11px;padding:5px;text-transform:none}
  .gw-roll-res{text-align:center;font-size:18px;font-weight:600;color:var(--wl-orange);margin:5px 0;min-height:20px;}
  .gw-or{text-align:center;color:#a99e78;font-style:italic;margin:5px 0;font-size:11px;}
  .gw-pick{width:100%;padding:5px;font-size:12px;}
  .gw-hint{font-size:11px;color:var(--wl-soft);margin-top:8px;line-height:1.4}
  .gw-roll-rest{display:block;width:100%;margin-top:8px;background:var(--wl-input);border:1px dashed var(--wl-orange);color:#8a3d10;border-radius:5px;padding:6px;font-size:11px;font-weight:600;cursor:pointer;}
  .gw-roll-rest:hover{background:#fff2e3}

  /* Rules table (roll-or-pick rows) */
  .gw-rt{width:100%;border-collapse:collapse;font-size:12px;background:var(--wl-input);border:1px solid var(--wl-line);}
  .gw-rt caption{background:var(--wl-band-2);color:#ffd77a;padding:3px 7px;font-weight:600;text-align:left;text-transform:uppercase;letter-spacing:1px;font-size:11px;}
  .gw-rt th{background:var(--wl-band);color:#ffe9ad;padding:3px 6px;text-align:left;font-size:11px;}
  .gw-rt td{padding:3px 6px;border-bottom:1px solid #ece0bc;}
  .gw-rt tbody tr{cursor:pointer}
  .gw-rt tbody tr:hover{background:#ffe8d0}
  .gw-rt tbody tr.sel{background:#ffe6bf;font-weight:600}
  .gw-rt tbody tr.sel td:first-child::before{content:"▶ ";color:var(--wl-orange)}
  .gw-rt .cp{text-align:right;color:var(--wl-soft);width:54px}
  .gw-rt .rng{width:62px;color:var(--wl-soft)}
  .gw-scroll{max-height:300px;overflow:auto;border:1px solid var(--wl-line);border-radius:5px}

  /* Abilities step */
  .gw-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
  .gw-tab{flex:1;text-align:center;border:1px solid var(--wl-line);border-radius:5px;padding:5px;font-size:11px;font-weight:600;cursor:pointer;background:var(--wl-input);}
  .gw-tab.off.active{background:#f3d2c2;border-color:var(--wl-orange);color:#71310d}
  .gw-tab.def.active{background:#cfe0e6;border-color:var(--wl-blue);color:#163a44}
  .gw-tab.mis.active{background:#efe3c0;border-color:var(--wl-amber);color:#5d4710}
  .gw-tab.wk.active{background:#f0d3d3;border-color:var(--wl-red);color:#6e1f1f}
  .gw-picks{display:flex;flex-direction:column;gap:5px;margin-top:7px}
  .gw-pickrow{border:1px solid var(--wl-line);border-radius:5px;background:var(--wl-input);padding:5px 7px;font-size:11px;}
  .gw-pickrow .mp{font-weight:600}.gw-pickrow .ab{color:var(--wl-soft);font-size:10px}
  .gw-chip{display:inline-flex;align-items:center;gap:5px;background:#eef3df;border:1px solid #8aa15a;color:#41541f;border-radius:999px;padding:3px 9px;font-size:11px;margin:0 5px 5px 0}
  .gw-chip .x{cursor:pointer;color:#9f3d14}

  /* Review sheet */
  .gw-sheet .sb{background:var(--wl-band);color:#ffe9ad;font-weight:600;letter-spacing:1px;font-size:12px;padding:4px 10px;border-radius:5px;margin:9px 0 6px;}
  .gw-sheet .sb:first-child{margin-top:0}
  .gw-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12px;}
  .gw-kv .k{color:var(--wl-soft)}
  .gw-cv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;text-align:center;font-size:11px;}
  .gw-cv .cell{background:var(--wl-input);border:1px solid var(--wl-line);border-radius:4px;padding:4px}
  .gw-cv .cell .v{font-weight:600;font-size:14px}
  .gw-cv .cell.hl{background:#fff2cf;border-color:var(--wl-orange);} .gw-cv .cell.hl .v,.gw-cv .cell.hl .l{color:var(--wl-orange)}
  .gw-abblocks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .gw-abb{border:1px solid #e3d4a8;border-radius:0 5px 5px 0;padding:5px 7px;font-size:11px;background:var(--wl-input)}
  .gw-abb.off{border-left:4px solid var(--wl-orange)} .gw-abb.off .t{color:#9f3d14}
  .gw-abb.def{border-left:4px solid var(--wl-blue)} .gw-abb.def .t{color:#163a44}
  .gw-abb.mis{border-left:4px solid var(--wl-amber)} .gw-abb.mis .t{color:#5d4710}
  .gw-abb.wk{border-left:4px solid var(--wl-red)} .gw-abb.wk .t{color:#a32d2d}
  .gw-abb .t{font-weight:600;margin-bottom:2px}
  textarea.gw-json{font-family:ui-monospace,monospace;font-size:10px;min-height:92px;background:#20241a;color:#e8e2bd;border-color:#4b532c}

  /* Nav */
  .gw-nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:9px;border-top:2px solid var(--wl-line);}
  .gw-bc{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:5px;align-items:end;}
  .gw-bc .c{text-align:center}.gw-bc .c label{display:block;font-size:11px;color:var(--wl-soft)}
  .gw-bc input{text-align:center;padding:4px 2px}

  /* Intro */
  .gw-intro{text-align:center;padding:26px 18px;}
  .gw-intro h3{color:var(--wl-orange);margin:0 0 6px;font-size:18px;text-transform:uppercase;letter-spacing:1px}
  .gw-intro p{color:var(--wl-soft);margin:6px 0;font-size:13px}
  .gw-intro-id{display:flex;gap:10px;justify-content:center;max-width:480px;margin:14px auto;flex-wrap:wrap}
  .gw-intro-id > div{flex:1;min-width:170px;text-align:left}
  .gw-intro-id label{font-size:11px;color:var(--wl-soft);display:block;margin-bottom:2px}
  .gw-intro-btns{display:flex;justify-content:center;gap:12px;margin:18px 0 6px;flex-wrap:wrap}
  .gw-intro-btns button{padding:10px 18px;font-size:14px}
  .gw-summary{text-align:center;padding:10px;background:#e6f0db;border:1px solid #7e9a55;border-radius:6px;margin-bottom:11px;}
  .gw-summary h3{color:#2c5424;margin:0 0 4px;font-size:16px}
  .gw-summary p{color:var(--wl-soft);margin:0;font-size:12px}
  .gw-summary-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .wl-foot{color:var(--wl-soft);font-size:11px;text-align:center;margin:10px 0 2px}
  @media(max-width:760px){.gw-body{flex-direction:column}.gw-chronicle{width:auto;border-right:none;border-bottom:2px solid var(--wl-line)}.gw-content{flex-direction:column}.gw-controls{width:100%}}
</style>
</head>

<script>
(function(){
  'use strict';
  const $=s=>document.querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
  const D=window.GWData2, WH=window.GWWarHeroes, CA=window.GWCrypticAlliances, ROLES=window.GWMPRoles, F=window.GWFlavor;
  const MP_LIST_KEY='mp-char-list', DRAFT_KEY='gw-character-starter-draft';
  const BCS=[['st','ST'],['en','EN'],['ag','AG'],['in','IN'],['cl','CL']];
  const ROLE_KEYS=['offense','defense','misc','weakness'];
  const BC_TIERS=[
    {name:'Normal',   scores:[14,12,10,8,6],   total:50,  abil:0},
    {name:'Low',      scores:[16,14,12,10,8],  total:100, abil:40},
    {name:'Standard', scores:[18,16,14,12,10], total:150, abil:80},
    {name:'High',     scores:[20,18,16,14,12], total:200, abil:120}
  ];
  const tierOf=n=>BC_TIERS.find(t=>t.name===n)||BC_TIERS[1];
  const PSH_CAPS={st:18,en:24,ag:24,in:24,cl:24};
  function bcCap(k){return state.species==='Pure Strain Human'?PSH_CAPS[k]:40;}
  function enforceBCCaps(){
    if(state.species!=='Pure Strain Human')return false;
    let changed=false;
    if(state.bc.st>PSH_CAPS.st){
      const others=['en','ag','in','cl'];
      let lo=others[0];others.forEach(k=>{if(state.bc[k]<state.bc[lo])lo=k;});
      if(state.bc[lo]<=PSH_CAPS.st){const t=state.bc.st;state.bc.st=state.bc[lo];state.bc[lo]=Math.min(t,PSH_CAPS[lo]);}
      else state.bc.st=PSH_CAPS.st;
      changed=true;
    }
    ['en','ag','in','cl'].forEach(k=>{if(state.bc[k]>PSH_CAPS[k]){state.bc[k]=PSH_CAPS[k];changed=true;}});
    return changed;
  }
  const SPECIES_MAP={psh:'Pure Strain Human',humanoid:'Humanoid (Mutant)',animal:'Mutated Animal',plant:'Mutated Plant',tech:'Tech Construct'};
  const PLAYABLE_CREATURES=['Android','Ark','Badder','Fen','Gren','Hisser','Hoop','Menarl','Orlen','Sleeth'];
  const BEST=()=>window.GWBestiary||{};
  const isCreature=sp=>PLAYABLE_CREATURES.indexOf(sp)>=0&&!!BEST()[sp];

  function classifyRole(name){
    const s=String(name).toLowerCase();
    if(/heightened (strength|attack)|natural weaponry|disintegrat|death (touch|field)|mental blast|energy|blast|siphon|life lea|transmut|attack|claw|bite|spine|sonic attack/.test(s))return 'offense';
    if(/armor|adaptation|force field|negation|reflection|invulnerab|heightened defense|density (control|increase)|resist|protection|regenerat/.test(s))return 'defense';
    return 'misc';
  }
  function parsePkgSeg(seg){
    seg=String(seg).trim();if(!seg||/^(null|none)\b/i.test(seg))return null;
    const m=seg.match(/(-?[\d.]+)\s*CP/);const cp=m?parseFloat(m[1]):0;
    let name=seg.split(/\s*\(/)[0].replace(/\s*-?[\d.]+\s*CP.*$/,'').trim();if(!name)name=seg;
    return {name,cp,ability:seg};
  }
  function splitSegs(str){let d=0,out='';for(const ch of String(str||'')){if(ch==='(')d++;else if(ch===')')d=Math.max(0,d-1);out+=(ch===','&&d>0)?'\u0001':ch;}return out.split(/,\s+(?=[A-Z])/).map(s=>s.replace(/\u0001/g,',').trim()).filter(Boolean);}
  function creaturePackage(cname){
    const c=BEST()[cname];if(!c)return null;
    const pools={offense:[],defense:[],misc:[],weakness:[]};
    splitSegs(c.abilities).forEach(seg=>{const e=parsePkgSeg(seg);if(!e)return;const role=classifyRole(e.name);pools[role].push({pkg:{...e,role,cpNum:e.cp,weakness:false}});});
    splitSegs(c.weaknesses).forEach(seg=>{const e=parsePkgSeg(seg);if(!e)return;const cpNum=-Math.abs(e.cp);pools.weakness.push({pkg:{...e,role:'weakness',cpNum,weakness:true}});});
    return pools;
  }

  let state={ step:0, powerLevel:'Low', activeRole:'offense',
    name:'', player:'', species:'Humanoid (Mutant)', culture:'', side:'', faction:'', alliance:'',
    home:'', homeland:'', bc:{st:10,en:10,ag:10,in:10,cl:10}, gender:'', age:'', weight:'',
    genderIdentity:'', genderExpression:'', biologicalSex:'', sexualAttraction:'', ageMethod:'standard',
    backgrounds:[], motivation:'', origin:'',
    abilities:[], rollLog:[], exportId:null };

  /* ── dice & helpers ─────────────────────────────────────────── */
  const die=n=>Math.floor(Math.random()*n)+1;
  const cpn=s=>{s=String(s==null?'':s).trim();if(s===''||s==='*')return null;const n=parseFloat(s);return isNaN(n)?null:n;};
  const fmt=n=>(Math.round(n*10)/10).toString();
  const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
  const mpLead=t=>{const x=String(t||'').split(/[:(]/)[0].trim();return x.length>2?x:'';};
  function log(l){if(!l)return;const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});state.rollLog.unshift(`[${t}] ${l}`);state.rollLog=state.rollLog.slice(0,50);}

  /* ── source tables ──────────────────────────────────────────── */
  const SIDES=['Good','Neutral','Evil'];
  const CULTURES=['Primitive','Modern','High Tech'];
  const BIRTHPLACES=[
    {lo:1,hi:3,name:'Far-Go'},{lo:4,hi:6,name:'Pitz Burke'},{lo:7,hi:9,name:'Albuq Starport'},
    {lo:10,hi:12,name:'Defiance'},{lo:13,hi:15,name:'Moonsee'},{lo:16,hi:18,name:'Findlay'},
    {lo:19,hi:21,name:'Fortain'},{lo:22,hi:24,name:'Jospeen'},{lo:25,hi:27,name:'Green Village'},
    {lo:28,hi:30,name:'Chi-Gor'},{lo:31,hi:33,name:'New Bosston'},{lo:34,hi:36,name:'Phila Delph'},
    {lo:37,hi:39,name:'St. Loowis'},{lo:40,hi:42,name:'Cinci'},{lo:43,hi:45,name:'Kan City'},

  function factionOptions(){return ['Independent'].concat((CA&&CA.alliances||[]).map(a=>a.name));}

  function speciesOptions(){

  }
  function rollNonAllianceSpecies(){const r=die(100);const s=(D.species||[]).find(x=>r>=x.lo&&x.hi>=r);return s?s.name:'Humanoid (Mutant)';}

  /* ── per-step rolls (pure state) ────────────────────────────── */
  function rollName(){if(!F||!F.rollName)return;state.name=F.rollName();log('Name: '+state.name);}
  function setSpecies(sp){state.species=sp;state.abilities=state.abilities.filter(a=>a.source==='special-weapon');if(sp==='Pure Strain Human'&&enforceBCCaps())log('PSH caps applied: ST\u226418, EN/AG/IN/CL\u226424.');if(isCreature(sp))rollAbilities();}

  function rollSide(){state.side=SIDES[die(3)-1];log('Side: '+state.side);}
  function rollCulture(){const c=die(100);state.culture=c<=33?'Primitive':(c<=66?'Modern':'High Tech');log('Culture: '+state.culture);}
  function rollHome(){const r=die(100);const e=BIRTHPLACES.find(x=>r>=x.lo&&x.hi>=r);state.home=e?e.name:'';log(`Birthplace ${r}: ${state.home}`);}
  function rollHomeland(){const r=die(20);state.homeland=HOMELANDS[r-1]||'';log(`Homeland ${r}: ${state.homeland}`);}
  function rollBC(){
    const tier=tierOf(state.powerLevel),order=['st','en','ag','in','cl'],got={};
    tier.scores.forEach(score=>{let idx=Math.floor((die(10)-1)/2),g=0;while(got[order[idx]]!==undefined&&g++<5)idx=(idx+1)%5;got[order[idx]]=score;});
    order.forEach(k=>state.bc[k]=got[k]||0);

    log(`MP BCs (${tier.name}): ${BCS.map(([k,l])=>l+' '+state.bc[k]).join(', ')} = ${bcTotal()}`);
  }
  // Gender — MP RAW: four independent d100 tables (identity, expression, biological sex, attraction)

  const AGE_METHODS=[['standard','Standard (2d10+10)'],['experienced','Experienced (2d10+20)'],['modern','Modern population (2d12)']];
  function rollGenderIdentityVal(){const r=die(100);state.genderIdentity=r<=48?'Woman':r<=96?'Man':'Nonbinary';}
  function rollGenderExpressionVal(){const r=die(100);state.genderExpression=r<=87?'Same as identity':r<=93?'Different from identity':r<=97?'Androgynous':'Gender Neutral';}
  function rollBiologicalSexVal(){const r=die(100);state.biologicalSex=r<=95?'Cisgender':r<=99?'Transgender':'Intersex';}
  function rollSexualAttractionVal(){const r=die(100);state.sexualAttraction=r<=90?'Straight':r<=94?'Gay/Lesbian':r<=99?'Bisexual/Pansexual':'Asexual';}

  function genderLine(){return [state.genderIdentity,state.genderExpression,state.biologicalSex,state.sexualAttraction].filter(Boolean).join(' \u00b7 ');}

  // Age — MP RAW: 2d10+10 (experienced +10 more), or the modern-population 2d12 formula

  function rollOneBg(){const r=die(100);const c=BACKGROUNDS.find(x=>r>=x.lo&&x.hi>=r)||BACKGROUNDS[0];return `${c.name} (${c.ex[die(c.ex.length)-1]})`;}

  /* ── ability engine (pure state) ────────────────────────────── */
  function bcTotal(){return BCS.reduce((s,[k])=>s+(state.bc[k]||0),0);}

  function weaknessCP(){return state.abilities.filter(a=>a.weakness).reduce((s,a)=>s+(a.cpNum||0),0);}

  function buildPools(){
    const sp=state.species,pools={offense:[],defense:[],misc:[],weakness:[]};
    if(isCreature(sp))return{kind:'creature',pools:creaturePackage(sp)||pools};
    if(sp==='Pure Strain Human'){const c=WH.commando;(c.offensive||[]).forEach(e=>pools.offense.push({commando:1,name:e.name}));(c.defensive||[]).forEach(e=>pools.defense.push({commando:1,name:e.name}));(c.misc||[]).forEach(e=>pools.misc.push({commando:1,name:e.name}));(c.weaknesses||[]).forEach(e=>pools.weakness.push({commando:1,name:e.name}));return{kind:'commando',pools};}
    if(sp==='Tech Construct')return{kind:'tech',pools};
    const cats=sp==='Mutated Plant'?['plant']:['physical','mental'];
    cats.forEach(cat=>(D.mutations[cat]||[]).forEach(m=>{const r=(ROLES[cat]||{})[m.name];if(r&&pools[r])pools[r].push({cat,m});}));
    return{kind:'mutant',pools};
  }
  function poolTable(role){
    const built=buildPools();const pool=built.pools[role]||[];const n=pool.length||1;const w=100/n;const rows=[];
    pool.forEach((it,i)=>{const lo=Math.floor(i*w)+1,hi=(i===n-1)?100:Math.floor((i+1)*w);let name,cp;if(it.commando){name=it.name;cp=role==='weakness'?'-10':'10';}else if(it.pkg){name=it.pkg.name;cp=it.pkg.cp;}else{name=it.m.name;cp=it.m.cp;}rows.push({lo,hi,name,cp,it,kind:built.kind});});
    return rows;
  }
  function entryFromRow(row,role){
    if(row.kind==='creature'){const p=row.it.pkg;return{role,base:p.name,gw:p.name,mp:p.name,cp:String(p.cpNum),cpNum:p.cpNum,ability:p.ability,source:'creature',weakness:role==='weakness'};}
    if(row.kind==='commando'){const cp=role==='weakness'?-10:10;return{role,base:row.name,gw:row.name,mp:row.name,cp:String(cp),cpNum:cp,ability:'(mundane '+role+' ability — assign MP build in builder)',source:'commando',weakness:role==='weakness'};}

    const cn=cpn(cp);return{role,base:row.name,gw:name,mp:mpLead(ability)||name,cp:String(cp),cpNum:cn==null?0:cn,ability:ability||'',source:row.it.cat,weakness:(role==='weakness')};
  }
  function rollRole(role,n){
    n=n||2;const built=buildPools(),rows=poolTable(role);state.abilities=state.abilities.filter(a=>a.role!==role||a.source==='special-weapon');
    if(built.kind==='creature'){rows.forEach(row=>state.abilities.push(entryFromRow(row,role)));return;}
    const got=[];let g=0;while(got.length<n&&g++<200&&rows.length){const row=rows[die(rows.length)-1];if(got.some(x=>x.gw===row.name))continue;got.push(entryFromRow(row,role));}

  function togglePick(row,role){

    else{const cur=state.abilities.filter(a=>a.role===role&&a.source!=='special-weapon');if(cur.length>=2)state.abilities=state.abilities.filter(a=>a!==cur[0]);state.abilities.push(entryFromRow(row,role));log(`Picked ${row.name}`);}
  }
  function fillEquipment(target){
    const list=[];(D.equipment||[]).forEach(g=>(g.items||[]).forEach(it=>{if(it.lo!=null)list.push(it);}));

  function go(n){state.step=n;saveDraft();render();window.scrollTo({top:0,behavior:'smooth'});}
  function rollRemaining(fromN){for(let i=fromN;i<LAST_DATA;i++){const k=STEPS[i].key;if(rollByKey[k])rollByKey[k]();}go(17);}

  /* ── species branch tracker (origin-tracker analog) ─────────── */
  function branchInfo(){
    const sp=state.species;
    if(isCreature(sp))return{cls:'',label:sp+' (creature)',items:[{step:1,t:'Fixed converted package'},{step:12,t:'Abilities: '+sp+' package applied'},{step:16,t:'Gear: optional special weapon'}]};
    if(sp==='Pure Strain Human')return{cls:'',label:'Pure Strain Human',items:[{step:1,t:'No mutations'},{step:12,t:'Abilities: commando tables (2/2/2/2)'},{step:16,t:'Gear: standard weapons'}]};
    if(sp==='Tech Construct')return{cls:'',label:'Tech Construct',items:[{step:1,t:'No mutation charts'},{step:12,t:'Abilities: artifacts (~60 CP)'},{step:16,t:'Gear: tech weapons'}]};
    if(sp==='Mutated Plant')return{cls:'',label:'Mutated Plant',items:[{step:1,t:'Plant mutation chart'},{step:12,t:'Abilities: 2/2/2/2 from plant chart'},{step:16,t:'Gear: optional special weapon'}]};
    return{cls:'',label:sp,items:[{step:1,t:'Physical + mental charts'},{step:12,t:'Abilities: 2/2/2/2 from mutation charts'},{step:16,t:'Gear: optional special weapon'}]};
  }

  /* ── chronicle ──────────────────────────────────────────────── */
  function chronResult(key){
    switch(key){
      case 'species':return state.species?`<strong>${esc(state.species)}</strong>${isCreature(state.species)?' (creature)':''}`:'—';
      case 'faction':return state.faction?`<strong>${esc(state.faction)}</strong>`:'—';
      case 'side':return state.side?`<strong>${esc(state.side)}</strong>`:'—';
      case 'culture':return state.culture?`<strong>${esc(state.culture)}</strong>`:'—';
      case 'home':return state.home?esc(state.home):'—';
      case 'homeland':return state.homeland?esc(state.homeland):'—';
      case 'bc':return BCS.map(([k,l])=>`${l} <strong>${state.bc[k]}</strong>`).join(' ')+`<br>= ${bcTotal()} CP`;
      case 'bio':return (state.genderIdentity||state.age||state.weight)?`${esc(state.genderIdentity||'—')}, age ${esc(String(state.age||'—'))}, ${esc(String(state.weight||'—'))} lb`:'—';
      case 'backgrounds':return (state.backgrounds||[]).length?state.backgrounds.map(b=>'• '+esc(b)).join('<br>'):'—';
      case 'motivation':return state.motivation?esc(state.motivation):'—';
      case 'origin':return state.origin?esc(state.origin):'—';
      case 'offense':{const n=state.abilities.filter(a=>a.role==='offense'&&a.source!=='special-weapon');return n.length?n.map(a=>'• '+esc(a.mp||a.gw)).join('<br>'):'—';}
      case 'defense':{const n=state.abilities.filter(a=>a.role==='defense'&&a.source!=='special-weapon');return n.length?n.map(a=>'• '+esc(a.mp||a.gw)).join('<br>'):'—';}
      case 'misc':{const n=state.abilities.filter(a=>a.role==='misc'&&a.source!=='special-weapon');return n.length?n.map(a=>'• '+esc(a.mp||a.gw)).join('<br>'):'—';}
      case 'weakness':{const n=state.abilities.filter(a=>a.weakness);return n.length?n.map(a=>'• '+esc(a.mp||a.gw)).join('<br>'):'—';}
      case 'weapons':{const g=state.abilities.filter(a=>a.source==='special-weapon');return g.length?g.map(x=>'• '+esc(x.gw)).join('<br>'):'—';}
      case 'review':return state.step===17?'Ready to transfer':'—';
    }
    return '—';
  }
  function renderChronicle(){
    const complete=state.step===17;
    const tally=`<div class="gw-tally">
      <div class="t"><div class="l">Total</div><div class="v">${tierOf(state.powerLevel).total}</div></div>
      <div class="t"><div class="l">Spent</div><div class="v">${fmt(netCP())}</div></div>
      <div class="t hl"><div class="l">Unspent</div><div class="v">${fmt(unspent())}</div></div></div>`;
    const b=branchInfo();
    const track=`<div class="gw-track"><div class="gw-track-h">${esc(b.label)}${complete?' ✓':''}</div><div class="gw-track-b">`+
      b.items.map(it=>{const done=state.step>it.step,act=state.step===it.step;const cls=done?'done':(act?'active':'pending');const ck=done?'✓':'○';return `<div class="gw-track-item ${cls}"><span>${ck}</span><span>${esc(it.t)}</span></div>`;}).join('')+`</div></div>`;
    const steps=STEPS.map(s=>{const act=s.n===state.step,done=s.n<state.step;let cls='gw-cstep';if(act)cls+=' active';if(done)cls+=' completed';return `<div class="${cls}" data-goto="${s.n}"><div class="h">${s.n}. ${esc(s.name)}</div><div class="r">${chronResult(s.key)}</div></div>`;}).join('');
    return `<div class="gw-chronicle ${complete?'complete':''}"><div class="gw-chron-title ${complete?'complete':''}">${complete?'✓ Build Complete':'Generation Chronicle'}</div>${tally}${track}${steps}</div>`;
  }

  /* ── main panel: step renderers ─────────────────────────────── */
  function head(n,title,desc){return `<div class="gw-step-head"><div class="gw-step-num">${n}</div><div class="gw-step-title">${esc(title)}</div></div>${desc?`<p class="gw-step-desc">${desc}</p>`:''}`;}
  function nav(n,nextLabel,opts){opts=opts||{};const prev=n===1?`<button class="wl-btn ghost" data-act="startover">← Start Over</button>`:`<button class="wl-btn ghost" data-act="prev">← Back</button>`;const rest=opts.noRest?'':`<button class="wl-btn ghost" data-act="rollrest" title="Roll every remaining step and jump to Review">🎲 Roll the rest →</button>`;const next=opts.noNext?'':`<button class="wl-btn green" data-act="next">${esc(nextLabel||'Next →')}</button>`;return `<div class="gw-nav"><div>${prev}</div><div style="display:flex;gap:8px">${rest}${next}</div></div>`;}
  function rollBox(title,resultHtml,pickHtml,rollLabel){return `<div class="gw-controls"><div class="gw-controls-title">${title||'Roll or Pick'}</div><button class="gw-roll-btn" data-act="roll">🎲 ${esc(rollLabel||'Roll')}</button><div class="gw-roll-res">${resultHtml||''}</div><div class="gw-or">— or —</div>${pickHtml||''}</div>`;}
  function tableRows(rows,selName){return `<div class="gw-scroll"><table class="gw-rt">${rows}</table></div>`;}

  function stepSpecies(){
    const o=speciesOptions();
    const opts=`<optgroup label="Standard Species">`+o.base.map(n=>`<option value="${esc(n)}" ${state.species===n?'selected':''}>${esc(n)}</option>`).join('')+`</optgroup>`+
      (o.crit.length?`<optgroup label="Playable Creatures">`+o.crit.map(n=>`<option value="${esc(n)}" ${state.species===n?'selected':''}>${esc(n)} (${esc(BEST()[n].cpEstimate||'creature')})</option>`).join('')+`</optgroup>`:'');
    const table=`<table class="gw-rt"><caption>Species (d100)</caption><tbody>`+
      (D.species||[]).map(s=>`<tr data-spk="${esc(s.name)}" class="${state.species===s.name?'sel':''}"><td class="rng">${s.lo}-${s.hi}</td><td>${esc(s.name)}</td></tr>`).join('')+`</tbody></table>`;
    const ctrl=rollBox('Roll or Pick','',`<select class="gw-pick" data-pick="species">${opts}</select>`,'Roll d%');
    const hint=`<div class="gw-hint">${isCreature(state.species)?'Creature: its converted MP package applies at the Abilities step.':state.species==='Pure Strain Human'?'PSH: no mutations — commando abilities + standard weapons.':state.species==='Tech Construct'?'Tech Construct: artifacts instead of mutations.':'Mutant: draws 2/2/2/2 from the mutation charts.'}</div>`;
    return head(1,'Species','Standard d100 table, or one of the ten playable creatures. This choice drives your Abilities branch.')+
      `<div class="gw-content"><div class="gw-table-side">${table}</div>${ctrl}</div>${hint}`+nav(1,'Next: Faction →');
  }
  function stepFaction(){
    const opts=factionOptions();
    const table=`<table class="gw-rt"><caption>Cryptic Alliances</caption><thead><tr><th>Faction</th><th>Side</th><th>Note</th></tr></thead><tbody>`+
      `<tr data-fck="Independent" class="${state.faction==='Independent'?'sel':''}"><td>Independent</td><td>—</td><td>No alliance ties.</td></tr>`+
      (CA&&CA.alliances||[]).map(a=>`<tr data-fck="${esc(a.name)}" class="${state.faction===a.name?'sel':''}"><td>${esc(a.name)}</td><td>${esc(a.side||'—')}</td><td>${esc(a.note||'')}</td></tr>`).join('')+`</tbody></table>`;
    const pick=`<select class="gw-pick" data-pick="faction">`+opts.map(n=>`<option value="${esc(n)}" ${state.faction===n?'selected':''}>${esc(n)}</option>`).join('')+`</select>`;
    return head(2,'Faction','Cryptic Alliance membership (or Independent). Picking an alliance sets a suggested Side.')+
      `<div class="gw-content"><div class="gw-table-side">${table}</div>${rollBox('Roll or Pick','',pick,'Roll d%')}</div>`+nav(2,'Next: Side →');
  }
  function stepSide(){
    const pick=`<select class="gw-pick" data-pick="side">`+['',...SIDES].map(n=>`<option value="${esc(n)}" ${state.side===n?'selected':''}>${n||'— pick —'}</option>`).join('')+`</select>`;
    const a=allianceByName(state.faction);
    const hint=a&&a.side?`<div class="gw-hint">${esc(state.faction)} leans <strong>${esc(a.side)}</strong>.</div>`:'';
    const table=`<table class="gw-rt"><caption>Side</caption><tbody>`+SIDES.map(s=>`<tr data-sdk="${s}" class="${state.side===s?'sel':''}"><td>${s}</td></tr>`).join('')+`</tbody></table>`;
    return head(3,'Side','Moral alignment for the build.')+`<div class="gw-content"><div class="gw-table-side">${table}${hint}</div>${rollBox('Roll or Pick','',pick,'Roll')}</div>`+nav(3,'Next: Culture →');
  }
  function stepCulture(){
    const table=`<table class="gw-rt"><caption>Culture (d100)</caption><tbody>`+
      [['01-33','Primitive'],['34-66','Modern'],['67-00','High Tech']].map(([r,n])=>`<tr data-clk="${n}" class="${state.culture===n?'sel':''}"><td class="rng">${r}</td><td>${n}</td></tr>`).join('')+`</tbody></table>`;
    const pick=`<select class="gw-pick" data-pick="culture">`+['',...CULTURES].map(n=>`<option value="${esc(n)}" ${state.culture===n?'selected':''}>${n||'— pick —'}</option>`).join('')+`</select>`;
    return head(4,'Culture','Technological backdrop you were raised in.')+`<div class="gw-content"><div class="gw-table-side">${table}</div>${rollBox('Roll or Pick','',pick,'Roll d%')}</div>`+nav(4,'Next: Birthplace →');
  }
  function stepHome(){
    const table=`<table class="gw-rt"><caption>Birthplace (d100)</caption><tbody>`+
      BIRTHPLACES.map(e=>`<tr data-hmk="${esc(e.name)}" class="${state.home===e.name?'sel':''}"><td class="rng">${e.lo}-${e.hi}</td><td>${esc(e.name)}</td></tr>`).join('')+`</tbody></table>`;
    const pick=`<select class="gw-pick" data-pick="home"><option value="">— pick —</option>`+
      BIRTHPLACES.map(e=>`<option value="${esc(e.name)}" ${state.home===e.name?'selected':''}>${esc(e.name)}</option>`).join('')+
      `<optgroup label="House">`+BIRTHPLACE_EXTRAS.map(n=>`<option value="${esc(n)}" ${state.home===n?'selected':''}>${esc(n)}</option>`).join('')+`</optgroup></select>`;
    return head(5,'Birthplace','Where the character was born.')+`<div class="gw-content"><div class="gw-table-side">${table}</div>${rollBox('Roll or Pick','',pick,'Roll d%')}</div>`+nav(5,'Next: Homeland →');
  }
  function stepHomeland(){
    const table=`<table class="gw-rt"><caption>Homeland Type (d20)</caption><tbody>`+
      HOMELANDS.map((n,i)=>`<tr data-hlk="${esc(n)}" class="${state.homeland===n?'sel':''}"><td class="rng">${i+1}</td><td>${esc(n)}</td></tr>`).join('')+`</tbody></table>`;
    const pick=`<select class="gw-pick" data-pick="homeland"><option value="">— pick —</option>`+HOMELANDS.map(n=>`<option value="${esc(n)}" ${state.homeland===n?'selected':''}>${esc(n)}</option>`).join('')+`</select>`;
    return head(6,'Homeland Type','The kind of community that shaped them.')+`<div class="gw-content"><div class="gw-table-side">${table}</div>${rollBox('Roll or Pick','',pick,'Roll d20')}</div>`+nav(6,'Next: Characteristics →');
  }
  function stepBC(){
    const plSel=`<select data-pl style="margin-bottom:8px">`+BC_TIERS.map(t=>`<option value="${t.name}" ${state.powerLevel===t.name?'selected':''}>${t.name} (BC ${t.scores.reduce((a,b)=>a+b,0)}, ${t.total} CP)</option>`).join('')+`</select>`;
    const psh=state.species==='Pure Strain Human';
    const grid=`<div class="gw-bc">`+BCS.map(([k,l])=>`<div class="c"><label>${l}${psh?` <span style="color:var(--wl-soft);font-weight:400">(max ${bcCap(k)})</span>`:''}</label><input type="number" min="0" max="${bcCap(k)}" data-bc="${k}" value="${state.bc[k]}"></div>`).join('')+`<div class="c"><label>Total</label><div style="font-weight:600;padding:5px 0">${bcTotal()}</div></div></div>`;
    const note=`<div class="gw-hint">MP Random Method: each of the five tier scores [${tierOf(state.powerLevel).scores.join('/')}] is dealt to a stat by a d10 column draw. Edit any cell by hand.</div>`;
    return head(7,'Basic Characteristics','Choose a power level, then roll the five BCs by the MP Random Method.')+
      `<div class="gw-content vertical"><div style="width:100%">${plSel}${grid}${note}</div></div>`+
      `<div style="margin-top:8px"><button class="gw-roll-btn sm" style="width:auto;display:inline-block;padding:6px 16px" data-act="roll">🎲 Roll BCs</button></div>`+nav(7,'Next: Bio →');
  }
  function stepBio(){
    const lab=t=>`<label style="font-size:11px;color:var(--wl-soft);display:block">${t}</label>`;
    const rb=(act,txt)=>`<button class="gw-roll-btn sm" style="width:100%;margin-top:5px;padding:5px;font-size:11px" data-act="${act}">🎲 ${txt||'Roll'}</button>`;
    const numFld=(label,key,act)=>`<div style="flex:1">${lab(label)}<input data-bio="${key}" value="${esc(String(state[key]||''))}">${rb(act)}</div>`;
    const ageMethod=`<select class="gw-pick" data-pick="ageMethod" style="width:100%;margin-top:3px">`+AGE_METHODS.map(([v,t])=>`<option value="${v}" ${(state.ageMethod||'standard')===v?'selected':''}>${esc(t)}</option>`).join('')+`</select>`;
    const ageFld=`<div style="flex:1">${lab('Age')}<input data-bio="age" value="${esc(String(state.age||''))}">${ageMethod}${rb('roll-age')}</div>`;
    const body=`<div style="display:flex;gap:8px;max-width:460px">${numFld('Weight (lb)','weight','roll-weight')}${ageFld}</div>`;
    const sel=(label,key,opts,act)=>`<div style="flex:1;min-width:180px">${lab(label)}<select class="gw-pick" data-pick="${key}"><option value="">— roll or pick —</option>`+opts.map(o=>`<option value="${esc(o)}" ${state[key]===o?'selected':''}>${esc(o)}</option>`).join('')+`</select>${rb(act)}</div>`;
    const gender=`<div class="gw-controls-title" style="text-align:left;margin:14px 0 6px">Gender (MP — four tables)</div>`+
      `<div style="display:flex;flex-wrap:wrap;gap:8px;max-width:520px">`+
        sel('Gender identity','genderIdentity',G_IDENTITY,'roll-gid')+
        sel('Gender expression','genderExpression',G_EXPRESSION,'roll-gexp')+
        sel('Biological sex','biologicalSex',G_SEX,'roll-gsex')+
        sel('Sexual attraction','sexualAttraction',G_ATTRACTION,'roll-gattr')+
      `</div><div style="margin-top:8px"><button class="gw-roll-btn sm" style="width:auto;display:inline-block;padding:6px 16px" data-act="roll-gender">🎲 Roll Gender (all four)</button></div>`;
    return head(8,'Bio','Physical descriptors. Roll each field, or set them by hand — gender follows MP\u2019s four d100 tables.')+
      `<div class="gw-content vertical"><div style="width:100%">${body}${gender}<div style="margin-top:14px;border-top:1px solid var(--wl-line);padding-top:10px"><button class="gw-roll-btn sm" style="width:auto;display:inline-block;padding:6px 16px" data-act="roll">🎲 Roll All</button></div></div></div>`+nav(8,'Next: Backgrounds →');
  }
  function stepBackgrounds(){
    const table=`<table class="gw-rt"><caption>Backgrounds (d100, pick or roll two)</caption><tbody>`+
      BACKGROUNDS.map(b=>{const on=(state.backgrounds||[]).some(x=>bgCat(x)===b.name);return `<tr data-bgk="${esc(b.name)}" class="${on?'sel':''}"><td class="rng">${b.lo}-${b.hi}</td><td>${esc(b.name)}</td></tr>`;}).join('')+`</tbody></table>`;
    const chips=(state.backgrounds||[]).map((bgv,i)=>`<span class="gw-chip">${esc(bgv)}<span class="x" data-rmbg="${i}">✕</span></span>`).join('')||'<span class="gw-hint">None yet — roll two or click rows (max 2).</span>';
    return head(9,'Backgrounds','Two life-paths. Click a row to add/replace; rolling picks two distinct categories.')+
      `<div class="gw-content"><div class="gw-table-side">${table}</div>${rollBox('Roll or Pick','','','Roll 2')}</div><div style="margin-top:8px">${chips}</div>`+nav(9,'Next: Motivation →');
  }
  function stepMotivation(){
    const opts=(F&&(F.motivationsBySide?F.motivationsBySide(state.side):F.motivations))||[];
    const pick=`<select class="gw-pick" data-pick="motivation"><option value="">— pick —</option>`+opts.map(n=>`<option value="${esc(n)}" ${state.motivation===n?'selected':''}>${esc(n)}</option>`).join('')+`</select>`;
    const f=`<input data-text="motivation" placeholder="Motivation" value="${esc(state.motivation||'')}" style="max-width:420px">`;
    return head(10,'Motivation','What drives the character. The list is tuned to the chosen Side — heroic for Good, villainous for Evil, both for Neutral. Roll, pick, or write your own.')+
      `<div class="gw-content"><div class="gw-table-side">${f}</div>${rollBox('Roll or Pick','',pick,'Roll')}</div>`+nav(10,'Next: Origin →');
  }
  function stepOrigin(){
    const opts=(F&&F.origins||[]);
    const pick=`<select class="gw-pick" data-pick="origin"><option value="">— pick —</option>`+opts.map(n=>`<option value="${esc(n)}" ${state.origin===n?'selected':''}>${esc(n)}</option>`).join('')+`</select>`;
    const f=`<input data-text="origin" placeholder="Origin" value="${esc(state.origin||'')}" style="max-width:420px">`;
    return head(11,'Origin','How the mutation/build came to be. Roll, pick, or write your own.')+
      `<div class="gw-content"><div class="gw-table-side">${f}</div>${rollBox('Roll or Pick','',pick,'Roll')}</div>`+nav(11,'Next: Offensive →');
  }
  const ROLE_META={
    offense:{n:12,label:'Offensive',next:'Next: Defensive →',pill:['#f3d2c2','#71310d'],desc:'Pick 2 offensive abilities, or roll the table.'},
    defense:{n:13,label:'Defensive',next:'Next: Miscellaneous →',pill:['#cfe0e6','#163a44'],desc:'Pick 2 defensive abilities, or roll the table.'},
    misc:{n:14,label:'Miscellaneous',next:'Next: Weaknesses →',pill:['#efe3c0','#5d4710'],desc:'Pick 2 miscellaneous abilities, or roll the table.'},
    weakness:{n:15,label:'Weaknesses',next:'Next: Weapons →',pill:['#f0d3d3','#6e1f1f'],desc:'Pick 2 weaknesses, or roll the table.'}
  };
  function stepRole(role){
    state.activeRole=role;
    const built=buildPools(),sp=state.species,meta=ROLE_META[role],rows=poolTable(role);
    const sel=state.abilities.filter(a=>a.role===role&&a.source!=='special-weapon').map(a=>a.base);
    const table=`<div class="gw-scroll"><table class="gw-rt"><thead><tr><th class="rng">d100</th><th>Ability</th><th class="cp">CP</th></tr></thead><tbody>`+
      rows.map((r,i)=>{const mp=r.kind==='mutant'?(mpLead(r.it.m.ability)||r.name):r.name;const on=sel.includes(r.name);return `<tr data-pick-row="${i}" class="${on?'sel':''}"><td class="rng">${r.lo}-${r.hi}</td><td>${esc(mp)}<span style="color:var(--wl-soft)"> · ${esc(r.name)}</span></td><td class="cp">${esc(String(r.cp))}</td></tr>`;}).join('')+`</tbody></table></div>`;
    const picks=state.abilities.filter(a=>a.role===role&&a.source!=='special-weapon');
    const pickList=`<div class="gw-picks">`+(picks.length?picks.map(p=>`<div class="gw-pickrow"><div class="mp">${esc(p.mp)} <span style="float:right">${esc(p.cp)} CP</span></div><div class="ab">${esc(p.gw)}</div></div>`).join(''):'<div class="gw-pickrow" style="color:var(--wl-soft)">Click rows to pick, or roll the category.</div>')+`</div>`;
    const budget=`<div style="background:${meta.pill[0]};color:${meta.pill[1]};display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:7px">${picks.length} / 2 picked</div>`;
    const canCat=!(built.kind==='creature'||built.kind==='tech');
    const ctrl=`<div class="gw-controls"><div class="gw-controls-title">${meta.label}</div>`+budget+
      (canCat?`<button class="gw-roll-btn" data-act="roll-cat">🎲 Roll this category</button>`:'')+
      `<button class="gw-roll-btn sm" data-act="roll-all">Roll all (2/2/2/2)</button>`+
      `<button class="gw-roll-rest" data-act="clear-role">Clear this category</button>`+
      `<div class="gw-hint">${isCreature(sp)?`Playing a ${esc(sp)}: its converted MP package for this role. Click a pick to drop it.`:(sp==='Tech Construct'?'Tech Construct builds from artifacts — Roll all fills ~60 CP of gear (listed under Miscellaneous).':(sp==='Pure Strain Human'?'PSH: pick from the commando abilities for this role.':'Drawn from your GW→MP mutation charts for this role.'))}</div></div>`;
    return head(meta.n,meta.label+(role==='weakness'?'':' Abilities'),meta.desc)+
      `<div class="gw-content"><div class="gw-table-side">${table}</div>${ctrl}</div>${pickList}`+nav(meta.n,meta.next);
  }
  function stepWeapons(){
    const wl=weaponList();
    const pick=`<select class="gw-pick" data-weapon>`+wl.map(w=>`<option value="${esc(w.name)}">${esc(w.name)} (${w.cp} CP)</option>`).join('')+`</select>`;
    const gear=state.abilities.filter(a=>a.source==='special-weapon');
    const chips=gear.map((g,i)=>`<span class="gw-chip">${esc(g.gw)} (${esc(g.cp)})<span class="x" data-rmweap="${state.abilities.indexOf(g)}">✕</span></span>`).join('')||'<span class="gw-hint">No weapons added.</span>';
    const ctrl=`<div class="gw-controls"><div class="gw-controls-title">Add Weapon</div>${pick}<button class="gw-roll-btn sm" style="margin-top:6px" data-act="addweapon">Add selected</button><button class="gw-roll-btn" data-act="rollweapon">🎲 Roll a weapon</button><div class="gw-hint">A weapon is a Special Weapon ability — its CP counts against the build.</div></div>`;
    return head(16,'Weapons & Gear','Optional special weapons. Any species may take them.')+
      `<div class="gw-content"><div class="gw-table-side">${chips}</div>${ctrl}</div>`+nav(16,'Review →',{noRest:true});
  }
  function stepReview(){
    const birth=[state.home,state.homeland].filter(Boolean).join(' — ');
    const idkv=[['Name',state.name||'Unnamed'],['Player',state.player||'—'],['Species',state.species],['Birthplace',birth||'—'],['Culture',state.culture||'—'],['Side',state.side||'—'],['Faction',state.faction||'—'],['Age',state.age?String(state.age):'—'],['Gender',genderLine()||'—'],['Motivation',state.motivation||'—'],['Origin',state.origin||'—'],['Power Level',state.powerLevel+' ('+tierOf(state.powerLevel).total+' CP)']].map(([k,v])=>`<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join('');
    const bc=BCS.map(([k,l])=>`<div class="cell"><div class="l" style="color:var(--wl-soft)">${l}</div><div class="v">${state.bc[k]}</div></div>`).join('')+`<div class="cell"><div class="l" style="color:var(--wl-soft)">BC Total</div><div class="v">${bcTotal()}</div></div>`;
    const cv=[['BC Total',bcTotal()],['Abilities',fmt(abilityCP())+' CP'],['Weaknesses',fmt(weaknessCP())+' CP'],['Ability Budget',tierOf(state.powerLevel).abil+' CP'],['Power Level',state.powerLevel]].map(([l,v])=>`<div class="cell"><div class="l" style="color:var(--wl-soft)">${esc(l)}</div><div class="v">${esc(String(v))}</div></div>`).join('')+`<div class="cell hl"><div class="l">Unspent CP</div><div class="v">${fmt(unspent())}</div></div>`;
    const byRole=r=>state.abilities.filter(a=>a.role===r&&!a.weakness);
    const cls={offense:'off',defense:'def',misc:'mis'},lbl={offense:'Offensive',defense:'Defensive',misc:'Misc'};
    const ab=['offense','defense','misc'].map(r=>{const items=byRole(r);return `<div class="gw-abb ${cls[r]}"><div class="t">${lbl[r]}</div>${items.length?items.map(a=>`${esc(a.mp)} <span style="color:var(--wl-soft)">(${esc(a.cp)})</span>`).join('<br>'):'—'}</div>`;}).join('')+(()=>{const w=state.abilities.filter(a=>a.weakness);return `<div class="gw-abb wk"><div class="t">Weaknesses</div>${w.length?w.map(a=>`${esc(a.gw)} <span style="color:var(--wl-soft)">(${esc(a.cp)})</span>`).join('<br>'):'—'}</div>`;})();
    const gear=state.abilities.filter(a=>a.source==='special-weapon');
    const gearHtml=gear.length?`<div class="gw-hint" style="margin:6px 0"><strong>Gear (Special Weapons):</strong> ${gear.map(g=>esc(g.gw)).join(', ')}</div>`:'';
    let json='';try{json=JSON.stringify(buildMP(),null,2);}catch(e){json='// '+e.message;}
    const idEdit=`<div style="display:flex;gap:8px;max-width:480px;margin-bottom:8px"><div style="flex:1"><label style="font-size:11px;color:var(--wl-soft)">Name</label><input data-text="name" value="${esc(state.name||'')}"></div><div style="flex:1"><label style="font-size:11px;color:var(--wl-soft)">Player</label><input data-text="player" value="${esc(state.player||'')}"></div></div>`;
    return `<div class="gw-step-head"><div class="gw-step-num">✓</div><div class="gw-step-title">Review</div></div>`+
      `<div class="gw-summary"><h3>Build Complete</h3><p>Review below, then transfer to the MP Builder.</p></div>`+
      `<div class="gw-summary-actions"><button class="wl-btn green" data-act="transfer">Transfer to MP Builder →</button><button class="wl-btn ghost" data-act="copyjson">Export JSON</button><button class="wl-btn ghost" data-act="startover">Start Over</button><button class="wl-btn red" data-act="discard">Discard</button></div>`+
      idEdit+
      `<div class="gw-sheet"><div class="sb">IDENTITY</div><div class="gw-kv">${idkv}</div>`+
      `<div class="sb">BASIC CHARACTERISTICS</div><div class="gw-cv">${bc}</div>`+
      `<div class="sb">COMBAT VALUES</div><div class="gw-cv">${cv}</div>`+
      `<div class="sb">ABILITIES</div><div class="gw-abblocks">${ab}</div>${gearHtml}`+
      `<div class="sb">MP BUILDER JSON</div><textarea class="gw-json" readonly>${esc(json)}</textarea></div>`+
      `<div class="gw-nav"><div><button class="wl-btn ghost" data-act="prev">← Back</button></div><div></div></div>`;
  }
  const stepRender={1:stepSpecies,2:stepFaction,3:stepSide,4:stepCulture,5:stepHome,6:stepHomeland,7:stepBC,8:stepBio,9:stepBackgrounds,10:stepMotivation,11:stepOrigin,12:()=>stepRole('offense'),13:()=>stepRole('defense'),14:()=>stepRole('misc'),15:()=>stepRole('weakness'),16:stepWeapons,17:stepReview};

  function renderIntro(){
    const resume=(state.name||state.species!=='Humanoid (Mutant)'||state.abilities.length)?`<p class="gw-hint" style="text-align:center">A saved draft is loaded — Step-by-Step resumes where you left off.</p>`:'';
    return `<div class="gw-intro" style="width:100%">
      <h3>Wasteland Character Generator</h3>
      <p>Build a Gamma World 1e character and convert it to a Mighty Protectors sheet.</p>
      <div class="gw-intro-id">
        <div><label>Character Name</label><input data-text="name" value="${esc(state.name||'')}" placeholder="Unnamed"></div>
        <div><label>Player</label><input data-text="player" value="${esc(state.player||'')}" placeholder="Player name"></div>
      </div>
      <div class="gw-intro-btns">
        <button class="wl-btn ghost" data-act="start">👣 Step-by-Step</button>
        <button class="wl-btn orange" data-act="quick">🎲 Quick Random</button>
      </div>
      <p class="gw-hint">Quick Random rolls everything and jumps to Review.</p>${resume}
    </div>`;
  }

  /* ── render ─────────────────────────────────────────────────── */
  function render(){
    const body=$('#gw-body');
    if(state.step===0){body.innerHTML=renderIntro();return;}
    body.innerHTML=`<div id="gw-chronicle-mount" style="display:flex;flex-shrink:0">${renderChronicle()}</div><div class="gw-main" id="gw-main">${(stepRender[state.step]||stepReview)()}</div>`;
  }
  function renderChronicleOnly(){const m=$('#gw-chronicle-mount');if(m)m.innerHTML=renderChronicle();}

  /* ── events ─────────────────────────────────────────────────── */
  function curKey(){const s=STEPS.find(s=>s.n===state.step);return s?s.key:null;}
  function bindHandlers(){
    const body=$('#gw-body');
    body.addEventListener('click',e=>{
      const goEl=e.target.closest('[data-goto]');if(goEl){const n=+goEl.dataset.goto;if(n<=Math.max(state.step,1))go(n);return;}
      const a=e.target.closest('[data-act]');if(a){onAct(a.dataset.act);return;}
      const sp=e.target.closest('[data-spk]');if(sp){setSpecies(sp.dataset.spk);log('Species: '+state.species);saveDraft();render();return;}
      const fk=e.target.closest('[data-fck]');if(fk){state.faction=fk.dataset.fck;const al=allianceByName(state.faction);if(al&&al.side)state.side=al.side;saveDraft();render();return;}
      const sd=e.target.closest('[data-sdk]');if(sd){state.side=sd.dataset.sdk;saveDraft();render();return;}
      const cl=e.target.closest('[data-clk]');if(cl){state.culture=cl.dataset.clk;saveDraft();render();return;}
      const hm=e.target.closest('[data-hmk]');if(hm){state.home=hm.dataset.hmk;saveDraft();render();return;}
      const hl=e.target.closest('[data-hlk]');if(hl){state.homeland=hl.dataset.hlk;saveDraft();render();return;}
      const bg=e.target.closest('[data-bgk]');if(bg){addBackground(bg.dataset.bgk);saveDraft();render();return;}
      const rmbg=e.target.closest('[data-rmbg]');if(rmbg){state.backgrounds.splice(+rmbg.dataset.rmbg,1);saveDraft();render();return;}
      const pr=e.target.closest('[data-pick-row]');if(pr){togglePick(poolTable(state.activeRole)[+pr.dataset.pickRow],state.activeRole);saveDraft();render();return;}
      const rmw=e.target.closest('[data-rmweap]');if(rmw){state.abilities.splice(+rmw.dataset.rmweap,1);saveDraft();render();return;}
      const tab=e.target.closest('[data-role]');if(tab){state.activeRole=tab.dataset.role;render();return;}
    });
    body.addEventListener('change',e=>{
      const pl=e.target.closest('[data-pl]');if(pl){state.powerLevel=pl.value;rollBC();saveDraft();render();return;}
      const pk=e.target.closest('[data-pick]');if(pk){const key=pk.dataset.pick,v=pk.value;if(key==='species'){setSpecies(v);}else{state[key]=v;if(key==='faction'){const al=allianceByName(v);if(al&&al.side)state.side=al.side;}if(key==='genderIdentity'){state.gender=v;}}saveDraft();render();return;}
      const bc=e.target.closest('[data-bc]');if(bc){const k=bc.dataset.bc,cap=bcCap(k);let v=parseInt(bc.value,10)||0;if(v>cap){v=cap;bc.value=v;}state.bc[k]=v;saveDraft();renderChronicleOnly();const t=$('#gw-main .gw-bc .c:last-child div');if(t)t.textContent=bcTotal();return;}
    });
    body.addEventListener('input',e=>{
      const tx=e.target.closest('[data-text]');if(tx){state[tx.dataset.text]=tx.value;saveDraft();renderChronicleOnly();return;}
      const bio=e.target.closest('[data-bio]');if(bio){state[bio.dataset.bio]=bio.value;saveDraft();renderChronicleOnly();return;}
    });
  }
  function onAct(act){
    switch(act){
      case 'start':go(1);return;
      case 'quick':generateAll();go(17);return;
      case 'prev':go(Math.max(1,state.step-1));return;
      case 'next':go(Math.min(17,state.step+1));return;
      case 'startover':if(confirm('Discard this draft and start over?'))startOver();return;
      case 'discard':if(confirm('Discard this character?'))startOver();return;
      case 'rollrest':rollRemaining(state.step);return;
      case 'transfer':transfer();return;
      case 'copyjson':exportJSON();return;
      case 'roll':{const k=curKey();if(rollByKey[k])rollByKey[k]();saveDraft();render();return;}
      case 'roll-weight':rollWeight();saveDraft();render();return;
      case 'roll-age':rollAge();saveDraft();render();return;
      case 'roll-gender':rollGender();saveDraft();render();return;
      case 'roll-gid':rollGenderIdentity();saveDraft();render();return;
      case 'roll-gexp':rollGenderExpression();saveDraft();render();return;
      case 'roll-gsex':rollBiologicalSex();saveDraft();render();return;
      case 'roll-gattr':rollSexualAttraction();saveDraft();render();return;
      case 'roll-all':rollAbilities();saveDraft();render();return;
      case 'roll-cat':rollRole(state.activeRole,2);saveDraft();render();return;
      case 'clear-ab':state.abilities=state.abilities.filter(a=>a.source==='special-weapon');log('Cleared abilities.');saveDraft();render();return;
      case 'clear-role':state.abilities=state.abilities.filter(a=>!(a.role===state.activeRole&&a.source!=='special-weapon'));log('Cleared '+state.activeRole+' abilities.');saveDraft();render();return;
      case 'addweapon':{const sel=$('#gw-main [data-weapon]');if(sel)addWeapon(weaponList().find(w=>w.name===sel.value));saveDraft();render();return;}
      case 'rollweapon':{const Lw=weaponList();addWeapon(Lw[die(Lw.length)-1]);saveDraft();render();return;}
    }
  }

  function applyAuthDefault(){if(typeof GCCAuth!=='undefined'&&GCCAuth.onAuthChange)GCCAuth.onAuthChange(u=>{if(u&&!(state.player||'').trim()){state.player=(u.displayName||u.email||'').trim();saveDraft();if(state.step===0||state.step===17)render();}});}
  function ensureCampaign(){try{let camps=JSON.parse(localStorage.getItem((typeof GCC!=='undefined'&&GCC.KEYS&&GCC.KEYS.campaigns)||'gcc-campaigns')||'[]');const DEF='Gamma World 2519';let ex=camps.find(c=>(c.name||'').trim().toLowerCase()===DEF.toLowerCase());if(!ex&&typeof GCC!=='undefined'&&GCC.addCampaign){ex=GCC.addCampaign({name:DEF,system:'mp',genre:'Post-apocalyptic',world:'Gamma World'});}window.__gwCampaign=ex?(ex.id||ex._id||''):'';}catch(e){}}

  function init(){ensureCampaign();loadDraft();applyAuthDefault();bindHandlers();render();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
