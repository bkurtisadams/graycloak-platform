<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamma World · Eden Valley</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tactical.css">
<link rel="stylesheet" href="mmo.css">
<link rel="stylesheet" href="hud.css">
</head>
<body class="play-page mmo">
<header class="topbar">
<a class="brand" href="index.html" title="Exit to Character Select">GAMMA WORLD</a>
<button id="sheetBtn">Character <kbd>C</kbd></button>
<button id="bagBtn">Inventory <kbd>I</kbd></button>
<button id="mapBtn">Map <kbd>M</kbd></button>
<button id="journalBtn">Journal <kbd>J</kbd></button>
<span class="clock" role="status"><span id="site"></span> · <span id="dayLabel"></span></span>
<button id="mapExpand">Hide panel</button>
<a class="plain" href="lab.html">Rules Lab</a>
<a class="button exit" href="index.html">Exit to Character Select</a>
</header>
<main id="worldShell">
<div id="frames">
<div class="frame unit-frame" id="pcFrame"><div class="portrait" id="pcPortrait" title="Portrait slot"></div><div class="body">
<div class="line"><strong id="name"></strong><span id="unitAc"></span></div>
<div class="hp-track" id="pcHp"><div id="worldHpFill"></div><span id="pcHpText"></span></div>
<small id="stats"></small><div class="conds" id="pcConds"></div></div></div>
<div class="party-label" id="partyLabel" hidden>PARTY</div><div id="partyFrames"></div>
</div>
<section class="battle-area stage" id="worldArea">
<div class="map-viewport" id="viewport"><div class="map-board" id="board"></div></div>
<div class="hud-top">
<div class="frame" id="targetFrame" hidden><div class="line"><strong id="targetTitle"></strong><span class="kind" id="targetKind"></span></div><div class="route" id="targetRoute"></div><div class="note" id="targetNote"></div></div>
<div class="view-switch" id="sceneTrail" role="group" aria-label="Where you are"></div>
<div class="frame minimap">
<div class="mm" id="minimap" title="Click to centre the map here"></div>
<div class="caption"><span><span id="minimapName"></span> · <span id="minimapScale"></span></span><span class="tools"><button id="mmCentre" title="Centre on your survivor (Home)">◎</button><button id="mmCollapse" title="Collapse the minimap">–</button></span></div>
</div>
</div>
<div class="scale-bar" id="worldScale" aria-hidden="true"><i></i><span id="worldScaleLabel"></span></div>
<div class="map-tools">
<button id="worldZoomOut" aria-label="Zoom out">−</button><button id="worldZoomIn" aria-label="Zoom in">+</button><button id="worldFit" title="Fit the map (F)">Fit</button><button id="gridBtn" aria-pressed="true" title="Show or hide the grid; movement is unchanged">Grid</button>
</div>
<div class="action-bar world-controls">
<button id="interact" class="primary" data-icon="talk">Interact</button><button id="resume" data-icon="resume" hidden>Resume</button><button id="tradeBtn" data-icon="trade">Trade</button><button id="restBtn" data-icon="rest">Rest</button><button id="supply" data-icon="supplies">Supplies</button><button id="sleepBtn" data-icon="tired">Sleep</button><button id="marchBtn" data-icon="flee" aria-pressed="false">Forced march: Off</button><button id="stop" data-icon="stop" hidden>Stop</button><button id="experiment" hidden>Identify device</button><button id="install" hidden>Install hydrogen cell</button>
<span class="divider" id="powerDivider" hidden></span><span id="worldPowers" style="display:contents"></span>
</div>
<div id="utilityPanel" hidden><div class="heading"><h3 id="utilityTitle"></h3><button id="closeUtility">Close</button></div><div id="utilityBody"></div></div>
<label hidden>Active survivor<select id="roster"></select></label>
</section>
<section class="battle-area stage" id="combatArea" hidden></section>
<aside class="information battle-info sidebar" id="sharedInformation">
<div class="side-tabs" role="group" aria-label="Side panel">
<button id="chatTab" aria-pressed="true">Information</button><button id="eventsTab" aria-pressed="false">Events</button><button id="partyTab" aria-pressed="false">Party</button><button id="bagTab" aria-pressed="false">Bag</button>
</div>
<div id="sideGrip" title="Drag to resize"></div>
<div id="feedFilters" role="group" aria-label="Show"><button data-filter="all" aria-pressed="true">All</button><button data-filter="travel" aria-pressed="false">Travel</button><button data-filter="combat" aria-pressed="false">Combat</button><button data-filter="npc" aria-pressed="false">NPC</button><span class="gap"></span><button id="rollsBtn" aria-pressed="true">Dice rolls: shown</button></div>
<div id="chat"><div id="messages" class="feed pane" role="log" aria-live="polite" data-filter="all"></div></div>
<div id="events" class="feed pane" role="log" hidden></div>
<div id="bagPane" class="pane" hidden></div><div id="partyPane" class="pane" hidden></div>
<div class="place-card"><strong id="placeTitle"></strong><div class="guidance" id="guidance" role="status"></div></div>
<form id="chatForm"><label>Say<input id="chatText" maxlength="500" placeholder="Message" autocomplete="off" required></label><button>Send</button></form>
</aside>
</main>
<dialog id="gameDialog"><div class="heading"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close dialog">Close</button></div><div id="dialogBody"></div></dialog>
<script type="module" src="play.js"></script>
</body>
</html>
