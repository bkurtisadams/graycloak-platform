<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamma World · Eden Valley</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tactical.css">
<link rel="stylesheet" href="mmo.css">
</head>
<body class="play-page mmo">
<header class="topbar">
<a class="brand" href="index.html" title="Exit to Character Select">GAMMA WORLD</a>
<button id="sheetBtn">Character <kbd>C</kbd></button>
<button id="bagBtn">Inventory <kbd>I</kbd></button>
<button id="mapBtn">Map <kbd>M</kbd></button>
<button id="journalBtn">Journal <kbd>J</kbd></button>
<span class="clock" role="status"><span id="site"></span> · <span id="dayLabel"></span></span>
<button id="mapExpand">Hide panel</button>
<a class="plain" href="lab.html">Rules Lab</a>
<a class="button exit" href="index.html">Exit to Character Select</a>
</header>
<main id="worldShell">
<section class="battle-area stage" id="worldArea">
<div class="map-viewport" id="viewport"><div class="map-board" id="board"></div></div>
<div class="hud-top">
<div class="frame unit-frame">
<div class="line"><strong id="name"></strong><span id="unitAc"></span></div>
<div class="hp-track"><div id="worldHpFill"></div></div>
<small id="stats"></small>
</div>
<div class="frame target-empty">No target<br><small>Appears in combat</small></div>
<div class="view-switch" id="sceneTrail" role="group" aria-label="Where you are"></div>
<div class="frame minimap">
<div class="mm" id="minimap"></div>
<div class="caption"><span id="minimapName"></span><span id="minimapScale"></span></div>
</div>
</div>
<div class="scale-bar" id="worldScale" aria-hidden="true"><i></i><span id="worldScaleLabel"></span></div>
<div class="map-tools">
<button id="worldZoomOut" aria-label="Zoom out">−</button><button id="worldZoomIn" aria-label="Zoom in">+</button><button id="worldFit">Fit</button><button id="stop" hidden>Stop</button>
</div>
<div class="action-bar world-controls">
<button id="interact" class="primary">Interact</button><button id="resume" hidden>Resume encounter</button><button id="tradeBtn" hidden>Trade</button><button id="restBtn" hidden>Rest</button><button id="supply">Collect supplies</button><button id="experiment" hidden>Identify device</button><button id="install" hidden>Install hydrogen cell</button>
<span class="divider" id="powerDivider" hidden></span><span id="worldPowers" style="display:contents"></span>
</div>
<div id="utilityPanel" hidden><div class="heading"><h3 id="utilityTitle"></h3><button id="closeUtility">Close</button></div><div id="utilityBody"></div></div>
<label hidden>Active survivor<select id="roster"></select></label>
</section>
<section class="battle-area stage" id="combatArea" hidden></section>
<aside class="information battle-info sidebar" id="sharedInformation">
<div class="side-tabs" role="group" aria-label="Side panel">
<button id="chatTab" aria-pressed="true">Chat</button><button id="eventsTab" aria-pressed="false">Events</button><button id="partyTab" aria-pressed="false">Party</button><button id="bagTab" aria-pressed="false">Bag</button>
</div>
<div id="chat"><div id="messages" class="feed pane" role="log" aria-live="polite"></div></div>
<div id="events" class="feed pane" role="log" hidden></div>
<div id="bagPane" class="pane" hidden></div><div id="partyPane" class="pane" hidden></div>
<div class="guidance" id="guidance" role="status"></div>
<form id="chatForm"><label>Say<input id="chatText" maxlength="500" placeholder="Message" autocomplete="off" required></label><button>Send</button></form>
</aside>
</main>
<dialog id="gameDialog"><div class="heading"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close dialog">Close</button></div><div id="dialogBody"></div></dialog>
<script type="module" src="play.js"></script>
</body>
</html>
