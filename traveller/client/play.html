<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traveller</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./play.css?v=v0.207.0">
  <script>
    // Same key the other pages use, applied before first paint.
    try {
      var t = localStorage.getItem('graycloak-traveller-theme');
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div class="shell" id="shell" data-drawer="closed" data-talk="closed">

    <header class="mast">
      <a class="mast-title" href="./enter.html" title="Back to the lobby">Traveller</a>
      <span class="mast-campaign" id="mast-campaign"></span>
      <div class="mast-where">
        <span class="mast-place" id="mast-place"></span>
        <span class="mast-detail" id="mast-detail"></span>
      </div>
      <div class="mast-date" title="Campaign date"><span id="mast-date"></span></div>
      <p class="mast-save" id="mast-save" hidden></p>
      <nav class="mast-chips" id="mast-chips" aria-label="Character, ship and referee"></nav>
      <button class="mast-theme" id="theme" type="button" aria-label="Switch between light and dark"></button>
    </header>

    <aside class="now" id="now" aria-label="What now"></aside>

    <main class="scene" id="scene"></main>

    <aside class="drawer" id="drawer" aria-label="Details" hidden>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">Close</button>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <footer class="talk">
      <div class="talk-log" id="talk-log" aria-live="polite"></div>
      <div class="talk-bar">
        <div class="dice" role="group" aria-label="Dice">
          <button type="button" class="die" title="Throw two dice. Shift-click for a private referee throw.">2D</button>
          <button type="button" class="die" title="Throw one die">1D</button>
          <button type="button" class="die" title="Other dice">…</button>
        </div>
        <input class="talk-input" id="talk-input" type="text" aria-label="Say something or roll"
               placeholder="Say something, or /roll 2d6+1">
        <p class="talk-last" id="talk-last"></p>
        <button class="talk-toggle" id="talk-toggle" type="button" aria-expanded="false">Show chat</button>
      </div>
    </footer>
  </div>

  <!-- Scaffolding: steps through the sample situations. Deleted when the page
       reads a real campaign, along with play-sample.js. -->
  <div class="preview" id="preview" role="group" aria-label="Preview a situation (sample data)"></div>

  <script type="module" src="./play.js?v=v0.207.0"></script>
</body>
</html>
