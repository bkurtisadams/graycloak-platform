<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traveller</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./play.css?v=v0.217.1">
  <script>
    // Same key the other pages use, applied before first paint.
    try {
      var t = localStorage.getItem('graycloak-traveller-theme');
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div class="shell" id="shell" data-drawer="closed" data-talk="closed">

    <header class="mast">
      <a class="mast-title" href="./enter.html" title="Back to the lobby">Traveller</a>
      <span class="mast-campaign" id="mast-campaign"></span>
      <div class="mast-where">
        <span class="mast-place" id="mast-place"></span>
        <span class="mast-detail" id="mast-detail"></span>
      </div>
      <div class="mast-date" title="Campaign date"><span id="mast-date"></span></div>
      <p class="mast-save" id="mast-save" hidden></p>
      <nav class="mast-chips" id="mast-chips" aria-label="Character, ship and referee"></nav>
      <button class="mast-theme" id="theme" type="button" aria-label="Switch between light and dark"></button>
    </header>

    <aside class="now" id="now" aria-label="What now"></aside>

    <main class="scene" id="scene"></main>

    <aside class="drawer" id="drawer" aria-label="Details" hidden>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">Close</button>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <footer class="talk">
      <div class="talk-log" id="talk-log" aria-live="polite"></div>
      <div class="talk-bar">
        <div class="dice" role="group" aria-label="Dice">
          <button type="button" class="die" title="Throw two dice. Shift-click for a private referee throw.">2D</button>
          <button type="button" class="die" title="Throw one die">1D</button>
          <button type="button" class="die" title="Other dice">…</button>
        </div>
        <input class="talk-input" id="talk-input" type="text" aria-label="Say something or roll"
               placeholder="Say something, or /roll 2d6+1">
        <p class="talk-last" id="talk-last"></p>
        <button class="talk-toggle" id="talk-toggle" type="button" aria-expanded="false">Show chat</button>
      </div>
    </footer>
  </div>

  <dialog class="signin" id="signin" aria-labelledby="signin-title">
    <form method="dialog" class="signin-form" id="signin-form">
      <header><h2 id="signin-title">Sign in</h2><button class="drawer-close" type="button" id="signin-close">Close</button></header>
      <p class="signin-why">Signing in saves this campaign to the cloud. Without it, changes stay in this browser.</p>
      <button class="button" type="button" id="signin-google"><span>Continue with Google</span></button>
      <p class="signin-or">or with email</p>
      <label class="field"><span class="field-label">Email</span><input id="signin-email" type="email" autocomplete="username" required></label>
      <label class="field"><span class="field-label">Password</span><input id="signin-password" type="password" autocomplete="current-password" required minlength="6"></label>
      <label class="check"><input id="signin-show" type="checkbox"> Show password <span class="signin-hint">(browsers sometimes fill in an old one)</span></label>
      <label class="field" id="signin-name-row" hidden><span class="field-label">Name, shown to your referee</span><input id="signin-name" type="text" autocomplete="nickname"></label>
      <p class="signin-status" id="signin-status" role="status"></p>
      <div class="lead-actions">
        <button class="button is-primary" type="submit" id="signin-submit"><span>Sign in</span></button>
        <button class="button" type="button" id="signin-mode"><span>Create an account</span></button>
      </div>
      <p class="signin-why"><button class="mast-signin signin-reset" type="button" id="signin-reset">Set or reset password</button>
        emails a link to choose one. Use it if you usually sign in with Google and want email sign-in too.</p>
    </form>
  </dialog>

  <dialog class="signin" id="account" aria-labelledby="account-title">
    <form method="dialog" class="signin-form" id="account-form">
      <header><h2 id="account-title">Account</h2><button class="drawer-close" type="button" id="account-close">Close</button></header>
      <p class="signin-why" id="account-who"></p>
      <label class="field"><span class="field-label">New password for email sign-in</span><input id="account-password" type="text" autocomplete="new-password" minlength="6"></label>
      <p class="signin-status" id="account-status" role="status"></p>
      <div class="lead-actions">
        <button class="button is-primary" type="submit"><span>Set password</span></button>
        <button class="button" type="button" id="account-signout"><span>Sign out</span></button>
      </div>
    </form>
  </dialog>

  <!-- Scaffolding: steps through the sample situations. Deleted when the page
       reads a real campaign, along with play-sample.js. -->
  <div class="preview" id="preview" role="group" aria-label="Preview a situation (sample data)"></div>

  <script type="module" src="./play.js?v=v0.217.1"></script>
</body>
</html>
