# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Graycloak Traveller lives outside gcc/ and imports the rules package
      # from ../vendor/. Vendor it, then assemble gcc/traveller/ for Pages.
      - name: Assemble Traveller
        run: |
          set -euo pipefail
          node traveller/scripts/sync-vendor.mjs
          # Jekyll excludes any directory named vendor/ unless told not to process the site at all.
          touch gcc/.nojekyll
          rm -rf gcc/traveller
          mkdir -p gcc/traveller
          cp -r traveller/client traveller/src traveller/world traveller/campaigns traveller/vendor gcc/traveller/
          cat > gcc/traveller/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Graycloak Traveller</title>
          <meta http-equiv="refresh" content="0; url=client/enter.html">
          <a href="client/enter.html">Graycloak Traveller</a>
          HTML
          # The published version and commit, readable at
          # graycloak.net/traveller/BUILD.txt — so "is the site current?" is one
          # glance rather than an investigation.
          VERSION=$(node -p "require('./traveller/package.json').version")
          printf 'version %s\ncommit %s\nbuilt %s\n' "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > gcc/traveller/BUILD.txt
          # Stamp the version into every asset URL. index.html loads ./app.js at
          # a URL that never changes, so a browser or CDN holding it has no way
          # to know there is new code; ?v=<version> makes a new version a new
          # URL and staleness structurally impossible.
          for page in gcc/traveller/client/*.html; do
            sed -i "s#\(src=\"\./app\.js\)\"#\1?v=$VERSION\"#; s#\(src=\"\./\(player\|enter\)\.js\)\"#\1?v=$VERSION\"#; s#\(href=\"\./styles\.css\)\"#\1?v=$VERSION\"#" "$page"
          done
          echo "stamped assets with v$VERSION"
          grep -o 'app\.js?v=[^"]*' gcc/traveller/client/index.html || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './gcc'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
